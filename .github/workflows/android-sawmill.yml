name: Sawmill Tycoon (Android)

# Builds the Sawmill Tycoon Android app (mobile/pilana-tajkun, Capacitor; pack.mjs copies the game in)
# whenever the game, the shared code or the app changes on main, and publishes it to the rolling
# GitHub release "sawmill-android". The site's download button always points at
#   https://github.com/basskibo/Gameroom/releases/download/sawmill-android/Sawmill-Tycoon.apk
# Signed with the upload key from the SAWMILL_* secrets (one-time: mobile/pilana-tajkun/release-key.sh),
# so each new APK installs over the previous one. Also builds the .aab for Google Play.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - games/pilana-tajkun/**
      - shared/**
      - mobile/pilana-tajkun/**
      - .github/workflows/android-sawmill.yml

permissions:
  contents: write

concurrency:
  group: android-sawmill
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile/pilana-tajkun
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: node pack.mjs && npx cap sync android

      - name: Version
        id: v
        run: |
          echo "code=$(( ${{ github.run_number }} + 1 ))" >> "$GITHUB_OUTPUT"
          echo "name=1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Signing key
        id: key
        env:
          KEYSTORE: ${{ secrets.SAWMILL_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::No SAWMILL_KEYSTORE_BASE64 secret: debug-signed APK (each build needs an uninstall first). Run mobile/pilana-tajkun/release-key.sh once."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        working-directory: mobile/pilana-tajkun/android
        env:
          VERSION_CODE: ${{ steps.v.outputs.code }}
          VERSION_NAME: ${{ steps.v.outputs.name }}
          ANDROID_KEYSTORE_FILE: ${{ steps.key.outputs.signed == 'true' && format('{0}/upload.jks', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SAWMILL_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.SAWMILL_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.SAWMILL_KEY_PASSWORD }}
        run: |
          mkdir -p ../dist
          if [ "${{ steps.key.outputs.signed }}" = true ]; then
            ./gradlew --no-daemon assembleRelease bundleRelease
            cp app/build/outputs/apk/release/app-release.apk ../dist/Sawmill-Tycoon.apk
            cp app/build/outputs/bundle/release/app-release.aab ../dist/Sawmill-Tycoon.aab
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../dist/Sawmill-Tycoon.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: sawmill-tycoon-${{ steps.v.outputs.name }}
          path: mobile/pilana-tajkun/dist/*

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=sawmill-android
          notes="Sawmill Tycoon for Android ${{ steps.v.outputs.name }} (build from ${GITHUB_SHA::7}).

          Install: download \`Sawmill-Tycoon.apk\` on the phone and open it (allow installs from your browser or file manager when asked). The \`.aab\` is for Google Play."
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "Sawmill Tycoon for Android" --notes "$notes" --target "$GITHUB_SHA"
          gh release upload "$tag" dist/* --clobber
          gh release edit "$tag" --title "Sawmill Tycoon for Android ${{ steps.v.outputs.name }}" --notes "$notes"
