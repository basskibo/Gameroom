<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Razori Kule</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Razori Kule">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8ecdf5; touch-action: none; }
  [hidden] { display: none !important; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  #ui { position: fixed; inset: 0; pointer-events: none; font-family: Nunito, sans-serif; color: #243044; }
  button, a { font-family: inherit; }
  #hud {
    position: absolute; top: calc(8px + env(safe-area-inset-top));
    left: 10px; right: 10px; display: flex; gap: 8px; align-items: center;
    flex-wrap: wrap; padding-right: 50px; box-sizing: border-box;
  }
  .pill {
    pointer-events: none;     background: rgba(255,255,255,0.88); white-space: nowrap;
    border-radius: 999px; padding: 6px 12px; font-weight: 800; font-size: 14px;
    box-shadow: 0 4px 14px rgba(20,40,60,0.12); display: flex; align-items: center; gap: 8px;
  }
  #gear {
    pointer-events: auto; position: absolute; top: 0; right: 0; z-index: 4;
    width: 40px; height: 40px; border: 0; border-radius: 50%;
    background: rgba(255,255,255,0.92); font-size: 20px; cursor: pointer;
    box-shadow: 0 4px 14px rgba(20,40,60,0.16); flex: none;
  }
  .bar { width: 92px; height: 8px; border-radius: 99px; background: #eadfd0; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0%; background: #e23b3b; }
  #php .bar > i { background: #3c7ee0; }
  #veil, #pause, #settings {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    pointer-events: auto; padding: 18px;
  }
  #veil { background: rgba(180, 220, 240, 0.18); }
  .card {
    width: min(420px, 100%); background: #fffdf8; border-radius: 22px; padding: 22px 22px 18px;
    box-shadow: 0 18px 50px rgba(20,40,70,0.22); text-align: center;
  }
  h1 { font-family: "Lilita One", Nunito, sans-serif; font-weight: 400; font-size: 46px; margin: 0 0 8px; letter-spacing: 0.3px; color: #e23b3b; }
  .blurb { margin: 0 0 14px; font-size: 15.5px; line-height: 1.45; font-weight: 600; }
  .best { margin: 0 0 14px; font-size: 13px; font-weight: 800; color: #7a6a58; }
  .btn {
    pointer-events: auto; border: 0; border-radius: 14px; padding: 12px 18px; font-weight: 800;
    font-size: 18px; cursor: pointer; background: #e23b3b; color: white; width: 100%;
  }
  .btn.ghost { background: #efe6d6; color: #243044; margin-top: 8px; }
  .btn:active { transform: translateY(1px); }
  #pause { background: rgba(20, 40, 60, 0.35); }
  #settings { background: rgba(20, 40, 60, 0.4); }
  #settings .card, #pause .card, #end.card { text-align: left; }
  #end {
    position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%);
    width: min(400px, calc(100% - 28px)); pointer-events: auto; text-align: center;
  }
  #settings a { display: block; margin-top: 8px; color: #243044; font-weight: 800; }
  #toast {
    position: absolute; left: 50%; top: calc(56px + env(safe-area-inset-top)); transform: translateX(-50%);
    background: rgba(255,255,255,0.94); padding: 8px 14px; border-radius: 999px;
    font-weight: 800; opacity: 0; transition: opacity 0.3s; white-space: nowrap;
  }
  #toast.on { opacity: 1; }
  #specials {
    position: absolute; left: 12px; bottom: calc(12px + env(safe-area-inset-bottom));
    display: flex; gap: 8px; z-index: 3;
  }
  #specials button {
    pointer-events: auto; border: 0; border-radius: 999px; padding: 10px 14px;
    font-weight: 800; font-size: 14px; cursor: pointer; color: #243044;
    background: rgba(255,255,255,0.94); box-shadow: 0 4px 14px rgba(20,40,60,0.16);
  }
  #specials button.on { background: #e23b3b; color: #fff; }
  #specials button:disabled { opacity: 0.42; cursor: default; }
  #magics {
    position: absolute; left: 12px; bottom: calc(62px + env(safe-area-inset-bottom));
    display: flex; gap: 8px; z-index: 3;
  }
  #magics button {
    pointer-events: auto; width: 48px; height: 48px; border-radius: 50%; padding: 0;
    border: 3px solid #243044; background: rgba(255,255,255,0.94);
    font-size: 22px; line-height: 1; cursor: pointer;
    box-shadow: 0 4px 14px rgba(20,40,60,0.16);
  }
  #magics button.on { border-color: #f2c230; box-shadow: 0 0 0 3px #f2c230; }
  @media (max-width: 520px) {
    h1 { font-size: 36px; }
    .pill { font-size: 12px; padding: 5px 8px; }
    .bar { width: 58px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="hud">
    <div class="pill" id="ammo"></div>
    <div class="pill" id="php"><span id="php-label"></span><span class="bar"><i id="php-bar"></i></span></div>
    <div class="pill" id="ehp"><span id="ehp-label"></span><span class="bar"><i id="ehp-bar"></i></span></div>
    <button id="gear" type="button" aria-label="Podešavanja">⚙</button>
  </div>
  <div id="specials" hidden>
    <button id="spec-drill" type="button"></button>
    <button id="spec-heavy" type="button"></button>
  </div>
  <div id="magics" hidden></div>
  <div id="veil">
    <div class="card">
      <h1 id="title">Razori Kule</h1>
      <p class="blurb" id="blurb"></p>
      <p class="best" id="best"></p>
      <button class="btn" id="play" type="button">IGRAJ</button>
    </div>
  </div>
  <div id="end" class="card" hidden>
    <h1 id="end-title" style="font-size:34px"></h1>
    <p class="blurb" id="end-text"></p>
    <button class="btn" id="end-next" type="button"></button>
    <button class="btn ghost" id="end-reward" type="button"></button>
  </div>
  <div id="pause" hidden>
    <div class="card">
      <h1 id="pause-title" style="font-size:34px">Pauza</h1>
      <button class="btn" id="resume" type="button">Nastavi</button>
    </div>
  </div>
  <div id="settings" hidden>
    <div class="card">
      <h1 id="set-title" style="font-size:30px">Podešavanja</h1>
      <button class="btn" id="mute" type="button"></button>
      <button class="btn ghost" id="lang" type="button"></button>
      <!-- gameroom:back — link nazad na landing (ne brisati) -->
      <a href="../../" id="gameroom-back">⌂ Nazad u Gameroom</a>
      <button class="btn ghost" id="set-close" type="button">Zatvori</button>
    </div>
  </div>
  <div id="toast"></div>
</div>
<script src="../../shared/gameroom-sdk.js"></script>
<script>
(function () {
  const WORLD_W = 1600, WORLD_H = 900, CELL = 10;
  const COLS = WORLD_W / CELL, ROWS = WORLD_H / CELL;
  const WATER_Y = 770, BEDROCK_Y = 840;
  const GRAV = 1100;
  const DRILL_GRAV = 90;
  const HEAVY_SCALE = 0.62;
  const MAX_SPEED = 1240;
  const params = new URLSearchParams(location.search);
  const AUTO = params.has('auto');
  const SIM = Number(params.get('sim')) || 0;

  const I18N = {
    sr: {
      title: 'Razori Kule', blurb: 'Povuci unazad i pusti. Zamak raste sa svakim nivoom. Bure se pojavi ponekad, na slučajnom mestu. Kutija daje magiju: zemljotres, led, meteor, obnova ili plotun.',
      play: 'IGRAJ', best: 'Najbolji rezultat', ammo: 'Rakete', you: 'Ti', foe: 'Oni',
      pause: 'Pauza', resume: 'Nastavi', settings: 'Podešavanja', soundOn: 'Zvuk: uključen', soundOff: 'Zvuk: isključen',
      close: 'Zatvori', back: '⌂ Nazad u Gameroom', hint: 'Povuci unazad',
      win: 'Zamak je pao', lose: 'Tvoja kula je pala',
      winText: 'Planina i kula su popustile.', loseText: 'Neprijatelj je srušio jezgro.',
      next: 'Sledeći zamak', retry: 'Igraj ponovo', extra: 'Još 5 raketa',
      noad: 'Reklama sad nije dostupna. Možeš odmah ponovo.',
      theirTurn: 'Njihov potez',
      score: 'Poeni', level: 'Nivo',
      drill: 'Bušilica', heavy: 'Bomba',
      armDrill: 'Bušilica ide pravo i buši uski tunel.',
      armHeavy: 'Bomba: kraći luk, ogromna rupa, košta 2 rakete.',
      need2: 'Bomba traži 2 rakete.',
      keg: 'Bure!', tunnel: 'Tunel!',
      collapseText: 'Kule su pale same na jezgro.',
      normal: 'Običan hitac.',
      quake: 'Zemljotres', ice: 'Led', meteor: 'Meteor', mend: 'Obnova', fan: 'Plotun',
      got: 'Magija:', theyGot: 'Oni uzeše', frozen: 'Zaledjeno',
    },
    en: {
      title: 'Smash the Towers', blurb: 'Pull back and release. The castle grows every level. A barrel shows up sometimes, in a random spot. A crate grants a spell: quake, ice, meteor, mend, or a volley.',
      play: 'PLAY', best: 'Best score', ammo: 'Rockets', you: 'You', foe: 'Them',
      pause: 'Paused', resume: 'Resume', settings: 'Settings', soundOn: 'Sound: on', soundOff: 'Sound: off',
      close: 'Close', back: '⌂ Back to Gameroom', hint: 'Pull back',
      win: 'The castle fell', lose: 'Your tower fell',
      winText: 'The mountain and the keep gave way.', loseText: 'The enemy broke your core.',
      next: 'Next castle', retry: 'Play again', extra: '5 more rockets',
      noad: 'No ad right now. You can retry immediately.',
      theirTurn: 'Their turn',
      score: 'Score', level: 'Level',
      drill: 'Drill', heavy: 'Bomb',
      armDrill: 'The drill flies straight and bores a narrow tunnel.',
      armHeavy: 'Bomb: shorter arc, huge crater, costs 2 rockets.',
      need2: 'The bomb needs 2 rockets.',
      keg: 'Barrel!', tunnel: 'Tunnel!',
      collapseText: 'The towers fell onto the core by themselves.',
      normal: 'Normal shot.',
      quake: 'Quake', ice: 'Ice', meteor: 'Meteor', mend: 'Mend', fan: 'Volley',
      got: 'Spell:', theyGot: 'They took', frozen: 'Frozen',
    },
  };

  function load(key, fallback) {
    try {
      const v = localStorage.getItem(key);
      return v == null ? fallback : v;
    } catch (e) { return fallback; }
  }
  function save(key, v) {
    try { localStorage.setItem(key, String(v)); } catch (e) {}
  }

  let lang = load('razori-kule:lang', (navigator.language || '').toLowerCase().startsWith('en') ? 'en' : 'sr');
  if (!I18N[lang]) lang = 'sr';
  let muted = load('razori-kule:mute', '0') === '1';
  let best = Number(load('razori-kule:best', '0')) || 0;
  const t = (k) => I18N[lang][k];

  const sdk = (window.Gameroom && window.Gameroom.track) ? window.Gameroom : {
    init() {}, gameplayStart() {}, gameplayStop() {},
    showRewarded() { return Promise.resolve(false); },
    showMidgame() { return Promise.resolve(); },
    track() {},
  };
  try { sdk.init({ game: 'razori-kule' }); } catch (e) {}

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const bulletImg = new Image();
  bulletImg.src = 'assets/sprites/bullet.png';
  function castleStyle() {
    const tier = Math.min(5, Math.max(0, level - 1));
    return [
      { wall: '#c4894a', joint: '#6b3e22', line: 'plank' },
      { wall: '#a86b3c', joint: '#5c3418', line: 'plank' },
      { wall: '#c4b29a', joint: '#6e5844', line: 'stone' },
      { wall: '#9aa3ad', joint: '#5c656e', line: 'stone' },
      { wall: '#7d868f', joint: '#454c54', line: 'concrete' },
      { wall: '#b7bdc4', joint: '#5e666e', line: 'concrete' },
    ][tier];
  }
  const terrain = document.createElement('canvas');
  terrain.width = WORLD_W; terrain.height = WORLD_H;
  const tctx = terrain.getContext('2d', { willReadFrequently: true });
  const solid = new Uint8Array(COLS * ROWS);

  const veil = document.getElementById('veil');
  const endEl = document.getElementById('end');
  const pauseEl = document.getElementById('pause');
  const settingsEl = document.getElementById('settings');
  const toastEl = document.getElementById('toast');

  let level = 1, score = 0, ammo = 6, ammoT = 0, maxAmmo = 6, shotCd = 0, salvo = 1;
  let armed = null, specialLeft = 1, coreChip = 0, collapseAwarded = false;
  let playing = false, paused = false, over = null;
  let time = 0, playTime = 0, sentMinute = false, shake = 0;
  let blocks = [], rockets = [], chunks = [], debris = [], particles = [], numbers = [], trees = [], orbs = [], barrels = [];
  let shotsFired = 0, lastImpactX = 0, simLeft = SIM, sessionSent = false;
  let turn = 'player', turnT = 0, dryT = 0, camBias = 0.32;
  let viewW = 800, viewH = 450, dpr = 1, zoom = 1, camX = 0, camY = 0, offsetX = 0, offsetY = 0;
  let camFocus = 420;
  let aiming = false, aimOrigin = null, aimPointer = null, cannonAng = -0.75, enemyAng = Math.PI + 0.55;
  let held = [], foeHeld = [], spellArmed = null, skipEnemy = 0, skipPlayer = 0;
  const SPELL_ICON = { quake: '🌋', ice: '❄️', meteor: '☄️', mend: '💚', fan: '🎯' };
  const cannonImg = { player: new Image(), enemy: new Image() };
  cannonImg.player.src = 'assets/cannon-blue.png';
  cannonImg.enemy.src = 'assets/cannon-red.png';
  let keyAim = -0.46, keyPower = 1200, keyShow = 0;
  const keys = {};
  const simStats = { shots: 0, hits: 0, mult: 0, win: 0, lose: 0 };
  let audioCtx = null;
  let toastT = 0;
  let hiddenPause = false;

  function hash(x, y) {
    let h = (x * 374761393 + y * 668265263) | 0;
    h = (h ^ (h >>> 13)) | 0;
    return (h >>> 0) % 100;
  }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function peakY() { return Math.max(240, 368 - (level - 1) * 18); }
  function groundY(x) {
    const peak = peakY();
    const left = 662, right = 640, x0 = 430, x1 = 1140;
    if (x <= x0) return left;
    if (x >= x1) return right;
    const u = (x - x0) / (x1 - x0);
    const hill = Math.pow(Math.sin(u * Math.PI), 1.18);
    const base = left + (right - left) * u;
    return base - hill * (base - peak);
  }
  function solidAt(x, y) {
    if (x < 0 || y < 0 || x >= WORLD_W || y >= WORLD_H) return y >= BEDROCK_Y;
    const i = ((y / CELL) | 0) * COLS + ((x / CELL) | 0);
    return solid[i] === 1;
  }

  function paintTerrain() {
    const img = tctx.createImageData(WORLD_W, WORLD_H);
    const d = img.data;
    solid.fill(0);
    for (let x = 0; x < WORLD_W; x++) {
      const gy = groundY(x) | 0;
      const slope = groundY(Math.min(WORLD_W - 1, x + 4)) - gy;
      const light = clamp(1.14 - slope * 0.02, 0.66, 1.28);
      const rocky = gy < 560;
      for (let y = Math.max(0, gy); y < WORLD_H; y++) {
        const depth = y - gy;
        const j = hash(x, y);
        let r, g, b;
        if (rocky && depth < 70) {
          r = 148 + (j % 16); g = 140 + (j % 12); b = 128;
        } else {
          const dark = Math.min(52, (depth / 7) | 0);
          r = 186 - dark + (j % 8); g = 112 - (dark >> 1); b = 72;
        }
        const i = (y * WORLD_W + x) * 4;
        d[i] = Math.min(255, r * light);
        d[i + 1] = Math.min(255, g * light);
        d[i + 2] = Math.min(255, b * light);
        d[i + 3] = 255;
      }
    }
    tctx.putImageData(img, 0, 0);
    for (let cy = 0; cy < ROWS; cy++) {
      for (let cx = 0; cx < COLS; cx++) {
        const x = cx * CELL + CELL / 2, y = cy * CELL + CELL / 2;
        if (y >= groundY(x) || y >= BEDROCK_Y) solid[cy * COLS + cx] = 1;
      }
    }
    paintSkin();
  }

  function paintSkin() {
    const img = tctx.getImageData(0, 0, WORLD_W, WORLD_H);
    const d = img.data;
    const snowLine = peakY() + 34;
    for (let x = 0; x < WORLD_W; x++) {
      let top = -1;
      for (let y = 0; y < WATER_Y; y += 2) {
        if (d[(y * WORLD_W + x) * 4 + 3] > 40) { top = y; break; }
      }
      if (top < 0) continue;
      const snow = top < snowLine;
      for (let k = 0; k < 9; k++) {
        const y = top + k;
        if (y >= WORLD_H) break;
        const i = (y * WORLD_W + x) * 4;
        if (d[i + 3] < 40) break;
        if (snow && k < 8) { d[i] = 238; d[i + 1] = 247; d[i + 2] = 252; }
        else { d[i] = 54 + (k % 3) * 6; d[i + 1] = 148; d[i + 2] = 68; }
      }
    }
    tctx.putImageData(img, 0, 0);
  }

  function lockBedrock() {
    const cy0 = (BEDROCK_Y / CELL) | 0;
    for (let cy = cy0; cy < ROWS; cy++) {
      for (let cx = 0; cx < COLS; cx++) solid[cy * COLS + cx] = 1;
    }
  }

  function refreshSolid(x0, y0, x1, y1) {
    const cx0 = clamp((x0 / CELL) | 0, 0, COLS - 1);
    const cy0 = clamp((y0 / CELL) | 0, 0, ROWS - 1);
    const cx1 = clamp(Math.ceil(x1 / CELL), 0, COLS);
    const cy1 = clamp(Math.ceil(y1 / CELL), 0, ROWS);
    if (cx1 <= cx0 || cy1 <= cy0) return;
    const img = tctx.getImageData(cx0 * CELL, cy0 * CELL, (cx1 - cx0) * CELL, (cy1 - cy0) * CELL);
    const w = (cx1 - cx0) * CELL;
    for (let cy = cy0; cy < cy1; cy++) {
      for (let cx = cx0; cx < cx1; cx++) {
        const px = ((cy - cy0) * CELL + CELL / 2) * w + ((cx - cx0) * CELL + CELL / 2);
        const a = img.data[(px | 0) * 4 + 3];
        solid[cy * COLS + cx] = a > 40 ? 1 : 0;
      }
    }
    lockBedrock();
  }

  function clearCells(cells) {
    for (let k = 0; k < cells.length; k++) {
      const i = cells[k];
      const cx = i % COLS, cy = (i / COLS) | 0;
      solid[i] = 0;
      tctx.clearRect(cx * CELL, cy * CELL, CELL, CELL);
    }
  }

  function detachLoose() {
    const n = COLS * ROWS;
    const grounded = new Uint8Array(n);
    const q = [];
    const cy0 = (BEDROCK_Y / CELL) | 0;
    for (let cy = cy0; cy < ROWS; cy++) {
      for (let cx = 0; cx < COLS; cx++) {
        const i = cy * COLS + cx;
        if (solid[i]) { grounded[i] = 1; q.push(i); }
      }
    }
    let qi = 0;
    while (qi < q.length) {
      const i = q[qi++];
      const cx = i % COLS, cy = (i / COLS) | 0;
      const nb = [i - 1, i + 1, i - COLS, i + COLS];
      for (let k = 0; k < 4; k++) {
        const j = nb[k];
        if (j < 0 || j >= n || grounded[j] || !solid[j]) continue;
        if (k === 0 && cx === 0) continue;
        if (k === 1 && cx === COLS - 1) continue;
        grounded[j] = 1;
        q.push(j);
      }
    }
    const seen = new Uint8Array(n);
    for (let i = 0; i < n; i++) {
      if (!solid[i] || grounded[i] || seen[i]) continue;
      const cells = [];
      const fq = [i];
      seen[i] = 1;
      while (fq.length) {
        const j = fq.pop();
        cells.push(j);
        const cx = j % COLS, cy = (j / COLS) | 0;
        const nb = [j - 1, j + 1, j - COLS, j + COLS];
        for (let k = 0; k < 4; k++) {
          const u = nb[k];
          if (u < 0 || u >= n || seen[u] || !solid[u]) continue;
          if (k === 0 && cx === 0) continue;
          if (k === 1 && cx === COLS - 1) continue;
          seen[u] = 1;
          fq.push(u);
        }
      }
      if (cells.length > n * 0.45) continue;
      if (cells.length < 4) {
        for (let k = 0; k < cells.length; k++) {
          const cx = cells[k] % COLS, cy = (cells[k] / COLS) | 0;
          burst(cx * CELL + 4, cy * CELL + 4, 2, '#8d6a48');
        }
        clearCells(cells);
      } else {
        makeChunk(cells);
      }
    }
  }

  function makeChunk(cells) {
    let minX = Infinity, minY = Infinity, maxX = 0, maxY = 0;
    for (let k = 0; k < cells.length; k++) {
      const cx = cells[k] % COLS, cy = (cells[k] / COLS) | 0;
      if (cx < minX) minX = cx;
      if (cy < minY) minY = cy;
      if (cx > maxX) maxX = cx;
      if (cy > maxY) maxY = cy;
    }
    minX *= CELL; minY *= CELL;
    const w = (maxX + 1) * CELL - minX, h = (maxY + 1) * CELL - minY;
    const cnv = document.createElement('canvas');
    cnv.width = Math.max(1, w); cnv.height = Math.max(1, h);
    const c = cnv.getContext('2d');
    c.drawImage(terrain, minX, minY, w, h, 0, 0, w, h);
    c.globalCompositeOperation = 'destination-in';
    c.fillStyle = '#fff';
    for (let k = 0; k < cells.length; k++) {
      const cx = cells[k] % COLS, cy = (cells[k] / COLS) | 0;
      c.fillRect(cx * CELL - minX, cy * CELL - minY, CELL, CELL);
    }
    clearCells(cells);
    chunks.push({
      cnv, x: minX, y: minY, w, h, bornY: minY,
      vx: (Math.random() - 0.5) * 50,
      vy: 60,
      ghost: false,
    });
    if (chunks.length > 18) chunks.shift();
  }

  function spawnClods(x, y, r) {
    const d = Math.max(8, Math.ceil(r * 2));
    const src = document.createElement('canvas');
    src.width = d; src.height = d;
    const sctx = src.getContext('2d');
    sctx.drawImage(terrain, x - r, y - r, d, d, 0, 0, d, d);
    sctx.globalCompositeOperation = 'destination-in';
    sctx.beginPath();
    sctx.arc(r, r, r * 0.95, 0, Math.PI * 2);
    sctx.fill();
    const data = sctx.getImageData(0, 0, d, d).data;
    let n = 0;
    for (let i = 3; i < data.length; i += 40) if (data[i] > 30) n++;
    if (n < 5) return;
    for (let side = -1; side <= 1; side += 2) {
      const cnv = document.createElement('canvas');
      cnv.width = d; cnv.height = d;
      const c = cnv.getContext('2d');
      c.drawImage(src, 0, 0);
      c.globalCompositeOperation = 'destination-in';
      c.fillStyle = '#fff';
      c.fillRect(side < 0 ? 0 : d / 2, 0, d / 2 + 1, d);
      chunks.push({
        cnv, x: x - r, y: y - r, w: d, h: d, bornY: y - r,
        vx: side * (70 + Math.random() * 50),
        vy: -90 - Math.random() * 50,
        ghost: true, life: 1.7,
      });
    }
    if (chunks.length > 18) chunks.splice(0, chunks.length - 18);
  }

  function carve(x, y, r) {
    spawnClods(x, y, r);
    tctx.save();
    tctx.globalCompositeOperation = 'destination-out';
    tctx.beginPath();
    tctx.arc(x, y, r, 0, Math.PI * 2);
    tctx.fill();
    tctx.restore();
    tctx.fillStyle = '#6a4632';
    tctx.fillRect(0, BEDROCK_Y, WORLD_W, WORLD_H - BEDROCK_Y);
    refreshSolid(x - r - CELL, y - r - CELL, x + r + CELL, y + r + CELL);
    detachLoose();
    paintSkin();
  }

  function stampCircles(circles) {
    if (!circles.length) return;
    let minX = WORLD_W, minY = WORLD_H, maxX = 0, maxY = 0;
    tctx.save();
    tctx.globalCompositeOperation = 'destination-out';
    for (let i = 0; i < circles.length; i++) {
      const c = circles[i];
      tctx.beginPath();
      tctx.arc(c[0], c[1], c[2], 0, Math.PI * 2);
      tctx.fill();
      if (c[0] - c[2] < minX) minX = c[0] - c[2];
      if (c[1] - c[2] < minY) minY = c[1] - c[2];
      if (c[0] + c[2] > maxX) maxX = c[0] + c[2];
      if (c[1] + c[2] > maxY) maxY = c[1] + c[2];
    }
    tctx.restore();
    tctx.fillStyle = '#6a4632';
    tctx.fillRect(0, BEDROCK_Y, WORLD_W, WORLD_H - BEDROCK_Y);
    refreshSolid(minX - CELL, minY - CELL, maxX + CELL, maxY + CELL);
    detachLoose();
    paintSkin();
  }

  function placeBarrels() {
    barrels = [];
    if (Math.random() < 0.45) {
      const mx = 520 + Math.random() * 340;
      const foot = Math.max(groundY(mx - 12), groundY(mx + 12));
      barrels.push({ x: mx - 16, y: foot - 46, w: 34, h: 44, kind: 'mountain', alive: true });
    }
    if (Math.random() < 0.32) {
      for (let t = 0; t < 10; t++) {
        const bx = 500 + Math.random() * 420;
        const by = 140 + Math.random() * 200;
        if (solidAt(bx, by) || solidAt(bx, by + 24) || by > groundY(bx) - 36) continue;
        barrels.push({ x: bx, y: by, w: 32, h: 40, kind: 'keg', alive: true });
        break;
      }
    }
  }

  function openTunnel(x, y) {
    const circles = [];
    let cx = x, cy = y;
    for (let i = 0; i < 16; i++) {
      circles.push([cx, cy, 40]);
      cx += 44;
      if (cx > x + 180 || cx > 1000) break;
      if (i > 3 && !solidAt(cx, cy) && !solidAt(cx, cy + 24) && !solidAt(cx, cy - 24)) break;
    }
    stampCircles(circles);
    burst(x, y, 16, '#ffb15a');
  }

  function knockLoose(b) {
    const pad = b.kind === 'base' ? 300 : 80;
    const cx = b.x + b.w / 2;
    for (let i = 0; i < blocks.length; i++) {
      const o = blocks[i];
      if (o.dead || o.team !== 'enemy' || o.kind === 'core') continue;
      if (o.y + o.h > b.y + 16) continue;
      if (o.x > b.x + b.w + pad || o.x + o.w < b.x - pad) continue;
      o.falling = true;
      o.vy = Math.min(o.vy, -20);
      o.vx += (o.x + o.w / 2 - cx) * 0.35;
    }
  }

  function detonate(b) {
    if (!b || !b.alive) return;
    b.alive = false;
    const x = b.x + b.w / 2, y = b.y + b.h / 2;
    shake = Math.max(shake, 14);
    score += 120;
    if (score > best) { best = score; save('razori-kule:best', best); }
    beep(70, 0.22, 'sawtooth', 0.08);
    burst(x, y, 20, '#ffd15c');
    if (b.kind === 'mountain') {
      openTunnel(x, y);
      numbers.push({ x, y: y - 28, text: t('tunnel'), life: 1.2, vy: -24, big: true });
      toast(t('tunnel'));
    } else {
      carve(x, y, 36);
      damageBlocks(x, y, 46);
      numbers.push({ x, y: y - 28, text: t('keg'), life: 1.2, vy: -24, big: true });
      toast(t('keg'));
    }
    ignite(x, y, 90);
  }

  function ignite(x, y, reach) {
    for (let i = 0; i < barrels.length; i++) {
      const b = barrels[i];
      if (!b.alive) continue;
      const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
      if (Math.hypot(cx - x, cy - y) < reach) detonate(b);
    }
  }

  function hitBarrel(x, y) {
    for (let i = 0; i < barrels.length; i++) {
      const b = barrels[i];
      if (!b.alive) continue;
      if (x > b.x - 8 && x < b.x + b.w + 8 && y > b.y - 10 && y < b.y + b.h + 6) return b;
    }
    return null;
  }

  function addBlock(team, x, y, w, h, kind, hp, extra) {
    const b = { team, x, y, w, h, kind, hp, maxHp: hp, vx: 0, vy: 0, falling: false, dead: false };
    if (extra) Object.assign(b, extra);
    blocks.push(b);
    return b;
  }

  function buildEnemyCastle() {
    const lv = level;
    const cols = Math.min(8, 1 + lv);
    const floors = Math.min(5, 1 + Math.floor((lv - 1) / 2));
    const towers = Math.min(4, 1 + Math.floor((lv - 1) / 2));
    const stoneW = 42, stoneH = 40;
    const width = cols * (stoneW + 2) + 12;
    const baseX = 1544 - width;
    const gR = groundY(baseX + width * 0.5);
    const mul = 1 + (lv - 1) * 0.14;
    const hp = (n) => Math.max(14, Math.round(n * mul));
    addBlock('enemy', baseX, gR - 32, width, 36, 'base', hp(78 + lv * 9));
    let coreSet = false;
    for (let f = 0; f < floors; f++) {
      for (let c = 0; c < cols; c++) {
        const x = baseX + 6 + c * (stoneW + 2);
        const y = gR - 32 - (f + 1) * stoneH;
        const isCore = !coreSet && f === floors - 1 && c === (cols >> 1);
        if (isCore) coreSet = true;
        addBlock('enemy', x, y, stoneW, stoneH - 2, isCore ? 'core' : 'stone',
          isCore ? hp(96 + lv * 14) : hp(30 + lv * 4),
          { skull: !isCore && (c + f) % 3 === 0 });
      }
    }
    const top = gR - 32 - floors * stoneH;
    for (let t = 0; t < towers; t++) {
      const tx = towers === 1 ? baseX + width / 2 - 22 : baseX + 8 + t * ((width - 56) / (towers - 1));
      const th = 52 + Math.min(70, (lv - 1) * 6);
      addBlock('enemy', tx, top - th, 44, th, 'tower', hp(34 + lv * 5), { skull: true });
      addBlock('enemy', tx - 8, top - th - 18, 60, 22, 'roof', hp(18 + lv * 2));
    }
    if (lv >= 4) {
      const h = 56 + (lv - 4) * 8;
      addBlock('enemy', baseX - 26, gR - h, 28, h, 'tower', hp(26 + lv * 3));
    }
    if (lv >= 8) {
      const h = 48 + (lv - 8) * 7;
      addBlock('enemy', baseX + width - 6, gR - h, 26, h, 'tower', hp(24 + lv * 3));
    }
  }

  function placeCrates() {
    orbs = [];
    const roll = Math.random();
    const n = roll < 0.35 ? 0 : roll < 0.82 ? 1 : 2;
    const kinds = ['quake', 'ice', 'meteor', 'mend', 'fan'];
    for (let i = 0; i < n; i++) {
      for (let t = 0; t < 12; t++) {
        const x = 480 + Math.random() * 560;
        const y = 120 + Math.random() * 190;
        if (solidAt(x, y) || y > groundY(x) - 40) continue;
        let near = false;
        for (let k = 0; k < orbs.length; k++) {
          if (Math.hypot(orbs[k].x - x, orbs[k].y - y) < 70) near = true;
        }
        if (near) continue;
        orbs.push({ x, y, kind: kinds[(Math.random() * kinds.length) | 0], phase: Math.random() * 6, alive: true });
        break;
      }
    }
  }

  function placeWorld() {
    blocks = []; rockets = []; chunks = []; particles = []; numbers = []; trees = []; orbs = [];
    paintTerrain();
    const gL = groundY(160);
    addBlock('player', 28, gL - 32, 300, 32, 'tread', 110);
    addBlock('player', 44, gL - 92, 58, 60, 'stone', 44);
    addBlock('player', 106, gL - 92, 68, 60, 'core', 120);
    addBlock('player', 178, gL - 92, 58, 60, 'stone', 44, { hero: true });
    addBlock('player', 240, gL - 92, 58, 60, 'stone', 44);
    addBlock('player', 48, gL - 196, 52, 104, 'tower', 42);
    addBlock('player', 244, gL - 196, 52, 104, 'tower', 42);
    addBlock('player', 34, gL - 258, 80, 64, 'roof', 22);
    addBlock('player', 230, gL - 258, 80, 64, 'roof', 22);

    buildEnemyCastle();
    placeBarrels();

    [16, 390, 1168, 1552].forEach((x, i) => {
      trees.push({ x, y: groundY(x), s: 0.85 + (i % 3) * 0.18, dead: false });
    });
    placeCrates();
    held = [];
    foeHeld = [];
    spellArmed = null;
    skipEnemy = 0;
    skipPlayer = 0;
    enemyAng = Math.PI + 0.55;
    salvo = 1;
    shotsFired = 0;
    turn = 'player';
    turnT = 0;
    dryT = 0;
    ammo = maxAmmo;
    ammoT = 0;
    armed = null;
    specialLeft = 1;
    coreChip = 0;
    collapseAwarded = false;
    lastImpactX = 0;
    camFocus = 480;
  }

  function launcher() {
    let top = null;
    for (let i = 0; i < blocks.length; i++) {
      const b = blocks[i];
      if (b.team !== 'player' || b.dead || b.falling) continue;
      if (!top || b.y < top.y) top = b;
    }
    if (!top) return { x: 180, y: 560, alive: false };
    return { x: top.x + top.w * 0.5, y: top.y - 12, alive: true };
  }
  function enemyCore() {
    for (let i = 0; i < blocks.length; i++) {
      const b = blocks[i];
      if (b.team === 'enemy' && b.kind === 'core' && !b.dead) return b;
    }
    return null;
  }
  function playerCore() {
    for (let i = 0; i < blocks.length; i++) {
      const b = blocks[i];
      if (b.team === 'player' && b.kind === 'core' && !b.dead) return b;
    }
    return null;
  }
  function hpOf(team) {
    const b = team === 'enemy' ? enemyCore() : playerCore();
    if (!b) return 0;
    return b.hp / b.maxHp;
  }

  function beep(freq, dur, type, gain) {
    if (muted) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type || 'square';
      o.frequency.value = freq;
      g.gain.value = gain || 0.04;
      o.connect(g); g.connect(audioCtx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.stop(audioCtx.currentTime + dur);
    } catch (e) {}
  }

  function burst(x, y, n, color) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 40 + Math.random() * 160;
      particles.push({
        x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40,
        life: 0.45 + Math.random() * 0.4, max: 0.8,
        color: color || (Math.random() < 0.5 ? '#e07040' : '#c4a07a'),
        s: 2 + Math.random() * 3,
      });
    }
    if (particles.length > 90) particles.splice(0, particles.length - 90);
  }

  function spawnRocket(x, y, vx, vy, team, skipOrb, kind) {
    if (rockets.length > 28) return null;
    const k = kind || 'normal';
    const r = {
      x, y, vx, vy, team, kind: k, age: 0, skipOrb: skipOrb || 0, alive: true, trail: [], sx: x, sy: y,
      grav: k === 'drill' ? DRILL_GRAV : GRAV, ice: false,
    };
    rockets.push(r);
    return r;
  }

  function shotTip(x, y, ang) {
    return { x: x + Math.cos(ang) * 58, y: y + Math.sin(ang) * 58 };
  }

  function liveRockets(team) {
    for (let i = 0; i < rockets.length; i++) {
      if (rockets[i].alive && rockets[i].team === team) return true;
    }
    return false;
  }

  function leadRocket(team) {
    let best = null;
    for (let i = 0; i < rockets.length; i++) {
      const r = rockets[i];
      if (!r.alive || r.team !== team) continue;
      if (!best || (team === 'player' ? r.x > best.x : r.x < best.x)) best = r;
    }
    return best;
  }

  function fireVelocity(vx, vy, force) {
    if (!playing || over || paused) return false;
    if (!force && turn !== 'player') return false;
    if (!force && shotCd > 0) return false;
    let kind = (!force && armed && specialLeft > 0) ? armed : 'normal';
    const spell = (!force && kind === 'normal') ? spellArmed : null;
    if (spell === 'meteor') kind = 'meteor';
    const cost = kind === 'heavy' ? 2 : 1;
    if (!force && ammo < cost) { toast(cost > 1 ? t('need2') : t('ammo') + ' 0'); return false; }
    const L = launcher();
    if (!L.alive && !force) return false;
    if (!force) {
      ammo -= cost;
      ammoT = 0;
      shotCd = 0.7;
      if (kind === 'drill' || kind === 'heavy') { specialLeft = 0; armed = null; }
      if (spell) {
        const at = held.indexOf(spell);
        if (at >= 0) held.splice(at, 1);
        spellArmed = null;
        refreshMagics();
      }
      turn = 'playerFly';
      turnT = 0;
    }
    shotsFired++;
    simStats.shots++;
    let sp = Math.hypot(vx, vy) || 1;
    if (kind === 'heavy') sp *= HEAVY_SCALE;
    const base = Math.atan2(vy, vx);
    const fan = spell === 'fan';
    const n = fan ? 3 : ((force || (kind !== 'normal' && kind !== 'meteor')) ? 1 : salvo);
    const spread = 0.07;
    for (let i = 0; i < n; i++) {
      const a = base + (i - (n - 1) / 2) * spread;
      const tip = shotTip(L.x, L.y, a);
      const r = spawnRocket(tip.x, tip.y, Math.cos(a) * sp, Math.sin(a) * sp, 'player', 0.15, kind);
      if (r && spell === 'ice') r.ice = true;
    }
    cannonAng = base;
    beep(210, 0.09, 'sawtooth', 0.05);
    refreshHud();
    refreshSpecials();
    return true;
  }

  function pickup(o, team) {
    o.alive = false;
    const bag = team === 'player' ? held : foeHeld;
    if (bag.length >= 3) bag.shift();
    bag.push(o.kind);
    simStats.mult++;
    numbers.push({ x: o.x, y: o.y - 24, text: t(o.kind), life: 1, vy: -28, big: true });
    beep(620, 0.08, 'square', 0.05);
    beep(880, 0.12, 'square', 0.04);
    toast((team === 'player' ? t('got') : t('theyGot')) + ' ' + t(o.kind));
    if (team === 'player') refreshMagics();
  }

  function hitBlockAt(x, y) {
    for (let i = 0; i < blocks.length; i++) {
      const b = blocks[i];
      if (b.dead) continue;
      if (x > b.x - 3 && x < b.x + b.w + 3 && y > b.y - 3 && y < b.y + b.h + 3) return b;
    }
    return null;
  }

  function onCoreGone(b) {
    if (over) return;
    if (b.team === 'enemy') {
      if (!collapseAwarded && coreChip < b.maxHp * 0.34) {
        collapseAwarded = true;
        score += 500;
        if (score > best) { best = score; save('razori-kule:best', best); }
        numbers.push({ x: b.x + b.w / 2, y: b.y - 20, text: '+500', life: 1.4, vy: -20, big: true });
        toast('+500');
      }
      finish('win');
    } else finish('lose');
  }

  function shatter(b) {
    const style = castleStyle();
    const bits = [];
    if (b.kind === 'roof') {
      bits.push({ w: b.w * 0.7, h: b.h * 0.9, skew: 0.6, roof: true, x: b.x + b.w * 0.32, y: b.y + b.h * 0.45 });
      bits.push({ w: b.w * 0.62, h: b.h * 0.75, skew: -0.55, roof: true, x: b.x + b.w * 0.68, y: b.y + b.h * 0.55 });
    } else if (b.h > b.w * 1.05) {
      const n = 3;
      for (let i = 0; i < n; i++) {
        bits.push({
          w: b.w / n + 8,
          h: b.h * (0.78 + (i % 2) * 0.18),
          skew: (i - 1) * 0.2,
          x: b.x + (i + 0.5) * b.w / n,
          y: b.y + b.h * (0.42 + (i % 2) * 0.08),
        });
      }
    } else {
      const n = Math.max(2, Math.min(4, Math.round(b.h / 22)));
      for (let i = 0; i < n; i++) {
        bits.push({
          w: b.w * (0.86 + (i % 2) * 0.1),
          h: Math.max(14, b.h / n - 1),
          skew: i % 2 ? 0.28 : -0.18,
          x: b.x + b.w * 0.5 + (i % 2 ? 6 : -6),
          y: b.y + (i + 0.5) * b.h / n,
        });
      }
    }
    for (let i = 0; i < bits.length; i++) {
      const bit = bits[i];
      debris.push({
        x: bit.x, y: bit.y, w: bit.w, h: bit.h, skew: bit.skew, roof: !!bit.roof,
        rot: (Math.random() - 0.5) * 0.6,
        vx: (Math.random() - 0.5) * 180 + (i - (bits.length - 1) / 2) * 70,
        vy: -50 - Math.random() * 110,
        vr: (Math.random() - 0.5) * 4.5,
        color: style.wall, joint: style.joint, life: 3.4,
      });
    }
    if (debris.length > 70) debris.splice(0, debris.length - 70);
  }

  function updateDebris(dt) {
    for (let i = 0; i < debris.length; i++) {
      const d = debris[i];
      d.vy += GRAV * dt;
      d.x += d.vx * dt;
      d.y += d.vy * dt;
      d.rot += d.vr * dt;
      d.vx *= 0.992;
      if (d.vy > 0 && solidAt(d.x, d.y + d.h * 0.35)) {
        d.vy *= -0.28;
        d.vx *= 0.55;
        d.vr *= 0.45;
        if (Math.abs(d.vy) < 80) d.vy = 0;
      }
      if (d.y > WATER_Y - 10) d.life = 0;
      else d.life -= dt;
    }
    if (debris.length) debris = debris.filter(d => d.life > 0);
  }

  function drawDebris(d) {
    ctx.save();
    ctx.translate(d.x, d.y);
    ctx.rotate(d.rot);
    const w = d.w, h = d.h, s = d.skew * Math.min(w, 28);
    ctx.beginPath();
    if (d.roof) {
      ctx.moveTo(-w * 0.1, -h * 0.55);
      ctx.lineTo(w * 0.55, h * 0.45);
      ctx.lineTo(-w * 0.45, h * 0.4);
    } else {
      ctx.moveTo(-w / 2, -h / 2);
      ctx.lineTo(w / 2 + s, -h / 2 + s * 0.25);
      ctx.lineTo(w / 2 - s * 0.35, h / 2);
      ctx.lineTo(-w / 2 + s * 0.15, h / 2 - s * 0.1);
    }
    ctx.closePath();
    ctx.fillStyle = d.color;
    ctx.fill();
    ctx.strokeStyle = d.joint;
    ctx.globalAlpha = 0.65;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
  }

  function killBlock(b) {
    if (b.dead) return;
    b.dead = true;
    shatter(b);
    burst(b.x + b.w / 2, b.y + b.h / 2, b.kind === 'roof' ? 4 : 6, castleStyle().wall);
    if (b.skull) {
      particles.push({
        x: b.x + b.w / 2, y: b.y, vx: (Math.random() - 0.5) * 80, vy: -120,
        life: 1.4, max: 1.4, color: '#fff', s: 8, skull: true,
      });
    }
    for (let i = 0; i < blocks.length; i++) {
      const o = blocks[i];
      if (o === b || o.dead) continue;
      if (o.y + o.h <= b.y + 10 && o.x < b.x + b.w && o.x + o.w > b.x) o.vx += (Math.random() - 0.5) * 60;
    }
    if (b.kind === 'core') onCoreGone(b);
  }

  function damageBlocks(x, y, radius) {
    for (let i = 0; i < blocks.length; i++) {
      const b = blocks[i];
      if (b.dead) continue;
      const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
      const d = Math.hypot(cx - x, cy - y);
      const reach = radius + Math.max(b.w, b.h) * 0.35;
      if (d > reach) continue;
      const dmg = Math.max(8, Math.round(36 * (1 - d / (reach + 8))));
      b.hp -= dmg;
      if (b.team === 'enemy') {
        score += dmg;
        if (b.kind === 'core') coreChip += dmg;
        if (score > best) { best = score; save('razori-kule:best', best); }
      }
      numbers.push({ x: cx, y: b.y - 6, text: String(dmg), life: 0.7, vy: -36, big: false });
      if (b.hp <= 0) killBlock(b);
    }
    if (numbers.length > 24) numbers.splice(0, numbers.length - 24);
  }

  function explode(r) {
    r.alive = false;
    lastImpactX = r.x;
    let radius = r.team === 'player' ? 52 : 36;
    if (r.kind === 'heavy') radius = 118;
    if (r.kind === 'meteor') radius = 96;
    if (r.kind === 'drill') radius = 24;
    if (r.kind === 'drill') {
      const sp = Math.hypot(r.vx, r.vy) || 1;
      const dx = r.vx / sp, dy = r.vy / sp;
      const circles = [];
      for (let i = 0; i < 12; i++) circles.push([r.x + dx * i * 24, r.y + dy * i * 24, 22]);
      stampCircles(circles);
    } else {
      carve(r.x, r.y, radius);
    }
    damageBlocks(r.x, r.y, radius + 8);
    if (r.team === 'player') ignite(r.x, r.y, radius + 18);
    for (let i = 0; i < trees.length; i++) {
      const tree = trees[i];
      if (!tree.dead && Math.hypot(tree.x - r.x, tree.y - 20 - r.y) < radius + 24) tree.dead = true;
    }
    if (r.ice) {
      const gun = r.team === 'player' ? enemyMuzzle() : launcher();
      if (gun && Math.hypot(gun.x - r.x, gun.y - r.y) < 90) {
        if (r.team === 'player') skipEnemy = 1; else skipPlayer = 1;
        numbers.push({ x: r.x, y: r.y - 24, text: t('frozen'), life: 1.2, vy: -22, big: true });
        toast(t('frozen'));
      }
    }
    shake = Math.max(shake, r.team === 'player' ? 9 : 5);
    burst(r.x, r.y, 12, '#ffb15a');
    beep(90, 0.18, 'triangle', 0.07);
    if (r.team === 'player') {
      const c = enemyCore();
      if (c && Math.hypot((c.x + c.w / 2) - r.x, (c.y + c.h / 2) - r.y) < 140) simStats.hits++;
    }
  }

  function splash(x, y) {
    burst(x, y, 6, '#b7e6f5');
  }

  function updateRockets(dt) {
    const steps = 3;
    const sdt = dt / steps;
    for (let i = 0; i < rockets.length; i++) {
      const r = rockets[i];
      if (!r.alive) continue;
      for (let s = 0; s < steps && r.alive; s++) {
        r.x += r.vx * sdt;
        r.y += r.vy * sdt;
        r.vy += (r.grav == null ? GRAV : r.grav) * sdt;
        r.age += sdt;
        if (r.skipOrb > 0) r.skipOrb -= sdt;
        if (r.skipOrb <= 0) {
          for (let k = 0; k < orbs.length; k++) {
            const o = orbs[k];
            if (!o.alive) continue;
            const oy = o.y + Math.sin(time * 2 + o.phase) * 8;
            if (Math.hypot(r.x - o.x, r.y - oy) < 36) { pickup(o, r.team); r.skipOrb = 0.4; break; }
          }
        }
        if (!r.alive) break;
        const flown = Math.hypot(r.x - r.sx, r.y - r.sy);
        if (flown > 16) {
          const keg = hitBarrel(r.x, r.y);
          if (keg) { detonate(keg); r.alive = false; lastImpactX = r.x; break; }
        }
        if (flown > 22 && hitBlockAt(r.x, r.y)) { explode(r); break; }
        if (flown > 16 && solidAt(r.x, r.y)) { explode(r); break; }
        if (r.y > WATER_Y || r.x < -60 || r.x > WORLD_W + 60) {
          splash(clamp(r.x, 10, WORLD_W - 10), WATER_Y);
          r.alive = false;
          break;
        }
      }
      if (r.alive) {
        r.trail.push(r.x, r.y);
        if (r.trail.length > 28) r.trail.splice(0, r.trail.length - 28);
      }
    }
    rockets = rockets.filter(r => r.alive);
  }

  function updateBlocks(dt) {
    const list = blocks.filter(b => !b.dead);
    list.sort((a, b) => (b.y + b.h) - (a.y + a.h));
    const supported = new Set();
    for (let i = 0; i < list.length; i++) {
      const b = list[i];
      if (b.falling) continue;
      const foot = b.y + b.h + 3;
      let ok = solidAt(b.x + 6, foot) || solidAt(b.x + b.w / 2, foot) || solidAt(b.x + b.w - 6, foot);
      if (!ok) {
        for (const o of supported) {
          const gap = o.y - (b.y + b.h);
          if (gap > -6 && gap < 10 && o.x < b.x + b.w - 4 && o.x + o.w > b.x + 4) { ok = true; break; }
        }
      }
      if (ok) supported.add(b);
      else killBlock(b);
    }
    for (let i = 0; i < list.length; i++) {
      const b = list[i];
      if (!b.falling) continue;
      b.vy += GRAV * dt;
      b.y += b.vy * dt;
      b.x += b.vx * dt;
      b.vx *= 0.98;
      let landed = null;
      for (const o of supported) {
        const gap = o.y - (b.y + b.h);
        if (gap > -8 && gap < 12 && b.x < o.x + o.w - 4 && b.x + b.w > o.x + 4 && b.vy > 0) landed = o;
      }
      const foot = b.y + b.h;
      const speed = b.vy;
      if (b.vy > 0 && (landed || solidAt(b.x + b.w / 2, foot + 2) || foot >= BEDROCK_Y)) {
        b.falling = false;
        b.vy = 0;
        b.vx = 0;
        if (landed) b.y = landed.y - b.h;
        if (landed && speed > 200 && b.team === 'enemy' && landed.team === 'enemy' && !landed.dead) {
          const smash = Math.round(speed / 5);
          landed.hp -= smash;
          numbers.push({ x: landed.x + landed.w / 2, y: landed.y - 8, text: String(smash), life: 0.7, vy: -30, big: false });
          if (landed.hp <= 0) killBlock(landed);
        }
        if (!b.dead && b.team === 'enemy' && b.kind === 'core' && speed > 420) {
          b.hp = 0;
          killBlock(b);
        }
      }
      if (b.y > WATER_Y + 30) {
        b.dead = true;
        if (b.kind === 'core') onCoreGone(b);
      }
    }
    blocks = blocks.filter(b => !b.dead);
    if (playing && !over && !playerCore()) finish('lose');
    if (playing && !over && !enemyCore()) finish('win');
  }

  function updateChunks(dt) {
    for (let i = chunks.length - 1; i >= 0; i--) {
      const c = chunks[i];
      c.vy += GRAV * dt;
      c.x += c.vx * dt;
      c.y += c.vy * dt;
      if (c.ghost) c.life -= dt;
      if (c.y > WATER_Y - 8 || (c.ghost && c.life <= 0)) {
        if (c.y > WATER_Y - 40) splash(c.x + c.w / 2, WATER_Y);
        chunks.splice(i, 1);
        continue;
      }
      if (c.ghost) continue;
      const fx = c.x + c.w * 0.5, fy = c.y + c.h;
      const fallen = c.y > c.bornY + 16 && c.vy > 80;
      if (fallen && (solidAt(fx, fy + 2) || solidAt(c.x + 6, fy + 2) || solidAt(c.x + c.w - 6, fy + 2))) {
        tctx.drawImage(c.cnv, c.x, c.y);
        refreshSolid(c.x, c.y, c.x + c.w, c.y + c.h);
        chunks.splice(i, 1);
      }
    }
  }

  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.vy += GRAV * 0.35 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }
    for (let i = numbers.length - 1; i >= 0; i--) {
      const n = numbers[i];
      n.life -= dt;
      n.y += n.vy * dt;
      if (n.life <= 0) numbers.splice(i, 1);
    }
  }

  function enemyMuzzle() {
    let best = null;
    for (let i = 0; i < blocks.length; i++) {
      const b = blocks[i];
      if (b.team !== 'enemy' || b.dead || b.falling || b.kind !== 'tower') continue;
      if (b.y > groundY(b.x) - 70) continue;
      if (!best || b.y < best.y) best = b;
    }
    if (!best) return null;
    return { x: best.x - 6, y: best.y + Math.min(30, best.h * 0.42) };
  }

  function castQuake(team) {
    const foe = team === 'player' ? 'enemy' : 'player';
    const chip = 8 + Math.min(10, level);
    shake = Math.max(shake, 16);
    for (let i = 0; i < blocks.length; i++) {
      const b = blocks[i];
      if (b.dead || b.team !== foe) continue;
      b.hp -= chip;
      if (b.hp <= 0) killBlock(b);
    }
    const core = foe === 'enemy' ? enemyCore() : playerCore();
    if (core && !core.dead) burst(core.x + core.w / 2, core.y + core.h / 2, 16, '#c4a07a');
    beep(42, 0.28, 'sawtooth', 0.08);
    toast(t('quake'));
    refreshHud();
  }

  function castMend(team) {
    const core = team === 'player' ? playerCore() : enemyCore();
    if (!core || core.dead) return;
    const heal = Math.max(12, Math.round(core.maxHp * 0.28));
    core.hp = Math.min(core.maxHp, core.hp + heal);
    numbers.push({ x: core.x + core.w / 2, y: core.y - 12, text: '+' + heal, life: 1, vy: -20, big: true });
    toast(t('mend'));
    beep(520, 0.1, 'triangle', 0.05);
    refreshHud();
  }

  function takeEnemySpell() {
    if (!foeHeld.length || Math.random() > 0.7) return null;
    const kind = foeHeld.shift();
    if (kind === 'quake') { castQuake('enemy'); return null; }
    if (kind === 'mend') { castMend('enemy'); return null; }
    return kind;
  }

  function enemyShoot() {
    const m = enemyMuzzle();
    const core = playerCore();
    if (!m || !core || over) return;
    const spell = takeEnemySpell();
    const tx = core.x + core.w / 2, ty = core.y + core.h / 2;
    let best = null;
    for (let a = Math.PI + 0.28; a <= Math.PI + 1.15; a += 0.1) {
      for (let pi = 0; pi < 4; pi++) {
        const p = 680 + pi * 160 + level * 12;
        const vx = Math.cos(a) * p, vy = Math.sin(a) * p;
        const tip = shotTip(m.x, m.y, a);
        let x = tip.x, y = tip.y, vvx = vx, vvy = vy, score = 1e9;
        for (let i = 0; i < 110; i++) {
          x += vvx * 0.05; y += vvy * 0.05; vvy += GRAV * 0.05;
          const d = Math.hypot(x - tx, y - ty);
          if (d < score) score = d;
          if (d < 26 || solidAt(x, y) || y > WATER_Y) break;
        }
        if (!best || score < best.score) best = { vx, vy, score, ang: a };
      }
    }
    if (!best) return;
    enemyAng = best.ang;
    const kind = spell === 'meteor' ? 'meteor' : 'normal';
    let shots = spell === 'fan' ? 3 : 1;
    if (level >= 6 && shots === 1) shots = 2;
    const j = (Math.random() - 0.5) * Math.max(14, 96 - level * 6);
    const sp = Math.hypot(best.vx, best.vy);
    for (let i = 0; i < shots; i++) {
      const a = best.ang + (i - (shots - 1) / 2) * 0.08;
      const tip = shotTip(m.x, m.y, a);
      const r = spawnRocket(tip.x, tip.y, Math.cos(a) * sp + j, Math.sin(a) * sp + j * 0.25, 'enemy', 0.2, kind);
      if (r && spell === 'ice') r.ice = true;
    }
    beep(160, 0.08, 'square', 0.03);
  }

  function bestShot() {
    const core = enemyCore();
    const L = launcher();
    const tx = core ? core.x + core.w / 2 : 1400;
    const ty = core ? core.y + core.h / 2 : 520;
    let best = null;
    for (let a = -1.0; a <= -0.18; a += 0.08) {
      for (let pi = 0; pi < 4; pi++) {
        const p = 760 + pi * 160;
        const vx = Math.cos(a) * p, vy = Math.sin(a) * p;
        let x = L.x, y = L.y, vvx = vx, vvy = vy, score = 1e9;
        for (let i = 0; i < 110; i++) {
          x += vvx * 0.05; y += vvy * 0.05; vvy += GRAV * 0.05;
          const d = Math.hypot(x - tx, y - ty);
          if (d < score) score = d;
          if (d < 30 || solidAt(x, y) || y > WATER_Y || x > WORLD_W) break;
        }
        if (!best || score < best.score) best = { vx, vy, score };
      }
    }
    return best || { vx: 640, vy: -760 };
  }

  function botFire() {
    if (ammo < 1) return;
    const s = bestShot();
    fireVelocity(s.vx, s.vy);
  }

  function predict(vx, vy, kind) {
    const L = launcher();
    const g = kind === 'drill' ? DRILL_GRAV : GRAV;
    const pts = [];
    let x = L.x, y = L.y, vvx = vx, vvy = vy;
    for (let i = 0; i < (kind === 'drill' ? 70 : 52); i++) {
      x += vvx * 0.05; y += vvy * 0.05; vvy += g * 0.05;
      pts.push(x, y);
      if (hitBarrel(x, y) || solidAt(x, y) || hitBlockAt(x, y) || y > WATER_Y) break;
    }
    return pts;
  }

  function pullVector() {
    if (!aiming || !aimOrigin || !aimPointer) return null;
    let dx = aimPointer.x - aimOrigin.x;
    let dy = aimPointer.y - aimOrigin.y;
    const len = Math.hypot(dx, dy);
    if (len < 1) return { dx: 0, dy: 0, len: 0, vx: 0, vy: 0 };
    const max = 170;
    const sc = Math.min(max, len) / len;
    dx *= sc; dy *= sc;
    const power = (Math.min(len, max) / max) * MAX_SPEED;
    let ang = Math.atan2(-dy, -dx);
    if (ang > 0.2) ang -= Math.PI * 2;
    ang = clamp(ang, -0.78, -0.08);
    return { dx, dy, len: Math.min(len, max), vx: Math.cos(ang) * power, vy: Math.sin(ang) * power };
  }

  function finish(kind) {
    if (over) return;
    over = kind;
    if (kind === 'win') { simStats.win++; score += 400; if (score > best) { best = score; save('razori-kule:best', best); } }
    else simStats.lose++;
    try { sdk.gameplayStop(); } catch (e) {}
    if (kind === 'win') { try { sdk.showMidgame(); } catch (e) {} }
    try { sdk.track('session_end', { result: kind, level, score }); } catch (e) {}
    sessionSent = true;
    showEnd();
    beep(kind === 'win' ? 520 : 140, 0.25, 'triangle', 0.06);
  }

  function showEnd() {
    endEl.hidden = false;
    document.getElementById('end-title').textContent = over === 'win' ? t('win') : t('lose');
    const line = over === 'win' && collapseAwarded ? t('collapseText') : (over === 'win' ? t('winText') : t('loseText'));
    document.getElementById('end-text').textContent = line + '  ' + t('score') + ': ' + score;
    document.getElementById('end-next').textContent = over === 'win' ? t('next') : t('retry');
    document.getElementById('end-reward').hidden = over !== 'lose';
    document.getElementById('end-reward').textContent = t('extra');
    refreshHud();
    refreshSpecials();
  }

  function nextRound() {
    if (over === 'win') level++;
    else { score = 0; level = 1; salvo = 1; }
    over = null;
    endEl.hidden = true;
    placeWorld();
    playing = true;
    paused = false;
    try { sdk.gameplayStart(); } catch (e) {}
    try { sdk.track('game_start', { level }); } catch (e) {}
    sessionSent = false;
    refreshHud();
    refreshSpecials();
    refreshMagics();
  }

  async function extraRockets() {
    try { sdk.track('rewarded_offer', { placement: 'extra_rockets' }); } catch (e) {}
    let ok = false;
    try { ok = await sdk.showRewarded('extra_rockets'); } catch (e) { ok = false; }
    try { sdk.track('rewarded_watched', { placement: 'extra_rockets', ok: !!ok }); } catch (e) {}
    if (ok && over === 'lose') {
      ammo = Math.min(maxAmmo, ammo + 5);
      over = null;
      endEl.hidden = true;
      playing = true;
      const core = playerCore();
      if (!core) {
        const L = launcher();
        addBlock('player', L.x - 24, L.y - 10, 48, 34, 'core', 80);
      }
      try { sdk.gameplayStart(); } catch (e) {}
      refreshHud();
    } else {
      toast(t('noad'));
    }
  }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    toastT = 1.6;
  }

  function armSpecial(kind) {
    if (!playing || over || paused || specialLeft < 1) return;
    armed = armed === kind ? null : kind;
    toast(armed === 'drill' ? t('armDrill') : armed === 'heavy' ? t('armHeavy') : t('normal'));
    refreshSpecials();
    refreshHud();
  }

  function refreshSpecials() {
    const box = document.getElementById('specials');
    const drill = document.getElementById('spec-drill');
    const heavy = document.getElementById('spec-heavy');
    box.hidden = !playing || !!over;
    drill.disabled = specialLeft < 1;
    heavy.disabled = specialLeft < 1;
    drill.classList.toggle('on', armed === 'drill');
    heavy.classList.toggle('on', armed === 'heavy');
    drill.textContent = t('drill');
    heavy.textContent = t('heavy');
  }

  function refreshMagics() {
    const box = document.getElementById('magics');
    if (!box) return;
    box.innerHTML = '';
    box.hidden = !playing || !!over || held.length === 0;
    for (let i = 0; i < held.length; i++) {
      const kind = held[i];
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = SPELL_ICON[kind] || '?';
      b.title = t(kind);
      b.setAttribute('aria-label', t(kind));
      if (spellArmed === kind) b.classList.add('on');
      b.addEventListener('click', (e) => { e.stopPropagation(); useSpell(i); });
      box.appendChild(b);
    }
  }

  function useSpell(i) {
    if (!playing || over || paused || turn !== 'player') return;
    const kind = held[i];
    if (!kind) return;
    if (kind === 'quake' || kind === 'mend') {
      held.splice(i, 1);
      if (spellArmed === kind) spellArmed = null;
      if (kind === 'quake') castQuake('player');
      else castMend('player');
    } else {
      spellArmed = spellArmed === kind ? null : kind;
      toast(spellArmed ? t(kind) : t('normal'));
    }
    refreshMagics();
    refreshHud();
  }

  function refreshHud() {
    let tag = '';
    if (armed === 'drill') tag = '  ·  ' + t('drill');
    if (armed === 'heavy') tag = '  ·  ' + t('heavy');
    if (spellArmed) tag += '  ·  ' + t(spellArmed);
    const multi = salvo > 1 ? '  ·  ×' + salvo : '';
    document.getElementById('ammo').textContent = t('ammo') + ' ' + ammo + multi + tag;
    document.getElementById('php-label').textContent = t('you');
    document.getElementById('ehp-label').textContent = t('foe') + ' · ' + t('level') + ' ' + level;
    document.getElementById('php-bar').style.width = Math.round(hpOf('player') * 100) + '%';
    document.getElementById('ehp-bar').style.width = Math.round(hpOf('enemy') * 100) + '%';
  }

  function applyLang() {
    document.documentElement.lang = lang === 'en' ? 'en' : 'sr';
    document.title = SIM ? document.title : t('title');
    document.getElementById('title').textContent = t('title');
    document.getElementById('blurb').textContent = t('blurb');
    document.getElementById('play').textContent = t('play');
    document.getElementById('best').textContent = t('best') + ': ' + best;
    document.getElementById('pause-title').textContent = t('pause');
    document.getElementById('resume').textContent = t('resume');
    document.getElementById('set-title').textContent = t('settings');
    document.getElementById('mute').textContent = muted ? t('soundOff') : t('soundOn');
    document.getElementById('lang').textContent = lang === 'sr' ? 'English' : 'Srpski';
    document.getElementById('gameroom-back').textContent = t('back');
    document.getElementById('set-close').textContent = t('close');
    if (over) showEnd();
    refreshHud();
    refreshSpecials();
  }

  function startGame() {
    if (playing) return;
    veil.hidden = true;
    playing = true;
    paused = false;
    over = null;
    try { if (audioCtx) audioCtx.resume(); } catch (e) {}
    try { sdk.gameplayStart(); } catch (e) {}
    try { sdk.track('game_start', { level }); } catch (e) {}
    refreshHud();
    refreshSpecials();
    refreshMagics();
  }

  function volley() {
    const angles = [-0.7, -0.8, -0.9, -1.02];
    const powers = [900, 960, 1020, 1080];
    angles.forEach((a, i) => {
      setTimeout(() => {
        if (!playing || over) return;
        fireVelocity(Math.cos(a) * powers[i], Math.sin(a) * powers[i], true);
      }, i * 110);
    });
  }

  function update(dt) {
    time += dt;
    for (let i = 0; i < orbs.length; i++) if (orbs[i].cd > 0) orbs[i].cd -= dt;
    if (toastT > 0) {
      toastT -= dt;
      if (toastT <= 0) toastEl.classList.remove('on');
    }
    shake *= Math.pow(0.04, dt);
    if (over) { updateChunks(dt); updateDebris(dt); updateParticles(dt); return; }
    if (!playing || paused) return;
    playTime += dt;
    if (!sentMinute && playTime > 60) {
      sentMinute = true;
      try { sdk.track('first_minute', { level, score }); } catch (e) {}
    }
    if (shotCd > 0) shotCd -= dt;
    ammoT += dt;
    if (ammo < maxAmmo && ammoT > 5.5) { ammo++; ammoT = 0; refreshHud(); }
    updateRockets(dt);
    if (over) { updateChunks(dt); updateDebris(dt); updateParticles(dt); return; }
    updateBlocks(dt);
    updateDebris(dt);
    updateChunks(dt);
    updateParticles(dt);
    if (turn === 'playerFly') {
      if (!liveRockets('player')) { turn = 'toEnemy'; turnT = 0.5; }
    } else if (turn === 'toEnemy') {
      turnT -= dt;
      if (turnT <= 0) {
        turn = 'enemy';
        turnT = 0.4;
        toast(t('theirTurn'));
      }
    } else if (turn === 'enemy') {
      turnT -= dt;
      if (turnT <= 0) {
        if (skipEnemy > 0) {
          skipEnemy--;
          toast(t('frozen'));
          turn = 'toPlayer';
          turnT = 0.35;
        } else {
          enemyShoot();
          turn = liveRockets('enemy') ? 'enemyFly' : 'toPlayer';
          turnT = 0.45;
        }
      }
    } else if (turn === 'enemyFly') {
      if (!liveRockets('enemy')) { turn = 'toPlayer'; turnT = 0.45; }
    } else if (turn === 'toPlayer') {
      turnT -= dt;
      if (turnT <= 0) {
        if (skipPlayer > 0) {
          skipPlayer--;
          toast(t('frozen'));
          turn = 'toEnemy';
          turnT = 0.25;
        } else { turn = 'player'; turnT = 0; dryT = 0; }
      }
    } else if (ammo < 1) {
      dryT += dt;
      if (dryT > 1.3) { dryT = 0; turn = 'toEnemy'; turnT = 0.2; }
    } else dryT = 0;
    if (SIM && simLeft > 0) {
      simLeft -= dt;
      if (turn === 'player' && ammo > 0 && !liveRockets('player') && Math.floor(time * 2) !== Math.floor((time - dt) * 2)) botFire();
      if (simLeft <= 0) {
        const payload = {
          hpE: Math.round(hpOf('enemy') * 100),
          hpP: Math.round(hpOf('player') * 100),
          shots: simStats.shots, hits: simStats.hits, mult: simStats.mult,
          win: simStats.win, lose: simStats.lose, level, score,
        };
        window.simLog = payload;
        document.title = 'hpE=' + payload.hpE + ' hpP=' + payload.hpP + ' shots=' + payload.shots + ' hits=' + payload.hits + ' mult=' + payload.mult + ' win=' + payload.win + ' lose=' + payload.lose + ' level=' + level;
        playing = false;
      }
    }
    const enemySide = turn === 'enemy' || turn === 'enemyFly' || turn === 'toEnemy';
    const flyTeam = turn === 'playerFly' ? 'player' : turn === 'enemyFly' ? 'enemy' : null;
    const lead = flyTeam ? leadRocket(flyTeam) : null;
    let focus = launcher().x + 36;
    if (lead) focus = lead.x;
    else if (flyTeam && lastImpactX) focus = lastImpactX;
    else if (enemySide) {
      const m = enemyMuzzle();
      focus = m ? m.x - 30 : 1320;
    }
    camBias = enemySide ? 0.7 : (turn === 'playerFly' ? 0.28 : 0.18);
    const rate = lead ? 7 : 2.4;
    camFocus += (focus - camFocus) * Math.min(1, dt * rate);
    if ((time * 4 | 0) !== ((time - dt) * 4 | 0)) refreshHud();
    if (keyShow > 0) keyShow -= dt;
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    viewW = window.innerWidth;
    viewH = window.innerHeight;
    canvas.width = Math.max(1, (viewW * dpr) | 0);
    canvas.height = Math.max(1, (viewH * dpr) | 0);
  }

  function frameCamera() {
    const landscape = viewW >= viewH;
    if (landscape) {
      zoom = Math.min(viewW / WORLD_W, viewH / WORLD_H);
      camX = 0; camY = 0;
      offsetX = (viewW - WORLD_W * zoom) / 2;
      offsetY = Math.max(0, viewH - WORLD_H * zoom);
    } else {
      zoom = viewH / (WORLD_H * 0.92);
      const visW = viewW / zoom;
      const visH = viewH / zoom;
      camX = clamp(camFocus - visW * camBias, 0, Math.max(0, WORLD_W - visW));
      camY = clamp((WORLD_H - visH) * 0.08, 0, Math.max(0, WORLD_H - visH));
      offsetX = 0; offsetY = 0;
    }
  }

  function roundRect(x, y, w, h, r, fill) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
  }

  function drawPine(x, y, s) {
    ctx.fillStyle = '#4a2e1c';
    ctx.fillRect(x - 3 * s, y - 28 * s, 5 * s, 28 * s);
    ctx.fillStyle = '#8a5a38';
    ctx.fillRect(x - 1 * s, y - 28 * s, 5 * s, 28 * s);
    ctx.fillStyle = '#1e4a30';
    ctx.beginPath();
    ctx.moveTo(x + 4 * s, y - 74 * s);
    ctx.lineTo(x - 22 * s, y - 28 * s);
    ctx.lineTo(x + 28 * s, y - 28 * s);
    ctx.fill();
    ctx.fillStyle = '#2f7a48';
    ctx.beginPath();
    ctx.moveTo(x, y - 80 * s);
    ctx.lineTo(x - 24 * s, y - 32 * s);
    ctx.lineTo(x + 18 * s, y - 32 * s);
    ctx.fill();
    ctx.fillStyle = '#49a15f';
    ctx.beginPath();
    ctx.moveTo(x - 2 * s, y - 62 * s);
    ctx.lineTo(x - 16 * s, y - 18 * s);
    ctx.lineTo(x + 12 * s, y - 18 * s);
    ctx.fill();
  }

  function drawCloud(x, y, s) {
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.beginPath();
    ctx.arc(x, y, 18 * s, 0, 7);
    ctx.arc(x + 22 * s, y + 4, 14 * s, 0, 7);
    ctx.arc(x - 20 * s, y + 6, 12 * s, 0, 7);
    ctx.fill();
  }

  function rgb(hex, m) {
    const n = parseInt(hex.slice(1), 16);
    const r = Math.max(0, Math.min(255, ((n >> 16) & 255) * m));
    const g = Math.max(0, Math.min(255, ((n >> 8) & 255) * m));
    const b = Math.max(0, Math.min(255, (n & 255) * m));
    return 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ')';
  }

  function drawBox(x, y, w, h, hex, depth) {
    const d = depth || 22;
    ctx.beginPath();
    ctx.moveTo(x + w, y);
    ctx.lineTo(x + w + d, y - d * 0.72);
    ctx.lineTo(x + w + d, y + h - d * 0.72);
    ctx.lineTo(x + w, y + h);
    ctx.closePath();
    ctx.fillStyle = rgb(hex, 0.62);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + d * 0.85, y - d * 0.72);
    ctx.lineTo(x + w + d, y - d * 0.72);
    ctx.lineTo(x + w, y);
    ctx.closePath();
    ctx.fillStyle = rgb(hex, 1.22);
    ctx.fill();
    ctx.fillStyle = hex;
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = 'rgba(255,255,255,0.16)';
    ctx.fillRect(x + 2, y + 2, Math.max(3, w * 0.16), h - 4);
    ctx.strokeStyle = 'rgba(40,24,16,0.28)';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  }

  function drawWindow(x, y, w, h) {
    ctx.fillStyle = '#1c3348';
    ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
    const g = ctx.createLinearGradient(x, y, x + w, y + h);
    g.addColorStop(0, '#d7f4ff');
    g.addColorStop(0.45, '#6eb0d8');
    g.addColorStop(1, '#2d6f99');
    ctx.fillStyle = g;
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillRect(x + 1, y + 1, w * 0.35, h * 0.4);
  }

  function drawBlock(b) {
    if (b.kind === 'roof') {
      const hex = b.team === 'player' ? '#2f74e0' : '#d43842';
      const d = 26;
      const ax = b.x + b.w * 0.48;
      const ay = b.y + 2;
      ctx.beginPath();
      ctx.moveTo(ax + d * 0.4, ay - d * 0.45);
      ctx.lineTo(b.x + b.w + d, b.y + b.h - d * 0.55);
      ctx.lineTo(b.x + b.w, b.y + b.h);
      ctx.lineTo(ax, ay);
      ctx.closePath();
      ctx.fillStyle = rgb(hex, 0.58);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.lineTo(b.x + 2, b.y + b.h);
      ctx.lineTo(b.x + b.w, b.y + b.h);
      ctx.closePath();
      ctx.fillStyle = hex;
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(ax, ay + 2);
      ctx.lineTo(b.x + b.w * 0.78, b.y + b.h - 1);
      ctx.lineTo(b.x + b.w * 0.48, b.y + b.h - 1);
      ctx.fillStyle = rgb(hex, 1.28);
      ctx.fill();
      ctx.strokeStyle = rgb(hex, 0.45);
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.lineTo(b.x + 2, b.y + b.h);
      ctx.lineTo(b.x + b.w, b.y + b.h);
      ctx.closePath();
      ctx.stroke();
      ctx.fillStyle = '#f7fbff';
      ctx.fillRect(ax - 2, ay - 18, 3, 18);
      ctx.fillStyle = b.team === 'player' ? '#2f74e0' : '#d43842';
      const wave = Math.sin(time * 3 + b.x * 0.01) * 2;
      ctx.beginPath();
      ctx.moveTo(ax + 1, ay - 22);
      ctx.lineTo(ax + 24 + wave, ay - 12);
      ctx.lineTo(ax + 1, ay - 3);
      ctx.fill();
      ctx.fillStyle = '#f7fbff';
      ctx.fillRect(ax + 1, ay - 14, 10, 2);
      return;
    }
    if (b.kind === 'tread') {
      drawBox(b.x, b.y + 4, b.w, b.h - 6, '#3a424c', 12);
      ctx.fillStyle = '#14181d';
      for (let x = b.x + 18; x < b.x + b.w - 8; x += 28) {
        ctx.beginPath();
        ctx.arc(x, b.y + b.h - 4, 9, 0, 7);
        ctx.fill();
        ctx.strokeStyle = '#d5dde6';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(x, b.y + b.h - 4, 9, 0, 7);
        ctx.stroke();
        ctx.strokeStyle = '#8b949e';
        ctx.beginPath();
        ctx.arc(x, b.y + b.h - 4, 4, 0, 7);
        ctx.stroke();
      }
      return;
    }
    const cracked = b.hp < b.maxHp * 0.55;
    const style = castleStyle();
    const hex = style.wall;
    drawBox(b.x, b.y, b.w, b.h, hex, b.kind === 'tower' ? 26 : 20);
    ctx.save();
    ctx.beginPath();
    ctx.rect(b.x, b.y, b.w, b.h);
    ctx.clip();
    ctx.strokeStyle = style.joint;
    ctx.globalAlpha = 0.55;
    ctx.lineWidth = 1.5;
    if (style.line === 'plank') {
      for (let y = b.y + 8; y < b.y + b.h - 3; y += 8) {
        ctx.beginPath();
        ctx.moveTo(b.x + 2, y);
        ctx.lineTo(b.x + b.w - 2, y);
        ctx.stroke();
      }
    } else if (style.line === 'stone') {
      const row = 11;
      for (let y = b.y + row; y < b.y + b.h - 2; y += row) {
        ctx.beginPath();
        ctx.moveTo(b.x + 2, y);
        ctx.lineTo(b.x + b.w - 2, y);
        ctx.stroke();
        const shift = ((y / row) | 0) % 2 ? 8 : 0;
        for (let x = b.x + 6 + shift; x < b.x + b.w - 4; x += 16) {
          ctx.beginPath();
          ctx.moveTo(x, y - row + 1);
          ctx.lineTo(x, y - 1);
          ctx.stroke();
        }
      }
    } else {
      ctx.beginPath();
      ctx.moveTo(b.x + b.w * 0.5, b.y + 3);
      ctx.lineTo(b.x + b.w * 0.5, b.y + b.h - 3);
      ctx.moveTo(b.x + 3, b.y + b.h * 0.5);
      ctx.lineTo(b.x + b.w - 3, b.y + b.h * 0.5);
      ctx.stroke();
    }
    ctx.restore();
    if (b.kind === 'tower') {
      ctx.fillStyle = rgb(hex, 1.15);
      for (let x = b.x + 2; x < b.x + b.w - 4; x += 12) {
        ctx.fillRect(x, b.y - 7, 8, 8);
        ctx.fillStyle = rgb(hex, 0.7);
        ctx.fillRect(x + 8, b.y - 5, 3, 6);
        ctx.fillStyle = rgb(hex, 1.15);
      }
    }
    if (b.kind === 'core') {
      const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
      const glow = ctx.createRadialGradient(cx - 3, cy - 3, 2, cx, cy, 14);
      glow.addColorStop(0, '#fff');
      glow.addColorStop(0.45, b.team === 'player' ? '#4c9bff' : '#ff4d55');
      glow.addColorStop(1, b.team === 'player' ? '#1d4e9c' : '#8a1820');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(cx, cy, 11, 0, 7);
      ctx.fill();
    } else if (b.h > 54) {
      drawWindow(b.x + b.w * 0.5 - 7, b.y + 18, 14, 18);
      ctx.strokeStyle = 'rgba(90,60,40,0.25)';
      ctx.beginPath();
      ctx.moveTo(b.x + 4, b.y + b.h * 0.55);
      ctx.lineTo(b.x + b.w - 4, b.y + b.h * 0.55);
      ctx.stroke();
    }
    if (cracked) {
      ctx.strokeStyle = '#5c4034';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(b.x + 8, b.y + 10);
      ctx.lineTo(b.x + b.w * 0.4, b.y + b.h * 0.6);
      ctx.lineTo(b.x + b.w - 8, b.y + b.h - 8);
      ctx.stroke();
    }
    if (b.hero) drawKnight(b.x + b.w * 0.5, b.y + 8);
    if (b.skull) drawSkull(b.x + b.w * 0.5, b.y + 6);
    if (b.kind === 'tower' && b.h > 36) drawBanner(b);
  }

  function drawBanner(b) {
    const left = b.team === 'enemy';
    const poleX = left ? b.x + 3 : b.x + b.w - 6;
    const y = b.y + 8;
    const len = Math.min(36, b.h - 12);
    ctx.fillStyle = '#f4efe4';
    ctx.fillRect(poleX, y, 3, len);
    ctx.fillStyle = b.team === 'player' ? '#2f74e0' : '#d43842';
    const dir = left ? -1 : 1;
    const wave = Math.sin(time * 3.2 + b.x * 0.02) * 3;
    ctx.beginPath();
    ctx.moveTo(poleX + (left ? 0 : 3), y + 2);
    ctx.lineTo(poleX + dir * (18 + wave), y + 9);
    ctx.lineTo(poleX + (left ? 0 : 3), y + 18);
    ctx.closePath();
    ctx.fill();
  }

  function drawKnight(x, y) {
    ctx.fillStyle = 'rgba(16,24,40,0.28)';
    ctx.beginPath();
    ctx.ellipse(x, y + 1, 15, 4, 0, 0, 7);
    ctx.fill();
    roundRect(x - 8, y - 15, 6, 14, 2, '#2a3344');
    roundRect(x + 2, y - 15, 6, 14, 2, '#1b2433');
    roundRect(x - 9, y - 5, 8, 5, 2, '#4a3424');
    roundRect(x + 2, y - 5, 8, 5, 2, '#3a281c');
    const plate = ctx.createLinearGradient(x - 12, y - 36, x + 12, y - 14);
    plate.addColorStop(0, '#8eb6f2');
    plate.addColorStop(0.45, '#2f6ed8');
    plate.addColorStop(1, '#17356e');
    roundRect(x - 11, y - 34, 22, 20, 5, plate);
    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    ctx.fillRect(x - 8, y - 32, 4, 14);
    ctx.fillStyle = '#e6c15a';
    ctx.fillRect(x - 10, y - 20, 20, 3);
    ctx.fillStyle = '#f4f7fb';
    ctx.beginPath();
    ctx.ellipse(x - 11, y - 30, 5, 3.2, -0.2, 0, 7);
    ctx.ellipse(x + 11, y - 30, 5, 3.2, 0.2, 0, 7);
    ctx.fill();
    roundRect(x - 16, y - 28, 5, 11, 2, '#2457ad');
    const skin = ctx.createRadialGradient(x - 2, y - 44, 1, x, y - 41, 9);
    skin.addColorStop(0, '#ffe6cf');
    skin.addColorStop(1, '#d39a6e');
    ctx.fillStyle = skin;
    ctx.beginPath();
    ctx.arc(x, y - 42, 7.5, 0, 7);
    ctx.fill();
    ctx.fillStyle = '#243044';
    ctx.beginPath();
    ctx.arc(x - 3, y - 43, 1.1, 0, 7);
    ctx.arc(x + 2.5, y - 43, 1.1, 0, 7);
    ctx.fill();
    ctx.fillStyle = '#d5e2f4';
    ctx.beginPath();
    ctx.arc(x, y - 49, 8.5, Math.PI, 0);
    ctx.fill();
    ctx.fillStyle = '#9aafc9';
    ctx.fillRect(x - 9, y - 49, 18, 3);
    ctx.fillStyle = '#e23b3b';
    ctx.beginPath();
    ctx.moveTo(x + 2, y - 54);
    ctx.quadraticCurveTo(x + 14, y - 64, x + 7, y - 46);
    ctx.quadraticCurveTo(x + 5, y - 52, x + 1, y - 52);
    ctx.fill();
  }

  function drawSkull(x, y) {
    ctx.fillStyle = 'rgba(40,10,10,0.25)';
    ctx.beginPath();
    ctx.ellipse(x + 1, y + 1, 13, 4, 0, 0, 7);
    ctx.fill();
    roundRect(x - 5, y - 16, 4, 14, 2, '#f2efe6');
    roundRect(x + 2, y - 16, 4, 14, 2, '#d9d3c6');
    const robe = ctx.createLinearGradient(x - 10, y - 32, x + 10, y - 8);
    robe.addColorStop(0, '#a12832');
    robe.addColorStop(0.5, '#6d1520');
    robe.addColorStop(1, '#3c0c12');
    ctx.fillStyle = robe;
    ctx.beginPath();
    ctx.moveTo(x - 11, y - 28);
    ctx.quadraticCurveTo(x - 14, y - 8, x - 8, y - 2);
    ctx.lineTo(x + 9, y - 2);
    ctx.quadraticCurveTo(x + 14, y - 8, x + 11, y - 28);
    ctx.closePath();
    ctx.fill();
    roundRect(x - 16, y - 24, 4, 12, 2, '#efeae0');
    const head = ctx.createRadialGradient(x - 2, y - 40, 1, x, y - 36, 12);
    head.addColorStop(0, '#ffffff');
    head.addColorStop(1, '#c8c2b6');
    ctx.fillStyle = head;
    ctx.beginPath();
    ctx.arc(x, y - 36, 9, 0, 7);
    ctx.fill();
    ctx.fillStyle = '#1a120e';
    ctx.beginPath();
    ctx.ellipse(x - 3.2, y - 37, 2, 2.6, 0, 0, 7);
    ctx.ellipse(x + 3.2, y - 37, 2, 2.6, 0, 0, 7);
    ctx.fill();
    ctx.fillStyle = '#2a211c';
    ctx.beginPath();
    ctx.moveTo(x, y - 34);
    ctx.lineTo(x - 1.4, y - 31);
    ctx.lineTo(x + 1.4, y - 31);
    ctx.fill();
    ctx.strokeStyle = '#2a211c';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(x - 4, y - 28);
    ctx.lineTo(x - 2, y - 26.5);
    ctx.lineTo(x, y - 28);
    ctx.lineTo(x + 2, y - 26.5);
    ctx.lineTo(x + 4, y - 28);
    ctx.stroke();
  }

  function drawRocket(r) {
    const ang = Math.atan2(r.vy, r.vx);
    ctx.save();
    ctx.translate(r.x, r.y);
    ctx.rotate(ang);
    ctx.fillStyle = 'rgba(255,170,60,0.55)';
    ctx.beginPath();
    ctx.moveTo(-14, 0);
    ctx.lineTo(-26, -4);
    ctx.lineTo(-22, 0);
    ctx.lineTo(-26, 4);
    ctx.fill();
      const heavy = r.kind === 'heavy' || r.kind === 'meteor';
    const drill = r.kind === 'drill';
    if (bulletImg.complete && bulletImg.naturalWidth) {
      const sc = heavy ? 1.5 : 1;
      const bw = 36 * sc, bh = 16 * sc;
      if (drill) ctx.filter = 'hue-rotate(200deg) saturate(1.6) brightness(1.2)';
      else if (r.ice) ctx.filter = 'hue-rotate(190deg) saturate(1.5) brightness(1.15)';
      else if (r.team === 'enemy') ctx.filter = 'saturate(0.75) hue-rotate(-12deg)';
      ctx.drawImage(bulletImg, -bw * 0.62, -bh / 2, bw, bh);
      ctx.filter = 'none';
      ctx.restore();
      return;
    }
    if (heavy) ctx.scale(1.45, 1.45);
    const body = ctx.createLinearGradient(0, -6, 0, 6);
    body.addColorStop(0, drill ? '#d5e8ff' : (r.team === 'player' ? '#ffb4b4' : '#e0899a'));
    body.addColorStop(0.45, drill ? '#3d7adf' : (heavy ? '#ff8a1e' : (r.team === 'player' ? '#e02727' : '#9a2340')));
    body.addColorStop(1, drill ? '#163e86' : (r.team === 'player' ? '#7a1010' : '#4a1020'));
    ctx.fillStyle = body;
    roundRect(-14, -5, 24, 10, 3, body);
    ctx.fillStyle = '#f4f7fb';
    ctx.beginPath();
    ctx.moveTo(10, -5);
    ctx.lineTo(20, 0);
    ctx.lineTo(10, 5);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.fillRect(-8, -4, 10, 2);
    ctx.restore();
  }

  function drawBarrel(b) {
    if (!b.alive) return;
    const x = b.x, y = b.y, w = b.w, h = b.h;
    const cx = x + w * 0.5;
    const topY = y + 15;
    const botY = y + h - 1;
    const rx = w * 0.5;
    ctx.fillStyle = 'rgba(40,24,12,0.22)';
    ctx.beginPath();
    ctx.ellipse(cx + 2, botY + 3, rx * 0.85, 3.5, 0, 0, 7);
    ctx.fill();
    const wood = ctx.createLinearGradient(x, 0, x + w, 0);
    wood.addColorStop(0, '#5a381f');
    wood.addColorStop(0.28, '#c4894e');
    wood.addColorStop(0.48, '#f0c48a');
    wood.addColorStop(0.72, '#a86b38');
    wood.addColorStop(1, '#4e3018');
    ctx.fillStyle = wood;
    const mid = topY + (botY - topY) * 0.5;
    ctx.beginPath();
    ctx.moveTo(cx - rx * 0.9, topY);
    ctx.bezierCurveTo(cx - rx * 1.02, topY + (botY - topY) * 0.28, cx - rx, mid, cx - rx * 0.86, botY);
    ctx.lineTo(cx + rx * 0.86, botY);
    ctx.bezierCurveTo(cx + rx, mid, cx + rx * 1.02, topY + (botY - topY) * 0.28, cx + rx * 0.9, topY);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(62,32,14,0.4)';
    ctx.lineWidth = 1;
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.moveTo(cx + i * rx * 0.42, topY + 1);
      ctx.quadraticCurveTo(cx + i * rx * 0.5, (topY + botY) * 0.5, cx + i * rx * 0.34, botY - 1);
      ctx.stroke();
    }
    function hoop(yy) {
      ctx.strokeStyle = '#2f3846';
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.moveTo(cx - rx + 1, yy);
      ctx.quadraticCurveTo(cx, yy + 4, cx + rx - 1, yy);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(220,228,238,0.8)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(cx - rx + 2, yy - 1);
      ctx.quadraticCurveTo(cx, yy + 2, cx + rx - 2, yy - 1);
      ctx.stroke();
    }
    hoop(topY + (botY - topY) * 0.3);
    hoop(topY + (botY - topY) * 0.68);
    ctx.fillStyle = '#8d5a32';
    ctx.beginPath();
    ctx.ellipse(cx, topY, rx - 1, 5, 0, 0, 7);
    ctx.fill();
    ctx.fillStyle = '#e8c296';
    ctx.beginPath();
    ctx.ellipse(cx - 1, topY - 1, rx * 0.62, 2.2, 0, Math.PI, 0, true);
    ctx.fill();
    const sticks = [[-6, 13, -0.22], [0, 16, 0.02], [6, 12, 0.2]];
    for (let i = 0; i < sticks.length; i++) {
      const s = sticks[i];
      ctx.save();
      ctx.translate(cx + s[0], topY - 1);
      ctx.rotate(s[2]);
      roundRect(-2.4, -s[1], 4.8, s[1] + 3, 1.5, i === 1 ? '#e23b3b' : '#c42828');
      ctx.fillStyle = '#f7f1e4';
      ctx.fillRect(-2.4, -s[1] + 2, 4.8, 1.8);
      ctx.restore();
    }
    const spark = 0.5 + 0.5 * Math.sin(time * 16 + b.x);
    ctx.strokeStyle = '#2c241c';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(cx + 1, topY - 15);
    ctx.quadraticCurveTo(cx + 10, topY - 18, cx + 8, topY - 26);
    ctx.stroke();
    ctx.fillStyle = spark > 0.55 ? '#fff3c2' : '#ff7a18';
    ctx.beginPath();
    ctx.arc(cx + 8, topY - 26, 1.6 + spark * 1.6, 0, 7);
    ctx.fill();
  }

  function drawOrb(o) {
    if (!o.alive) return;
    const y = o.y + Math.sin(time * 2 + o.phase) * 8;
    const icon = { quake: '≋', ice: '❄', meteor: '★', mend: '+', fan: '»' }[o.kind] || '?';
    ctx.save();
    ctx.translate(o.x, y);
    ctx.fillStyle = 'rgba(20,40,20,0.18)';
    ctx.beginPath();
    ctx.ellipse(0, 26, 16, 5, 0, 0, 7);
    ctx.fill();
    drawBox(-18, -20, 36, 36, '#e6b15a', 8);
    ctx.strokeStyle = '#8a5a22';
    ctx.lineWidth = 3;
    ctx.strokeRect(-18, -20, 36, 36);
    ctx.fillStyle = '#243044';
    ctx.font = '800 18px Nunito, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(icon, 0, -2);
    ctx.restore();
  }

  function drawFar() {
    ctx.fillStyle = '#b7c9d6';
    ctx.beginPath();
    ctx.moveTo(0, 620);
    const peaks = [[80, 470], [220, 520], [380, 440], [560, 500], [760, 420], [980, 490], [1180, 430], [1380, 500], [1600, 460]];
    peaks.forEach(p => ctx.lineTo(p[0], p[1]));
    ctx.lineTo(WORLD_W, 700); ctx.lineTo(0, 700); ctx.fill();
    ctx.fillStyle = '#8eacb8';
    ctx.beginPath();
    ctx.moveTo(0, 680);
    [[140, 540], [360, 590], [620, 520], [900, 580], [1200, 530], [1480, 590], [1600, 550]].forEach(p => ctx.lineTo(p[0], p[1]));
    ctx.lineTo(WORLD_W, 760); ctx.lineTo(0, 760); ctx.fill();
  }

  function drawWater() {
    ctx.beginPath();
    ctx.moveTo(0, WATER_Y);
    for (let x = 0; x <= WORLD_W; x += 20) {
      ctx.lineTo(x, WATER_Y + Math.sin(time * 2 + x * 0.02) * 4);
    }
    ctx.lineTo(WORLD_W, WORLD_H);
    ctx.lineTo(0, WORLD_H);
    ctx.fillStyle = 'rgba(46, 168, 196, 0.72)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.75)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let x = 0; x <= WORLD_W; x += 16) {
