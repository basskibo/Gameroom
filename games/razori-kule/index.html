    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
  }

  function drawTree(x, y, s) {
    const kind = theme().tree;
    if (kind === 'cactus') return drawCactus(x, y, s);
    drawPine(x, y, s);
    if (kind === 'snowpine') {
      ctx.fillStyle = 'rgba(248,252,255,0.92)';
      for (const [ty, w] of [[-80, 10], [-58, 16], [-36, 20]]) {
        ctx.beginPath(); ctx.moveTo(x, y + ty * s); ctx.lineTo(x - w * s, y + (ty + 14) * s); ctx.lineTo(x + w * 0.8 * s, y + (ty + 14) * s); ctx.fill();
      }
    }
  }
  function drawCactus(x, y, s) {
    const g = '#3f9a52', d = '#2c7340';
    roundRect(x - 7 * s, y - 62 * s, 14 * s, 62 * s, 7 * s, g);
    roundRect(x - 22 * s, y - 44 * s, 9 * s, 22 * s, 4.5 * s, g);
    roundRect(x - 22 * s, y - 28 * s, 20 * s, 8 * s, 4 * s, g);
    roundRect(x + 13 * s, y - 52 * s, 9 * s, 26 * s, 4.5 * s, g);
    roundRect(x + 2 * s, y - 32 * s, 20 * s, 8 * s, 4 * s, g);
    ctx.fillStyle = d;
    ctx.fillRect(x - 1 * s, y - 58 * s, 2 * s, 54 * s);
  }
  function drawPine(x, y, s) {
    ctx.fillStyle = '#4a2e1c';
    ctx.fillRect(x - 3 * s, y - 28 * s, 5 * s, 28 * s);
    ctx.fillStyle = '#8a5a38';
    ctx.fillRect(x - 1 * s, y - 28 * s, 5 * s, 28 * s);
    ctx.fillStyle = '#1e4a30';
    ctx.beginPath();
    ctx.moveTo(x + 4 * s, y - 74 * s);
    ctx.lineTo(x - 22 * s, y - 28 * s);
    ctx.lineTo(x + 28 * s, y - 28 * s);
    ctx.fill();
    ctx.fillStyle = '#2f7a48';
    ctx.beginPath();
    ctx.moveTo(x, y - 80 * s);
    ctx.lineTo(x - 24 * s, y - 32 * s);
    ctx.lineTo(x + 18 * s, y - 32 * s);
    ctx.fill();
    ctx.fillStyle = '#49a15f';
    ctx.beginPath();
    ctx.moveTo(x - 2 * s, y - 62 * s);
    ctx.lineTo(x - 16 * s, y - 18 * s);
    ctx.lineTo(x + 12 * s, y - 18 * s);
    ctx.fill();
  }

  function drawCloud(x, y, s) {
    const TH = theme();
    ctx.fillStyle = TH.cloudShade;     // soft shaded underside
    ctx.beginPath();
    ctx.arc(x + 2, y + 7, 17 * s, 0, 7);
    ctx.arc(x + 24 * s, y + 10, 13 * s, 0, 7);
    ctx.arc(x - 20 * s, y + 11, 11 * s, 0, 7);
    ctx.fill();
    ctx.fillStyle = TH.cloud;
    ctx.beginPath();
    ctx.arc(x, y, 18 * s, 0, 7);
    ctx.arc(x + 22 * s, y + 4, 14 * s, 0, 7);
    ctx.arc(x - 20 * s, y + 6, 12 * s, 0, 7);
    ctx.arc(x + 8 * s, y - 8 * s, 12 * s, 0, 7);
    ctx.fill();
  }

  function rgb(hex, m) {
    const n = parseInt(hex.slice(1), 16);
    const r = Math.max(0, Math.min(255, ((n >> 16) & 255) * m));
    const g = Math.max(0, Math.min(255, ((n >> 8) & 255) * m));
    const b = Math.max(0, Math.min(255, (n & 255) * m));
    return 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ')';
  }

  function drawBox(x, y, w, h, hex, depth) {
    const d = depth || 22;
    ctx.beginPath();
    ctx.moveTo(x + w, y);
    ctx.lineTo(x + w + d, y - d * 0.72);
    ctx.lineTo(x + w + d, y + h - d * 0.72);
    ctx.lineTo(x + w, y + h);
    ctx.closePath();
    ctx.fillStyle = rgb(hex, 0.62);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + d * 0.85, y - d * 0.72);
    ctx.lineTo(x + w + d, y - d * 0.72);
    ctx.lineTo(x + w, y);
    ctx.closePath();
    ctx.fillStyle = rgb(hex, 1.22);
    ctx.fill();
    ctx.fillStyle = hex;
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = 'rgba(255,255,255,0.16)';
    ctx.fillRect(x + 2, y + 2, Math.max(3, w * 0.16), h - 4);
    ctx.strokeStyle = 'rgba(40,24,16,0.28)';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  }

  function drawWindow(x, y, w, h) {
    ctx.fillStyle = '#1c3348';
    ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
    const g = ctx.createLinearGradient(x, y, x + w, y + h);
    g.addColorStop(0, '#d7f4ff');
    g.addColorStop(0.45, '#6eb0d8');
    g.addColorStop(1, '#2d6f99');
    ctx.fillStyle = g;
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillRect(x + 1, y + 1, w * 0.35, h * 0.4);
  }

  function drawBlock(b) {
    if (b.kind === 'roof') {
      const hex = b.team === 'player' ? '#2f74e0' : '#d43842';
      const d = 26;
      const ax = b.x + b.w * 0.48;
      const ay = b.y + 2;
      ctx.beginPath();
      ctx.moveTo(ax + d * 0.4, ay - d * 0.45);
      ctx.lineTo(b.x + b.w + d, b.y + b.h - d * 0.55);
      ctx.lineTo(b.x + b.w, b.y + b.h);
      ctx.lineTo(ax, ay);
      ctx.closePath();
      ctx.fillStyle = rgb(hex, 0.58);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.lineTo(b.x + 2, b.y + b.h);
      ctx.lineTo(b.x + b.w, b.y + b.h);
      ctx.closePath();
      ctx.fillStyle = hex;
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(ax, ay + 2);
      ctx.lineTo(b.x + b.w * 0.78, b.y + b.h - 1);
      ctx.lineTo(b.x + b.w * 0.48, b.y + b.h - 1);
      ctx.fillStyle = rgb(hex, 1.28);
      ctx.fill();
      ctx.strokeStyle = rgb(hex, 0.45);
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.lineTo(b.x + 2, b.y + b.h);
      ctx.lineTo(b.x + b.w, b.y + b.h);
      ctx.closePath();
      ctx.stroke();
      ctx.fillStyle = '#f7fbff';
      ctx.fillRect(ax - 2, ay - 18, 3, 18);
      ctx.fillStyle = b.team === 'player' ? '#2f74e0' : '#d43842';
      const wave = Math.sin(time * 3 + b.x * 0.01) * 2;
      ctx.beginPath();
      ctx.moveTo(ax + 1, ay - 22);
      ctx.lineTo(ax + 24 + wave, ay - 12);
      ctx.lineTo(ax + 1, ay - 3);
      ctx.fill();
      ctx.fillStyle = '#f7fbff';
      ctx.fillRect(ax + 1, ay - 14, 10, 2);
      return;
    }
    if (b.kind === 'tread') {
      drawBox(b.x, b.y + 4, b.w, b.h - 6, '#3a424c', 12);
      ctx.fillStyle = '#14181d';
      for (let x = b.x + 18; x < b.x + b.w - 8; x += 28) {
        ctx.beginPath();
        ctx.arc(x, b.y + b.h - 4, 9, 0, 7);
        ctx.fill();
        ctx.strokeStyle = '#d5dde6';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(x, b.y + b.h - 4, 9, 0, 7);
        ctx.stroke();
        ctx.strokeStyle = '#8b949e';
        ctx.beginPath();
        ctx.arc(x, b.y + b.h - 4, 4, 0, 7);
        ctx.stroke();
      }
      return;
    }
    const cracked = b.hp < b.maxHp * 0.55;
    const style = castleStyle();
    const hex = style.wall;
    drawBox(b.x, b.y, b.w, b.h, hex, b.kind === 'tower' ? 26 : 20);
    ctx.save();
    ctx.beginPath();
    ctx.rect(b.x, b.y, b.w, b.h);
    ctx.clip();
    ctx.strokeStyle = style.joint;
    ctx.globalAlpha = 0.55;
    ctx.lineWidth = 1.5;
    if (style.line === 'plank') {
      for (let y = b.y + 8; y < b.y + b.h - 3; y += 8) {
        ctx.beginPath();
        ctx.moveTo(b.x + 2, y);
        ctx.lineTo(b.x + b.w - 2, y);
        ctx.stroke();
      }
    } else if (style.line === 'stone') {
      const row = 11;
      for (let y = b.y + row; y < b.y + b.h - 2; y += row) {
        ctx.beginPath();
        ctx.moveTo(b.x + 2, y);
        ctx.lineTo(b.x + b.w - 2, y);
        ctx.stroke();
        const shift = ((y / row) | 0) % 2 ? 8 : 0;
        for (let x = b.x + 6 + shift; x < b.x + b.w - 4; x += 16) {
          ctx.beginPath();
          ctx.moveTo(x, y - row + 1);
          ctx.lineTo(x, y - 1);
          ctx.stroke();
        }
      }
    } else {
      ctx.beginPath();
      ctx.moveTo(b.x + b.w * 0.5, b.y + 3);
      ctx.lineTo(b.x + b.w * 0.5, b.y + b.h - 3);
      ctx.moveTo(b.x + 3, b.y + b.h * 0.5);
      ctx.lineTo(b.x + b.w - 3, b.y + b.h * 0.5);
      ctx.stroke();
    }
    ctx.restore();
    if (b.kind === 'tower') {
      ctx.fillStyle = rgb(hex, 1.15);
      for (let x = b.x + 2; x < b.x + b.w - 4; x += 12) {
        ctx.fillRect(x, b.y - 7, 8, 8);
        ctx.fillStyle = rgb(hex, 0.7);
        ctx.fillRect(x + 8, b.y - 5, 3, 6);
        ctx.fillStyle = rgb(hex, 1.15);
      }
    }
    if (b.kind === 'core') {
      const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
      const glow = ctx.createRadialGradient(cx - 3, cy - 3, 2, cx, cy, 14);
      glow.addColorStop(0, '#fff');
      glow.addColorStop(0.45, b.team === 'player' ? '#4c9bff' : '#ff4d55');
      glow.addColorStop(1, b.team === 'player' ? '#1d4e9c' : '#8a1820');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(cx, cy, 11, 0, 7);
      ctx.fill();
    } else if (b.h > 54) {
      drawWindow(b.x + b.w * 0.5 - 7, b.y + 18, 14, 18);
      ctx.strokeStyle = 'rgba(90,60,40,0.25)';
      ctx.beginPath();
      ctx.moveTo(b.x + 4, b.y + b.h * 0.55);
      ctx.lineTo(b.x + b.w - 4, b.y + b.h * 0.55);
      ctx.stroke();
    }
    if (cracked) {
      ctx.strokeStyle = '#5c4034';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(b.x + 8, b.y + 10);
      ctx.lineTo(b.x + b.w * 0.4, b.y + b.h * 0.6);
      ctx.lineTo(b.x + b.w - 8, b.y + b.h - 8);
      ctx.stroke();
    }
    if (b.hero) drawKnight(b.x + b.w * 0.5, b.y + 8 - Math.abs(Math.sin(time * 2.4)) * 2);
    if (b.skull) drawSkull(b.x + b.w * 0.5, b.y + 6 - Math.abs(Math.sin(time * 3 + b.x * 0.05)) * 2);
    if (b.kind === 'tower' && b.h > 36) drawBanner(b);
  }

  function drawBanner(b) {
    const left = b.team === 'enemy';
    const poleX = left ? b.x + 3 : b.x + b.w - 6;
    const y = b.y + 8;
    const len = Math.min(36, b.h - 12);
    ctx.fillStyle = '#f4efe4';
    ctx.fillRect(poleX, y, 3, len);
    ctx.fillStyle = b.team === 'player' ? '#2f74e0' : '#d43842';
    const dir = left ? -1 : 1;
    const wave = Math.sin(time * 3.2 + b.x * 0.02) * 3;
    ctx.beginPath();
    ctx.moveTo(poleX + (left ? 0 : 3), y + 2);
    ctx.lineTo(poleX + dir * (18 + wave), y + 9);
    ctx.lineTo(poleX + (left ? 0 : 3), y + 18);
    ctx.closePath();
    ctx.fill();
  }

  function drawKnight(x, y) {
    ctx.fillStyle = 'rgba(16,24,40,0.28)';
    ctx.beginPath();
    ctx.ellipse(x, y + 1, 15, 4, 0, 0, 7);
    ctx.fill();
    roundRect(x - 8, y - 15, 6, 14, 2, '#2a3344');
    roundRect(x + 2, y - 15, 6, 14, 2, '#1b2433');
    roundRect(x - 9, y - 5, 8, 5, 2, '#4a3424');
    roundRect(x + 2, y - 5, 8, 5, 2, '#3a281c');
    const plate = ctx.createLinearGradient(x - 12, y - 36, x + 12, y - 14);
    plate.addColorStop(0, '#8eb6f2');
    plate.addColorStop(0.45, '#2f6ed8');
    plate.addColorStop(1, '#17356e');
    roundRect(x - 11, y - 34, 22, 20, 5, plate);
    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    ctx.fillRect(x - 8, y - 32, 4, 14);
    ctx.fillStyle = '#e6c15a';
    ctx.fillRect(x - 10, y - 20, 20, 3);
    ctx.fillStyle = '#f4f7fb';
    ctx.beginPath();
    ctx.ellipse(x - 11, y - 30, 5, 3.2, -0.2, 0, 7);
    ctx.ellipse(x + 11, y - 30, 5, 3.2, 0.2, 0, 7);
    ctx.fill();
    roundRect(x - 16, y - 28, 5, 11, 2, '#2457ad');
    const skin = ctx.createRadialGradient(x - 2, y - 44, 1, x, y - 41, 9);
    skin.addColorStop(0, '#ffe6cf');
    skin.addColorStop(1, '#d39a6e');
    ctx.fillStyle = skin;
    ctx.beginPath();
    ctx.arc(x, y - 42, 7.5, 0, 7);
    ctx.fill();
    ctx.fillStyle = '#243044';
    ctx.beginPath();
    ctx.arc(x - 3, y - 43, 1.1, 0, 7);
    ctx.arc(x + 2.5, y - 43, 1.1, 0, 7);
    ctx.fill();
    ctx.fillStyle = '#d5e2f4';
    ctx.beginPath();
    ctx.arc(x, y - 49, 8.5, Math.PI, 0);
    ctx.fill();
    ctx.fillStyle = '#9aafc9';
    ctx.fillRect(x - 9, y - 49, 18, 3);
    ctx.fillStyle = '#e23b3b';
    ctx.beginPath();
    ctx.moveTo(x + 2, y - 54);
    ctx.quadraticCurveTo(x + 14, y - 64, x + 7, y - 46);
    ctx.quadraticCurveTo(x + 5, y - 52, x + 1, y - 52);
    ctx.fill();
  }

  function drawSkull(x, y) {
    ctx.fillStyle = 'rgba(40,10,10,0.25)';
    ctx.beginPath();
    ctx.ellipse(x + 1, y + 1, 13, 4, 0, 0, 7);
    ctx.fill();
    roundRect(x - 5, y - 16, 4, 14, 2, '#f2efe6');
    roundRect(x + 2, y - 16, 4, 14, 2, '#d9d3c6');
    const robe = ctx.createLinearGradient(x - 10, y - 32, x + 10, y - 8);
    robe.addColorStop(0, '#a12832');
    robe.addColorStop(0.5, '#6d1520');
    robe.addColorStop(1, '#3c0c12');
    ctx.fillStyle = robe;
    ctx.beginPath();
    ctx.moveTo(x - 11, y - 28);
    ctx.quadraticCurveTo(x - 14, y - 8, x - 8, y - 2);
    ctx.lineTo(x + 9, y - 2);
    ctx.quadraticCurveTo(x + 14, y - 8, x + 11, y - 28);
    ctx.closePath();
    ctx.fill();
    roundRect(x - 16, y - 24, 4, 12, 2, '#efeae0');
    const head = ctx.createRadialGradient(x - 2, y - 40, 1, x, y - 36, 12);
    head.addColorStop(0, '#ffffff');
    head.addColorStop(1, '#c8c2b6');
    ctx.fillStyle = head;
    ctx.beginPath();
    ctx.arc(x, y - 36, 9, 0, 7);
    ctx.fill();
    ctx.fillStyle = '#1a120e';
    ctx.beginPath();
    ctx.ellipse(x - 3.2, y - 37, 2, 2.6, 0, 0, 7);
    ctx.ellipse(x + 3.2, y - 37, 2, 2.6, 0, 0, 7);
    ctx.fill();
    ctx.fillStyle = '#2a211c';
    ctx.beginPath();
    ctx.moveTo(x, y - 34);
    ctx.lineTo(x - 1.4, y - 31);
    ctx.lineTo(x + 1.4, y - 31);
    ctx.fill();
    ctx.strokeStyle = '#2a211c';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(x - 4, y - 28);
    ctx.lineTo(x - 2, y - 26.5);
    ctx.lineTo(x, y - 28);
    ctx.lineTo(x + 2, y - 26.5);
    ctx.lineTo(x + 4, y - 28);
    ctx.stroke();
  }

  function drawRocket(r) {
    const ang = Math.atan2(r.vy, r.vx);
    ctx.save();
    ctx.translate(r.x, r.y);
    ctx.rotate(ang);
    ctx.fillStyle = 'rgba(255,170,60,0.55)';
    ctx.beginPath();
    ctx.moveTo(-14, 0);
    ctx.lineTo(-26, -4);
    ctx.lineTo(-22, 0);
    ctx.lineTo(-26, 4);
    ctx.fill();
      const heavy = r.kind === 'heavy' || r.kind === 'meteor';
    const drill = r.kind === 'drill';
    if (bulletImg.complete && bulletImg.naturalWidth) {
      const sc = heavy ? 1.5 : 1;
      const bw = 36 * sc, bh = 16 * sc;
      if (drill) ctx.filter = 'hue-rotate(200deg) saturate(1.6) brightness(1.2)';
      else if (r.ice) ctx.filter = 'hue-rotate(190deg) saturate(1.5) brightness(1.15)';
      else if (r.team === 'enemy') ctx.filter = 'saturate(0.75) hue-rotate(-12deg)';
      ctx.drawImage(bulletImg, -bw * 0.62, -bh / 2, bw, bh);
      ctx.filter = 'none';
      ctx.restore();
      return;
    }
    if (heavy) ctx.scale(1.45, 1.45);
    const body = ctx.createLinearGradient(0, -6, 0, 6);
    body.addColorStop(0, drill ? '#d5e8ff' : (r.team === 'player' ? '#ffb4b4' : '#e0899a'));
    body.addColorStop(0.45, drill ? '#3d7adf' : (heavy ? '#ff8a1e' : (r.team === 'player' ? '#e02727' : '#9a2340')));
    body.addColorStop(1, drill ? '#163e86' : (r.team === 'player' ? '#7a1010' : '#4a1020'));
    ctx.fillStyle = body;
    roundRect(-14, -5, 24, 10, 3, body);
    ctx.fillStyle = '#f4f7fb';
    ctx.beginPath();
    ctx.moveTo(10, -5);
    ctx.lineTo(20, 0);
    ctx.lineTo(10, 5);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.fillRect(-8, -4, 10, 2);
    ctx.restore();
  }

  function drawBarrel(b) {
    if (!b.alive) return;
    const x = b.x, y = b.y, w = b.w, h = b.h;
    const cx = x + w * 0.5;
    const topY = y + 15;
    const botY = y + h - 1;
    const rx = w * 0.5;
    ctx.fillStyle = 'rgba(40,24,12,0.22)';
    ctx.beginPath();
    ctx.ellipse(cx + 2, botY + 3, rx * 0.85, 3.5, 0, 0, 7);
    ctx.fill();
    const wood = ctx.createLinearGradient(x, 0, x + w, 0);
    wood.addColorStop(0, '#5a381f');
    wood.addColorStop(0.28, '#c4894e');
    wood.addColorStop(0.48, '#f0c48a');
    wood.addColorStop(0.72, '#a86b38');
    wood.addColorStop(1, '#4e3018');
    ctx.fillStyle = wood;
    const mid = topY + (botY - topY) * 0.5;
    ctx.beginPath();
    ctx.moveTo(cx - rx * 0.9, topY);
    ctx.bezierCurveTo(cx - rx * 1.02, topY + (botY - topY) * 0.28, cx - rx, mid, cx - rx * 0.86, botY);
    ctx.lineTo(cx + rx * 0.86, botY);
    ctx.bezierCurveTo(cx + rx, mid, cx + rx * 1.02, topY + (botY - topY) * 0.28, cx + rx * 0.9, topY);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(62,32,14,0.4)';
    ctx.lineWidth = 1;
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.moveTo(cx + i * rx * 0.42, topY + 1);
      ctx.quadraticCurveTo(cx + i * rx * 0.5, (topY + botY) * 0.5, cx + i * rx * 0.34, botY - 1);
      ctx.stroke();
    }
    function hoop(yy) {
      ctx.strokeStyle = '#2f3846';
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.moveTo(cx - rx + 1, yy);
      ctx.quadraticCurveTo(cx, yy + 4, cx + rx - 1, yy);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(220,228,238,0.8)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(cx - rx + 2, yy - 1);
      ctx.quadraticCurveTo(cx, yy + 2, cx + rx - 2, yy - 1);
      ctx.stroke();
    }
    hoop(topY + (botY - topY) * 0.3);
    hoop(topY + (botY - topY) * 0.68);
    ctx.fillStyle = '#8d5a32';
    ctx.beginPath();
    ctx.ellipse(cx, topY, rx - 1, 5, 0, 0, 7);
    ctx.fill();
    ctx.fillStyle = '#e8c296';
    ctx.beginPath();
    ctx.ellipse(cx - 1, topY - 1, rx * 0.62, 2.2, 0, Math.PI, 0, true);
    ctx.fill();
    const sticks = [[-6, 13, -0.22], [0, 16, 0.02], [6, 12, 0.2]];
    for (let i = 0; i < sticks.length; i++) {
      const s = sticks[i];
      ctx.save();
      ctx.translate(cx + s[0], topY - 1);
      ctx.rotate(s[2]);
      roundRect(-2.4, -s[1], 4.8, s[1] + 3, 1.5, i === 1 ? '#e23b3b' : '#c42828');
      ctx.fillStyle = '#f7f1e4';
      ctx.fillRect(-2.4, -s[1] + 2, 4.8, 1.8);
      ctx.restore();
    }
    const spark = 0.5 + 0.5 * Math.sin(time * 16 + b.x);
    ctx.strokeStyle = '#2c241c';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(cx + 1, topY - 15);
    ctx.quadraticCurveTo(cx + 10, topY - 18, cx + 8, topY - 26);
    ctx.stroke();
    ctx.fillStyle = spark > 0.55 ? '#fff3c2' : '#ff7a18';
    ctx.beginPath();
    ctx.arc(cx + 8, topY - 26, 1.6 + spark * 1.6, 0, 7);
    ctx.fill();
  }

  function drawOrb(o) {
    if (!o.alive) return;
    const y = o.y + Math.sin(time * 2 + o.phase) * 8;
    const icon = { quake: '≋', ice: '❄', meteor: '★', mend: '+', fan: '»' }[o.kind] || '?';
    ctx.save();
    ctx.translate(o.x, y);
    ctx.fillStyle = 'rgba(20,40,20,0.18)';
    ctx.beginPath();
    ctx.ellipse(0, 26, 16, 5, 0, 0, 7);
    ctx.fill();
    drawBox(-18, -20, 36, 36, '#e6b15a', 8);
    ctx.strokeStyle = '#8a5a22';
    ctx.lineWidth = 3;
    ctx.strokeRect(-18, -20, 36, 36);
    ctx.fillStyle = '#243044';
    ctx.font = '800 18px Nunito, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(icon, 0, -2);
    ctx.restore();
  }

  // far ranges: three layers, each moves less than the world (parallax) and fades into the horizon haze
  const RANGES = [
    { k: 0.25, top: '#c7d8e8', bot: '#dde9f2', base: 640, pts: [[0, 520], [120, 450], [260, 500], [420, 420], [600, 480], [760, 400], [940, 470], [1120, 410], [1300, 480], [1480, 430], [1700, 470]], snow: true },
    { k: 0.45, top: '#9fbacb', bot: '#c3d5e1', base: 700, pts: [[0, 560], [140, 500], [320, 545], [520, 470], [700, 530], [900, 480], [1100, 545], [1320, 490], [1520, 540], [1700, 510]] },
    { k: 0.7, top: '#6f9a86', bot: '#9bbcaa', base: 760, pts: [[0, 620], [180, 575], [380, 610], [600, 560], [820, 605], [1040, 570], [1260, 612], [1480, 580], [1700, 600]] },
  ];
  function drawFar() {
    const TH = theme();
    for (let li = 0; li < RANGES.length; li++) {
      const R = RANGES[li], shift = camX * (1 - R.k), col = TH.ranges[li];
      ctx.save();
      ctx.translate(shift, 0);
      const g = ctx.createLinearGradient(0, 400, 0, R.base);
      g.addColorStop(0, col[0]); g.addColorStop(1, col[1]);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(-200, R.base);
      ctx.lineTo(-200, R.pts[0][1]);
      for (const p of R.pts) ctx.lineTo(p[0], p[1]);
      ctx.lineTo(1900, R.base);
      ctx.fill();
      if (R.snow && TH.snowCaps) {
        ctx.fillStyle = 'rgba(255,255,255,0.75)';
        for (const p of R.pts) {
          if (p[1] > 440) continue;
          ctx.beginPath();
          ctx.moveTo(p[0], p[1]); ctx.lineTo(p[0] - 26, p[1] + 22); ctx.lineTo(p[0] - 8, p[1] + 16); ctx.lineTo(p[0] + 4, p[1] + 26); ctx.lineTo(p[0] + 24, p[1] + 20);
          ctx.fill();
        }
      }
      ctx.restore();
    }
  }

  function drawWater() {
    const g = ctx.createLinearGradient(0, WATER_Y, 0, WORLD_H + 200);
    const TW = theme().water;
    g.addColorStop(0, `rgba(${TW[0]},0.86)`);
    g.addColorStop(1, `rgba(${TW[1]},0.96)`);
    ctx.beginPath();
    ctx.moveTo(-400, WATER_Y);
    for (let x = -400; x <= WORLD_W + 400; x += 20) {
      ctx.lineTo(x, WATER_Y + Math.sin(time * 2 + x * 0.02) * 4);
    }
    ctx.lineTo(WORLD_W + 400, WORLD_H + 400);
    ctx.lineTo(-400, WORLD_H + 400);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (let x = -400; x <= WORLD_W + 400; x += 16) {
      const y = WATER_Y + Math.sin(time * 2.4 + x * 0.03) * 3;
      if (x === -400) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.35)';    // sun glints drifting on the swell
    for (let i = 0; i < 26; i++) {
      const x = ((i * 137 + time * (12 + (i % 5) * 4)) % (WORLD_W + 200)) - 100;
      const y = WATER_Y + 18 + (i * 53) % 90;
      ctx.fillRect(x, y, 10 + (i % 4) * 6, 2);
    }
  }

  let vignette = null;
  function drawVignette() {
    if (!vignette || vignette.width !== canvas.width || vignette.height !== canvas.height) {
      vignette = document.createElement('canvas');
      vignette.width = canvas.width; vignette.height = canvas.height;
      const v = vignette.getContext('2d'), w = canvas.width, h = canvas.height;
      const g = v.createRadialGradient(w / 2, h * 0.45, Math.min(w, h) * 0.35, w / 2, h * 0.45, Math.hypot(w, h) * 0.62);
      g.addColorStop(0, 'rgba(20,30,50,0)'); g.addColorStop(1, 'rgba(20,30,50,0.32)');
      v.fillStyle = g; v.fillRect(0, 0, w, h);
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(vignette, 0, 0);
  }

  // first castle ever: a ghost hand shows the pull-back gesture until the first shot
  function drawTutorial() {
    if (tutorialSeen || shotsFired > 0 || aiming || turn !== 'player' || !playing || over) return;
    const L = launcher();
    if (!L.alive) return;
    const k = (time % 1.8) / 1.8, e = k < 0.7 ? k / 0.7 : 1;
    const ease = 1 - Math.pow(1 - e, 3);
    // the drag starts anywhere: show it in open space to the right of the castle, pulling down-left
    const ox = L.x + 300, oy = L.y + 10;
    const hx = ox - ease * 110, hy = oy + ease * 80;
    ctx.globalAlpha = k < 0.85 ? 0.9 : (1 - k) / 0.15 * 0.9;
    ctx.setLineDash([6, 6]);
    ctx.strokeStyle = '#243044';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(hx, hy); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255,255,255,0.9)';   // the finger: a touch dot with a ring
    ctx.beginPath(); ctx.arc(hx, hy, 13, 0, 7); ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = '#243044'; ctx.stroke();
    ctx.globalAlpha *= 0.5;
    ctx.beginPath(); ctx.arc(hx, hy, 20 + Math.sin(time * 8) * 3, 0, 7); ctx.stroke();
    ctx.textAlign = 'center';
    ctx.globalAlpha = 1;
    ctx.font = '800 18px Nunito, sans-serif';
    ctx.lineWidth = 4; ctx.strokeStyle = '#fff';
    ctx.strokeText(t('tutorial'), ox, oy - 26);
    ctx.fillStyle = '#243044';
    ctx.fillText(t('tutorial'), ox, oy - 26);
  }

  function drawAim() {
    const pull = pullVector();
    let vx = 0, vy = 0, show = false;
    const L = launcher();
    if (pull && pull.len > 8) {
      vx = pull.vx; vy = pull.vy; show = true;
      cannonAng = Math.atan2(vy, vx);
      ctx.strokeStyle = '#243044';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(L.x - 14, L.y + 8);
      ctx.lineTo(L.x + pull.dx, L.y + pull.dy);
      ctx.lineTo(L.x + 14, L.y + 8);
      ctx.stroke();
    } else if (keyShow > 0) {
      vx = Math.cos(keyAim) * keyPower;
      vy = Math.sin(keyAim) * keyPower;
      show = true;
      cannonAng = keyAim;
    }
    if (!show) return;
    const kind = armed && specialLeft > 0 ? armed : 'normal';
    let pvx = vx, pvy = vy;
    if (kind === 'heavy') { pvx *= HEAVY_SCALE; pvy *= HEAVY_SCALE; }
    const pts = predict(pvx, pvy, kind);
    for (let i = 0; i < pts.length; i += 2) {
      ctx.globalAlpha = 0.85;
      ctx.fillStyle = i % 4 === 0 ? '#243044' : '#fff';
      ctx.beginPath();
      ctx.arc(pts[i], pts[i + 1], 3.2, 0, 7);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (playing && shotsFired === 0 && tutorialSeen) {
      ctx.fillStyle = '#243044';
      ctx.font = '800 16px Nunito, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(t('hint'), L.x + 20, L.y - 36);
    }
  }

  function draw() {
    frameCamera();
    const sx = (Math.random() - 0.5) * shake;
    const sy = (Math.random() - 0.5) * shake;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const horizon = offsetY + (600 - camY) * zoom;
    const sky = ctx.createLinearGradient(0, 0, 0, Math.max(viewH * 0.4, horizon));
    const TH = theme();
    sky.addColorStop(0, TH.sky[0]);
    sky.addColorStop(0.6, TH.sky[1]);
    sky.addColorStop(1, TH.sky[2]);
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, viewW, viewH);
    if (TH.dark) {
      for (const [sx0, sy0, r] of STARS) {
        ctx.globalAlpha = 0.5 + 0.5 * Math.sin(time * 2 + sx0 * 40);
        ctx.fillStyle = '#fff';
        ctx.fillRect(sx0 * viewW, sy0 * viewH, r, r);
      }
      ctx.globalAlpha = 1;
    }
    const sunX = viewW * 0.18, sunY = Math.min(viewH * 0.14, horizon - 120) + 10;
    const halo = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, 150);
    halo.addColorStop(0, `rgba(${TH.halo},0.75)`); halo.addColorStop(1, `rgba(${TH.halo},0)`);
    ctx.fillStyle = halo;
    ctx.fillRect(sunX - 150, sunY - 150, 300, 300);
    ctx.fillStyle = TH.sun;
    ctx.beginPath();
    ctx.arc(sunX, sunY, TH.moon ? 22 : 26, 0, 7);
    ctx.fill();
    if (TH.moon) { ctx.fillStyle = TH.sky[0]; ctx.beginPath(); ctx.arc(sunX + 9, sunY - 6, 19, 0, 7); ctx.fill(); }

    ctx.setTransform(dpr * zoom, 0, 0, dpr * zoom, dpr * (offsetX - camX * zoom + sx), dpr * (offsetY - camY * zoom + sy));
    drawFar();
    const clouds = [[180, 80, 1.3], [520, 50, 1], [900, 90, 1.5], [1280, 46, 1.1]];
    for (let i = 0; i < clouds.length; i++) {
      const c = clouds[i];
      drawCloud((c[0] + time * (8 + i * 3)) % (WORLD_W + 200) - 100, c[1], c[2]);
    }
    ctx.drawImage(terrain, 0, 0);
    for (let i = 0; i < trees.length; i++) {
      const tree = trees[i];
      if (tree.dead || !solidAt(tree.x, tree.y + 6)) continue;
      drawTree(tree.x, tree.y + 8, tree.s);
    }
    for (let i = 0; i < chunks.length; i++) {
      const c = chunks[i];
      ctx.globalAlpha = c.ghost ? Math.max(0.25, Math.min(1, c.life)) : 1;
      ctx.drawImage(c.cnv, c.x, c.y);
      ctx.globalAlpha = 1;
    }
    const paintBlocks = blocks.slice().filter(b => !b.dead).sort((a, b) => b.y - a.y);
    for (let i = 0; i < paintBlocks.length; i++) drawBlock(paintBlocks[i]);
    for (let i = 0; i < debris.length; i++) drawDebris(debris[i]);
    for (let i = 0; i < barrels.length; i++) drawBarrel(barrels[i]);
    drawSmoke();
    drawWater();
    for (let i = 0; i < orbs.length; i++) drawOrb(orbs[i]);
    if (TH.dark) {   // night: everything drawn so far goes moonlit blue; fire and sparks come after, so they glow
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalCompositeOperation = 'multiply';
      ctx.fillStyle = '#7d8cc4';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.restore();
    }
    drawGlow();
    for (let i = 0; i < rockets.length; i++) drawRocket(rockets[i]);
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      if (p.skull) drawSkull(p.x, p.y);
      else {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.s, 0, 7);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    ctx.font = '800 16px "Lilita One", Nunito, sans-serif';
    ctx.textAlign = 'center';
    for (let i = 0; i < numbers.length; i++) {
      const n = numbers[i];
      ctx.globalAlpha = Math.max(0, n.life);
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#243044';
      ctx.strokeText(n.text, n.x, n.y);
      ctx.fillStyle = n.big ? '#ffc83d' : '#fff';
      ctx.fillText(n.text, n.x, n.y);
    }
    ctx.globalAlpha = 1;
    if (playing && !over) drawAim();
    drawCannons();
    drawTutorial();
    drawVignette();
    const fl = document.getElementById('flash');
    const fa = Math.round(flashA * 100) / 100;
    if (fl.dataset.a !== String(fa)) { fl.dataset.a = String(fa); fl.style.opacity = String(fa); }
  }

  function drawCannon(x, y, ang, team) {
    const img = cannonImg[team];
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ang);
    if (img && img.complete && img.naturalWidth) {
      const sc = 0.2;
      ctx.drawImage(img, -142 * sc, -218 * sc, img.naturalWidth * sc, img.naturalHeight * sc);
    } else {
      ctx.fillStyle = team === 'player' ? '#2f74e0' : '#d43842';
      ctx.fillRect(0, -6, 28, 12);
    }
    ctx.restore();
  }

  function drawCannons() {
    const L = launcher();
    if (L.alive) drawCannon(L.x - Math.cos(cannonAng) * cannonKick * 9, L.y - Math.sin(cannonAng) * cannonKick * 9, cannonAng, 'player');
    const m = enemyMuzzle();
    if (m) drawCannon(m.x - Math.cos(enemyAng) * enemyKick * 9, m.y - Math.sin(enemyAng) * enemyKick * 9, enemyAng, 'enemy');
  }

  function loop(now) {
    let dt = Math.min(0.05, (now - (loop.then || now)) / 1000);
    loop.then = now;
    if (slowmo > 0) { slowmo -= dt; dt *= 0.28; }   // the killing blow plays in slow motion
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  function toWorld(px, py) {
    const rect = canvas.getBoundingClientRect();
    const sx = (px - rect.left) * (canvas.width / rect.width) / dpr;
    const sy = (py - rect.top) * (canvas.height / rect.height) / dpr;
    return { x: (sx - offsetX) / zoom + camX, y: (sy - offsetY) / zoom + camY };
  }

  canvas.addEventListener('pointerdown', (e) => {
    if (!playing || over || paused || settingsEl.hidden === false || turn !== 'player') return;
    aiming = true;
    aimOrigin = toWorld(e.clientX, e.clientY);
    aimPointer = aimOrigin;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!aiming) return;
    aimPointer = toWorld(e.clientX, e.clientY);
  });
  function releaseAim() {
    if (!aiming) return;
    const pull = pullVector();
    aiming = false;
    if (pull && pull.len > 22) fireVelocity(pull.vx, pull.vy);
  }
  canvas.addEventListener('pointerup', releaseAim);
  canvas.addEventListener('pointercancel', () => { aiming = false; });

  function setPaused(p, showCard) {
    if (!playing || over) return;
    if (p === paused) { pauseEl.hidden = !(p && showCard); return; }
    paused = p;
    pauseEl.hidden = !(p && showCard);
    if (p) { try { sdk.gameplayStop(); } catch (e) {} bus.ambienceOn(false); music.stop(); }
    else { hiddenPause = false; try { sdk.gameplayStart(); } catch (e) {} bus.ambienceOn(true); music.play(); }
    refreshHud();
  }
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Escape' || e.code === 'KeyP') {
      e.preventDefault();
      if (!settingsEl.hidden) { settingsEl.hidden = true; setPaused(false); return; }
      if (!playing || over) return;
      setPaused(!paused, true);
      return;
    }
    if (!playing || over || paused) return;
    if (e.code === 'ArrowLeft') { keyAim = clamp(keyAim - 0.05, -0.78, -0.12); keyShow = 1.2; e.preventDefault(); }
    if (e.code === 'ArrowRight') { keyAim = clamp(keyAim + 0.05, -0.78, -0.12); keyShow = 1.2; e.preventDefault(); }
    if (e.code === 'ArrowUp') { keyPower = clamp(keyPower + 40, 520, MAX_SPEED); keyShow = 1.2; e.preventDefault(); }
    if (e.code === 'ArrowDown') { keyPower = clamp(keyPower - 40, 520, MAX_SPEED); keyShow = 1.2; e.preventDefault(); }
    if (e.code === 'Digit1') { armSpecial('drill'); e.preventDefault(); }
    if (e.code === 'Digit2') { armSpecial('heavy'); e.preventDefault(); }
    if (e.code === 'Space') {
      e.preventDefault();
      if (!keys.Space) fireVelocity(Math.cos(keyAim) * keyPower, Math.sin(keyAim) * keyPower);
      keys.Space = true;
    }
  });
  window.addEventListener('keyup', (e) => { keys[e.code] = false; });

  document.getElementById('play').addEventListener('click', () => startGame(false));
  document.getElementById('newgame').addEventListener('click', () => startGame(true));
  document.getElementById('gear').addEventListener('click', () => {
    settingsEl.hidden = false;
    setPaused(true, false);
  });
  document.getElementById('set-close').addEventListener('click', () => {
    settingsEl.hidden = true;
    setPaused(false);
  });
  document.getElementById('resume').addEventListener('click', () => {
    setPaused(false);
    soundWasMuted = bus.muted;
    try { sdk.showMidgame('resume'); } catch (e) {}
  });
  document.getElementById('music').addEventListener('click', () => {
    bus.ensure();
    music.toggle();
    applyLang();
  });
  document.getElementById('mute').addEventListener('click', () => {
    bus.ensure();
    bus.toggleMute();
    soundWasMuted = bus.muted;
    applyLang();
  });
  document.getElementById('lang').addEventListener('click', () => {
    lang = lang === 'sr' ? 'en' : 'sr';
    if (window.GameroomI18n) window.GameroomI18n.set(lang, { reload: false });
    applyLang();
  });
  document.getElementById('spec-drill').addEventListener('click', () => armSpecial('drill'));
  document.getElementById('spec-heavy').addEventListener('click', () => armSpecial('heavy'));
  document.getElementById('end-next').addEventListener('click', nextRound);
  document.getElementById('end-reward').addEventListener('click', endReward);
  document.getElementById('refill').addEventListener('click', refillRockets);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && playing && !over && !paused) { setPaused(true, true); hiddenPause = true; }
  });
  window.addEventListener('pagehide', () => {
    if (sessionSent) return;
    try { sdk.track('level_end', { result: over || 'leave', level, score }); } catch (e) {}
    try { sdk.gameplayStop(); } catch (e) {}
  });
  window.addEventListener('resize', resize);

  function solidCount() {
    let n = 0;
    for (let i = 0; i < solid.length; i++) n += solid[i];
    return n;
  }
  window.__start = () => startGame(false);
  window.__razori = {
    fireVelocity, solidCount, launcher, solidAt,
    finish, get progress() { return JSON.parse(JSON.stringify(progress)); },
    setAmmo(n) { ammo = n; ammoT = 0; refreshHud(); return ammo; },
    view() { return { w: viewW / zoom, zoom }; },
    theme() { return theme().id; },
    boss() { return isBoss(); },
    winNow() { const c = enemyCore(); if (c) { c.hp = 0; killBlock(c); } },
    loseNow() { const c = playerCore(); if (c) { c.hp = 0; killBlock(c); } },
    get rockets() { return rockets; },
    get chunks() { return chunks; },
    get orbs() { return orbs; },
    get blocks() { return blocks; },
    get barrels() { return barrels; },
    get held() { return held.slice(); },
    armSpecial,
    detonate,
    give(kind) { held.push(kind); refreshMagics(); },
    setLevel(n) {
      level = n;
      score = 0;
      over = null;
      playing = true;
      paused = false;
      veil.hidden = true;
      endEl.hidden = true;
      placeWorld();
      refreshHud();
      refreshSpecials();
      refreshMagics();
    },
    get state() {
      return {
        playing, over, ammo, salvo, score, level, armed, specialLeft, coreChip, collapseAwarded, turn,
        hpE: hpOf('enemy'), hpP: hpOf('player'),
        skipEnemy, skipPlayer, spellArmed, held: held.slice(), foeHeld: foeHeld.slice(),
        barrels: barrels.filter(b => b.alive).map(b => ({ x: Math.round(b.x), y: Math.round(b.y), kind: b.kind })),
        crates: orbs.filter(o => o.alive).length,
        enemyBlocks: blocks.filter(b => b.team === 'enemy' && !b.dead).length,
      };
    },
  };

  resize();
  placeWorld();
  applyLang();
  if (AUTO) {
    veil.hidden = true;
    playing = true;
    try { sdk.gameplayStart(); } catch (e) {}
    try { sdk.track('game_start', { level, auto: true }); } catch (e) {}
    if (!SIM) setTimeout(volley, params.get('shot') === 'boom' ? 1700 : 2400);
    refreshSpecials();
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
