}

function spawnPouch(keepSeries){
  const ids = activeSeriesIds();
  if(!keepSeries || ids.indexOf(pouchSeries)<0){
    pouchSeries = ids[Math.floor(Math.random()*ids.length)];
  }
  if(pouch){ openRoot.remove(pouch.group); pouch.group.traverse(o=>{ if(o.isMesh) o.geometry.dispose(); }); }
  pouch = buildPouch();
  pouch.group.position.set(0, 0.46, 0);
  openRoot.add(pouch.group);
  pop3(pouch.group);
  applyOpenTheme();
}
let popping = null;
function pop3(obj){ obj.scale.setScalar(0.01); popping = { obj, t:0 }; }

function startOpen(){
  if(state.tokens<1 || phase!=='idle') return;
  sfx.ensure();
  state.tokens -= 1;
  pendingCharacter = weightedRandomCharacter();
  pendingIsNew = !state.collection[pendingCharacter.id];
  // upisujemo odmah — napuštanje ekrana usred animacije više ne gubi figuru
  state.collection[pendingCharacter.id] = (state.collection[pendingCharacter.id]||0) + 1;
  pendingBonus = !pendingIsNew;
  if(pendingBonus) state.tokens = Math.min(state.maxTokens, state.tokens+1);
  saveLocal();
  if(!opened++) sdk.track('game_start', { owned: Object.keys(state.collection).length });
  sdk.track('bag_opened', { rarity: pendingCharacter.rarity, isNew: pendingIsNew, owned: Object.keys(state.collection).length });
  if(pendingIsNew && Object.keys(state.collection).length===CHARACTERS.length) sdk.track('collection_complete');
  hideResultCardInstant();
  phase = 'shake'; phaseTime = 0; ripCount = 0;
  const hex = RARITY[pendingCharacter.rarity].hex;
  pouch.glowMat.color.set(pendingCharacter.rarity==='common' ? 0xffffff : hex);
  pouch.leakMat.color.set(pendingCharacter.rarity==='common' ? 0xffffff : hex);
  updateTokenUI(); updateProgressUI();
}

function enterPhase(name){
  phase = name; phaseTime = 0;
  const ch = pendingCharacter;
  if(name==='burst'){
    sfx.pop();
    if(activeFigure) openRoot.remove(activeFigure);
    activeFigure = buildFigureModel(ch);
    activeFigure.position.set(0, 0.6, 0);
    activeFigure.rotation.y = 0;
    openCamGoal.theta = 0; openCam.theta = 0;
    activeFigure.scale.setScalar(0.0001);
    openRoot.add(activeFigure);
    const top = new THREE.Vector3(0, pouch.group.position.y + POUCH_H*0.35, 0.05);
    const lvl = ch.rarity==='legendary' ? 2 : ch.rarity==='rare' ? 1 : 0;
    spawnParticleBurst(top, RARITY[ch.rarity].hex, ch.accent, [60,150,320][lvl], [0.09,0.13,0.17][lvl], [1,1.35,1.8][lvl]);
    spawnConfetti(top, [50,160,340][lvl], [0.8,1.15,1.5][lvl]);
    ringMat.color.set(RARITY[ch.rarity].hex); ringMat.opacity = 0.9; ring.scale.setScalar(0.3);
    if(lvl>0){
      beamCone.visible = true; beamCone.material.color.set(RARITY[ch.rarity].hex); beamCone.material.opacity = 0;
      raysMat.color.set(lvl===2 ? 0xffd24a : 0x6fc3ff);
      rarityPop(ch);
      camShake = lvl===2 ? 0.09 : 0.04;
      screenFlash(lvl===2 ? '#fff6c9' : '#d9f0ff', lvl===2 ? 1 : 0.62);
      if(lvl===2) sfx.legendary(); else sfx.rare();
    } else sfx.sparkle();
  }
  if(name==='result'){
    updateTokenUI(); updateProgressUI();
    showResultCard(ch, pendingIsNew, pendingBonus);
    // dodatni "sletni" bljesak čestica tačno kad se pojavi kartica — jači za retke/legendarne
    const lvl2 = ch.rarity==='legendary' ? 2 : ch.rarity==='rare' ? 1 : 0;
    if(lvl2>0){
      const landPt = new THREE.Vector3(0, 1.1, 0.05);
      spawnParticleBurst(landPt, RARITY[ch.rarity].hex, ch.accent, lvl2===2?150:75, lvl2===2?0.15:0.11, lvl2===2?1.35:1.05);
      if(lvl2===2) spawnConfetti(landPt, 130, 1.1);
    }
  }
  if(name==='idle'){
    if(activeFigure){ openRoot.remove(activeFigure); activeFigure=null; }
    beamCone.visible = false; raysMat.opacity = 0;
    spawnPouch();
  }
  updateTokenUI();
}

// napuštanje ekrana otvaranja usred animacije: figura je već u kolekciji, samo počistimo scenu
function finishOpenNow(){
  if(phase==='idle') return;
  hideResultCardInstant();
  document.getElementById('rarity-pop').className = '';
  enterPhase('idle');
}

function updateOpenSequence(dt){
  if(!pouch) return;
  phaseTime += dt;
  const ch = pendingCharacter;
  if(popping){ popping.t += dt/0.45; popping.obj.scale.setScalar(Math.max(0.01, easeOutBack(Math.min(1,popping.t)))); if(popping.t>=1){ popping.obj.scale.setScalar(1); popping = null; } }

  if(phase==='idle'){
    pouch.group.rotation.y = Math.sin(clock.elapsedTime*0.7)*0.45;
    pouch.group.rotation.z = Math.sin(clock.elapsedTime*1.1)*0.03;
    pouch.group.position.y = 0.46 + Math.sin(clock.elapsedTime*1.4)*0.025;
  }
  else if(phase==='shake'){
    // napetost: kesica se okreće ka kameri i trese; retke figure svetle kroz foliju
    const dur = SHAKE_DUR[ch.rarity], t = clamp(phaseTime/dur,0,1);
    const amp = ch.rarity==='legendary' ? 0.12 : ch.rarity==='rare' ? 0.09 : 0.07;
    pouch.group.rotation.y = lerp(pouch.group.rotation.y, 0, Math.min(1, dt*10));
    pouch.group.rotation.z = Math.sin(phaseTime*38)*amp*(0.4+t*0.6);
    pouch.group.position.x = Math.sin(phaseTime*27)*0.01*t;
    pouch.group.scale.setScalar(1 + Math.sin(phaseTime*30)*0.02*t);
    const glowMax = ch.rarity==='legendary' ? 0.95 : ch.rarity==='rare' ? 0.7 : 0.3;
    pouch.glowMat.opacity = t*glowMax*(0.8+Math.sin(phaseTime*20)*0.2);
    pouch.glow.scale.setScalar(1.3 + t*(ch.rarity==='legendary' ? 1.2 : 0.5));
    if(ch.rarity==='legendary'){ camShake = Math.max(camShake, 0.012*t); if(Math.random()<dt*20) spawnParticleBurst(new THREE.Vector3(rand(-0.3,0.3),rand(0.1,0.9),0.1), 0xffd24a, 0xffffff, 4, 0.08, 0.3); }
    if(Math.random()<dt*6) sfx.crinkle();
    if(t>=1){ pouch.group.rotation.z = 0; pouch.group.position.x = 0; pouch.group.scale.setScalar(1); enterPhase('tear'); }
  }
  else if(phase==='tear'){
    const dur = 0.85, t = clamp(phaseTime/dur,0,1);
    peelStrip(easeOutCubic(t));
    pouch.group.rotation.z = Math.sin(phaseTime*50)*0.015*(1-t);
    const rips = Math.floor(t*5);
    if(rips>ripCount){ ripCount = rips; sfx.rip();
      const x = -POUCH_W/2 + t*POUCH_W, y = pouch.group.position.y + (TEAR_V-0.5)*POUCH_H;
      spawnParticleBurst(new THREE.Vector3(x,y,0.08), 0xffffff, 0xd9d0ff, 6, 0.06, 0.4); }
    pouch.leakMat.opacity = t*(ch.rarity==='common' ? 0.5 : 1);
    pouch.leak.scale.set(0.2+t*0.9, 0.18+t*0.12, 1);
    if(t>=1) enterPhase('burst');
  }
  else if(phase==='burst'){
    const t = phaseTime;
    // otkinuta traka odleti, kesica se zgnječi i padne, figura iskoči iz nje
    const fly = clamp(t/0.6,0,1);
    pouch.strip.position.set(fly*0.9, fly*0.5 - fly*fly*0.6, fly*0.2);
    pouch.strip.rotation.set(fly*1.5, fly*2, -fly*3);
    const squash = Math.sin(clamp(t/0.25,0,1)*Math.PI);
    pouch.body.scale.set(1+squash*0.12, 1-squash*0.15, 1);
    if(t>0.25){ const d = easeOutCubic(clamp((t-0.25)/0.7,0,1)); pouch.group.position.y = 0.46 - d*1.2; pouch.mats.forEach(m=>{ m.transparent = true; m.opacity = 1-d; }); }
    pouch.leakMat.opacity = Math.max(0, pouch.leakMat.opacity - dt*2);
    pouch.glowMat.opacity = Math.max(0, pouch.glowMat.opacity - dt*1.2);
    const lvl = ch.rarity==='legendary' ? 2 : ch.rarity==='rare' ? 1 : 0;
    ring.scale.setScalar(0.3 + t*(2.2 + lvl*1.1)); ringMat.opacity = Math.max(0, (0.9 + lvl*0.05) - t*(1.2 - lvl*0.2));
    if(activeFigure){
      const bs = activeFigure.userData.baseScale;
      if(t<0.45){ const k = easeOutCubic(t/0.45); activeFigure.position.y = lerp(0.6, 1.05, k); activeFigure.scale.setScalar(lerp(0.25, 1.15, k)*bs); }
      else { const k = clamp((t-0.45)/0.6,0,1); activeFigure.position.y = lerp(1.05, 0.42, easeOutBounce(k)); activeFigure.scale.setScalar(lerp(1.15, 1.32, k)*bs); }
      activeFigure.rotation.y = lerp(activeFigure.rotation.y, 0, Math.min(1, dt*8));
    }
    if(lvl>0){
      beamCone.material.opacity = Math.sin(clamp(t/1.05,0,1)*Math.PI)*(0.4+lvl*0.2);
      raysMat.opacity = Math.min(lvl===2 ? 0.9 : 0.55, t*2);
    }
    if(lvl===2 && Math.random()<dt*14) spawnConfetti(new THREE.Vector3(rand(-0.7,0.7),1.5,rand(-0.25,0.25)), 10, 0.55);
    if(lvl===1 && Math.random()<dt*5) spawnConfetti(new THREE.Vector3(rand(-0.5,0.5),1.3,rand(-0.2,0.2)), 5, 0.4);
    if(t>=1.05){ pouch.group.visible = false; enterPhase('result'); }
  }
  else if(phase==='result'){
    if(activeFigure){ activeFigure.position.y = 0.42 + Math.abs(Math.sin(clock.elapsedTime*2.2))*0.03; activeFigure.scale.setScalar(activeFigure.userData.baseScale*1.32); activeFigure.rotation.y = lerp(activeFigure.rotation.y, 0, Math.min(1, dt*8)); }
    beamCone.material.opacity = Math.max(0, beamCone.material.opacity-dt*0.4);
    raysMat.opacity = Math.max(pendingCharacter.rarity==='legendary' ? 0.45 : pendingCharacter.rarity==='rare' ? 0.25 : 0, raysMat.opacity - dt*0.5);
  }
  if(raysMat.opacity>0) raysMat.rotation += dt*0.4;
  updateParticleSystems(dt);
  updateConfetti(dt);
}

const openCamTarget = new THREE.Vector3(0,0.5,0);
const openCam = { theta:0, phi:1.36, radius:2.7 }, openCamGoal = { theta:0, phi:1.36, radius:2.7 };
const showroomCamTarget = new THREE.Vector3(-0.25,1.95,-0.9);
const camSpherical = { theta:0, phi:1.45, radius:7 }, camTargetSpherical = { theta:0, phi:1.45, radius:7 };
let showroomMinR = 2.2, showroomMaxR = 9;

let showroomPan = 0;
let shelfHome = { y:1.95, radius:7, phi:1.45 };
let shelfFocus = null;
function fitCameras(){
  const aspect = window.innerWidth/window.innerHeight, halfT = Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  // otvaranje: fiksna udaljenost (bez zuma) — dovoljno da kesica/figura stanu i na uskom ekranu
  openCamGoal.radius = openCam.radius = Math.max(2.45, 0.56/(halfT*aspect));
  // showroom: na uskom ekranu bliži kadar (figure se vide), širina se gleda prevlačenjem
  const wide = Math.max(4.6/halfT*0.5, 2.6/(halfT*Math.max(aspect, 0.55)));
  const portrait = aspect < 0.9;
  const fitR = portrait ? Math.min(wide, Math.max(7.2, 2.3/halfT)) : wide;
  showroomMinR = portrait ? 3.4 : 2.2;
  showroomMaxR = Math.max(wide, fitR) * 1.08;
  shelfHome = { y: portrait ? 2.55 : 1.95, radius: fitR, phi: portrait ? 1.38 : 1.45 };
  if(!shelfFocus){
    camTargetSpherical.radius = camSpherical.radius = fitR;
    camTargetSpherical.phi = camSpherical.phi = shelfHome.phi;
    showroomCamTarget.y = shelfHome.y;
  }
}
function sphericalToCartesian(s, center){
  return new THREE.Vector3(center.x + s.radius*Math.sin(s.phi)*Math.sin(s.theta), center.y + s.radius*Math.cos(s.phi), center.z + s.radius*Math.sin(s.phi)*Math.cos(s.theta));
}
function updateOpenCamera(dt){
  const k = 1-Math.pow(0.0008, dt);
  openCam.theta = lerp(openCam.theta, openCamGoal.theta, k);
  openCam.phi = lerp(openCam.phi, openCamGoal.phi, k);
  camera.position.copy(sphericalToCartesian(openCam, openCamTarget));
  if(camShake>0){ camera.position.x += rand(-camShake,camShake); camera.position.y += rand(-camShake,camShake); camShake = Math.max(0, camShake - dt*0.08); }
  camera.lookAt(openCamTarget);
}
function updateShowroomCamera(dt){
  const k = 1-Math.pow(0.0008, dt);
  const goal = shelfFocus || { x: -0.25 + showroomPan, y: shelfHome.y, z: -0.9 };
  showroomCamTarget.x = lerp(showroomCamTarget.x, goal.x, k);
  showroomCamTarget.y = lerp(showroomCamTarget.y, goal.y, k);
  showroomCamTarget.z = lerp(showroomCamTarget.z, goal.z, k);
  camSpherical.theta = lerp(camSpherical.theta, camTargetSpherical.theta, k);
  camSpherical.phi = lerp(camSpherical.phi, camTargetSpherical.phi, k);
  camSpherical.radius = lerp(camSpherical.radius, camTargetSpherical.radius, k);
  camera.position.copy(sphericalToCartesian(camSpherical, showroomCamTarget));
  camera.lookAt(showroomCamTarget);
}

let shelfFigures = {}, selectableRoots = [], shelfSpinId = null;
const SHELF_Y = [3.55, 2.75, 1.95, 1.15, 0.35];
const SLOT_X = [-1.6,-0.9,-0.2,0.5,1.2,1.9];

function paintSweetWall(ctx, s){
  const g = ctx.createLinearGradient(0,0,0,s);
  g.addColorStop(0,'#3a2d86'); g.addColorStop(0.55,'#2f6cb8'); g.addColorStop(1,'#1d4e86');
  ctx.fillStyle=g; ctx.fillRect(0,0,s,s);
  ctx.globalAlpha=0.55;
  for(let i=0;i<70;i++){ ctx.fillStyle = ['#ffffff','#fff27a','#ff9ad5','#7df9ff'][i%4]; starShape(ctx, Math.random()*s, Math.random()*s, rand(3,8), ctx.fillStyle); }
  ctx.globalAlpha=1;
}
function paintGarageWall(ctx, s){
  const g = ctx.createLinearGradient(0,0,0,s);
  g.addColorStop(0,'#7ecbff'); g.addColorStop(0.5,'#d7f1ff'); g.addColorStop(0.78,'#ffe7a0'); g.addColorStop(1,'#ffb020');
  ctx.fillStyle=g; ctx.fillRect(0,0,s,s);
  ctx.fillStyle='#ffe14d';
  ctx.beginPath(); ctx.arc(s*0.8, s*0.16, s*0.07, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.95)';
  [[0.16,0.2,0.06],[0.34,0.14,0.045],[0.5,0.26,0.05]].forEach(([x,y,r])=>{
    ctx.beginPath(); ctx.arc(x*s, y*s, r*s, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x*s+r*s*0.9, y*s+r*s*0.1, r*s*0.7, 0, Math.PI*2); ctx.fill();
  });
  ctx.fillStyle='#3d4d6e';
  for(let i=0;i<16;i++){
    const w = s*0.055, h = s*(0.07+((i*5)%4)*0.025);
    ctx.fillRect(i*w*1.12, s*0.72-h*0.15, w*0.85, h);
  }
}
function paintSeaWall(ctx, s){
  const g = ctx.createLinearGradient(0,0,0,s);
  g.addColorStop(0,'#c8fbff'); g.addColorStop(0.28,'#3ec6ff'); g.addColorStop(0.7,'#1466d6'); g.addColorStop(1,'#07285f');
  ctx.fillStyle=g; ctx.fillRect(0,0,s,s);
  ctx.globalAlpha=0.22; ctx.fillStyle='#ffffff';
  for(let i=0;i<5;i++){
    ctx.beginPath();
    ctx.moveTo(s*(0.12+i*0.18), 0);
    ctx.lineTo(s*(0.2+i*0.18), s);
    ctx.lineTo(s*(0.08+i*0.18), s);
    ctx.fill();
  }
  ctx.globalAlpha=0.7;
  for(let i=0;i<18;i++){
    ctx.fillStyle='rgba(255,255,255,0.85)';
    ctx.beginPath(); ctx.arc(Math.random()*s, Math.random()*s, rand(4,14), 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1; ctx.strokeStyle='#1f9a5c'; ctx.lineWidth=8; ctx.lineCap='round';
  for(let i=0;i<7;i++){
    const x = s*(0.08+i*0.14);
    ctx.beginPath(); ctx.moveTo(x, s); ctx.quadraticCurveTo(x+20, s*0.82, x-8, s*0.7); ctx.stroke();
  }
}
function paintFruitWall(ctx, s){
  const g = ctx.createLinearGradient(0,0,0,s);
  g.addColorStop(0,'#eaffb0'); g.addColorStop(0.5,'#b6e34d'); g.addColorStop(1,'#3f8f1f');
  ctx.fillStyle=g; ctx.fillRect(0,0,s,s);
  ctx.fillStyle='#ffe14d';
  ctx.beginPath(); ctx.arc(s*0.78, s*0.15, s*0.075, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.lineWidth=6;
  for(let i=0;i<6;i++){
    const x = s*(0.08+i*0.17);
    ctx.beginPath(); ctx.moveTo(x, s); ctx.quadraticCurveTo(x+18, s*0.6, x-10, s*0.3); ctx.stroke();
  }
  ctx.globalAlpha=0.6;
  for(let i=0;i<40;i++){ ctx.fillStyle = i%2 ? '#fff6c9' : '#ffffff'; ctx.beginPath(); ctx.arc(Math.random()*s, s*0.15+Math.random()*s*0.7, rand(3,7), 0, Math.PI*2); ctx.fill(); }
  ctx.globalAlpha=1;
}
function paintFruitFloor(ctx, s){
  ctx.fillStyle='#c98a4b'; ctx.fillRect(0,0,s,s);
  for(let i=0;i<8;i++){ ctx.fillStyle = i%2 ? '#b6742f' : '#c98a4b'; ctx.fillRect(0,i*s/8,s,s/8); }
  ctx.strokeStyle='rgba(0,0,0,0.15)'; ctx.lineWidth=3;
  for(let i=0;i<4;i++){ ctx.beginPath(); ctx.moveTo(i*s/4,0); ctx.lineTo(i*s/4,s); ctx.stroke(); }
}
function paintSweetFloor(ctx, s){
  for(let i=0;i<8;i++){ ctx.fillStyle = i%2 ? '#e39a4a' : '#c47b32'; ctx.fillRect(0,i*s/8,s,s/8); }
}
function paintGarageFloor(ctx, s){
  for(let y=0;y<8;y++) for(let x=0;x<8;x++){
    ctx.fillStyle = (x+y)%2 ? '#d7dbe3' : '#b4bac6';
    ctx.fillRect(x*s/8, y*s/8, s/8, s/8);
  }
  ctx.fillStyle='#ffb020'; ctx.fillRect(0,0,s,s*0.08); ctx.fillRect(0,s*0.92,s,s*0.08);
}
function paintSeaFloor(ctx, s){
  ctx.fillStyle='#f0d08a'; ctx.fillRect(0,0,s,s);
  for(let i=0;i<90;i++){
    ctx.fillStyle = i%2 ? '#e2b86a' : '#fff3c4';
    ctx.beginPath(); ctx.arc(Math.random()*s, Math.random()*s, rand(2,7), 0, Math.PI*2); ctx.fill();
  }
}
const ROOM_BACKDROP = {
  slatko: ['#2f6dff','#6a3dff','#ff5fa8'],
  garaza: ['#7ecbff','#ffe7a0','#ffb020'],
  more: ['#7fe7ff','#1470e0','#07285f'],
  voce: ['#eaffb0','#9ccc3f','#2f7a1f']
};
function showroomBackdrop(){

}

const WALL_PAINT = { garaza:paintGarageWall, more:paintSeaWall, voce:paintFruitWall };
const FLOOR_PAINT = { garaza:paintGarageFloor, more:paintSeaFloor, voce:paintFruitFloor };
function buildShowroomScene(){
  const wallPaint = WALL_PAINT[showroomSeries] || paintSweetWall;
  const floorPaint = FLOOR_PAINT[showroomSeries] || paintSweetFloor;
  const wallTex = srgb(makeCanvasTexture(wallPaint, 512));
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(9,5.4), new THREE.MeshStandardMaterial({ map:wallTex, roughness:0.9 }));
  wall.position.set(-0.25,2.3,-1.3); wall.receiveShadow = true;
  showroomRoot.add(wall);
  const floorTex = srgb(makeCanvasTexture(floorPaint, 256));
  floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping; floorTex.repeat.set(3,3);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(10,7), new THREE.MeshStandardMaterial({ map:floorTex, roughness:0.8 }));
  floor.rotation.x=-Math.PI/2; floor.receiveShadow = true;
  showroomRoot.add(floor);

  const key = new THREE.DirectionalLight(0xffffff, 0.85);
  key.position.set(2,6,5); key.castShadow = true; key.shadow.mapSize.set(1024,1024);
  Object.assign(key.shadow.camera, { left:-4, right:4, top:4.5, bottom:-1 });
  key.target.position.set(0,2,-0.9);
  showroomRoot.add(key, key.target);
  showroomRoot.add(new THREE.HemisphereLight(0xd7ecff, 0x6a4a88, 0.55));

  SERIES[showroomSeries].factions.forEach((fid,idx)=> buildShelf(fid, SHELF_Y[idx]));
}

function buildShelf(factionId, y){
  const faction = FACTIONS[factionId];
  const board = new THREE.Mesh(new THREE.BoxGeometry(5.1,0.08,0.62), toonMat(faction.color));
  board.position.set(-0.25,y,-0.9); board.castShadow = true; board.receiveShadow = true;
  showroomRoot.add(board);
  const lip = new THREE.Mesh(new THREE.BoxGeometry(5.1,0.05,0.04), toonMat(0xffffff));
  lip.position.set(-0.25,y+0.02,-0.9+0.32);
  showroomRoot.add(lip);
  // viseća etiketa sa imenom grupe
  const tagTex = srgb(makeCanvasTexture((ctx,w,h)=>{
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.roundRect(4,4,w-8,h-8,26); ctx.fill();
    ctx.lineWidth = 8; ctx.strokeStyle = '#'+faction.color.toString(16).padStart(6,'0'); ctx.stroke();
    ctx.font = '800 58px "Baloo 2", Arial'; ctx.fillStyle = '#2a1245'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(faction.emoji+' '+faction.name, w/2, h/2+4);
  }, 420, 110));
  const tag = new THREE.Mesh(new THREE.PlaneGeometry(0.84,0.22), new THREE.MeshBasicMaterial({ map:tagTex, transparent:true }));
  tag.position.set(-2.35, y+0.3, -0.62);
  showroomRoot.add(tag);
  const chars = CHARACTERS.filter(c=>c.faction===factionId);
  chars.forEach((char,i)=> buildSlot(char, new THREE.Vector3(SLOT_X[i], y+0.04, -0.9)));
}

function buildSlot(char, pos){
  const owned = !!state.collection[char.id];
  const pedestal = new THREE.Mesh(new THREE.CylinderGeometry(0.17,0.19,0.035,20), toonMat(owned ? 0xffffff : 0xe8e0ff));
  pedestal.position.copy(pos); pedestal.receiveShadow = true;
  showroomRoot.add(pedestal);
  if(owned){
    const fig = buildFigureModel(char);
    fig.position.set(pos.x, pos.y+0.018, pos.z);
    fig.userData.baseY = pos.y+0.018;
    showroomRoot.add(fig);
    shelfFigures[char.id] = fig;
    selectableRoots.push(fig);
  } else {
    const ghost = buildLockedGhost(char);
    ghost.position.set(pos.x, pos.y+0.02, pos.z);
    showroomRoot.add(ghost);
  }
}

function buildLockedGhost(char){
  const g = new THREE.Group();
  const mat = new THREE.MeshBasicMaterial({ color:FACTIONS[char.faction].color, transparent:true, opacity:0.88, depthWrite:false });
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.16,14,12), mat);
  body.scale.set(1,1.25,1); body.position.y = 0.2;
  g.add(body);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.15, 0.028, 8, 18), new THREE.MeshBasicMaterial({ color:FACTIONS[char.faction].color }));
  ring.rotation.x = Math.PI/2; ring.position.y = 0.02;
  g.add(ring);
  const q = new THREE.Sprite(new THREE.SpriteMaterial({ map: questionTex, transparent:true, opacity:1 }));
  q.scale.setScalar(0.28); q.position.y = 0.24;
  g.add(q);
  return g;
}

function rebuildShowroom(){
  clearGroup(showroomRoot);
  shelfFigures = {}; selectableRoots = [];
  buildShowroomScene();
  if(scene && currentMode==='showroom') scene.background = showroomBackdrop();
}

function updateShelfFiguresIdle(dt, elapsed){
  Object.values(shelfFigures).forEach(fig=>{
    if(fig.userData.charId===shelfSpinId){ /* korisnik je okreće pun krug */ }
    else fig.rotation.y += dt*0.45;
    fig.position.y = fig.userData.baseY + Math.abs(Math.sin(elapsed*1.6+fig.userData.floatSeed))*0.02;
    const orbit = fig.getObjectByName('orbit');
    if(orbit) orbit.rotation.y += dt*1.2;
    if(fig.userData.bumpT!==undefined && fig.userData.bumpT<1){
      fig.userData.bumpT += dt*2.4;
      const b = Math.sin(clamp(fig.userData.bumpT,0,1)*Math.PI)*0.18;
      fig.scale.setScalar(fig.userData.baseScale + b);
      if(fig.userData.bumpT>=1){ fig.scale.setScalar(fig.userData.baseScale); delete fig.userData.bumpT; }
    }
  });
}

/* ============================= KONTROLE (prevlačenje / štipanje) ============================= */

const pointers = new Map();
let dragAccum = 0, pinchDist = 0;

function setupControls(){
  const el = renderer.domElement;
  el.addEventListener('pointerdown', e=>{
    pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
    dragAccum = 0;
    if(pointers.size===2){ const [a,b] = [...pointers.values()]; pinchDist = Math.hypot(a.x-b.x, a.y-b.y); }
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
  });
  el.addEventListener('pointermove', e=>{
    const p = pointers.get(e.pointerId);
    if(!p) return;
    const dx = e.clientX-p.x, dy = e.clientY-p.y;
    p.x = e.clientX; p.y = e.clientY;
    dragAccum += Math.abs(dx)+Math.abs(dy);
    if(pointers.size>=2){
      // štipanje = zum, samo na policama
      if(currentMode!=='showroom') return;
      const [a,b] = [...pointers.values()], d = Math.hypot(a.x-b.x, a.y-b.y);
      if(pinchDist>0){
        const rMin = shelfFocus ? 1.55 : showroomMinR, rMax = shelfFocus ? 3.6 : showroomMaxR;
        camTargetSpherical.radius = clamp(camTargetSpherical.radius * pinchDist/d, rMin, rMax);
      }
      pinchDist = d;
      return;
    }
    if(currentMode==='showroom'){
      const spun = shelfSpinId && shelfFigures[shelfSpinId];
      if(spun) spun.rotation.y -= dx*0.012;
      else if(!shelfFocus) showroomPan = clamp(showroomPan - dx*0.006, -1.8, 1.8);
      if(!shelfFocus) camTargetSpherical.phi = clamp(camTargetSpherical.phi - dy*0.004, 1.15, 1.55);
    } else {
      // izvlačenje: figura gleda u kameru, samo mali otklon levo-desno
      openCamGoal.theta = clamp(openCamGoal.theta - dx*0.004, -0.28, 0.28);
    }
  });
  const up = e=>{ pointers.delete(e.pointerId); if(pointers.size<2) pinchDist = 0; };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('wheel', e=>{
    e.preventDefault();
    if(currentMode!=='showroom') return;       // na otvaranju nema zuma
    const rMin = shelfFocus ? 1.55 : showroomMinR, rMax = shelfFocus ? 3.6 : showroomMaxR;
    camTargetSpherical.radius = clamp(camTargetSpherical.radius + e.deltaY*0.003, rMin, rMax);
  }, { passive:false });
  el.addEventListener('click', onCanvasClick);
}

function onCanvasClick(e){
  if(dragAccum>8) return;
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX-rect.left)/rect.width)*2-1;
  mouse.y = -((e.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(mouse, camera);
  if(currentMode==='open'){
    // tap na kesicu takođe otvara
    if(phase==='idle' && pouch && raycaster.intersectObject(pouch.group, true).length) startOpen();
    return;
  }
  const hits = raycaster.intersectObjects(selectableRoots, true);
  if(hits.length){
    let obj = hits[0].object;
    while(obj && !obj.userData.charId) obj = obj.parent;
    if(obj) selectCharacterInfo(obj.userData.charId);
  } else hideInfoPanel();
}

function applyShelfFocusVisibility(){
  Object.values(shelfFigures).forEach(fig=>{
    fig.visible = !shelfFocus || fig.userData.charId===shelfSpinId;
  });
}
function focusShelfFigure(fig){
  const narrow = window.innerWidth < 720;
  shelfFocus = {
    x: fig.position.x + (narrow ? 0 : 0.32),
    y: fig.userData.baseY + (narrow ? 0.22 : 0.38),
    z: fig.position.z
  };
  camTargetSpherical.radius = narrow ? 1.85 : 1.55;
  camTargetSpherical.phi = 1.18;
  camTargetSpherical.theta = 0;
  fig.rotation.y = 0;
  applyShelfFocusVisibility();
}
function syncShelfChrome(){
  const show = currentMode==='showroom' && !shelfFocus;
  const bar = document.getElementById('series-bar');
  if(bar) bar.classList.toggle('hidden', !show);
}
function selectCharacterInfo(charId){
  shelfSpinId = charId;
  const char = CHAR_BY_ID[charId];
  paintRarityPips(document.getElementById('info-rarity'), char.rarity);
  document.getElementById('info-name').textContent = char.name;
  document.getElementById('info-faction').textContent = FACTIONS[char.faction].emoji+' '+FACTIONS[char.faction].name;
  document.getElementById('info-desc').textContent = char.desc;
  document.getElementById('info-count').textContent = tr('owned', { n: state.collection[char.id]||0 });
  document.getElementById('info-panel').classList.add('show');
  const fig = shelfFigures[char.id];
  if(fig){ fig.userData.bumpT = 0; focusShelfFigure(fig); }
  syncShelfChrome();
}
function hideInfoPanel(){
  shelfSpinId = null;
  shelfFocus = null;
  applyShelfFocusVisibility();
  camTargetSpherical.radius = shelfHome.radius;
  camTargetSpherical.phi = shelfHome.phi;
  camTargetSpherical.theta = 0;
  document.getElementById('info-panel').classList.remove('show');
  syncShelfChrome();
}

function setMode(mode){
  if(mode===currentMode) return;
  if(currentMode==='open') finishOpenNow();
  currentMode = mode;
  document.querySelectorAll('.tab-btn').forEach(b=> b.classList.toggle('active', b.dataset.mode===mode));
  openRoot.visible = mode==='open';
  showroomRoot.visible = mode==='showroom';

  else scene.background = openBgTex;

/* ============================= UI ============================= */

function updateTokenUI(){
  document.getElementById('token-count').textContent = state.tokens+' / '+state.maxTokens;
  const fill = document.getElementById('token-bar-fill');
  fill.style.width = (state.tokens>=state.maxTokens ? 100 : clamp(state.tokenTimer/state.tokenInterval,0,1)*100)+'%';
  const btn = document.getElementById('open-btn');
  const hint = document.getElementById('open-hint');
  btn.disabled = state.tokens<1 || phase!=='idle';
  hint.textContent = state.tokens<1 ? tr('waitToken', { s: Math.max(0,Math.ceil(state.tokenInterval-state.tokenTimer)) }) : '';
  hint.classList.toggle('hidden', !hint.textContent);
  syncDaily();
}
function updateProgressUI(){
  document.getElementById('progress-text').textContent = Object.keys(state.collection).length+'/'+CHARACTERS.length;
}
let toastTimer = null;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 2400);
}
let saveTick = 0;
function tickTokens(dt){
  if(state.tokens<state.maxTokens){
    state.tokenTimer += dt;
    if(state.tokenTimer>=state.tokenInterval){
      state.tokenTimer = 0; state.tokens = Math.min(state.maxTokens, state.tokens+1);
      showToast(tr('newToken'));
      saveLocal();
    }
  }
  saveTick += dt;
  if(saveTick>5){ saveTick = 0; saveLocal(); }
  updateTokenUI();
}

function showResultCard(char, isNew, bonus){
  const card = document.getElementById('reveal-card');
  card.classList.remove('legendary','rare');
  if(char.rarity!=='common') card.classList.add(char.rarity);
  paintRarityPips(document.getElementById('reveal-badge'), char.rarity);
  document.getElementById('reveal-name').textContent = char.name;
  document.getElementById('reveal-faction').textContent = FACTIONS[char.faction].emoji+' '+FACTIONS[char.faction].name;
  document.getElementById('reveal-desc').textContent = char.desc;
  document.getElementById('reveal-dup').textContent = tr(isNew ? 'newInCollection' : bonus ? 'dupBonus' : 'dup');
  document.body.classList.add('reveal-open');
  requestAnimationFrame(()=> card.classList.add('show'));
}
function hideResultCardInstant(){
  document.getElementById('reveal-card').classList.remove('show');
  document.body.classList.remove('reveal-open');
}

function setupSaveLoad(){
  document.getElementById('save-btn').addEventListener('click', ()=>{
    const data = { v:3, tokens: state.tokens, maxTokens: state.maxTokens, tokenTimer: state.tokenTimer, collection: state.collection, enabled: enabledSeries };
    const blob = new Blob([JSON.stringify(data)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = tr('saveFile');
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast(tr('exported'));
  });
  document.getElementById('load-btn').addEventListener('click', ()=> document.getElementById('load-input').click());
  document.getElementById('load-input').addEventListener('change', e=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const data = JSON.parse(reader.result);
        if(data && data.collection){
          state.tokens = clamp(data.tokens!==undefined?data.tokens:state.maxTokens, 0, state.maxTokens);
          state.tokenTimer = data.tokenTimer || 0;
          state.collection = {};
          for(const id in data.collection) if(CHAR_BY_ID[id]) state.collection[id] = data.collection[id];
          applyEnabled(data.enabled);
          renderSeriesSettings();
          if(phase==='idle') spawnPouch(true);
          saveLocal(); updateTokenUI(); updateProgressUI();
          if(currentMode==='showroom') rebuildShowroom();
          showToast(tr('imported'));
        } else showToast(tr('badFile'));
      }catch(err){ showToast(tr('loadError')); }
    };
    reader.readAsText(file);
    e.target.value = '';
  });
}

/* ============================= INIT / PETLJA ============================= */

function init(){
  initThree();
  TOON_RAMP = makeToonRamp();
  blackMat = new THREE.MeshBasicMaterial({ color:0x1a1428 }); blackMat.userData.shared = true;
  whiteMat = new THREE.MeshBasicMaterial({ color:0xffffff }); whiteMat.userData.shared = true;
  mouthMat = new THREE.MeshBasicMaterial({ color:0x5a1a3a }); mouthMat.userData.shared = true;
  cheekMat = new THREE.MeshBasicMaterial({ color:0xff7aa8, transparent:true, opacity:0.6, depthWrite:false }); cheekMat.userData.shared = true;
  outlineMat = makeOutlineMat();
  sparkleTex = makeSparkleSprite();
  starTex = makeStarSprite();
  raysTex = makeRaysTexture();
  questionTex = makeQuestionTexture();
  buildAllPouchTex();
  openBgTex = makeGradientTexture(['#ff9ad5','#ffc36b','#8f6bff']);
  showroomBgTex = makeGradientTexture(['#2f6dff','#6a3dff','#ff5fa8']);
  scene.background = openBgTex;
  raycaster = new THREE.Raycaster();
  mouse = new THREE.Vector2();
  loadLocal();
  fitCameras();
  buildOpenScene();
  setupControls();
  setupSaveLoad();
  setupSettings();
  renderSeriesSettings();
  document.querySelectorAll('.tab-btn').forEach(btn=> btn.addEventListener('click', ()=> setMode(btn.dataset.mode)));
  document.querySelectorAll('#series-bar button').forEach(btn=> btn.addEventListener('click', ()=>{
    showroomSeries = btn.dataset.series;
    document.querySelectorAll('#series-bar button').forEach(b=> b.classList.toggle('active', b===btn));
    if(shelfFocus) hideInfoPanel();
    if(currentMode==='showroom') rebuildShowroom();
  }));
  document.getElementById('open-btn').addEventListener('click', startOpen);
  document.getElementById('daily-btn').addEventListener('click', watchDaily);
  document.getElementById('reveal-close').addEventListener('click', ()=>{ hideResultCardInstant(); enterPhase('idle'); });
  document.getElementById('info-back').addEventListener('click', hideInfoPanel);
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden) saveLocal(); });
  window.addEventListener('pagehide', saveLocal);
  updateTokenUI();
  updateProgressUI();
  // redraw labela kad se font učita (grafika kesice koristi Baloo 2)
  paintBrandLogo();
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{
    buildAllPouchTex();
    paintBrandLogo();
    renderSeriesSettings();
    if(phase==='idle') spawnPouch(true);
  });
  requestAnimationFrame(()=> document.getElementById('loading').classList.add('hide'));
  animate();
  // QA: ?debug=all otključa sve, ?open=legendary|rare|common otvori kesicu sa zadatom retkošću
  const qs = new URLSearchParams(location.search);
  if(qs.get('debug')==='all'){ CHARACTERS.forEach(c=> state.collection[c.id] = 1); updateProgressUI(); }
  if(qs.get('open')){
    const pool = CHARACTERS.filter(c=>c.rarity===qs.get('open'));
    const orig = weightedRandomCharacter;
    weightedRandomCharacter = ()=> pool[Math.floor(Math.random()*pool.length)] || orig();
    state.tokens = state.maxTokens;
    setTimeout(startOpen, 300);
  }
  if(qs.get('mode')==='showroom') setMode('showroom');
}

window.__timeScale = 1;
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05) * window.__timeScale;
  const elapsed = clock.elapsedTime;
  if(currentMode==='open'){ updateOpenSequence(dt); updateOpenCamera(dt); }
  else { updateShowroomCamera(dt); updateShelfFiguresIdle(dt, elapsed); }
  if(waterBlur && waterBlur.visible){
    waterUniforms.uTime.value = elapsed;
    renderer.getDrawingBufferSize(waterBufSize);
    if(waterTarget.width !== waterBufSize.x || waterTarget.height !== waterBufSize.y){
      waterTarget.setSize(waterBufSize.x, waterBufSize.y);
      waterBlur.material.uniforms.uRes.value.copy(waterBufSize);
    }
    renderer.setRenderTarget(waterTarget);
    renderer.render(waterScene, camera);
    renderer.setRenderTarget(null);
  }
  tickTokens(dt);
  renderer.render(scene, camera);
  window.__debug = { phase, phaseTime, elapsed, hasFigure: !!activeFigure, tokens: state.tokens, mode: currentMode };
}

init();
</script>
