<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Surprise Toys — Open. Collect. Display.</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Surprise Toys">
<script src="../../shared/gameroom-i18n.js"></script>
<script src="../../shared/gameroom-config.js"></script>
<script src="../../shared/gameroom-sdk.js"></script>
<style>
/* ===================== SuperUkis — crtaći kolekcionarski UI ===================== */
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Lilita+One&family=Luckiest+Guy&family=Nunito:wght@600;700;800&display=swap');

:root{
  --bg: #ffd9f2;
  --ink: #2a1450;
  --cream: #fffdf6;
  --pink: #ff4d9a;
  --yellow: #ffe14d;
  --cyan: #5ad8ff;
  --purple: #8a5cff;
  --panel: var(--cream);
  --accent-cyan: #5ad8ff;
  --accent-pink: #ff4d9a;
  --accent-gold: #ffe14d;
  --accent-purple: #8a5cff;
  --common: #3ecf6e;
  --rare: #2f9dff;
  --legendary: #f0a000;
  --text: #2a1450;
  --text-dim: #6d548c;
  --radius: 22px;
  --stroke: 3px solid #2a1450;
  --shadow: 4px 4px 0 #2a1450;
}

*{ box-sizing: border-box; }
html, body{
  margin: 0; padding: 0; width: 100%; height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Nunito', sans-serif;
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
}

#app{ position: fixed; inset: 0; }
#canvas-holder{ position: absolute; inset: 0; }
#canvas-holder canvas{ display:block; width:100%; height:100%; touch-action:none; }

.font-title{ font-family: 'Baloo 2', 'Nunito', cursive; font-weight: 800; }

#topbar{
  position: absolute; top: 0; left: 0; right: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px;
  z-index: 20;
  pointer-events: none;
}
#topbar > *{ pointer-events: auto; }

.brand{ display:flex; align-items:center; gap:10px; }
#brand-logo{ display:block; }
.brand .logo-badge{
  width: 48px; height: 48px; border-radius: 16px;
  background: linear-gradient(160deg, #ff8ad4, #ffe14d);
  display:flex; align-items:center; justify-content:center;
  font-size: 24px;
  border: var(--stroke);
  box-shadow: 3px 3px 0 #2a1450;
  transform: rotate(-8deg);
}
.brand .name{
  font-family:'Lilita One', cursive; font-size: 26px; font-weight: 400; letter-spacing: 0.5px;
  color: #1f5eff;
  text-shadow:
    -2px -2px 0 #ffe14d, 2px -2px 0 #ffe14d, -2px 2px 0 #ffe14d, 2px 2px 0 #ffe14d,
    4px 4px 0 #e10600;
}
.brand .tagline{ font-size: 12px; color: #2a1450; font-weight: 800; margin-top: -2px; }

.topbar-right{ display:flex; align-items:center; gap:10px; }

.pill{
  background: var(--cream);
  color: var(--ink);
  border: var(--stroke);
  border-radius: 999px; padding: 8px 14px;
  display:flex; align-items:center; gap:8px;
  box-shadow: 3px 3px 0 #ff4d9a;
  font-weight:800; font-size:14px;
}
.pill .icon{ font-size:16px; }

#token-pill{ position: relative; overflow: hidden; min-width: 128px; }
#token-count{ font-family:'Lilita One', cursive; font-size:18px; color: var(--ink); }
#token-bar-bg{
  position:absolute; left:6px; right:6px; bottom:4px; height: 5px;
  background: #efe6d6; border-radius: 999px;
}
#token-bar-fill{ height:100%; width:0%; background: linear-gradient(90deg,#ffe14d,#ff4d9a); border-radius: 999px; transition: width .2s linear; }

.icon-btn{
  background: var(--cream); border: var(--stroke);
  border-radius: 14px; width: 42px; height: 42px; display:flex; align-items:center; justify-content:center;
  cursor: pointer; font-size: 18px; color: var(--ink);
  box-shadow: 3px 3px 0 #8a5cff;
  transition: transform .12s ease;
}
.icon-btn:hover{ transform: translateY(-2px) rotate(-3deg); }
.icon-btn:active{ transform: translateY(2px); box-shadow: 1px 1px 0 #8a5cff; }

#settings{
  position:absolute; inset:0; z-index:50;
  background: rgba(42, 20, 80, 0.35);
  display:flex; align-items:flex-end; justify-content:center;
  padding: 16px;
}
#settings-card{
  width: min(420px, 100%);
  background: var(--cream);
  color: var(--ink);
  border: 4px solid #2a1450;
  border-radius: 28px;
  padding: 16px 16px 18px;
  box-shadow: 8px 8px 0 #ff4d9a;
  margin-bottom: max(8px, env(safe-area-inset-bottom));
}
#settings-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
#settings-head h2{ margin:0; font-family:'Baloo 2','Nunito',sans-serif; font-weight:800; font-size:26px; color: var(--ink); }
#settings-close{
  border: var(--stroke); background: #ffe14d; color: var(--ink);
  width:38px; height:38px; border-radius:14px; font-size:16px; cursor:pointer;
  box-shadow: 2px 2px 0 #2a1450;
}
#settings-note{ margin:6px 0 12px; color: var(--text-dim); font-size:14px; font-weight:800; }
#settings-actions{ display:flex; gap:10px; margin-top:12px; padding-top:14px; border-top: 3px dashed #e6d9ff; }
.settings-action-btn{
  flex:1; font-family:'Baloo 2','Nunito',sans-serif; font-weight:800; font-size:17px; color: var(--ink);
  background:#fff4c8; border: var(--stroke); border-radius:14px; padding:10px 8px; cursor:pointer;
  box-shadow: 3px 3px 0 #8a5cff;
}
.settings-action-btn:active{ transform: translateY(2px); box-shadow: 1px 1px 0 #8a5cff; }
.series-toggle{
  display:flex; align-items:center; gap:12px;
  background: #fff4c8;
  border: var(--stroke);
  border-radius: 18px; padding: 8px 12px 8px 8px;
  margin-bottom: 8px; cursor:pointer;
  box-shadow: 3px 3px 0 #8a5cff;
}
.series-toggle img{
  width: 54px; height: 76px; object-fit: cover; border-radius: 10px;
  border: 2px solid #2a1450;
  background: #ffe9f6; flex: none;
}
.series-toggle .meta{ flex:1; min-width:0; }
.series-toggle .meta b{ display:block; font-family:'Baloo 2','Nunito',sans-serif; font-weight:800; font-size:18px; color: var(--ink); }
.series-toggle .meta small{ font-family:'Baloo 2','Nunito',sans-serif; font-weight:700; color: var(--text-dim); }
.series-toggle input{ width: 26px; height: 26px; accent-color: #ff4d9a; flex: none; }

#tabs{
  position:absolute; top: 78px; left: 50%; transform: translateX(-50%);
  display:flex; gap: 6px; background: var(--cream);
  border: var(--stroke); border-radius: 999px; padding: 5px; z-index: 20;
  box-shadow: 4px 4px 0 #5ad8ff;
}
.tab-btn{
  border: 3px solid transparent; background: transparent; color: var(--text-dim);
  font-family: 'Lilita One', cursive; font-size: 16px; font-weight: 400;
  padding: 8px 18px; border-radius: 999px; cursor: pointer;
  display:flex; align-items:center; gap:6px;
}
.tab-btn.active{
  background: #ffe14d;
  color: #2a1450;
  border-color: #2a1450;
  box-shadow: 0 3px 0 #e0a800;
}

#open-panel{
  position:absolute; left:50%; bottom: 34px; transform: translateX(-50%);
  z-index: 20; display:flex; flex-direction:column; align-items:center; gap:10px;
}
#open-btn{
  font-family:'Lilita One',cursive; font-size: 26px; font-weight: 400;
  color: #2a1450; background: #ffe14d;
  border: var(--stroke); border-radius: 20px; padding: 14px 36px;
  cursor: pointer;
  box-shadow: 0 6px 0 #ff4d9a, 0 9px 0 #2a1450;
  letter-spacing: 0.5px;
}
#open-btn:hover:not(:disabled){ transform: translateY(-2px) rotate(-1deg); }
#open-btn:active:not(:disabled){ transform: translateY(4px); box-shadow: 0 2px 0 #ff4d9a, 0 4px 0 #2a1450; }
#open-btn:disabled{ filter: grayscale(0.4); cursor: not-allowed; box-shadow: 0 4px 0 #b9a88a; }
#daily-btn{ font-family:'Lilita One',cursive; font-size:15px; color:#2a1450; background:linear-gradient(#fff4a8,#ffd23f);
  border:3px solid #2a1450; border-radius:14px; padding:6px 14px; box-shadow:3px 3px 0 #8a5cff; cursor:pointer;
  display:flex; align-items:center; gap:6px; margin:6px auto 0; animation: dailyIn .35s cubic-bezier(.2,1.5,.4,1); }
#daily-btn small{ font-size:10px; background:#2a1450; color:#fff4a8; border-radius:6px; padding:1px 6px; }
#daily-btn.hidden{ display:none; }
@keyframes dailyIn{ from{ transform:scale(.6); opacity:0; } }
#open-hint{ font-size: 13px; color: #2a1450; font-weight: 800; min-height: 16px;
  background: #fffdf6; border: 2px solid #2a1450; border-radius: 999px; padding: 2px 10px; }

#progress-pill{ position: static; background:#b8ff9a; box-shadow: 3px 3px 0 #2a1450; }
body.reveal-open #progress-pill,
body.reveal-open #open-panel,
body.reveal-open #gameroom-back{ display:none !important; }

#info-panel{
  position:absolute; right: 20px; top: 140px; width: 280px;
  background: var(--cream); color: var(--ink);
  border: 4px solid #2a1450; border-radius: 24px;
  padding: 18px; box-shadow: 6px 6px 0 #8a5cff; z-index: 20;
  opacity:0; transform: translateX(20px) rotate(1deg); pointer-events:none;
  transition: opacity .25s ease, transform .25s ease;
}
#info-panel.show{ opacity:1; transform: rotate(-1deg); pointer-events:auto; }
.rarity-tag{
  display:inline-block; font-size:12px; font-weight:800; padding: 3px 10px; border-radius:999px;
  text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px;
  border: 2px solid #2a1450; color: #2a1450;
}
#info-name{ font-family:'Baloo 2', 'Nunito', cursive; font-weight: 800; font-size: 26px; margin: 2px 0 4px; color: var(--ink); }
#info-faction{ font-size: 13px; color: var(--text-dim); font-weight: 800; margin-bottom: 10px; }
#info-desc{ font-size: 14px; line-height: 1.45; color: var(--ink); font-weight: 700; }
#info-count{ margin-top: 12px; font-size: 13px; color: var(--text-dim); font-weight: 800; }
#info-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px; }
#info-head span{ font-family:'Lilita One',cursive; font-size:15px; letter-spacing:0.4px; color:#ff4d9a; }
#info-back{
  font-family:'Lilita One',cursive; font-size:15px; color:#2a1450; cursor:pointer;
  background:#ffe14d; border:3px solid #2a1450; border-radius:12px; padding:4px 12px;
  box-shadow:2px 2px 0 #2a1450;
}
#info-back:active{ transform: translateY(2px); box-shadow: none; }

#series-bar{
  position:absolute; top: auto; bottom: max(16px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
  z-index: 21; display:flex; gap:6px; max-width: 94vw;
  overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
  background: var(--cream); border: var(--stroke);
  border-radius: 999px; padding: 4px; box-shadow: 4px 4px 0 #ff4d9a;
}
#series-bar::-webkit-scrollbar{ display:none; }
#series-bar button{
  border: 3px solid transparent; background:transparent; color: var(--text-dim); cursor:pointer;
  font-family:'Baloo 2','Nunito',sans-serif; font-weight:800; font-size:15px; flex: none;
  padding: 6px 14px; border-radius: 999px; white-space: nowrap;
}
#series-bar button.active{
  background: #ffe14d; color:#2a1450; border-color:#2a1450;
}

#reveal-modal{
  position:absolute; inset:0; display:flex; align-items:flex-end; justify-content:center;
  z-index: 30; pointer-events:none;
}
#reveal-card{
  pointer-events:none;
  width: min(420px, 92vw);
  margin-bottom: max(12px, env(safe-area-inset-bottom));
  background: var(--cream);
  color: var(--ink);
  border-radius: 24px; padding: 10px 16px 12px;
  border: 4px solid #2a1450;
  box-shadow: 8px 8px 0 #ff4d9a;
  text-align:center;
  opacity:0; transform: translateY(40px) scale(0.92) rotate(-2deg);
  transition: opacity .35s cubic-bezier(.2,.9,.3,1.3), transform .35s cubic-bezier(.2,.9,.3,1.3);
}
#reveal-card.show{ opacity:1; transform: rotate(-1deg); pointer-events:auto; }
#reveal-card.legendary{ box-shadow: 8px 8px 0 #f0a000, 0 0 0 4px #ffe14d; }
#reveal-card.rare{ box-shadow: 8px 8px 0 #2f9dff; }
.rarity-block{ margin: 2px 0 6px; }
.rarity-label{
  font-family:'Baloo 2','Nunito',sans-serif; font-weight:800; font-size:15px;
  letter-spacing:0.6px; text-transform:uppercase; margin-bottom:6px;
}
.rarity-pips{ display:flex; justify-content:center; gap:7px; }
#info-rarity .rarity-pips{ justify-content:flex-start; }
.rarity-pips i{
  display:block; width:28px; height:9px; border-radius:99px;
  background:#efe8ff; border:3px solid #2a1450;
}
.rarity-pips i.on{ background: currentColor; }
#reveal-card .rarity-block{ margin: 0 0 2px; }
#reveal-card .rarity-label{ margin-bottom: 2px; font-size: 13px; }
#reveal-name{ font-family:'Baloo 2', 'Nunito', cursive; font-weight: 800; font-size: 30px; margin: 2px 0 0; color: var(--ink); }
#reveal-faction{ font-size: 13px; color: var(--text-dim); font-weight:800; margin-bottom:4px; }
#reveal-desc{ font-size: 14px; color: var(--ink); font-weight: 700; line-height:1.35; margin-bottom: 2px; }
#reveal-dup{ font-size: 13px; color: #d07a00; font-weight: 800; margin-bottom: 4px; min-height: 0; }
#reveal-close{
  margin-top: 6px; font-family:'Lilita One',cursive; font-size:18px;
  background: #5ad8ff;
  color: #2a1450; border: var(--stroke); border-radius: 16px; padding: 10px 34px; cursor:pointer;
  box-shadow: 0 4px 0 #2a1450;
}
#reveal-close:active{ transform: translateY(3px); box-shadow: 0 1px 0 #2a1450; }

#toast{
  position:absolute; top: 78px; left: 50%; transform: translateX(-50%) translateY(-10px) rotate(-2deg);
  background: #ffe14d; color: var(--ink); border: var(--stroke); border-radius: 16px;
  padding: 10px 18px; font-size: 14px; font-weight:800; z-index: 40;
  box-shadow: 4px 4px 0 #2a1450;
  opacity:0; transition: opacity .25s ease, transform .25s ease; pointer-events:none;
}
#toast.show{ opacity:1; transform: translateX(-50%) rotate(-1deg); }

#loading{
  position:absolute; inset:0; z-index: 100;
  background: linear-gradient(180deg, #ffd0f0 0%, #ffe9a0 50%, #b9ecff 100%);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
}
#loading .spinner{
  width: 52px; height: 52px; border-radius: 50%;
  border: 5px solid #2a1450; border-top-color: #ff4d9a; border-right-color: #ffe14d;
  animation: spin 0.8s linear infinite;
}
@keyframes spin{ to{ transform: rotate(360deg); } }
#loading .ltext{ font-family:'Baloo 2','Nunito',sans-serif; font-weight:800; font-size: 20px; color: #2a1450; }
#loading.hide{ opacity:0; pointer-events:none; transition: opacity .4s ease; }

#fx-flash{
  position:absolute; inset:0; z-index:25; pointer-events:none; opacity:0;
}
#rarity-pop{
  position:absolute; left:50%; top:36%; z-index:28; pointer-events:none; opacity:0;
  font-family:'Lilita One',cursive; font-size: clamp(32px, 8vw, 56px);
  letter-spacing: 1px; white-space: nowrap;
  -webkit-text-stroke: 6px #2a1450;
  paint-order: stroke fill;
  text-shadow: 6px 6px 0 #ff4d9a;
  transform: translate(-50%,-50%) scale(0.4);
}
#rarity-pop.rare{ color:#7fd0ff; }
#rarity-pop.legendary{ color:#ffe14d; }
#rarity-pop.show{ animation: rarityIn .9s cubic-bezier(.2,1.3,.3,1) forwards; }
@keyframes rarityIn{
  0%{ opacity:0; transform:translate(-50%,-30%) scale(.35) rotate(-8deg); }
  35%{ opacity:1; transform:translate(-50%,-50%) scale(1.12) rotate(4deg); }
  60%{ transform:translate(-50%,-50%) scale(1) rotate(-2deg); }
  100%{ opacity:0; transform:translate(-50%,-80%) scale(1.05); }
}

.hidden{ display:none !important; }

@media (max-width: 640px){
  #topbar{ padding: 10px 12px 0; gap: 8px; align-items: center; }
  .brand{ gap: 7px; min-width: 0; }
  .brand .tagline{ display:none; }
  .brand .logo-badge{ width: 34px; height: 34px; font-size: 16px; border-radius: 12px; flex: none; }
  .brand .name{ font-size: 18px; text-shadow: -1px -1px 0 #ffe14d, 1px -1px 0 #ffe14d, -1px 1px 0 #ffe14d, 1px 1px 0 #ffe14d, 3px 3px 0 #e10600; }
  .topbar-right{ gap: 8px; flex: none; }
  #token-pill{ min-width: 0; padding: 6px 10px; }
  #token-count{ font-size: 15px; }
  .icon-btn{ width: 36px; height: 36px; border-radius: 12px; font-size: 16px; box-shadow: 2px 2px 0 #8a5cff; }
  #tabs{ top: 54px; }
  .tab-btn{ font-size: 14px; padding: 6px 12px; }
  #series-bar{ top: auto; bottom: max(14px, env(safe-area-inset-bottom)); }
  #series-bar button{ font-size: 12px; padding: 6px 8px; }
  #toast{ top: 154px; }
  #info-panel{ top: auto; bottom: max(14px, env(safe-area-inset-bottom)); left: 10px; right: 10px; width: auto; padding: 14px; }
  #progress-pill{ padding: 6px 10px; font-size: 12px; }
  #open-panel{ bottom: max(16px, env(safe-area-inset-bottom)); }
  #open-btn{ font-size: 20px; padding: 12px 26px; }
  #reveal-name{ font-size: 26px; }
  #reveal-card{ padding: 8px 14px 10px; }
}
</style>
</head>
<body>
<div id="loading">
  <div class="spinner"></div>
  <div class="ltext" data-i18n="loading"></div>
</div>

<div id="app">
  <div id="canvas-holder"></div>

  <div id="topbar">
    <div class="brand">
      <canvas id="brand-logo" aria-label="SuperUkis"></canvas>
    </div>
    <div class="topbar-right">
      <div class="pill" id="progress-pill">🧩 <span id="progress-text">0/120</span></div>
      <div class="pill" id="token-pill">
        <span class="icon">💎</span>
        <span id="token-count">5 / 5</span>
        <div id="token-bar-bg"><div id="token-bar-fill"></div></div>
      </div>
      <button class="icon-btn" id="settings-btn" data-i18n-attr="title:settingsTitle;aria-label:settingsTitle">⚙️</button>
    </div>
  </div>

  <div id="tabs">
    <button class="tab-btn active" data-mode="open" data-i18n="tabOpen"></button>
    <button class="tab-btn" data-mode="showroom" data-i18n="tabShowroom"></button>
  </div>

  <div id="toast"></div>

  <div id="open-panel">
    <button id="open-btn" data-i18n="openBag"></button>
    <div id="open-hint"></div>
    <button id="daily-btn" type="button" class="hidden"><span data-i18n="dailyBag"></span><small data-i18n="adTag"></small></button>
  </div>

  <div id="fx-flash"></div>
  <div id="rarity-pop"></div>

  <div id="series-bar" class="hidden">
    <button type="button" data-series="slatko" class="active">🍬 <span data-i18n="s_slatko"></span></button>
    <button type="button" data-series="garaza">🚗 <span data-i18n="s_garaza"></span></button>
    <button type="button" data-series="more">🌊 <span data-i18n="s_more"></span></button>
    <button type="button" data-series="voce">🍏 <span data-i18n="s_voce"></span></button>
  </div>

  <div id="settings" class="hidden">
    <div id="settings-card">
      <div id="settings-head">
        <h2 data-i18n="bagsTitle"></h2>
        <button type="button" id="settings-close" data-i18n-attr="aria-label:close">✕</button>
      </div>
      <p id="settings-note" data-i18n="bagsNote"></p>
      <div id="series-toggles"></div>
      <div id="settings-actions">
        <button type="button" class="settings-action-btn" id="save-btn" data-i18n="save"></button>
        <button type="button" class="settings-action-btn" id="load-btn" data-i18n="load"></button>
        <input type="file" id="load-input" accept="application/json" class="hidden">
      </div>
      <!-- gameroom:back — link nazad na landing (ne brisati) -->
      <div id="langRow"></div>
      <a href="../../" id="gameroom-back" data-i18n="back">⌂ Back to Gameroom</a>
    </div>
  </div>

  <div id="info-panel">
    <div id="info-head"><span data-i18n="details"></span><button type="button" id="info-back" data-i18n="infoBack"></button></div>
    <div class="rarity-block" id="info-rarity" aria-label="">
      <div class="rarity-label"></div>
      <div class="rarity-pips"></div>
    </div>
    <div id="info-name" class="font-title">—</div>
    <div id="info-faction">—</div>
    <div id="info-desc">—</div>
    <div id="info-count">—</div>
  </div>

  <div id="reveal-modal">
    <div id="reveal-card">
      <div class="rarity-block" id="reveal-badge" aria-label="">
        <div class="rarity-label"></div>
        <div class="rarity-pips"></div>
      </div>
      <div id="reveal-name" class="font-title">—</div>
      <div id="reveal-faction">—</div>
      <div id="reveal-desc">—</div>
      <div id="reveal-dup"></div>
      <button id="reveal-close" data-i18n="super"></button>

/* ============================= UTILS ============================= */

function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function lerp(a,b,t){ return a+(b-a)*t; }
function rand(min,max){ return min+Math.random()*(max-min); }
function smooth(a,b,x){ const t = clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
function easeOutCubic(t){ t=clamp(t,0,1); return 1-Math.pow(1-t,3); }
function easeOutBack(t){ const c1=1.70158,c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); }
function easeOutBounce(t){
  const n1=7.5625, d1=2.75;
  if(t<1/d1) return n1*t*t;
  if(t<2/d1) return n1*(t-=1.5/d1)*t+0.75;
  if(t<2.5/d1) return n1*(t-=2.25/d1)*t+0.9375;
  return n1*(t-=2.625/d1)*t+0.984375;
}

function weightedRandomCharacter(){
  const fac = SERIES[pouchSeries].factions;
  const pool = CHARACTERS.filter(c=>fac.includes(c.faction));
  const total = pool.reduce((s,c)=>s+RARITY[c.rarity].weight,0);
  let r = Math.random()*total;
  for(const c of pool){ const w = RARITY[c.rarity].weight; if(r<w) return c; r-=w; }
  return pool[pool.length-1];
}

function pillMesh(radius, totalLength, mat, segments){
  segments = segments || 14;
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(radius, segments, Math.max(8, Math.round(segments*0.7))), mat);
  mesh.scale.y = totalLength/(radius*2);
  return mesh;
}

function clearGroup(group){
  group.children.slice().forEach(obj=>{
    obj.traverse(o=>{
      if(o.isMesh && !o.userData.isOutline){
        if(o.geometry) o.geometry.dispose();
        if(Array.isArray(o.material)) o.material.forEach(m=>{ if(!m.userData.shared) m.dispose(); });
        else if(o.material && !o.material.userData.shared) o.material.dispose();
      }
    });
    group.remove(obj);
  });
}

/* ============================= TEKSTURE ============================= */

function srgb(tex){ tex.encoding = THREE.sRGBEncoding; return tex; }

function makeCanvasTexture(draw, w, h){
  h = h || w;
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  draw(ctx, w, h);
  const tex = new THREE.CanvasTexture(canvas);
  tex.needsUpdate = true;
  return tex;
}

function makeGradientTexture(stops){
  return srgb(makeCanvasTexture((ctx,w,h)=>{
    const g = ctx.createLinearGradient(0,0,0,h);
    stops.forEach((s,i)=> g.addColorStop(i/(stops.length-1), s));
    ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
  }, 8, 256));
}

function makeSparkleSprite(){
  return makeCanvasTexture((ctx,s)=>{
    const g = ctx.createRadialGradient(s/2,s/2,0, s/2,s/2,s/2);
    g.addColorStop(0,'rgba(255,255,255,1)');
    g.addColorStop(0.35,'rgba(255,255,255,0.9)');
    g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,s,s);
  }, 64);
}

function makeStarSprite(){
  return makeCanvasTexture((ctx,s)=>{
    ctx.translate(s/2,s/2);
    const g = ctx.createRadialGradient(0,0,0,0,0,s/2);
    g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle = g;

  garaza: [sketchDigger, sketchCar, sketchPlane],
  more: [sketchFish, sketchCrab, sketchJelly],
  voce: [sketchGrapes, sketchApple, sketchCarrot],
};
// dodaje sjaj (gore levo) i senku (dole) preko lika, samo unutar njegovog silueta
function addToonShading(canvas){
  const w = canvas.width, h = canvas.height, g = canvas.getContext('2d');
  g.save();
  g.globalCompositeOperation = 'source-atop';
  const shade = g.createLinearGradient(0, h*0.32, 0, h);
  shade.addColorStop(0, 'rgba(20,10,40,0)');
  shade.addColorStop(1, 'rgba(20,10,40,0.24)');
  g.fillStyle = shade; g.fillRect(0, 0, w, h);
  const gloss = g.createRadialGradient(w*0.34, h*0.26, 2, w*0.34, h*0.26, w*0.46);
  gloss.addColorStop(0, 'rgba(255,255,255,0.6)');
  gloss.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gloss; g.fillRect(0, 0, w, h);
  g.restore();
}
// siluet lika u jednoj boji — koristi se za debelu "sticker" konturu
function silhouette(canvas, color){
  const w = canvas.width, h = canvas.height;
  const s = document.createElement('canvas'); s.width = w; s.height = h;
  const g = s.getContext('2d');
  g.drawImage(canvas, 0, 0);
  g.globalCompositeOperation = 'source-in';
  g.fillStyle = color; g.fillRect(0, 0, w, h);
  return s;
}
function drawPackCast(ctx, seriesId, W, H){
  const theme = SERIES[seriesId] || SERIES.slatko;
  const pack = PACK_LOOK[theme.id] || PACK_LOOK.slatko;
  const cast = PACK_CAST[seriesId] || PACK_CAST.slatko;
  const spots = [
    { x:0.22, y:0.54, s:1.72, rot:-0.2 },
    { x:0.50, y:0.51, s:2.05, rot:0.03 },
    { x:0.78, y:0.54, s:1.62, rot:0.18 },
  ];
  // pozadinske iskrice oko ekipe — dodatna dinamika iza likova
  [[0.14,0.32,11,'#ffffff'],[0.87,0.30,9,'#ffffff'],[0.30,0.70,8,pack.a],[0.71,0.68,10,pack.a],[0.5,0.23,13,'#ffffff']]
    .forEach(s=> starShape(ctx, W*s[0], H*s[1], s[2], s[3]));
  cast.forEach((draw, i)=>{
    const c = document.createElement('canvas');
    c.width = 200; c.height = 200;
    const g = c.getContext('2d');
    g.translate(100, 90);
    draw(g);
    addToonShading(c);
    const sil = silhouette(c, '#ffffff');
    const p = spots[i];
    ctx.save();
    ctx.translate(W*p.x, H*p.y);
    ctx.rotate(p.rot);
    ctx.scale(p.s, p.s);
    // senka na "podu" ispod lika, za osećaj dubine
    ctx.save();
    ctx.globalAlpha = 0.24; ctx.fillStyle = '#140a2a';
    ctx.beginPath(); ctx.ellipse(3, 64, 44, 13, 0, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    // debela bela "sticker" kontura oko lika (krug otisaka silueta)
    for(let a=0; a<14; a++){
      const ang = a/14*Math.PI*2;
      ctx.drawImage(sil, -100+Math.cos(ang)*6.5, -90+Math.sin(ang)*6.5);
    }
    ctx.drawImage(c, -100, -90);
    ctx.restore();
  });
  // male akcione zvezdice odmah uz glavnog (srednjeg) lika
  starShape(ctx, W*0.635, H*0.395, 10, '#ffffff');
  starShape(ctx, W*0.355, H*0.40, 7, pack.a);
}
function drawCastPlain(ctx, seriesId, spots){
  const cast = PACK_CAST[seriesId] || PACK_CAST.slatko;
  cast.forEach((draw, i)=>{
    const c = document.createElement('canvas');
    c.width = 200; c.height = 200;
    const g = c.getContext('2d');
    g.translate(100, 90);
    draw(g);
    addToonShading(c);
    const p = spots[i];
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot || 0);
    ctx.scale(p.s, p.s);
    ctx.drawImage(c, -100, -90);
    ctx.restore();
  });
}

function pouchSplash(ctx, x, y, color){
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle = color;
  ctx.beginPath();
  for(let i=0;i<12;i++){
    const a = -Math.PI/2 + i/12*Math.PI*2;
    const r = i%2 ? 78 : 48;
    const px = Math.cos(a)*r, py = Math.sin(a)*r*0.62;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath(); ctx.fill();
  ctx.lineWidth = 6; ctx.strokeStyle = '#ffffff'; ctx.stroke();
  ctx.fillStyle = '#ffffff';
  ctx.font = '900 86px "Lilita One", "Arial Black", Arial';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('1', 0, -6);
  ctx.fillStyle = '#ffe14d';
  ctx.font = '900 22px "Lilita One", "Arial Black", Arial';
  ctx.lineWidth = 5; ctx.strokeStyle = '#1a3f9a';
  ctx.strokeText(tr('bagToy'), 0, 40);
  ctx.fillText(tr('bagToy'), 0, 40);
  ctx.restore();
}

function makePouchFrontTexture(series){
  const theme = series || SERIES.slatko;
  const pack = PACK_LOOK[theme.id] || PACK_LOOK.slatko;
  return srgb(makeCanvasTexture((ctx,W,H)=>{
    if(theme.id==='garaza'){ paintGarageFront(ctx, W, H); }
    else {
    pouchBurst(ctx, W, H, pack);
    drawPackCast(ctx, theme.id, W, H);
    pouchSplash(ctx, W/2, H*0.74, pack.splash);
    [[-4,0],[4,0],[0,-4],[0,4],[-3,-3],[3,-3],[-3,3],[3,3]].forEach(function(o){
      comicLogo(ctx, 'SuperUkis', W/2+o[0], H*0.28+o[1], 52, '#2a1450');
    });
    comicLogo(ctx, 'SuperUkis', W/2, H*0.28, 52, '#e10600');
    ctx.save(); ctx.translate(W/2, H*0.325); ctx.rotate(-0.06);
    ctx.font = '800 34px "Baloo 2", "Nunito", Arial';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    ctx.lineWidth = 10; ctx.strokeStyle = '#1a4fd0'; ctx.strokeText(theme.name.toUpperCase(), 2, 3);
    ctx.lineWidth = 6; ctx.strokeStyle = '#0b2e86'; ctx.strokeText(theme.name.toUpperCase(), 0, 0);
    ctx.fillStyle = '#ffe14d'; ctx.fillText(theme.name.toUpperCase(), 0, 0);
    ctx.restore();
    ctx.save(); ctx.translate(W*0.16, H*0.4); ctx.rotate(-0.2);
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(0,0,42,0,Math.PI*2); ctx.fill();
    ctx.lineWidth = 5; ctx.strokeStyle = '#1f5eff'; ctx.stroke();
    ctx.fillStyle = '#e10600'; ctx.font = '900 16px "Lilita One", Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(tr('bagCollect'), 0, -6); ctx.fillText(tr('bagAll'), 0, 12);
    ctx.restore();
    }
    crimp(ctx, 0, H*0.1, W, pack.a);
    tearLine(ctx, W, H);
    zigzagCut(ctx, W, H);
  }, ART_W, ART_H));
}

function makePouchBackTexture(series){
  const theme = series || SERIES.slatko;
  const pack = PACK_LOOK[theme.id] || PACK_LOOK.slatko;
  return srgb(makeCanvasTexture((ctx,W,H)=>{
    pouchBurst(ctx, W, H, pack);
    comicLogo(ctx, tr('bagCollectAll'), W/2, H*0.22, 42, '#1f5eff');
    const cols = 6, cell = 70, x0 = W/2 - cols*cell/2 + cell/2, y0 = H*0.32;
    theme.factions.forEach((f,row)=>{
      for(let c=0;c<cols;c++){
        const x = x0 + c*cell, y = y0 + row*cell*0.95;
        ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.beginPath(); ctx.arc(x,y,26,0,Math.PI*2); ctx.fill();
        ctx.lineWidth = 4; ctx.strokeStyle = '#'+FACTIONS[f].color.toString(16).padStart(6,'0'); ctx.stroke();
        ctx.font = '26px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(c===5 ? '⭐' : FACTIONS[f].emoji, x, y+2);
      }
    });
    crimp(ctx, 0, H*0.1, W, pack.a);
    tearLine(ctx, W, H);
    zigzagCut(ctx, W, H);
  }, ART_W, ART_H));
}

function paintBrandLogo(){
  const c = document.getElementById('brand-logo');
  if(!c) return;
  const size = window.innerWidth < 640 ? 22 : 30;
  const w = Math.ceil(size * 12), h = Math.ceil(size * 2.8);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const scratch = document.createElement('canvas');
  scratch.width = Math.ceil(w * dpr); scratch.height = Math.ceil(h * dpr);
  const ctx = scratch.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  comicLogo(ctx, 'SuperUkis', w / 2, h * 0.46, size, '#e10600');
  const img = ctx.getImageData(0, 0, scratch.width, scratch.height).data;
  let minX = scratch.width, minY = scratch.height, maxX = 0, maxY = 0;
  for(let y=0; y<scratch.height; y++){
    for(let x=0; x<scratch.width; x++){
      if(img[(y*scratch.width+x)*4+3] > 16){
        if(x<minX) minX = x; if(y<minY) minY = y;
        if(x>maxX) maxX = x; if(y>maxY) maxY = y;
      }
    }
  }
  if(maxX<minX){ minX = 0; minY = 0; maxX = scratch.width-1; maxY = scratch.height-1; }
  const pad = Math.ceil(dpr);
  minX = Math.max(0, minX-pad); minY = Math.max(0, minY-pad);
  maxX = Math.min(scratch.width-1, maxX+pad); maxY = Math.min(scratch.height-1, maxY+pad);
  const cw = maxX-minX+1, ch = maxY-minY+1;
  c.width = cw; c.height = ch;
  c.style.width = (cw/dpr)+'px'; c.style.height = (ch/dpr)+'px';
  c.getContext('2d').drawImage(scratch, minX, minY, cw, ch, 0, 0, cw, ch);
}
function onResize(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  fitCameras();
  paintBrandLogo();
}

/* ============================= CARTOON MATERIJALI ============================= */

function punchColor(color){
  const c = new THREE.Color(color);
  const hsl = { h:0, s:0, l:0 };
  c.getHSL(hsl);
  if(hsl.s < 0.08) return c;
  hsl.s = Math.min(1, hsl.s * 1.25 + 0.18);
  hsl.l = Math.max(0.36, Math.min(0.5, hsl.l));
  c.setHSL(hsl.h, hsl.s, hsl.l);
  return c;
}
function toonMat(color, extra){
  extra = Object.assign({}, extra||{});
  if(extra.emissive!==undefined) extra.emissive = punchColor(extra.emissive);
  if(extra.emissiveIntensity!==undefined && extra.emissiveIntensity < 0.4) extra.emissiveIntensity = 0.05;
  return new THREE.MeshToonMaterial(Object.assign({ color: punchColor(color), gradientMap: TOON_RAMP }, extra));
}
function makeToonRamp(){
  const tex = makeCanvasTexture((ctx,w)=>{
    ['#1c1c1c','#454545','#7a7a7a','#c4c4c4'].forEach((c,i)=>{ ctx.fillStyle = c; ctx.fillRect(i,0,1,1); });
  }, 4, 1);
  tex.minFilter = tex.magFilter = THREE.NearestFilter;
  tex.generateMipmaps = false;
  return tex;
}
function makeOutlineMat(){
  const m = new THREE.MeshBasicMaterial({ color:0x2a1440, side:THREE.BackSide });
  m.onBeforeCompile = sh => {
    sh.vertexShader = sh.vertexShader.replace('#include <begin_vertex>', 'vec3 transformed = position + normal * 0.014;');
  };
  m.userData.shared = true;
  return m;
}
// crna kontura (inverted hull) oko svih većih delova figure
function addOutlines(root){
  const list = [];
  root.traverse(o=>{
    if(!o.isMesh || o.userData.isOutline || o.userData.noOutline || o.material.transparent) return;
    const t = o.geometry.type;
    if(t==='CircleGeometry' || t==='PlaneGeometry') return;
    if(!o.geometry.boundingSphere) o.geometry.computeBoundingSphere();
    if(o.geometry.boundingSphere.radius < 0.03) return;
    list.push(o);
  });
  list.forEach(m=>{ const ol = new THREE.Mesh(m.geometry, outlineMat); ol.userData.isOutline = true; m.add(ol); });
}

function makeEyePair(parent, opts){
  // Cartoon lice: velike oči sa sjajem, osmeh i rumeni obrazi
  opts = opts || {};
  const spacing = opts.spacing!==undefined?opts.spacing:0.075;
  const y = opts.y!==undefined?opts.y:0;
  const z = opts.z!==undefined?opts.z:0.14;
  const r = (opts.r!==undefined?opts.r:0.036)*1.15;
  const irisColor = opts.irisColor!==undefined?opts.irisColor:0x2a2044;
  [-1,1].forEach(side=>{
    const sclera = new THREE.Mesh(new THREE.SphereGeometry(r*1.25,14,14), whiteMat);
    sclera.scale.set(1,1.15,0.45);
    sclera.position.set(side*spacing, y, z-0.008);
    sclera.userData.noOutline = true;
    parent.add(sclera);
    const iris = new THREE.Mesh(new THREE.CircleGeometry(r*0.78,16), new THREE.MeshBasicMaterial({ color:irisColor }));
    iris.position.set(side*spacing, y-r*0.05, z+0.012);
    parent.add(iris);
    const pupil = new THREE.Mesh(new THREE.CircleGeometry(r*0.4,12), blackMat);
    pupil.position.set(side*spacing, y-r*0.08, z+0.014);
    parent.add(pupil);
    const hi = new THREE.Mesh(new THREE.CircleGeometry(r*0.26,8), whiteMat);
    hi.position.set(side*spacing+r*0.3, y+r*0.35, z+0.016);
    parent.add(hi);
    const hi2 = new THREE.Mesh(new THREE.CircleGeometry(r*0.12,6), whiteMat);
    hi2.position.set(side*spacing-r*0.25, y-r*0.3, z+0.016);
    parent.add(hi2);
    if(!opts.noCheeks){
      const cheek = new THREE.Mesh(new THREE.CircleGeometry(r*0.5,12), cheekMat);
      cheek.position.set(side*(spacing+r*1.05), y-r*1.35, z-0.006);
      parent.add(cheek);
    }
  });
  if(!opts.noMouth){
    const mouth = new THREE.Mesh(new THREE.TorusGeometry(r*0.7, r*0.16, 6, 14, Math.PI), mouthMat);
    mouth.rotation.z = Math.PI;
    mouth.position.set(0, y-r*1.25, z+0.002);
    parent.add(mouth);
  }
}

function addCape(g, color, opts){
  opts = opts || {};
  const w = opts.w!==undefined?opts.w:0.22;
  const h = opts.h!==undefined?opts.h:0.3;
  const y = opts.y!==undefined?opts.y:0.28;
  const z = opts.z!==undefined?opts.z:-0.1;
  const teeth = 4;
  const shape = new THREE.Shape();
  shape.moveTo(-w/2, h*0.5);
  shape.lineTo(w/2, h*0.5);
  shape.lineTo(w*0.42, -h*0.5+0.03);
  for(let i=0;i<teeth;i++){
    const x1 = lerp(w*0.42, -w*0.42, (i+0.5)/teeth);
    const x2 = lerp(w*0.42, -w*0.42, (i+1)/teeth);
    shape.quadraticCurveTo(x1, -h*0.5-0.025, x2, -h*0.5+0.03);
  }
  shape.lineTo(-w/2, h*0.5);
  const geo = new THREE.ExtrudeGeometry(shape, { depth:0.018, bevelEnabled:false, curveSegments:6 });
  geo.translate(0,0,-0.009);
  const cape = new THREE.Mesh(geo, toonMat(color, { side:THREE.DoubleSide }));
  cape.position.set(0,y,z);
  cape.rotation.x = -0.22;
  g.add(cape);
  return cape;
}

function addStubLimbs(g, mat, opts){
  opts = opts || {};
  const armY = opts.armY!==undefined?opts.armY:0.22;
  const armX = opts.armX!==undefined?opts.armX:0.15;
  const legY = opts.legY!==undefined?opts.legY:0.045;
  const legX = opts.legX!==undefined?opts.legX:0.08;
  const armR = opts.armR!==undefined?opts.armR:0.042;
  const armLen = opts.armLen!==undefined?opts.armLen:0.12;
  const legR = opts.legR!==undefined?opts.legR:0.05;
  const legLen = opts.legLen!==undefined?opts.legLen:0.09;
  const armTilt = opts.armTilt!==undefined?opts.armTilt:0.5;
  const legMat = opts.legMat || mat;
  [-1,1].forEach(side=>{
    if(!opts.noArms){
      const arm = pillMesh(armR, armLen, mat);
      arm.position.set(side*armX, armY, 0); arm.rotation.z = side*-armTilt;
      g.add(arm);
    }
    if(!opts.noLegs){
      const leg = pillMesh(legR, legLen, legMat);
      leg.position.set(side*legX, legY, 0);
      g.add(leg);
    }
  });
}

function lathe(points, mat, segs){
  return new THREE.Mesh(new THREE.LatheGeometry(points.map(p=>new THREE.Vector2(p[0],p[1])), segs||28), mat);
}
function lathRadius(points, y){
  for(let i=1;i<points.length;i++){ if(points[i][1]>=y){ const a=points[i-1], b=points[i]; return lerp(a[0], b[0], (y-a[1])/Math.max(1e-6,b[1]-a[1])); } }
  return 0;
}

function makeSwirlTexture(cols){
  return srgb(makeCanvasTexture((ctx,s)=>{
    ctx.translate(s/2,s/2);
    for(let i=0;i<cols.length*3;i++){
      ctx.fillStyle = '#'+cols[i%cols.length].toString(16).padStart(6,'0');
      ctx.beginPath(); ctx.moveTo(0,0);
      for(let t=0;t<=1.001;t+=0.02){ const a = i/(cols.length*3)*Math.PI*2 + t*4; ctx.lineTo(Math.cos(a)*t*s/2, Math.sin(a)*t*s/2); }
      for(let t=1;t>=0;t-=0.02){ const a = (i+1)/(cols.length*3)*Math.PI*2 + t*4; ctx.lineTo(Math.cos(a)*t*s/2, Math.sin(a)*t*s/2); }
      ctx.fill();
    }
  }, 256));
}

  const body = lathe(APPLE, toonMat(char.base, { emissive:char.base, emissiveIntensity:0.25 })); body.position.y = 0.06; body.scale.setScalar(1.15); g.add(body);
  const shine = new THREE.Mesh(new THREE.SphereGeometry(0.04,10,8), toonMat(0xffffff)); shine.scale.set(1,1.6,0.4); shine.position.set(-0.12,0.35,0.17); g.add(shine);
  const stem = pillMesh(0.018,0.1,toonMat(0x8b5a2b)); stem.position.set(0,0.47,0); g.add(stem);
  const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.06,10,8), trimMat); leaf.scale.set(1.6,0.35,0.8); leaf.position.set(0.08,0.48,0); leaf.rotation.z = 0.5; g.add(leaf);
  const face = new THREE.Group(); face.position.y = 0.25; g.add(face);
  makeEyePair(face, { spacing:0.07, y:0, z:0.235, r:0.036 });
  const orbit = new THREE.Group(); orbit.name = 'orbit'; orbit.position.y = 0.3; g.add(orbit);
  for(let i=0;i<4;i++){ const s = new THREE.Mesh(new THREE.OctahedronGeometry(0.03,0), toonMat(0xffffff, { emissive:0xfff6a0, emissiveIntensity:0.8 })); const a = i/4*Math.PI*2; s.position.set(Math.cos(a)*0.3, Math.sin(a*2)*0.05, Math.sin(a)*0.3); orbit.add(s); }
  addStubLimbs(g, toonMat(0xffc233), { armY:0.26, armX:0.25, legY:0.05, legX:0.08, legLen:0.08 });
  return g;
}

function rubberMat(){
  if(!rubberMat.m){ rubberMat.m = toonMat(0x141414); rubberMat.m.userData.shared = true; }
  return rubberMat.m;
}
function hubMat(){
  if(!hubMat.m){ hubMat.m = toonMat(0xdedede); hubMat.m.userData.shared = true; }
  return hubMat.m;
}
function putBox(g, w, h, d, mat, x, y, z){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z); g.add(m); return m;
}
function addWheel(g, x, y, z, r){
  const tire = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 0.048, 12), rubberMat());
  tire.rotation.z = Math.PI/2; tire.position.set(x,y,z); g.add(tire);
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(r*0.42, r*0.42, 0.052, 8), hubMat());
  hub.rotation.z = Math.PI/2; hub.position.set(x,y,z); g.add(hub);
}
function axle(g, y, z, r, span){ [-1,1].forEach(s=> addWheel(g, s*span, y, z, r)); }
function windshield(g, y, z, s){
  const f = new THREE.Group(); f.position.set(0,y,z);
  makeEyePair(f, { spacing:0.042*s, r:0.024*s, z:0.002, y:0 });
  g.add(f);
}

function oneEye(g, x, y, z, r){
  r = r || 0.04;
  const sclera = new THREE.Mesh(new THREE.SphereGeometry(r, 12, 10), whiteMat);
  sclera.scale.set(1, 1.08, 0.55);
  sclera.position.set(x, y, z);
  sclera.userData.noOutline = true;
  g.add(sclera);
  const pupil = new THREE.Mesh(new THREE.SphereGeometry(r*0.46, 10, 8), blackMat);
  pupil.position.set(x + r*0.12, y - r*0.04, z + r*0.42);
  pupil.userData.noOutline = true;
  g.add(pupil);
  const hi = new THREE.Mesh(new THREE.SphereGeometry(r*0.2, 8, 6), whiteMat);
  hi.position.set(x + r*0.28, y + r*0.28, z + r*0.5);
  hi.userData.noOutline = true;
  g.add(hi);
}

    const finMat = id==='zlatna-ribica' ? trim : accent;
    sideFish(g, base, finMat);
    if(id==='klavnko'){
      [0.05, -0.09].forEach(x=>{
        fishBand(g, trim, x, 0.05, 0.2, 0.14, 0);
        fishBand(g, accent, x, 0.024, 0.16, 0.12, 0.045);

function vegEyes(g, y, z, gap, r){
  gap = gap || 0.045; r = r || 0.03;
  oneEye(g, -gap, y, z, r);
  oneEye(g, gap, y, z, r);
  const mouth = new THREE.Mesh(new THREE.SphereGeometry(r*0.4, 8, 6), blackMat);
  mouth.scale.set(1.8, 0.5, 0.45);
  mouth.position.set(0, y - r*1.7, z + r*0.2);
  mouth.userData.noOutline = true;
  g.add(mouth);
}
function vegLeaf(g, mat, x, y, z){
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.015, 0.07, 5), mat);
  stem.position.set(x, y, z); g.add(stem);
  const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.045, 8, 6), mat);
  leaf.scale.set(1.5, 0.32, 0.55);
  leaf.position.set(x+0.05, y+0.02, z+0.01);
  leaf.rotation.z = 0.6;
  g.add(leaf);
}
function vegCrown(g, mat, y){
  for(let i=0;i<5;i++){
    const p = new THREE.Mesh(new THREE.ConeGeometry(0.018, 0.07, 4), mat);
    const a = i/5*Math.PI*2;
    p.position.set(Math.sin(a)*0.05, y, Math.cos(a)*0.02);
    g.add(p);
  }
}
function roundFruit(g, mat, sx, sy, sz, y){
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 12), mat);
  body.scale.set(sx, sy, sz);
  body.position.y = y;
  g.add(body);
  return body;
}
function berryCluster(g, mat, n, spread){
  for(let i=0;i<n;i++){
    const a = i/n*Math.PI*2;
    const b = new THREE.Mesh(new THREE.SphereGeometry(0.055, 10, 8), mat);
    const ring = i < 4 ? 0.05 : 0.02;
    b.position.set(Math.cos(a)*ring*spread, 0.22 + (i%3)*0.045, Math.sin(a)*0.03);
    g.add(b);
  }
}

function toyHash(id){
  let h = 2166136261;
  for(let i=0;i<id.length;i++){ h ^= id.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

function toyArm(g, from, to, mat, gloveMat){
  const dir = new THREE.Vector3().subVectors(to, from);

  const arm = pillMesh(0.034, Math.max(0.08, len), mat);
  arm.position.copy(from).lerp(to, 0.5);

}

function buildSuperToy(char){
  const g = new THREE.Group();
  const h = toyHash(char.id);
  const base = toonMat(char.base);
  const accent = toonMat(char.accent);
  const trim = toonMat(char.trim!==undefined ? char.trim : 0xffffff);
  const bootMat = toonMat(0x241433);
  const waveSide = (h & 1) ? 1 : -1;

  [-1,1].forEach(side=>{
    const kicked = side===1 && (h & 2);
    const hip = new THREE.Mesh(new THREE.SphereGeometry(0.05, 12, 10), base);
    hip.position.set(side*0.072, kicked ? 0.17 : 0.125, kicked ? 0.03 : 0);
    g.add(hip);
    const boot = new THREE.Mesh(new THREE.SphereGeometry(0.052, 12, 10), side===waveSide ? accent : bootMat);
    boot.scale.set(1.15, 0.68, 1.45);
    boot.position.set(side*0.078, kicked ? 0.1 : 0.042, kicked ? 0.07 : 0.03);
    g.add(boot);
  });

  const body = new THREE.Mesh(new THREE.SphereGeometry(0.155, 18, 14), base);
  body.scale.set(1.22, 0.98, 0.9);
  body.position.set(0, 0.28, 0);
  g.add(body);
  const belly = new THREE.Mesh(new THREE.CircleGeometry(0.05, 16), accent);
  belly.position.set(0, 0.26, 0.132);
  g.add(belly);
  const gem = new THREE.Mesh(new THREE.CircleGeometry(0.02, 10), trim);
  gem.position.set(0, 0.26, 0.136);
  g.add(gem);

  [-1,1].forEach(side=>{
    const up = side===waveSide;
    const from = new THREE.Vector3(side*0.14, 0.34, 0.02);
    const to = up
      ? new THREE.Vector3(side*0.2, 0.5, 0.08)
      : new THREE.Vector3(side*0.24, 0.18, 0.06);
    toyArm(g, from, to, base, trim);
  });

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.172, 22, 16), base);
  head.scale.set(1.08, 1.02, 0.95);
  head.position.set(0, 0.52, 0.02);
  g.add(head);
  [-1,1].forEach(side=>{
    const cheek = new THREE.Mesh(new THREE.SphereGeometry(0.03, 8, 6), cheekMat);
    cheek.scale.set(1.3, 0.75, 0.35);
    cheek.position.set(side*0.105, 0.46, 0.15);
    g.add(cheek);
  });
  if(char.rarity!=='common'){
    const mask = new THREE.Mesh(new THREE.SphereGeometry(0.1, 12, 8), accent);
    mask.scale.set(1.7, 0.48, 0.32);
    mask.position.set(0, 0.545, 0.09);
    g.add(mask);
  }
  toyEyes(g, char);
  toyGrin(g);
  if((h % 3)!==2) addCape(g, char.accent, { w:0.38, h:0.4, y:0.4, z:-0.11 });
  addToyExtra(g, char, base, accent, trim);
  return g;
}

function buildFigureModel(char){
  const group = new THREE.Group();
  group.name = char.id;
  const baseMat = toonMat(char.base);
  const accentMat = toonMat(char.accent, { emissive:char.accent, emissiveIntensity:0.12 });
  const trimMat = toonMat(char.trim!==undefined ? char.trim : 0xffffff);
  const body = SEA[char.id] ? buildSea(char.id, baseMat, accentMat, trimMat) : (GARAGE[char.id] ? buildGarage(char.id, baseMat, accentMat, trimMat) : (PRODUCE[char.id] ? buildProduce(char.id, baseMat, accentMat, trimMat) : (SHAPE_BUILDERS[char.id] || buildIskrica)(char, baseMat, accentMat, trimMat)));
  group.add(body);
  addOutlines(body);

  const isLegendary = char.rarity==='legendary', isRare = char.rarity==='rare';
  if(isLegendary){
    const halo = new THREE.Mesh(new THREE.TorusGeometry(0.2,0.018,10,40), toonMat(0xffd24a, { emissive:0xffd24a, emissiveIntensity:0.9 }));
    halo.position.y = 0.8; halo.rotation.x = Math.PI/2 - 0.3;
    group.add(halo);
  }
  if(isLegendary || isRare){
    const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: sparkleTex, color: RARITY[char.rarity].hex, transparent:true, opacity: isLegendary ? 0.55 : 0.35, blending:THREE.AdditiveBlending, depthWrite:false }));
    glow.scale.setScalar(isLegendary ? 1.1 : 0.85); glow.position.set(0,0.32,-0.2);
    group.add(glow);
  }
  group.traverse(o=>{
    if(o.isMesh && !o.userData.isOutline){
      if(!o.geometry.boundingSphere) o.geometry.computeBoundingSphere();
      o.castShadow = o.geometry.boundingSphere.radius > 0.06;
    }
  });
  const scale = isLegendary?1.1:(isRare?1.03:0.98);
  group.scale.setScalar(scale);
  group.userData.baseScale = scale;
  group.userData.floatSeed = Math.random()*10;
  group.userData.charId = char.id;
  return group;
}

function pouchPart(v0, v1, back){
  const segX = 26, segY = Math.max(3, Math.round((v1-v0)*44));
  const geo = new THREE.PlaneGeometry(POUCH_W, (v1-v0)*POUCH_H, segX, segY);
  const pos = geo.attributes.position, uv = geo.attributes.uv;
  const yOff = ((v0+v1)/2 - 0.5)*POUCH_H;
  for(let i=0;i<pos.count;i++){
    const x = pos.getX(i), y = pos.getY(i) + yOff;
    const u = x/POUCH_W + 0.5, v = y/POUCH_H + 0.5;
    const sx = Math.max(0, 1 - Math.pow(Math.abs(2*u-1), 2.4));
    const sy = smooth(0,0.03,v) * (1 - smooth(0.8,0.9,v));
    const crinkle = 0.004*Math.sin(u*38+v*21)*Math.cos(v*30-u*9);
    pos.setXYZ(i, x, y, 0.075*Math.sqrt(sx)*sy + crinkle*sy + 0.001);
    uv.setXY(i, back ? 1-u : u, v);
  }
  if(back) geo.rotateY(Math.PI);
  geo.computeVertexNormals();
  return geo;
}

const pouchTex = {};
function buildAllPouchTex(){
  Object.keys(glyphCache).forEach(k=>{ delete glyphCache[k]; });
  Object.keys(SERIES).forEach(id=>{
    pouchTex[id] = { front: makePouchFrontTexture(SERIES[id]), back: makePouchBackTexture(SERIES[id]) };
  });
}

function buildPouch(){
  const tex = pouchTex[pouchSeries] || pouchTex.slatko;
  const group = new THREE.Group();
  const matF = new THREE.MeshStandardMaterial({ map:tex.front, metalness:0.35, roughness:0.28, alphaTest:0.5, envMapIntensity:1.3 });
  const matB = new THREE.MeshStandardMaterial({ map:tex.back,  metalness:0.35, roughness:0.28, alphaTest:0.5, envMapIntensity:1.3 });
  const body = new THREE.Group();
  body.add(new THREE.Mesh(pouchPart(0, TEAR_V, false), matF), new THREE.Mesh(pouchPart(0, TEAR_V, true), matB));
  group.add(body);
  // gornja traka koja se cepa (pivot na desnom kraju linije cepanja)
  const strip = new THREE.Group();
  const stripF = new THREE.Mesh(pouchPart(TEAR_V, 1, false), matF);
  const stripB = new THREE.Mesh(pouchPart(TEAR_V, 1, true), matB);
  [stripF, stripB].forEach(m=> m.userData.orig = m.geometry.attributes.position.array.slice());
  strip.add(stripF, stripB);
  group.add(strip);
  group.traverse(o=>{ if(o.isMesh){ o.castShadow = true; } });
  // sjaj iza kesice (jači za retke figure) i blesak
  const glowMat = new THREE.SpriteMaterial({ map:sparkleTex, color:0xffffff, transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false });
  const glow = new THREE.Sprite(glowMat); glow.scale.setScalar(1.6); glow.position.set(0,0.05,-0.1);
  group.add(glow);
  const leakMat = new THREE.SpriteMaterial({ map:sparkleTex, color:0xffffff, transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false });
  const leak = new THREE.Sprite(leakMat); leak.scale.set(0.9,0.25,1); leak.position.set(0,(TEAR_V-0.5)*POUCH_H,0.06);
  group.add(leak);
  return { group, body, strip, stripParts:[stripF, stripB], mats:[matF, matB], glow, glowMat, leak, leakMat };
}

// cepanje: temena gornje trake se odižu s leva na desno, u zavisnosti od napretka p (0..1)
function peelStrip(p){
  for(const m of pouch.stripParts){
    const arr = m.geometry.attributes.position.array, orig = m.userData.orig;
    const back = m === pouch.stripParts[1];
    for(let i=0;i<arr.length;i+=3){
      const x = orig[i], u = (back ? -x : x)/POUCH_W + 0.5;
      const a = clamp((p*1.3 - u)/0.3, 0, 1), e = a*a;
      const ty = (TEAR_V-0.5)*POUCH_H;
      const dy = orig[i+1] - ty;
      arr[i] = orig[i] + e*0.02;
      arr[i+1] = orig[i+1] + e*(0.07 + dy*0.6);
      arr[i+2] = orig[i+2] + e*0.12*(back ? -0.3 : 1);
    }
    m.geometry.attributes.position.needsUpdate = true;
    m.geometry.computeVertexNormals();
  }
}

let particleSystems = [];
function spawnParticleBurst(origin, color1, color2, count, size, speed){
  const cA = new THREE.Color(color1), cB = new THREE.Color(color2);
  const positions = new Float32Array(count*3), colors = new Float32Array(count*3), velocities = [];
  for(let i=0;i<count;i++){
    positions[i*3]=origin.x; positions[i*3+1]=origin.y; positions[i*3+2]=origin.z;
    const ang = Math.random()*Math.PI*2, up = rand(0.8, 1.6);
    velocities.push(new THREE.Vector3(Math.cos(ang)*rand(0.4,1.6)*speed, up*speed*1.5, Math.sin(ang)*rand(0.4,1.6)*speed));
    const col = Math.random()<0.5?cA:cB;
    colors[i*3]=col.r; colors[i*3+1]=col.g; colors[i*3+2]=col.b;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions,3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors,3));
  const mat = new THREE.PointsMaterial({ size, map: starTex, transparent:true, vertexColors:true, blending:THREE.AdditiveBlending, depthWrite:false });
  const points = new THREE.Points(geo, mat);
  openRoot.add(points);
  particleSystems.push({ points, velocities, life:0, maxLife:1.7, geo });
}
function updateParticleSystems(dt){
  for(let i=particleSystems.length-1;i>=0;i--){
    const p = particleSystems[i];
    p.life += dt;
    const pos = p.geo.attributes.position.array;
    for(let j=0;j<p.velocities.length;j++){
      const v = p.velocities[j];
      v.y -= dt*2.4; v.multiplyScalar(1-dt*0.6);
      pos[j*3] += v.x*dt; pos[j*3+1] += v.y*dt; pos[j*3+2] += v.z*dt;
    }
    p.geo.attributes.position.needsUpdate = true;
    p.points.material.opacity = clamp(1-p.life/p.maxLife,0,1);
    if(p.life>=p.maxLife){ openRoot.remove(p.points); p.geo.dispose(); p.points.material.dispose(); particleSystems.splice(i,1); }
  }
}

// konfete: po jedan InstancedMesh po boji (ova verzija three.js-a ne čita per-instance
// boju u MeshBasicMaterial-u, pa šarenilo pravimo kroz nekoliko pool-ova sa fiksnom bojom)
const CONF_MAX = 260;
const CONF_COLORS = [0xff4d6d,0xffb13d,0xffe14d,0x5ee06b,0x4db8ff,0xa46bff,0xff5ad1,0xffffff];
let confettiPools = [], confetti = [];
const confDummy = new THREE.Object3D();
function buildConfetti(){
  confettiPools = CONF_COLORS.map(hex=>{
    const mesh = new THREE.InstancedMesh(new THREE.PlaneGeometry(0.035,0.06), new THREE.MeshBasicMaterial({ color:hex, side:THREE.DoubleSide, toneMapped:false }), CONF_MAX);
    mesh.frustumCulled = false;
    mesh.count = 0;
    openRoot.add(mesh);
    return mesh;
  });
}
function spawnConfetti(origin, n, power){
  for(let i=0;i<n;i++){
    if(confetti.length>=CONF_MAX) confetti.shift();
    const a = rand(0,Math.PI*2);
    confetti.push({ p: origin.clone(), v: new THREE.Vector3(Math.cos(a)*rand(0.3,1.3)*power, rand(1.5,3.2)*power, Math.sin(a)*rand(0.3,1.1)*power),
      r: new THREE.Vector3(rand(0,6),rand(0,6),rand(0,6)), w: new THREE.Vector3(rand(-9,9),rand(-9,9),rand(-9,9)),
      colorIdx: Math.floor(Math.random()*CONF_COLORS.length), life: rand(2,3.2) });
  }
}
function updateConfetti(dt){
  for(let i=confetti.length-1;i>=0;i--){
    const c = confetti[i];
    c.life -= dt;
    if(c.life<=0 || c.p.y < -0.5){ confetti.splice(i,1); continue; }
    c.v.y -= 3.2*dt; c.v.multiplyScalar(1 - dt*1.6);
    c.v.x += Math.sin(c.life*6+i)*dt*0.6;
    c.p.addScaledVector(c.v, dt);
    c.r.addScaledVector(c.w, dt);
  }
  const perPoolCount = new Array(confettiPools.length).fill(0);
  for(const c of confetti){
    const pool = confettiPools[c.colorIdx];
    const idx = perPoolCount[c.colorIdx]++;
    if(idx >= CONF_MAX) continue;
    confDummy.position.copy(c.p); confDummy.rotation.set(c.r.x,c.r.y,c.r.z);
    confDummy.scale.setScalar(Math.min(1, c.life*2));
    confDummy.updateMatrix();
    pool.setMatrixAt(idx, confDummy.matrix);
  }
  confettiPools.forEach((pool,i)=>{ pool.count = perPoolCount[i]; pool.instanceMatrix.needsUpdate = true; });
}

/* ============================= ZVUK (mali WebAudio sintisajzer) ============================= */

const sfx = (()=>{
  let ctx = null;
  let out = null, muted = false;
  // every sound goes through one compressor, so a legendary fanfare with many notes never clips
  function ensure(){ try{
    if(!ctx){ ctx = new (window.AudioContext||window.webkitAudioContext)();
      const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = 0.004; comp.release.value = 0.2;
      out = ctx.createGain(); out.gain.value = muted ? 0 : 1; out.connect(comp).connect(ctx.destination); }
    if(ctx.state==='suspended') ctx.resume(); }catch(e){} }
  function tone(f, d, type, v, f2, delay){
    if(!ctx) return;
    const t = ctx.currentTime + (delay||0), o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type||'sine'; o.frequency.setValueAtTime(f, t);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2, t+d);
    g.gain.setValueAtTime(v||0.08, t); g.gain.exponentialRampToValueAtTime(0.0001, t+d);
    o.connect(g).connect(out); o.start(t); o.stop(t+d+0.02);
  }
  function noise(d, v, freq){
    if(!ctx) return;
    const len = Math.floor(ctx.sampleRate*d), buf = ctx.createBuffer(1, len, ctx.sampleRate), data = buf.getChannelData(0);
    for(let i=0;i<len;i++) data[i] = (Math.random()*2-1) * (1 - i/len);
    const src = ctx.createBufferSource(); src.buffer = buf;
    const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq||2500; f.Q.value = 0.8;
    const g = ctx.createGain(); g.gain.value = v||0.2;
    src.connect(f).connect(g).connect(out); src.start();
  }
  return {
    ensure,
    setMuted(m){ muted = m; if(out) out.gain.value = m ? 0 : 1; },
    crinkle(){ noise(0.08, 0.12, 4000); },
    rip(){ noise(0.12, 0.25, rand(1800,3200)); },
    pop(){ tone(300, 0.18, 'sine', 0.2, 900); },
    sparkle(){ [1318,1568,2093].forEach((f,i)=>tone(f, 0.12, 'triangle', 0.05, null, i*0.06)); },
    rare(){
      noise(0.22, 0.09, 3200);
      [523,659,784,1046,1318].forEach((f,i)=>tone(f, 0.26, 'triangle', 0.09, null, i*0.075));
      tone(1568, 0.5, 'sine', 0.05, null, 0.42);
    },
    legendary(){
      tone(110, 0.6, 'sine', 0.18, 60, 0);
      noise(0.4, 0.13, 2600);
      [392,523,659,784,1046,1318,1568].forEach((f,i)=>tone(f, 0.4, 'square', 0.055, null, 0.12+i*0.09));
      [784,1046,1568,2093].forEach((f,i)=>tone(f, 0.9, 'triangle', 0.055, null, 0.9+i*0.08));
    },
  };
})();

const state = { tokens: 5, maxTokens: 5, tokenTimer: 0, tokenInterval: 22, collection: {} };

function saveLocal(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify({ v:3, tokens:state.tokens, tokenTimer:state.tokenTimer, collection:state.collection, enabled:enabledSeries, t:Date.now() })); }catch(e){}
}
function applyEnabled(raw){
  if(!raw || typeof raw!=='object') return;
  Object.keys(SERIES).forEach(id=>{ if(typeof raw[id]==='boolean') enabledSeries[id] = raw[id]; });
  if(!Object.keys(SERIES).some(id=> enabledSeries[id]!==false)) enabledSeries[Object.keys(SERIES)[0]] = true;
}
function renderSeriesSettings(){
  const root = document.getElementById('series-toggles');
  if(!root) return;
  root.innerHTML = '';
  Object.keys(SERIES).forEach(id=>{
    const s = SERIES[id];
    const row = document.createElement('label');
    row.className = 'series-toggle';
    const img = document.createElement('img');
    const canvas = pouchTex[id] && pouchTex[id].front && pouchTex[id].front.image;
    if(canvas && canvas.toDataURL) img.src = canvas.toDataURL('image/jpeg', 0.8);
    img.alt = s.name;
    const meta = document.createElement('span');
    meta.className = 'meta';
    meta.innerHTML = '<b>'+s.name+'</b><small>'+s.badge+'</small>';
    const input = document.createElement('input');
    input.type = 'checkbox';
    input.checked = enabledSeries[id] !== false;
    input.addEventListener('change', ()=>{
      if(!input.checked && activeSeriesIds().filter(k=>k!==id).length===0){
        input.checked = true;
        showToast(tr('oneBagOn'));
        return;
      }
      enabledSeries[id] = input.checked;
      saveLocal();
      if(phase==='idle') spawnPouch(true);

    row.append(img, meta, input);
    root.appendChild(row);
  });
}
function setupSettings(){
  const panel = document.getElementById('settings');
  document.getElementById('settings-btn').addEventListener('click', ()=>{ renderSeriesSettings(); panel.classList.remove('hidden'); });
  document.getElementById('settings-close').addEventListener('click', ()=> panel.classList.add('hidden'));
  panel.addEventListener('click', e=>{ if(e.target===panel) panel.classList.add('hidden'); });
}
function loadLocal(){
  try{
    const d = JSON.parse(localStorage.getItem(SAVE_KEY)||'null');
    if(!d || !d.collection) return;
    state.collection = {};
    for(const id in d.collection) if(CHAR_BY_ID[id]) state.collection[id] = d.collection[id];
    applyEnabled(d.enabled);
    state.tokens = clamp(d.tokens|0, 0, state.maxTokens);
    state.tokenTimer = d.tokenTimer || 0;
    // tokeni se pune i dok igra nije otvorena
    if(d.t){ const away = (Date.now()-d.t)/1000 + state.tokenTimer; const gained = Math.floor(away/state.tokenInterval);
      state.tokens = Math.min(state.maxTokens, state.tokens + gained); state.tokenTimer = state.tokens>=state.maxTokens ? 0 : away % state.tokenInterval; }
  }catch(e){}
}

function paintOpenSea(ctx, w, h){
  const g = ctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0,'#d8fbff'); g.addColorStop(0.28,'#3ec6ff'); g.addColorStop(0.62,'#1466d6'); g.addColorStop(1,'#07285f');
  ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
  ctx.save(); ctx.globalAlpha = 0.16; ctx.fillStyle = '#ffffff';
  for(let i=0;i<6;i++){
    const x = w*(0.06+i*0.17);
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x+w*0.05,h); ctx.lineTo(x-w*0.07,h); ctx.fill();
  }
  ctx.restore();
  for(let i=0;i<16;i++){
    const x = (i*83+40)%w, y = (i*61+30)%Math.floor(h*0.62), r = 5+(i%4)*3;
    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.stroke();
  }
  const ink = '#2a1450';
  function pineapple(x, y, s){
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = '#3a9a32'; ctx.strokeStyle = ink; ctx.lineWidth = 4; ctx.lineJoin = 'round';
    [[-0.55,-1.05],[ -0.15,-1.25],[0.28,-1.12],[0.62,-0.9]].forEach(function(p){
      ctx.beginPath();
      ctx.moveTo(0, -s*0.45);
      ctx.quadraticCurveTo(p[0]*s*0.4, -s*0.85, p[0]*s, p[1]*s);
      ctx.quadraticCurveTo(p[0]*s*0.35, -s*0.7, 0, -s*0.4);
      ctx.fill(); ctx.stroke();
    });
    ctx.fillStyle = '#f0c84a';
    ctx.beginPath(); ctx.ellipse(0, s*0.08, s*0.46, s*0.62, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#c4922a'; ctx.lineWidth = 2;
    for(let i=-2;i<=2;i++){
      ctx.beginPath(); ctx.moveTo(-s*0.36, s*(0.08+i*0.16)); ctx.lineTo(s*0.36, s*(0.08+i*0.16)); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(s*i*0.16, -s*0.4); ctx.quadraticCurveTo(s*i*0.16, s*0.08, s*i*0.1, s*0.62); ctx.stroke();
    }
    ctx.fillStyle = '#7ecbff'; ctx.strokeStyle = ink; ctx.lineWidth = 4;
    [[-s*0.16,-s*0.08],[s*0.16,-s*0.02]].forEach(function(p){
      ctx.beginPath(); ctx.arc(p[0], p[1], s*0.09, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    });
    ctx.strokeStyle = ink; ctx.lineWidth = Math.max(4, s*0.045); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(0, s*0.12, s*0.18, 0.15*Math.PI, 0.85*Math.PI); ctx.stroke();
    ctx.restore();
  }
  function moai(x, y, s){
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = '#e0a15a'; ctx.strokeStyle = ink; ctx.lineWidth = 4; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(-s*0.4, s*0.62);
    ctx.lineTo(-s*0.5, -s*0.1);
    ctx.quadraticCurveTo(-s*0.46, -s*0.95, 0, -s*1.02);
    ctx.quadraticCurveTo(s*0.46, -s*0.95, s*0.5, -s*0.1);
    ctx.lineTo(s*0.4, s*0.62);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#c4843c';
    ctx.fillRect(-s*0.4, -s*0.48, s*0.8, s*0.14);
    ctx.strokeRect(-s*0.4, -s*0.48, s*0.8, s*0.14);
    ctx.fillStyle = '#2a1450';
    ctx.fillRect(-s*0.3, -s*0.3, s*0.16, s*0.1);
    ctx.fillRect(s*0.14, -s*0.3, s*0.16, s*0.1);
    ctx.fillStyle = '#e8b56e';
    ctx.beginPath();
    ctx.moveTo(-s*0.1, -s*0.16); ctx.lineTo(s*0.1, -s*0.16); ctx.lineTo(s*0.16, s*0.16); ctx.lineTo(-s*0.16, s*0.16);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#6a4020';
    ctx.beginPath(); ctx.roundRect(-s*0.12, s*0.28, s*0.24, s*0.24, 6); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  function bloom(x, y, s, color){
    ctx.fillStyle = color; ctx.strokeStyle = ink; ctx.lineWidth = 3;
    for(let i=0;i<5;i++){
      const a = -Math.PI/2 + i/5*Math.PI*2;
      ctx.beginPath(); ctx.ellipse(x+Math.cos(a)*s*0.7, y+Math.sin(a)*s*0.55, s*0.55, s*0.36, a, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    }

      '      else if(pick > 0.33) sc = vec3(0.35, 0.85, 1.0);',
      '      col = mix(col, sc, body);',
      '    }',
      '    gl_FragColor = vec4(col, 1.0);',
      '    return;',
      '  }',
      '  if(uKind > 1.5){',
      '    float horizon = 0.64;',
      '    if(vUv.y > 0.74){',
      '      col = texture2D(tReef, vUv).rgb;',
      '    } else if(vUv.y > horizon){',
      '      col = texture2D(tReef, vec2(vUv.x, 0.86)).rgb;',
      '      float scroll = t * 0.22;',
      '      float idx = floor(vUv.x * 7.0 - scroll);',
      '      float fx = fract(vUv.x * 7.0 - scroll);',
      '      float bh = 0.045 + hash(idx) * 0.09;',
      '      if(vUv.y < horizon + bh && fx > 0.06 && fx < 0.94){',
      '        col = vec3(0.29, 0.33, 0.41);',
      '        float wy = fract((horizon + bh - vUv.y) * 16.0);',
      '        float wx = fract(fx * 3.5);',
      '        if(wy > 0.32 && wy < 0.72 && wx > 0.22 && wx < 0.72){',
      '          col = hash(idx + floor(wy * 5.0)) > 0.45 ? vec3(1.0, 0.88, 0.3) : vec3(0.49, 0.8, 1.0);',
      '        }',
      '      }',
      '    } else {',
      '      float near = clamp((horizon - vUv.y) / horizon, 0.0, 1.0);',
      '      float dist = 0.12 / max(near, 0.012);',
      '      float halfW = mix(0.055, 0.92, pow(near, 0.8));',
      '      float dx = abs(vUv.x - 0.5);',
      '      if(dx > halfW){',
      '        col = vec3(0.44, 0.75, 0.29);',
      '        float stripe = step(0.55, fract(dist * 1.6 - t * 1.1 + vUv.x * 3.0));',
      '        col *= 0.9 + stripe * 0.12;',
      '      } else {',
      '        col = vec3(0.23, 0.25, 0.31);',
      '        float edge = halfW - mix(0.01, 0.035, near);',
      '        if(abs(dx - edge) < mix(0.004, 0.014, near)) col = vec3(1.0);',
      '        float mark = fract(dist * 1.7 - t * 1.35);',
      '        float dashW = mix(0.006, 0.05, near);',
      '        if(mark > 0.42 && abs(vUv.x - 0.5) < dashW) col = vec3(1.0, 0.88, 0.3);',
      '      }',
      '    }',
      '    gl_FragColor = vec4(col, 1.0);',
      '    return;',
      '  }',
      '  vec2 uv = vUv;',
      '  float wx = sin(uv.y*18.0 + t*1.5)*0.02 + sin(uv.y*6.5 - t*0.75)*0.028;',
      '  float wy = cos(uv.x*14.0 + t*1.1)*0.016 + sin(uv.x*5.0 + uv.y*3.0 + t*0.55)*0.012;',
      '  col = texture2D(tReef, clamp(uv + vec2(wx, wy), 0.001, 0.999)).rgb;',
      '  vec2 c = uv * vec2(8.0, 13.0);',
      '  float cau = sin(c.x + t*1.25)*sin(c.y - t*0.9) + sin(c.x*1.7 - t*0.65 + c.y)*0.55;',
      '  col += vec3(0.62, 0.9, 1.0) * smoothstep(0.55, 1.15, cau) * 0.42;',
      '  float shaft = 0.0;',
      '  for(int i=0;i<4;i++){',
      '    float fi = float(i);',
      '    float x = 0.16 + fi*0.22 + sin(t*0.4 + fi*1.7)*0.035;',
      '    shaft += exp(-pow((uv.x - x)*9.0, 2.0));',
      '  }',
      '  shaft *= smoothstep(1.0, 0.12, uv.y) * (0.5 + 0.5*sin(t*0.85));',
      '  col += vec3(0.75, 0.92, 1.0) * shaft * 0.2;',
      '  for(int i=0;i<12;i++){',
      '    float fi = float(i);',
      '    float sp = 0.04 + hash(fi)*0.055;',
      '    vec2 p = vec2(fract(hash(fi+9.0) + sin(t*0.55 + fi)*0.025), fract(hash(fi+3.0) + t*sp));',
      '    float rad = 0.011 + hash(fi+1.7)*0.024;',
      '    vec2 d = (uv - p) * vec2(0.55, 1.0);',
      '    float dist = length(d);',
      '    float ring = smoothstep(rad, rad-0.0035, dist) - smoothstep(rad*0.62, rad*0.28, dist);',
      '    float hi = smoothstep(rad*0.38, 0.0, length(d - vec2(rad*0.28, rad*0.3)));',
      '    col += vec3(0.9, 0.97, 1.0) * (ring*0.9 + hi*0.5);',
      '  }',
      '  float glass = smoothstep(0.08, 0.0, abs(uv.y - (0.15 + 0.7*fract(t*0.03)) + (uv.x-0.5)*0.18));',
      '  col += vec3(1.0) * glass * 0.07;',
      '  gl_FragColor = vec4(col, 1.0);',
      '}'
    ].join('\n')
  });
  waterSheet = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat);
  waterSheet.frustumCulled = false;
  waterScene = new THREE.Scene();
  waterScene.add(waterSheet);
  waterTarget = new THREE.WebGLRenderTarget(2, 2);
  waterTarget.depthBuffer = false;
  waterTarget.stencilBuffer = false;
  waterTarget.texture.minFilter = THREE.LinearFilter;
  waterTarget.texture.magFilter = THREE.LinearFilter;
  waterTarget.texture.generateMipmaps = false;
  const blurUniforms = { tMap:{ value: waterTarget.texture }, uRes:{ value: new THREE.Vector2(2, 2) } };
  const blurMat = new THREE.ShaderMaterial({
    uniforms: blurUniforms,
    depthTest: false,
    depthWrite: false,
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 1.0, 1.0); }',
    fragmentShader: [
      'precision highp float;',
      'uniform sampler2D tMap;',
      'uniform vec2 uRes;',
      'varying vec2 vUv;',
      'void main(){',
      '  vec2 px = 4.5 / uRes;',
      '  vec3 col = texture2D(tMap, vUv).rgb * 0.28;',
      '  col += texture2D(tMap, vUv + vec2(px.x, 0.0)).rgb * 0.14;',
      '  col += texture2D(tMap, vUv - vec2(px.x, 0.0)).rgb * 0.14;',
      '  col += texture2D(tMap, vUv + vec2(0.0, px.y)).rgb * 0.14;',
      '  col += texture2D(tMap, vUv - vec2(0.0, px.y)).rgb * 0.14;',
      '  col += texture2D(tMap, vUv + px).rgb * 0.04;',
      '  col += texture2D(tMap, vUv - px).rgb * 0.04;',
      '  col += texture2D(tMap, vUv + vec2(px.x, -px.y)).rgb * 0.04;',
      '  col += texture2D(tMap, vUv + vec2(-px.x, px.y)).rgb * 0.04;',
      '  gl_FragColor = vec4(col, 1.0);',
      '}'
    ].join('\n')
  });
  waterBlur = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), blurMat);
  waterBlur.frustumCulled = false;
  waterBlur.renderOrder = -10;
  waterBlur.visible = false;
  scene.add(waterBlur);
}
function syncWaterBackdrop(){
  if(!waterSheet) return;
  const open = currentMode==='open' && !!openBgTex;
  const sea = open && pouchSeries==='more';
  const drive = open && pouchSeries==='garaza';
  const sweet = open && pouchSeries==='slatko';
  const field = open && pouchSeries==='voce';
  waterSheet.visible = true;
  waterBlur.visible = sea || drive || sweet || field;
  waterUniforms.uKind.value = field ? 4 : sweet ? 3 : drive ? 2 : 1;
  if(!waterBlur.visible) return;
  if(!waterReefTex){
    waterReefTex = new THREE.CanvasTexture(openBgTex.image);
    waterReefTex.minFilter = THREE.LinearFilter;
    waterReefTex.magFilter = THREE.LinearFilter;
    waterReefTex.generateMipmaps = false;
    waterReefTex.wrapS = waterReefTex.wrapT = THREE.ClampToEdgeWrapping;
  } else waterReefTex.image = openBgTex.image;
  waterReefTex.needsUpdate = true;
  waterUniforms.tReef.value = waterReefTex;
  if(!propSpriteTex && propAtlasCanvas){
    propSpriteTex = new THREE.CanvasTexture(propAtlasCanvas);
    propSpriteTex.minFilter = THREE.LinearFilter;
    propSpriteTex.magFilter = THREE.LinearFilter;
    propSpriteTex.generateMipmaps = false;
    propSpriteTex.wrapS = propSpriteTex.wrapT = THREE.ClampToEdgeWrapping;
    propSpriteTex.premultiplyAlpha = false;
    propSpriteTex.needsUpdate = true;
  }
  waterUniforms.tSprites.value = propSpriteTex;
}
function applyOpenTheme(){
  if(openBgTex) openBgTex.dispose();
  openBgTex = srgb(makeCanvasTexture(function(ctx,w,h){ paintOpenSky(ctx, w, h, pouchSeries); }, 540, 960));
  if(currentMode!=='showroom') scene.background = openBgTex;
  syncWaterBackdrop();
  if(openStage){
    if(openStage.material.map) openStage.material.map.dispose();
    openStage.material.map = srgb(makeCanvasTexture(function(ctx,s){ paintStageDisc(ctx, s, pouchSeries); }, 512));
    openStage.material.needsUpdate = true;
  }
  if(openRim){
    const hex = STAGE_RIM[pouchSeries] || STAGE_RIM.slatko;
    openRim.material.color.setHex(hex);
    openRim.material.emissive.setHex(hex);
  }
}
function buildOpenScene(){
  openStage = new THREE.Mesh(new THREE.CylinderGeometry(1.65,1.8,0.22,48), new THREE.MeshStandardMaterial({ roughness:0.5, metalness:0.1 }));
  openStage.position.y = -0.11; openStage.receiveShadow = true;
  openRoot.add(openStage);
  openRim = new THREE.Mesh(new THREE.TorusGeometry(1.72,0.04,12,64), new THREE.MeshStandardMaterial({ color:0xffd24a, emissive:0xffd24a, emissiveIntensity:0.6, metalness:0.6, roughness:0.3 }));
  openRim.rotation.x = Math.PI/2; openRim.position.y = 0.005;
  openRoot.add(openRim);
  const key = new THREE.SpotLight(0xffffff, 0.85, 12, Math.PI/5, 0.4, 1.2);
  key.position.set(2.2,4.2,2.6); key.castShadow = true; key.shadow.mapSize.set(1024,1024);
  key.target.position.set(0,0.4,0);
  openRoot.add(key, key.target);
  const rimLight1 = new THREE.PointLight(0x4fd8ff, 0.35, 8); rimLight1.position.set(-2.4,1.6,-1.6);
  const rimLight2 = new THREE.PointLight(0xff8fd6, 0.3, 8); rimLight2.position.set(2.2,1.2,-2);
  const front = new THREE.DirectionalLight(0xffffff, 0.32); front.position.set(0,1,4);
