<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; overflow: hidden; background: #8fd16a;
    font-family: 'Baloo 2', 'Arial Black', system-ui, sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: none;
  }
  canvas { display: block; touch-action: none; }
  #ui { position: fixed; inset: 0; pointer-events: none; color: #fff; }
  .stroke { text-shadow: 0 2px 0 #0005, 2px 2px 0 #2a1b3d, -2px -2px 0 #2a1b3d, 2px -2px 0 #2a1b3d, -2px 2px 0 #2a1b3d; }
  #top {
    position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between;
    align-items: flex-start; padding: max(10px, env(safe-area-inset-top)) 12px 0; gap: 8px;
  }
  .hud-left { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px; background: #2a1b3dd9; border-radius: 16px;
    padding: 4px 14px 4px 8px; font-size: 22px; font-weight: 800; line-height: 1.2;
    box-shadow: 0 3px 0 #0003;
  }
  .pill .ic { font-size: 22px; }
  .pill.money { font-size: 28px; color: #ffd84a; }
  .pill.money.bump { animation: bump .25s; }
  @keyframes bump { 50% { transform: scale(1.12); } }
  .pill.cap.full { background: #c0392bdd; }
  .pill.order { color: #ffe8a0; font-size: 18px; }
  .btns { display: flex; gap: 6px; position: relative; z-index: 60; }
  .btns button, #settingsMenu button, #settingsMenu a {
    pointer-events: auto; font-family: inherit; font-size: 18px; font-weight: 800; color: #fff; background: #2a1b3dd9;
    border: none; border-radius: 12px; min-width: 42px; height: 42px; cursor: pointer;
  }
  #settingsMenu {
    position: absolute; top: calc(100% + 8px); right: 0; width: min(260px, calc(100vw - 24px));
    background: #2a1b3df5; border: 3px solid #ffd84a; border-radius: 18px; padding: 8px;
    display: flex; flex-direction: column; gap: 6px; z-index: 61; pointer-events: auto;
  }
  #settingsMenu.hidden { display: none; }
  #langRow .gr-lang { display: flex !important; width: 100%; }
  #settingsMenu #langRow button { flex: 1; width: auto; height: 32px; justify-content: center; padding: 0; }
  #settingsMenu button, #settingsMenu a {
    width: 100%; min-width: 0; height: 40px; font-size: 16px; text-decoration: none;
    display: flex; align-items: center; justify-content: flex-start; padding: 0 12px; background: #3a2752;
  }
  #toast {
    position: absolute; top: 22%; left: 50%; transform: translate(-50%, -10px) scale(.8); opacity: 0;
    background: #2a1b3de6; border: 3px solid #ffd84a; border-radius: 18px; padding: 8px 22px;
    font-size: 26px; font-weight: 800; text-align: center; transition: all .25s; white-space: nowrap;
  }
  #toast small { display: block; font-size: 15px; color: #ffe8a0; font-weight: 600; }
  #toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
  .float {
    position: absolute; transform: translate(-50%, -50%); font-size: 24px; font-weight: 800; white-space: nowrap;
    animation: floatUp 1.1s ease-out forwards; color: #ffe066;
  }
  .float.info { color: #fff; font-size: 20px; }
  @keyframes floatUp {
    0% { opacity: 0; transform: translate(-50%, -20%) scale(.6); }
    15% { opacity: 1; transform: translate(-50%, -60%) scale(1.1); }
    100% { opacity: 0; transform: translate(-50%, -220%) scale(1); }
  }
  #maxTag {
    position: absolute; transform: translate(-50%, -100%); background: #e74c3c; border-radius: 10px;
    padding: 0 10px; font-size: 18px; font-weight: 800; display: none;
  }
  #joy {
    position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%;
    background: #ffffff22; border: 3px solid #ffffff66; display: none;
  }
  #joyKnob {
    position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px;
    border-radius: 50%; background: #ffffffcc; box-shadow: 0 3px 8px #0004;
  }
  .overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #1d2b1acc; pointer-events: auto; padding: 16px;
  }
  .overlay.hidden { display: none; }
  .card {
    background: #fff9ec; color: #2a1b3d; border-radius: 26px; padding: 26px 24px; max-width: 440px; width: 100%;
    text-align: center; box-shadow: 0 10px 0 #0003; max-height: calc(100vh - 32px); overflow: auto;
  }
  .card h1 { font-size: 48px; line-height: .95; color: #d35400; }
  .card h2 { font-size: 36px; color: #d35400; }
  .card p { font-family: system-ui, sans-serif; font-size: 15px; line-height: 1.5; margin: 12px 0; color: #4a3f55; }
  .steps { display: grid; grid-template-columns: 34px 1fr; gap: 6px 10px; text-align: left; margin: 14px 0 18px;
    font-family: system-ui, sans-serif; font-size: 14px; color: #3b3147; align-items: center; }
  .steps span:nth-child(odd) { font-size: 24px; text-align: center; }
  button.play {
    font-family: inherit; font-size: 24px; font-weight: 800; color: #fff; background: #e67e22; border: none;
    border-radius: 16px; padding: 10px 40px; box-shadow: 0 5px 0 #a04000; cursor: pointer; margin: 4px;
  }
  button.play:active { transform: translateY(3px); box-shadow: 0 2px 0 #a04000; }
  button.link { background: none; border: none; font-family: inherit; font-size: 15px; color: #8a7f96; text-decoration: underline; cursor: pointer; margin-top: 8px; }
  .keys { font-family: system-ui, sans-serif; font-size: 12px; color: #8a7f96; margin-top: 10px; }
  button.link.hidden, .steps.hidden { display: none; }
  #howBtn { display: block; margin: 0 auto 10px; }
  /* rewarded-ad offers (the player picks them; hidden when no ad network is there) */
  #adBtns { position: absolute; left: 12px; top: calc(max(10px, env(safe-area-inset-top)) + 54px); display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  #adBtns button {
    pointer-events: auto; font-family: inherit; font-size: 16px; font-weight: 800; color: #2a1b3d; border: 0; cursor: pointer;
    background: linear-gradient(#ffe066, #f5b800); border-radius: 14px; padding: 5px 12px; box-shadow: 0 3px 0 #b07d00;
    display: flex; align-items: center; gap: 6px; animation: offerIn .35s cubic-bezier(.2, 1.5, .4, 1);
  }
  #adBtns button small { font-size: 10px; background: #2a1b3d; color: #ffe066; border-radius: 6px; padding: 1px 6px; }
  #adBtns button.on { background: linear-gradient(#9be15d, #4caf50); box-shadow: 0 3px 0 #2e7d32; color: #fff; cursor: default; }
  #adBtns button.hidden { display: none; }
  @keyframes offerIn { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
  .overlay .card { animation: cardIn .28s cubic-bezier(.2, 1.4, .4, 1); }
  @keyframes cardIn { from { transform: scale(.88) translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (max-width: 600px) {
    .pill { font-size: 18px; padding: 3px 11px 3px 7px; }
    .pill.money { font-size: 22px; }
    .pill .ic { font-size: 18px; }
    #toast { font-size: 20px; top: 16%; }
    .float { font-size: 20px; }
  }
</style>

const flights = [];

function updateFlights(dt) {

const slotOut = { p: V(), r: 0 };
const gridLayout = (cols, rows, dx, dz) => (i, items, o) => {
  const per = cols * rows, layer = Math.floor(i / per), k = i % per, h = ITEMS[items[i].type].h;
  o.p.set(((k % cols) - (cols - 1) / 2) * dx, layer * h + h / 2, (Math.floor(k / cols) - (rows - 1) / 2) * dz);
  o.r = 0;
};
const stackLayout = (i, items, o) => {
  let y = 0;
  for (let j = 0; j < i; j++) y += ITEMS[items[j].type].h;
  o.p.set(0, y + ITEMS[items[i].type].h / 2, 0);

class Pile {
  constructor(parent, pos, layout) {
    this.group = new THREE.Group();
    this.group.position.copy(pos);
    parent.add(this.group);
    this.items = [];
    this.layout = layout;
  }
  get length() { return this.items.length; }
  count(t) { let n = 0; for (const it of this.items) if (it.type === t) n++; return n; }
  place(it, i) {
    this.layout(i, this.items, slotOut);
    it.mesh.position.copy(slotOut.p);
    it.mesh.rotation.set(0, slotOut.r, 0);
  }
  worldSlot(it) {
    const i = this.items.indexOf(it);
    if (i < 0) return it.mesh.position.clone();      // taken while still flying: stop where it is
    this.layout(i, this.items, slotOut);
    this.group.updateWorldMatrix(true, false);
    return this.group.localToWorld(slotOut.p.clone());
  }
  add(type, from) {
    const it = { type, mesh: makeItem(type), flying: false, removed: false };
    this.items.push(it);
    if (from && !instant) {
      it.flying = true;
      fly(it.mesh, from, () => this.worldSlot(it), 0.3, () => {
        if (it.removed) { scene.remove(it.mesh); return; }
        it.flying = false;
        this.group.add(it.mesh);
        this.place(it, this.items.indexOf(it));
      });
    } else {
      this.group.add(it.mesh);
      this.place(it, this.items.length - 1);
    }
    return it;
  }
  take(type) {
    for (let i = this.items.length - 1; i >= 0; i--) {
      const it = this.items[i];
      if (type && it.type !== type) continue;
      this.items.splice(i, 1);
      it.removed = true;
      const pos = V();
      it.mesh.getWorldPosition(pos);
      if (it.mesh.parent) it.mesh.parent.remove(it.mesh);
      for (let j = i; j < this.items.length; j++) if (!this.items[j].flying) this.place(this.items[j], j);
      return { type: it.type, pos };
    }
    return null;
  }
  clear() { while (this.take()); }
}

class CashPile {
  constructor(pos) { this.pos = pos; this.amount = 0; this.pile = new Pile(scene, pos, gridLayout(2, 2, 0.56, 0.3)); }
  add(v, from) {
    this.amount += v;
    const want = Math.min(40, Math.ceil(this.amount / 6));
    while (this.pile.length < want) this.pile.add('cash', from);
  }
  collect(toFn) {
    const v = this.amount;
    this.amount = 0;
    let r, k = 0;
    while ((r = this.pile.take())) {
      if (instant) continue;
      const m = makeItem('cash');
      fly(m, r.pos, toFn, 0.25 + (k++) * 0.02, () => scene.remove(m));
    }
    return v;
  }
}

function animateChar(c, dt, speed) {

function resolve(pos, r = 0.4) {
  for (const c of colliders) {
    if (c.hx) {
      const dx = pos.x - c.x, dz = pos.z - c.z, px = c.hx + r - Math.abs(dx), pz = c.hz + r - Math.abs(dz);
      if (px > 0 && pz > 0) { if (px < pz) pos.x += (dx < 0 ? -1 : 1) * px; else pos.z += (dz < 0 ? -1 : 1) * pz; }
      continue;
    }
    const dx = pos.x - c.x, dz = pos.z - c.z, d = Math.hypot(dx, dz), min = c.r + r;
    if (d < min && d > 1e-4) { pos.x = c.x + dx / d * min; pos.z = c.z + dz / d * min; }

  pos.z = clamp(pos.z, BOUNDS.z0, BOUNDS.z1);
}
// walks pos toward target (x/z), returns distance moved
function moveAgent(agent, target, speed, dt, solid = true) {
  const dx = target.x - agent.pos.x, dz = target.z - agent.pos.z, d = Math.hypot(dx, dz);
  if (d < 0.05) return 0;
  const step = Math.min(d, speed * dt);
  const ox = agent.pos.x, oz = agent.pos.z;
  let ux = dx / d, uz = dz / d;
  if (agent.detour > 0) { agent.detour -= dt; [ux, uz] = [ux * 0.3 - uz * agent.side, uz * 0.3 + ux * agent.side]; }
  agent.pos.x += ux * step; agent.pos.z += uz * step;
  if (solid) resolve(agent.pos);
  const moved = Math.hypot(agent.pos.x - ox, agent.pos.z - oz);

  if (solid && moved < step * 0.25) { agent.stuck = (agent.stuck || 0) + dt; if (agent.stuck > 0.4) { agent.stuck = 0; agent.detour = 0.7; agent.side = Math.random() < 0.5 ? -1 : 1; } }
  else agent.stuck = 0;
  turn(agent.c.root, Math.atan2(ux, uz), dt);
  return moved;
}

const SOURCES = {
  log:   { list: () => trees.filter(t => t.state === 'alive'), reach: 1.95, mul: 1,   hit: (s, a) => hitTree(s, a, a === player) },
  meat:  { list: () => pigs.filter(p => p.alive),              reach: 1.9,  mul: 1.3, hit: (s, a) => hitPig(s, a) },
  apple: { list: () => appleTrees.filter(t => t.count > 0),    reach: 2.0,  mul: 0.7, hit: (s, a) => pickApple(s, a) },
  fish:  { list: () => docks,                                  reach: 1.1,  mul: 2.4, hit: (s, a) => catchFish(s, a) },
};
function nearestSource(res, pos, max = Infinity, agent = null) {
  let best = null, bd = max;
  for (const s of SOURCES[res].list()) {
    if (res === 'fish' && s.user && s.user !== agent && agent !== player) continue;
    const d = dist2(pos, s.pos);
    if (d < bd) { bd = d; best = s; }
  }
  return best;
}
const facePos = (res, s) => res === 'fish' ? s.water : s.pos;

const SHIRTS = [0x3498db, 0x9b59b6, 0x1abc9c, 0xe67e22, 0xe84393, 0x2ecc71, 0xf1c40f, 0x6c5ce7, 0xfd79a8];

const HAIRS = [0x2d1b0e, 0x6b3e1f, 0xe0b25a, 0x1a1a1a, 0xb04a2a];
let spawnTimer = 2;
function spawnCustomer() {
  const open = stands.filter(s => s.queue.length < 4);
  if (!open.length) return;
  // prefer stands that have goods on the shelf
  const w = open.map(s => 1 + (s.shelf.length > 0 ? 2 : 0));
  let r = Math.random() * w.reduce((a, b) => a + b), st = open[0];
  for (let i = 0; i < open.length; i++) { r -= w[i]; if (r <= 0) { st = open[i]; break; } }
  const c = makeCharacter({
    shirt: SHIRTS[Math.floor(Math.random() * SHIRTS.length)], pants: PANTS[Math.floor(Math.random() * PANTS.length)],
    hair: HAIRS[Math.floor(Math.random() * HAIRS.length)], hat: Math.random() < 0.2 ? 'straw' : null,
    skin: [0xf2c28e, 0xe0a877, 0xc68642, 0x8d5524][Math.floor(Math.random() * 4)],
  });
  scene.add(c.root);
  const side = Math.random() < 0.5 ? -1 : 1;
  const cu = {
    c, st, pos: V(side * 46, 0, ROAD_Z + rand(-0.8, 0.8)), state: 'in', path: [V(st.pos.x, 0, ROAD_Z + rand(-0.5, 0.5))],
    want: 1 + Math.floor(Math.random() * 3) + Math.floor(S.lv.base / 2), got: 0, buyT: 0, wait: 0, exitX: -side * 46,
    hands: new Pile(c.front, V(), stackLayout), bubble: new THREE.Sprite(new THREE.SpriteMaterial({ map: emojiTex(ITEMS[st.item].icon), depthWrite: false })), bubbleT: 0,
  };
  cu.bubble.scale.setScalar(0.9); cu.bubble.position.y = 2.6; cu.bubble.visible = false; c.root.add(cu.bubble);
  c.root.position.copy(cu.pos);
  st.queue.push(cu);
  customers.push(cu);
}
function setBubble(cu, emoji, t) { cu.bubble.material.map = emojiTex(emoji); cu.bubble.visible = true; cu.bubbleT = t; }
function leave(cu, happy) {
  const i = cu.st.queue.indexOf(cu);
  if (i >= 0) cu.st.queue.splice(i, 1);
  if (cu.got > 0) {
    const v = Math.round(cu.got * PRICE[cu.st.item] * priceMult());
    cu.st.cash.add(v, cu.pos.clone().setY(1.2));
    sfx.pay();
    if (!cashier) floatText(`+${v}`, cu.pos.clone().setY(2.4), 'info');
  }
  setBubble(cu, happy ? '😊' : '😠', 2);
  cu.state = 'out';
  cu.path = [V(cu.pos.x, 0, ROAD_Z + rand(-0.5, 0.5)), V(cu.exitX, 0, ROAD_Z)];
}
function updateCustomers(dt) {
  spawnTimer -= dt;
  const maxAlive = 4 + stands.length * 4;
  if (spawnTimer <= 0) {
    spawnTimer = 3.2 / (1 + 0.35 * S.lv.base) * rand(0.7, 1.3);
    if (customers.length < maxAlive) spawnCustomer();
  }
  for (let i = customers.length - 1; i >= 0; i--) {
    const cu = customers[i];
    let target = cu.path[0] || null, speed = 0;
    if (!target && cu.state === 'in') target = queueSpot(cu.st, cu.st.queue.indexOf(cu));
    if (target) {
      speed = moveAgent(cu, target, 3.4, dt, false) / Math.max(dt, 1e-4);
      if (dist2(cu.pos, target) < 0.1 && cu.path.length) cu.path.shift();
    }
    if (cu.state === 'in' && !cu.path.length && cu.st.queue[0] === cu && dist2(cu.pos, target) < 0.15) {
      turn(cu.c.root, Math.PI, dt);
      cu.buyT += dt;
      if (cu.buyT > 0.35 && cu.got < cu.want) {
        const r = cu.st.shelf.take(cu.st.item);
        if (r) { cu.hands.add(r.type, r.pos); cu.got++; cu.buyT = 0; cu.wait = 0; cu.c.carry = true; }
        else cu.wait += dt;
      }
      if (cu.got >= cu.want) leave(cu, true);
      else if (cu.wait > 1.2 && !cu.bubble.visible) setBubble(cu, ITEMS[cu.st.item].icon, 99);
      else if (cu.wait > 25) leave(cu, cu.got > 0);
    }
    if (cu.bubble.visible && cu.bubbleT < 90) { cu.bubbleT -= dt; if (cu.bubbleT <= 0) cu.bubble.visible = false; }
    if (cu.bubble.visible && cu.bubbleT >= 90 && cu.st.shelf.length) cu.bubble.visible = false;
    cu.c.root.position.copy(cu.pos);
    animateChar(cu.c, dt, speed);
    if (cu.state === 'out' && !cu.path.length) {
      scene.remove(cu.c.root);
      customers.splice(i, 1);
    }
  }
}

function spawnWorker(job, temp = 0) {
  const J = JOBS[job];
  const home = pads.find(p => p.def.id === job).pos;
  const c = makeCharacter(temp ? { ...J.look, shirt: 0xffd84a, hatColor: 0xff7eb6 } : J.look);
  scene.add(c.root);
  const w = { job, res: J.res, interval: J.interval, c, pos: V(home.x + rand(-1, 1), 0, home.z + rand(-1, 1)), state: 'gather', chopT: 0, dep: 0, dock: null, capFn: wcap, temp };
  w.pile = new Pile(c.back, V(), stackLayout);
  c.root.position.copy(w.pos);
  workers.push(w);
  pop(c.root);
  return w;
}
// where a worker drops a resource: the station that processes it (if its goods can be sold), else a stand
function dropZoneFor(res) {
  const st = stations.find(s => s.input === res);
  if (st && hasStand(st.output) && st.inP.length < st.inZone.cap) return st.inZone;
  return zones.find(z => z.kind === 'deposit' && z.accepts === res && !z.owner.input && z.pile.length < z.cap) || null;
}
function releaseDock(w) { if (w.dock) { w.dock.user = null; w.dock = null; } }
function updateWorker(w, dt) {
  let target = null, work = null;
  if (w.state === 'gather') {
    const src = nearestSource(w.res, w.pos, Infinity, w);
    if (w.pile.length >= wcap() || (w.pile.length && !src)) w.state = 'deliver';
    else if (src) {
      if (w.res === 'fish' && w.dock !== src) { releaseDock(w); src.user = w; w.dock = src; }
      if (dist2(w.pos, src.pos) < SOURCES[w.res].reach * 0.85) work = src; else target = src.pos;
    }
  }
  if (w.state === 'deliver') {
    releaseDock(w);
    const z = w.pile.length ? dropZoneFor(w.res) : null;
    if (!w.pile.length) w.state = 'gather';
    else if (z) {
      if (dist2(w.pos, z.pos) < z.r * 0.7) {
        w.dep += dt;
        while (w.dep > 0.08) { w.dep -= 0.08; if (z.pile.length >= z.cap) break; const r = w.pile.take(w.res); if (!r) break; z.pile.add(r.type, r.pos); }
      } else target = z.pos;
    }
  }
  const moved = target ? moveAgent(w, target, 4.2, dt) : 0;
  if (work) {
    const f = facePos(w.res, work);
    turn(w.c.root, Math.atan2(f.x - w.pos.x, f.z - w.pos.z), dt);
    w.chopT += dt / w.interval;
    if (w.chopT >= 1) { w.chopT = 0; SOURCES[w.res].hit(work, w); }
  } else w.chopT = 0;
  w.c.chop = work ? w.chopT : -1;
  w.c.root.position.copy(w.pos);
  animateChar(w.c, dt, moved / Math.max(dt, 1e-4));
}

function spawnCarrier(stationId) {
  const st = stations.find(s => s.id === stationId);
  const c = makeCharacter({ shirt: 0xecf0f1, pants: 0x2d3436, hat: 'beanie', hatColor: 0x8e44ad });
  scene.add(c.root);
  const k = { st, c, pos: st.outZone.pos.clone().add(V(0, 0, 1.6)), state: 'fetch', dep: 0, idle: 0, capFn: () => wcap() + 2 };
  k.pile = new Pile(c.back, V(), stackLayout);
  c.root.position.copy(k.pos);
  carriers.push(k);
  pop(c.root);
}
function updateCarrier(k, dt) {
  const stand = stands.find(s => s.item === k.st.output);
  let target = null;
  if (stand && k.state === 'fetch') {
    const room = stand.shelf.length + k.pile.length < stand.zone.cap;
    if (k.pile.length >= k.capFn() || (k.pile.length && (!room || k.idle > 1.2))) k.state = 'deliver';
    else if (room) {
      if (dist2(k.pos, k.st.outZone.pos) < 1.0) {
        if (!k.st.outP.length) k.idle += dt;
        k.dep += dt;
        while (k.dep > 0.08) { k.dep -= 0.08; if (k.pile.length >= k.capFn()) break; const r = k.st.outP.take(); if (!r) break; k.pile.add(r.type, r.pos); k.idle = 0; }
      } else target = k.st.outZone.pos;
    }
  }
  if (stand && k.state === 'deliver') {
    if (!k.pile.length) { k.state = 'fetch'; k.idle = 0; }
    else if (dist2(k.pos, stand.zone.pos) < stand.zone.r * 0.7) {
      k.dep += dt;
      while (k.dep > 0.08) { k.dep -= 0.08; if (stand.shelf.length >= stand.zone.cap) break; const r = k.pile.take(); if (!r) break; stand.shelf.add(r.type, r.pos); }
    } else target = stand.zone.pos;
  }
  const moved = target ? moveAgent(k, target, 4.6, dt) : 0;
  k.c.root.position.copy(k.pos);
  animateChar(k.c, dt, moved / Math.max(dt, 1e-4));
}

  input.set(x, 0, z);
  if (input.length() > 1) input.normalize();
}

function updatePlayer(dt) {
  const speed = BOOTS[S.lv.boots];
  const ox = player.pos.x, oz = player.pos.z;
  if (input.lengthSq() > 0.01) {
    player.pos.x += input.x * speed * dt; player.pos.z += input.z * speed * dt;
    resolve(player.pos);
    turn(player.c.root, Math.atan2(input.x, input.z), dt, 14);
  }
  const moved = Math.hypot(player.pos.x - ox, player.pos.z - oz);
  player.full = player.pile.length >= cap();

  // gathering: whatever source is closest and within reach (tree, pig, apple tree, dock)
  let target = null, tres = null;
  if (!player.full) {
    let bd = Infinity;
    for (const res in SOURCES) {
      const src = nearestSource(res, player.pos, SOURCES[res].reach, player);
      if (src && dist2(player.pos, src.pos) < bd) { bd = dist2(player.pos, src.pos); target = src; tres = res; }
    }
  }
  if (target) {
    const f = facePos(tres, target);
    turn(player.c.root, Math.atan2(f.x - player.pos.x, f.z - player.pos.z), dt, 14);
    player.chopT += dt / (AXE[S.lv.axe] * SOURCES[tres].mul);
    if (player.chopT >= 1) { player.chopT = 0; SOURCES[tres].hit(target, player); }
  } else player.chopT = Math.max(0, player.chopT - dt * 3);
  player.c.chop = target ? player.chopT : -1;

  // zones: drop off, pick up, collect cash, pay for things
  player.xferT += dt;
  let xfers = 0;
  while (player.xferT >= 0.06) { player.xferT -= 0.06; xfers++; }
  for (const z of zones) {
    const inside = dist2(player.pos, z.pos) < z.r;
    if (z.kind === 'buy') { z.pad.ring.scale.setScalar(inside && z.pad.g.visible ? 1.08 + Math.sin(S.time * 10) * 0.04 : 1); if (inside && z.pad.g.visible) payPad(z.pad, dt); continue; }
    if (!inside) continue;
    if (z.kind === 'order') loadOrder(xfers);
    else if (z.kind === 'deposit') {
      for (let k = 0; k < xfers && z.pile.length < z.cap; k++) {
        const r = player.pile.take(z.accepts);
        if (!r) break;
        z.pile.add(r.type, r.pos); sfx.drop();
      }
    } else if (z.kind === 'pickup') {
      for (let k = 0; k < xfers && player.pile.length < cap(); k++) {
        const r = z.pile.take();
        if (!r) break;
        player.pile.add(r.type, r.pos); sfx.pick();
      }
    } else if (z.kind === 'cash' && z.cash.amount > 0) {
      const v = z.cash.collect(() => player.pos.clone().setY(1.4));
      addMoney(v, player.pos.clone().setY(2.6));
    }
  }
  player.c.root.position.copy(player.pos);
  player.c.back.rotation.x = -Math.min(0.25, moved / Math.max(dt, 1e-4) * 0.03);   // stack leans while running
  animateChar(player.c, dt, moved / Math.max(dt, 1e-4));
}

// BOT (debug simulation + tutorial hint arrow)

function botTarget() {
  const p = player.pos;
  let best = null, bd = Infinity;
  const consider = (pos, bonus = 0) => { const d = dist2(p, pos) - bonus; if (d < bd) { bd = d; best = pos; } };
  // 1. something affordable to buy
  // save up for buildings / base: tools only when they are cheap next to the next building
  const big = pads.filter(pd => pd.g.visible && (!pd.upgrade || pd.def.id === 'base'));
  const nextBig = big.length ? Math.min(...big.map(padRemaining)) : Infinity;
  for (const pad of pads) {
    if (!pad.g.visible || S.money < padRemaining(pad)) continue;
    const tool = pad.upgrade && pad.def.id !== 'base';
    if (!tool || padRemaining(pad) <= nextBig * 0.5) consider(pad.pos, tool ? 0 : 5);
  }
  if (best) return best;
  const full = player.pile.length >= cap();
  // 1b. a truck is waiting: bring what it needs (from station outputs, or chop logs)
  if (order && order.state === 'waiting' && order.time > 12) {
    const need = Object.keys(order.needs).filter(t => orderLeft(t) > 0);
    if (need.some(t => player.pile.count(t))) return ORDER_POS;
    if (!full) {
      for (const t of need) {
        const st = stations.find(s => s.output === t && s.outP.length > 0);
        if (st) consider(st.outZone.pos);
      }
      if (best) return best;
      if (need.includes('log')) { const src = nearestSource('log', player.pos, Infinity, player); if (src) return src.pos; }
    }
  }
  // 2. deliver what we carry (logs prefer the sawmill)
  if (player.pile.length) {
    for (const z of zones) if (z.kind === 'deposit' && z.pile.length < z.cap && player.pile.count(z.accepts))
      consider(z.pos, z.owner.input ? (hasStand(z.owner.output) ? 8 : -30) : 0);
    if (order && order.state === 'waiting' && Object.keys(order.needs).some(t => orderLeft(t) > 0 && player.pile.count(t))) consider(ORDER_POS, 12);
    if (best && (full || !gatherTarget())) return best;
    best = null; bd = Infinity;
  }
  // 3. cash waiting at a stand
  if (!cashier) for (const st of stands) if (st.cash.amount >= 15) consider(st.cash.pos);
  if (best) return best;
  // 4. finished goods at a station
  const sellable = t => zones.some(z => z.kind === 'deposit' && z.accepts === t && z.pile.length < z.cap);
  if (!full) for (const st of stations) if (st.outP.length >= 4 && sellable(st.output)) consider(st.outZone.pos);
  if (best) return best;
  // 5. gather
  if (!full) { const g = gatherTarget(); if (g) return g.pos; }
  if (!cashier) for (const st of stands) if (st.cash.amount > 0) consider(st.cash.pos);
  return best;
}
function gatherTarget() {
  // feed the most valuable station that runs low (fewer trips needed when helpers already work it)
  for (const res of ['fish', 'apple', 'meat']) {
    const st = stations.find(s => s.input === res);
    if (!st || !hasStand(st.output)) continue;
    const helpers = workers.filter(w => w.res === res).length;
    if (st.inP.length + player.pile.count(res) < 14 - helpers * 5) { const src = nearestSource(res, player.pos, Infinity, player); if (src) return src; }
  }
  return nearestSource('log', player.pos, Infinity, player);
}
function botDrive() {
  const t = botTarget();
  if (!t) { input.set(0, 0, 0); return; }
  const dx = t.x - player.pos.x, dz = t.z - player.pos.z, d = Math.hypot(dx, dz);
  if (d < 0.5) { input.set(0, 0, 0); return; }
  let ux = dx / d, uz = dz / d;
  const p = player;
  if (p.detour > 0) { p.detour -= 1 / 30; [ux, uz] = [ux * 0.3 - uz * p.side, uz * 0.3 + ux * p.side]; }
  else if (p.lastBot && dist2(p.lastBot, p.pos) < 0.02) { p.stuck = (p.stuck || 0) + 1 / 30; if (p.stuck > 0.4) { p.stuck = 0; p.detour = 0.7; p.side = Math.random() < 0.5 ? -1 : 1; } }
  else p.stuck = 0;
  p.lastBot = (p.lastBot || V()).copy(p.pos);
  input.set(ux, 0, uz);
}
// tutorial arrow: points at what the bot would do next, until the first few things are built
const arrow = new THREE.Mesh(new THREE.ConeGeometry(0.4, 0.9, 4).rotateX(Math.PI), new THREE.MeshBasicMaterial({ color: 0xffd84a }));

let hintT = 0, hintPos = null;
function updateHint(dt) {
  const show = S.unlocked.size < 3 && S.lv.base === 0;
  hintT -= dt;
  if (hintT <= 0) { hintT = 0.4; hintPos = show ? botTarget() : null; }
  arrow.visible = !!hintPos && dist2(player.pos, hintPos) > 2;
  if (arrow.visible) { arrow.position.set(hintPos.x, 3.2 + Math.sin(S.time * 5) * 0.3, hintPos.z); arrow.rotation.y += dt * 3; }
}

  { const t = botTarget(); simEvents.push(`END pos=${player.pos.x.toFixed(1)},${player.pos.z.toFixed(1)} target=${t ? t.x.toFixed(1) + ',' + t.z.toFixed(1) : '-'} pile=${player.pile.length}`); }
  document.title = `t=${S.time.toFixed(0)} money=${Math.floor(S.money)} earned=${Math.floor(S.earned)} base=${S.lv.base} bag=${S.lv.bag} axe=${S.lv.axe} boots=${S.lv.boots} unlocked=${S.unlocked.size} customers=${customers.length}`;
}
