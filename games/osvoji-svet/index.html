<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Conquer the World</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Conquer the World">
<script src="../../shared/gameroom-i18n.js"></script>
<script src="../../shared/gameroom-config.js"></script>
<script src="../../shared/gameroom-sdk.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Unbounded:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #eef4ff;
    --dim: #b7c6de;
    --panel: rgba(13, 22, 38, 0.9);
    --line: rgba(255, 255, 255, 0.14);
    --blue: #3c7dff;
    --green: #3ddc97;
    --warn: #ffc14a;
    --danger: #ff6b7a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #163a6e; color: var(--ink);
    font-family: Manrope, sans-serif; user-select: none; -webkit-user-select: none; }
  button, input { font-family: inherit; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  #ui button, #ui input, #ui a, #ui label { pointer-events: auto; }
  .hidden { display: none !important; }
  .flag { width: 20px; height: 15px; border-radius: 2px; object-fit: cover; flex: 0 0 auto;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.35); background: rgba(255,255,255,0.12); }

  #loading {
    position: absolute; inset: 0; display: grid; place-items: center; z-index: 9;
    font-family: Unbounded, sans-serif; font-size: 16px; letter-spacing: 0.06em; color: var(--dim);
    background: radial-gradient(circle at 50% 45%, #1d4f8a, #0f2c55);
  }

  #hud {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 12px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 7px 10px 7px 12px; backdrop-filter: blur(10px); max-width: calc(100% - 24px);
  }
  #hud-me { display: flex; align-items: center; gap: 8px; min-width: 0; }
  #hud-name { font-family: Unbounded, sans-serif; font-size: 13px; letter-spacing: 0.03em; white-space: nowrap; }
  #hud-time { color: var(--dim); font-weight: 800; font-size: 13px; font-variant-numeric: tabular-nums; }
  #hud-actions { display: flex; gap: 6px; }
  #hud-actions button, #tools button, .text-btn {
    background: rgba(255,255,255,0.08); color: var(--ink); border: 1px solid var(--line);
    border-radius: 10px; padding: 6px 10px; font-weight: 800; cursor: pointer;
  }
  #hud-actions button:hover, #tools button:hover { background: rgba(255,255,255,0.16); }

  #board {
    position: absolute; top: 12px; left: 12px; width: 268px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 6px; backdrop-filter: blur(10px); max-height: min(50vh, 440px); overflow: auto;
  }
  #board h3 { display: grid; grid-template-columns: 22px 1fr 50px 50px; gap: 6px; margin: 4px 6px 4px;
    font-size: 10px; letter-spacing: 0.12em; color: var(--dim); font-weight: 800; }
  #board h3 span:nth-child(n+3) { text-align: right; }
  .lb {
    width: 100%; display: grid; grid-template-columns: 22px 1fr 50px 50px; gap: 6px; align-items: center;
    text-align: left; background: transparent; color: var(--ink); border: 0; border-top: 1px solid rgba(255,255,255,0.06);
    padding: 6px; cursor: pointer; font-size: 12px; font-weight: 700;
  }
  .lb:hover { background: rgba(255,255,255,0.06); }
  .lb.me { background: rgba(60, 125, 255, 0.2); }
  .lb .who { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .lb .who b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 800; }
  .lb .num { text-align: right; font-variant-numeric: tabular-nums; }
  .lb .rk { color: var(--dim); }

  #dock {
    position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%);
    width: min(560px, calc(100% - 24px));
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 10px; backdrop-filter: blur(12px); display: grid; gap: 8px;
  }
  .row1 { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; }
  .chip {
    border: 1px solid var(--line); border-radius: 9px; padding: 5px 8px; font-weight: 800; font-size: 13px;
    white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  .chip.good { color: var(--green); border-color: rgba(61, 220, 151, 0.4); }
  .chip.gold { color: var(--warn); border-color: rgba(255, 193, 74, 0.45); }
  #tbar {
    position: relative; height: 32px; border-radius: 9px; overflow: hidden;
    border: 2px solid #f2c94c; background: rgba(0,0,0,0.35);
  }
  #tfill { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #1f6fe0, #2f8cff); }
  #ttext { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; font-size: 15px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.6); font-variant-numeric: tabular-nums; }
  .row2 { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; }
  #pct { width: 100%; accent-color: #4aa3ff; }
  #tgt { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center;
    border-top: 1px solid var(--line); padding-top: 8px; }
  #tgt > div { min-width: 0; }
  #tgt .flag { width: 32px; height: 24px; }
  #tgt-name { font-weight: 800; font-size: 14px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #tgt-info { color: var(--dim); font-size: 12px; font-weight: 700; }
  #go {
    background: var(--green); color: #062016; border: 0; border-radius: 10px;
    padding: 10px 14px; font-family: Unbounded, sans-serif; font-size: 12px; cursor: pointer; white-space: nowrap;
  }
  #go:disabled { opacity: 0.4; cursor: default; }
  #hint { margin: 0; font-size: 12px; color: var(--dim); min-height: 16px; }
  #reinforce {
    background: linear-gradient(#ffe066, #f5b800); color: #1b1b2f; border: 0; border-radius: 10px; padding: 7px 12px;
    font-weight: 800; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
    animation: pop .3s ease;
  }
  #reinforce small { font-size: 10px; background: #1b1b2f; color: #ffe066; border-radius: 6px; padding: 1px 6px; }
  #flashFx { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .5s;
    background: radial-gradient(circle at 50% 50%, rgba(61,220,151,0) 40%, rgba(61,220,151,0.35)); }
  #flashFx.on { opacity: 1; transition: none; }
  #end .card, #start .card, #pause .card { animation: cardIn .3s cubic-bezier(.2, 1.4, .4, 1); }
  @keyframes cardIn { from { transform: scale(.9) translateY(14px); opacity: 0; } }
  #hint.warn { color: var(--warn); }

  #atks {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: 192px;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; width: min(560px, calc(100% - 24px));
  }
  .atk {
    display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 9px; padding: 4px 6px 4px 8px; font-size: 12px; font-weight: 800; color: #8fc2ff;
    font-variant-numeric: tabular-nums;
  }
  .atk.in { color: var(--danger); border-color: rgba(255, 107, 122, 0.4); }
  .atk button { background: transparent; border: 0; color: var(--danger); font-size: 13px; cursor: pointer; padding: 0 2px; }

  #tip {
    position: absolute; z-index: 3; display: flex; align-items: center; gap: 8px; pointer-events: none;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 9px;
    font-size: 12px; font-weight: 800; white-space: nowrap;
  }
  #tip span { color: var(--dim); }

  #toasts {
    position: absolute; right: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 6px;
    width: min(300px, calc(100% - 28px)); z-index: 4;
  }
  .toast {
    background: rgba(13, 22, 38, 0.94); border: 1px solid var(--line); border-left: 3px solid var(--blue);
    border-radius: 8px; padding: 8px 10px; font-size: 13px; font-weight: 700; animation: pop .25s ease;
  }
  .toast.good { border-left-color: var(--green); color: #9ff0c8; }
  .toast.bad { border-left-color: var(--danger); color: #ffb3bc; }
  @keyframes pop { from { transform: translateY(8px); opacity: 0; } }

  #tools { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 8px; }
  #tools button { width: 40px; height: 40px; font-size: 18px; background: var(--panel); }

  #gear {
    position: absolute; top: 12px; right: 12px; z-index: 6; pointer-events: auto;
    width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); font-size: 18px; cursor: pointer;
  }
  #settings { position: absolute; inset: 0; z-index: 8; background: rgba(0,0,0,0.45); display: grid; place-items: center; pointer-events: auto; }
  #settings-card, .card {
    width: min(380px, calc(100% - 28px)); background: #101a2e; border: 1px solid var(--line);
    border-radius: 18px; padding: 16px;
  }
  #settings-head { display: flex; justify-content: space-between; align-items: center; }
  h2 { font-family: Unbounded, sans-serif; font-size: 18px; margin: 0; }
  #settings-close {
    width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line);
    background: transparent; color: var(--ink); cursor: pointer;
  }
  .mute-row { display: flex; gap: 8px; align-items: center; margin: 16px 0; font-weight: 700; }
  #gameroom-back {
    display: block; text-align: center; text-decoration: none; color: #062016;
    background: var(--green); border-radius: 12px; padding: 10px; font-weight: 800;
  }

  #start, #pause, #end { position: absolute; z-index: 5; }
  #start {
    top: 16px; left: 16px; width: min(380px, calc(100% - 32px)); max-height: calc(100% - 32px);
    overflow: auto; pointer-events: auto;
  }
  #start .card h2 { font-size: 26px; }
  .eyebrow { letter-spacing: 0.16em; font-size: 11px; font-weight: 800; color: var(--green); margin: 0 0 6px; }
  #start p { color: var(--dim); font-size: 14px; line-height: 1.45; }
  #picked { display: flex; align-items: center; gap: 10px; color: var(--ink); font-weight: 800; margin: 12px 0; }
  #picked .flag { width: 32px; height: 24px; }
  #search {
    width: 100%; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,0.06);
    color: var(--ink); padding: 10px 12px; font-weight: 700;
  }
  #list { margin-top: 8px; max-height: 220px; overflow: auto; display: flex; flex-direction: column; gap: 2px; }
  #list button {
    display: flex; align-items: center; gap: 8px; text-align: left; background: transparent; color: var(--ink);
    border: 0; border-radius: 8px; padding: 6px 8px; cursor: pointer; font-weight: 700;
  }
  #list button.on, #list button:hover { background: rgba(60, 125, 255, 0.2); }
  .start-actions { display: flex; gap: 8px; margin-top: 12px; }
  #play, #again, #resume {
    flex: 1; background: var(--green); color: #062016; border: 0; border-radius: 12px;
    padding: 12px; font-family: Unbounded, sans-serif; font-size: 14px; cursor: pointer;
  }
  #play:disabled { opacity: 0.4; cursor: default; }
  #best { font-size: 12px; }

  #pause, #end { inset: 0; display: grid; place-items: center; background: rgba(4, 10, 20, 0.45); pointer-events: auto; }
  #pause .card, #end .card { text-align: center; }
  #end p, #pause p { color: var(--dim); }

  #board-toggle { display: none; }
  @media (pointer: coarse) {
    #zin, #zout { display: none; }
    #pct { height: 28px; }
  }
  @media (max-width: 720px), (max-height: 520px) {
    #board-toggle {
      display: flex; align-items: center; gap: 6px; width: 100%; background: transparent; border: 0;
      color: var(--ink); font-weight: 800; font-size: 12px; padding: 4px 6px; cursor: pointer;
    }
    #board-toggle i { font-style: normal; margin-left: auto; color: var(--dim); transition: transform .2s; }
    #board.open #board-toggle i { transform: rotate(180deg); }
    #board:not(.open) #board-rows { display: none; }
    #hud { top: 8px; left: 8px; right: 58px; transform: none; width: auto; gap: 8px; padding: 6px 8px; justify-content: space-between; }
    #hud-name { font-size: 11px; max-width: 30vw; overflow: hidden; text-overflow: ellipsis; }
    #board { top: 56px; left: 8px; width: min(220px, 60vw); max-height: 40vh; padding: 4px; }
    #board h3 { display: none; }
    .lb { grid-template-columns: 18px 1fr 42px; padding: 4px; font-size: 11px; }
    .lb .num.tr { display: none; }
    #dock { bottom: calc(8px + env(safe-area-inset-bottom)); padding: 8px; gap: 6px; width: calc(100% - 16px); }
    #tbar { height: 28px; }
    #ttext { font-size: 13px; }
    .chip { font-size: 12px; padding: 4px 6px; }
    #hint { display: none; }
    #tgt { padding-top: 6px; gap: 8px; }
    #tgt .flag { width: 26px; height: 20px; }
    #tgt-name { font-size: 13px; }
    #tgt-info { font-size: 11px; }
    #go { padding: 12px 14px; font-size: 12px; }
    #atks { bottom: calc(150px + env(safe-area-inset-bottom)); width: calc(100% - 16px); }
    .atk { font-size: 11px; padding: 3px 5px 3px 6px; }
    #toasts { right: 8px; left: auto; bottom: auto; top: 56px; width: min(56vw, 240px); }
    .toast { font-size: 12px; padding: 6px 8px; }
    #start { top: auto; bottom: calc(8px + env(safe-area-inset-bottom)); left: 8px; width: calc(100% - 16px); max-height: 48vh; }
    #start .card { padding: 12px; }
    #start .card h2 { font-size: 20px; }
    #start .eyebrow { display: none; }
    #start p { font-size: 12px; margin: 6px 0; }
    #picked { margin: 8px 0; }
    #list { max-height: 18vh; }
    .start-actions { position: sticky; bottom: 0; }
    #tools { top: auto; bottom: calc(196px + env(safe-area-inset-bottom)); right: 8px; transform: none; }
    #gear { top: 8px; right: 8px; }
    #tip { display: none; }
  }
  @media (max-height: 520px) {
    #hint { display: none; }
    #board { max-height: 40vh; }
    #atks { bottom: 166px; }
  }
  @media (max-height: 520px) {
    #dock { width: min(520px, calc(100% - 16px)); gap: 4px; }
    #tbar { height: 24px; }
    #pct { height: 20px; }
    #tgt { padding-top: 4px; }
    #go { padding: 8px 12px; }
    #atks { bottom: calc(132px + env(safe-area-inset-bottom)); }
    #tools { bottom: 140px; }
    #start { top: 8px; bottom: 8px; left: 8px; width: min(360px, 50vw); max-height: none; }
    #list { max-height: 30vh; }
  }
  #langRow { margin: 4px 0 12px; }
</style>
</head>
<body>
<canvas id="map"></canvas>
<div id="ui">
  <div id="loading" data-i18n="loading"></div>

  <div id="hud" class="hidden">
    <div id="hud-me"><img class="flag" id="hud-flag" alt=""><span id="hud-name" data-i18n="country"></span></div>
    <span id="hud-time">0:00</span>
    <div id="hud-actions">
      <button type="button" id="speed">1×</button>
      <button type="button" id="pauseBtn" data-i18n-attr="aria-label:pause">❚❚</button>
    </div>
  </div>

  <div id="board" class="hidden">
    <button type="button" id="board-toggle" data-i18n-attr="aria-label:board">🏆 <span id="board-me" data-i18n="rank"></span> <i>▾</i></button>
    <h3><span>#</span><span data-i18n="hNation"></span><span data-i18n="hLand"></span><span data-i18n="hArmy"></span></h3>
    <div id="board-rows"></div>
  </div>

  <div id="atks"></div>

  <div id="dock" class="hidden">
    <div class="row1">
      <span class="chip good" id="rate">+0/s</span>
      <div id="tbar"><i id="tfill"></i><b id="ttext">0 / 0</b></div>
      <span class="chip gold" id="landPct">0%</span>
    </div>
    <div class="row2">
      <span class="chip" id="sendLbl">⚔ 20%</span>
      <input id="pct" type="range" min="5" max="100" step="5" value="20" data-i18n-attr="aria-label:sendShare">
    </div>
    <div id="tgt">
      <img class="flag" id="tgt-flag" alt="">
      <div><b id="tgt-name" data-i18n="pickTarget"></b><span id="tgt-info" data-i18n="pickTargetHint"></span></div>
      <button type="button" id="go" disabled data-i18n="attack"></button>
    </div>
    <p id="hint"></p>
    <button type="button" id="reinforce" class="hidden"><span data-i18n="reinforce"></span><small data-i18n="adTag"></small></button>
  </div>
  <div id="flashFx"></div>

  <div id="tip" class="hidden"></div>
  <div id="toasts"></div>

  <div id="tools">
    <button type="button" id="zin" data-i18n-attr="aria-label:zoomIn">+</button>
    <button type="button" id="zout" data-i18n-attr="aria-label:zoomOut">−</button>
    <button type="button" id="fit" data-i18n-attr="aria-label:fit">⌖</button>
  </div>

  <button type="button" id="gear" data-i18n-attr="aria-label:settings">⚙</button>
  <div id="settings" class="hidden">
    <div id="settings-card">
      <div id="settings-head">
        <h2 data-i18n="settings"></h2>
        <button type="button" id="settings-close" data-i18n-attr="aria-label:close">✕</button>
      </div>
      <label class="mute-row"><input type="checkbox" id="mute"> <span data-i18n="mute"></span></label>
      <div id="langRow"></div>
      <!-- gameroom:back — link nazad na landing (ne brisati) -->
      <a href="../../" id="gameroom-back" data-i18n="back">⌂ Back to Gameroom</a>
    </div>
  </div>

  <div id="start" class="hidden">
    <div class="card">
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h2 data-i18n="title"></h2>
      <p data-i18n="intro"></p>
      <div id="picked"><img class="flag hidden" id="picked-flag" alt=""><span id="picked-name" data-i18n="pickHint"></span></div>
      <input id="search" type="search" autocomplete="off" data-i18n-attr="placeholder:search;aria-label:search">
      <div id="list"></div>
      <div class="start-actions">
        <button type="button" id="random" class="text-btn" data-i18n="random"></button>
        <button type="button" id="play" disabled data-i18n="play"></button>
      </div>
      <p id="best"></p>
    </div>
  </div>

  <div id="pause" class="hidden">
    <div class="card">
      <h2 data-i18n="pause"></h2>
      <p data-i18n="pauseText"></p>
      <button type="button" id="resume" data-i18n="resume"></button>
    </div>
  </div>

  <div id="end" class="hidden">
    <div class="card">
      <h2 id="end-title"></h2>
      <p id="end-text"></p>
      <button type="button" id="again" data-i18n="again"></button>
    </div>
  </div>
</div>
<script src="./countries.js"></script>
<script>
// ---------- jezik (shared/gameroom-i18n.js): engleski podrazumevano, srpski po izboru ----------
const i18n = window.GameroomI18n;
const tr = (k, v) => i18n.t(k, v);
i18n.add({
  en: {
    title: 'Conquer the World', loading: 'Drawing the world map…', country: 'Country', pause: 'Paused', board: 'Leaderboard', rank: 'Rank',
    hNation: 'NATION', hLand: 'LAND', hArmy: 'ARMY', sendShare: 'Share of army to send',
    pickTarget: 'Pick a target', pickTargetHint: 'click enemy territory on the map', attack: 'ATTACK', land: 'LAND',
    zoomIn: 'Zoom in', zoomOut: 'Zoom out', fit: 'Fit map', settings: 'Settings', close: 'Close', mute: 'Mute sound', back: '⌂ Back to Gameroom',
    eyebrow: 'STRATEGY',
    intro: 'Pick a country. Your army grows by itself. Attack your neighbors and the front moves bit by bit. Mountains and forests are harder to take, and you cross the sea by boat.',
    pickHint: 'Pick a country on the map or from the list.', search: 'Search countries', random: 'Random', play: 'PLAY',
    pauseText: 'Your army waits. P or Esc to resume.', resume: 'RESUME', again: 'PLAY AGAIN',
    t0: 'sea', t1: 'plains', t2: 'forest', t3: 'hills', t4: 'mountains', t5: 'desert',
    reinforce: '⚔ Reinforcements: +50% army', adTag: 'AD', reinforced: 'Reinforcements arrived!',
    best: 'Best: {p}% of the world', underAttack: '{name} is attacking you!', youConquered: 'You conquered {name}',
    theyConquered: '{by} conquered {name}', landingRepelled: 'Your landing was repelled at the shore', landing: 'Landing: {name}', shore: 'shore',
    winTitle: 'The world is yours', loseTitle: 'Your country has fallen',
    winText: 'You hold {p}% of the land after {time}. Army: {troops}.',
    loseText: 'At your peak you held {p}% of the world before they overran you.',
    pickCountry: 'Pick a country', noRoute: 'No border or sea route to {name}', routeLost: 'You no longer have a route to that country',
    coastYours: 'That coast is already yours', cantAttack: 'You cannot attack from here',
    frontHint: 'The front moves tile by tile. Mountains and forests are slower and cost more.',
    targetInfo: '{troops} troops · {mode} · {terrain}', bySea: 'by sea ~{s}s', byLand: 'by land',

// ---------- pomoćne ----------
function fmt(n) {
  n = Math.max(0, Math.round(n));
  if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (n >= 10000) return (n / 1000).toFixed(1) + 'K';
  if (n >= 1000) return (n / 1000).toFixed(2) + 'K';
  return String(n);
}
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }
function norm(s) { return s.normalize('NFD').replace(/\p{M}/gu, '').toLowerCase(); }
function esc(s) { return s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function minZoom() { return Math.min(viewW / W, viewH / H) * 0.92; }
function lonX(lon) { return (lon + 180) * W / 360; }
function latY(lat) { return (90 - lat) * H / 180; }
function flagUrl(code, w) { return code ? `https://flagcdn.com/w${w}/${code}.png` : ''; }
function flagTag(n) {
  return n && n.code ? `<img class="flag" src="${flagUrl(n.code, 40)}" alt="" loading="lazy">`
    : `<span class="flag" style="background:${n ? n.css : '#888'}"></span>`;
}
const flagImgs = new Map();
function flagImg(code) {
  if (!code) return null;
  let img = flagImgs.get(code);
  if (!img) {
    img = new Image();
    img.src = flagUrl(code, 80);
    flagImgs.set(code, img);
  }
  return img.complete && img.naturalWidth ? img : null;
}

function hash2(ix, iy, s) {
  let h = Math.imul(ix, 374761393) ^ Math.imul(iy, 668265263) ^ Math.imul(s, 2246822519);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y, s) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = hash2(ix, iy, s), b = hash2(ix + 1, iy, s), c = hash2(ix, iy + 1, s), d = hash2(ix + 1, iy + 1, s);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
function fbm(x, y, s, oct) {
  let v = 0, amp = 0.5, f = 1, t = 0;
  for (let i = 0; i < oct; i++) { v += amp * vnoise(x * f, y * f, s + i * 17); t += amp; amp *= 0.5; f *= 2.03; }
  return v / t;
}
function hsl(h, s, l) {
  s /= 100; l /= 100;
  const k = (n) => (n + h / 30) % 12;
  const a = s * Math.min(l, 1 - l);
  const f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return [Math.round(f(0) * 255), Math.round(f(8) * 255), Math.round(f(4) * 255)];
}
function pack(r, g, b, a) { return ((a << 24) | (b << 16) | (g << 8) | r) >>> 0; }

// ---------- rasterizacija ----------
function fillPoly(rings, fn) {
  const edges = [];
  let y0 = Infinity, y1 = -Infinity;
  for (const ring of rings) {
    for (let i = 0; i < ring.length; i++) {
      const a = ring[i], b = ring[(i + 1) % ring.length];
      if (a[1] === b[1]) continue;
      edges.push(a[0], a[1], b[0], b[1]);
      y0 = Math.min(y0, a[1], b[1]);
      y1 = Math.max(y1, a[1], b[1]);
    }
  }
  const xs = [];
  for (let y = Math.max(0, Math.floor(y0)); y <= Math.min(H - 1, Math.ceil(y1)); y++) {
    const yc = y + 0.5;
    xs.length = 0;
    for (let e = 0; e < edges.length; e += 4) {
      const ay = edges[e + 1], by = edges[e + 3];
      if ((ay <= yc && by > yc) || (by <= yc && ay > yc)) {
        const ax = edges[e], bx = edges[e + 2];
        xs.push(ax + (yc - ay) * (bx - ax) / (by - ay));
      }
    }
    xs.sort((a, b) => a - b);
    for (let k = 0; k + 1 < xs.length; k += 2) {
      const xa = Math.max(0, Math.ceil(xs[k] - 0.5)), xb = Math.min(W - 1, Math.floor(xs[k + 1] - 0.5));
      for (let x = xa; x <= xb; x++) fn(y * W + x);
    }
  }
}

function repairRings(rings) {
  const WW = W - 1;
  const out = [];
  for (const ring of rings) {
    if (ring.length < 3) continue;
    const jumps = [];
    for (let i = 0; i < ring.length - 1; i++) {
      if (Math.abs(ring[i + 1][0] - ring[i][0]) > WW * 0.5) jumps.push(i);
    }
    if (!jumps.length) { out.push(ring); continue; }
    const chains = [];
    let s = 0;
    for (const j of jumps) { chains.push(ring.slice(s, j + 1)); s = j + 1; }
    if (s < ring.length) chains.push(ring.slice(s));
    if (chains.length >= 2) {
      const first = chains[0], last = chains[chains.length - 1];
      if (Math.abs(first[0][0] - last[last.length - 1][0]) < WW * 0.5) { chains[0] = last.concat(first); chains.pop(); }
    }
    for (const ch of chains) {
      if (ch.length < 2) continue;
      const edge = (x) => (x > WW * 0.5 ? WW : 0);
      const a = ch[0], b = ch[ch.length - 1];
      out.push([[edge(a[0]), a[1]], ...ch, [edge(b[0]), b[1]]]);
    }
  }
  return out;
}

// udaljenost (×3) od najbližeg polja-izvora
function chamfer(seed) {
  const INF = 65000;
  const d = new Uint16Array(N);
  for (let t = 0; t < N; t++) d[t] = seed[t] ? 0 : INF;
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const t = y * W + x;
      let v = d[t];
      if (!v) continue;
      if (x > 0 && d[t - 1] + 3 < v) v = d[t - 1] + 3;
      if (y > 0) {
        if (d[t - W] + 3 < v) v = d[t - W] + 3;
        if (x > 0 && d[t - W - 1] + 4 < v) v = d[t - W - 1] + 4;
        if (x < W - 1 && d[t - W + 1] + 4 < v) v = d[t - W + 1] + 4;
      }
      d[t] = v;
    }
  }
  for (let y = H - 1; y >= 0; y--) {
    for (let x = W - 1; x >= 0; x--) {
      const t = y * W + x;
      let v = d[t];
      if (!v) continue;
      if (x < W - 1 && d[t + 1] + 3 < v) v = d[t + 1] + 3;
      if (y < H - 1) {
        if (d[t + W] + 3 < v) v = d[t + W] + 3;
        if (x < W - 1 && d[t + W + 1] + 4 < v) v = d[t + W + 1] + 4;
        if (x > 0 && d[t + W - 1] + 4 < v) v = d[t + W - 1] + 4;
      }
      d[t] = v;
    }
  }
  return d;
}

// ---------- izgradnja sveta ----------
function buildWorld(data) {
  W = data.w; H = data.h; N = W * H;
  const nameOf = (c) => (i18n.lang === 'en' && EN_NAMES[c.id]) || c.name;
  const list = data.countries.slice().sort((a, b) => nameOf(a).localeCompare(nameOf(b), i18n.lang));
  nations = [null];
  byCountry = new Map();
  list.forEach((c, k) => {
    const n = {
      i: k + 1, id: c.id, name: nameOf(c), code: ISO2[c.id] || '', home: c,
      rings: repairRings(c.rings), troops: 0, max: 1, tiles: 0, sx: 0, sy: 0,
      border: new Set(), coast: [], naval: [], ax: c.label[0], ay: c.label[1], lx: c.label[0], ly: c.label[1],
      nextAI: 0, css: '#888', edgeCss: '#444',
    };
    nations.push(n);
    byCountry.set(c.id, n);
  });
  for (const n of nations) {
    if (!n) continue;
    const ids = new Set(n.home.naval);
    for (const o of list) if (o.naval.includes(n.id)) ids.add(o.id);
    n.naval = [...ids].map((id) => byCountry.get(id)).filter(Boolean).map((o) => o.i);
  }

  // 1) države u mrežu, veće prvo da manje leže preko njih
  const raw = new Uint8Array(N);
  const bigFirst = nations.slice(1).sort((a, b) => b.home.area - a.home.area);
  for (const n of bigFirst) fillPoly(n.rings, (t) => { raw[t] = n.i; });

  // 2) razbij prave linije obale i granica šumom
  owner = new Uint8Array(N);
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const t = y * W + x;
      const v = raw[t];
      const l = raw[y * W + (x >= 4 ? x - 4 : x + W - 4)], r = raw[y * W + (x < W - 4 ? x + 4 : x - W + 4)];
      const u = raw[Math.max(0, y - 4) * W + x], d = raw[Math.min(H - 1, y + 4) * W + x];
      if (v === l && v === r && v === u && v === d) { owner[t] = v; continue; }
      const wx = (vnoise(x * 0.07, y * 0.07, 11) - 0.5) * 6 + (vnoise(x * 0.25, y * 0.25, 12) - 0.5) * 2.4;
      const wy = (vnoise(x * 0.07, y * 0.07, 13) - 0.5) * 6 + (vnoise(x * 0.25, y * 0.25, 14) - 0.5) * 2.4;
      let sx = x + Math.round(wx);
      if (sx < 0) sx += W; else if (sx >= W) sx -= W;
      const sy = clamp(y + Math.round(wy), 0, H - 1);
      owner[t] = raw[sy * W + sx];
    }
  }
  for (const lk of LAKES) {
    const ring = [];
    for (let i = 0; i < lk.length; i += 2) ring.push([lonX(lk[i]), latY(lk[i + 1])]);
    fillPoly([ring], (t) => { owner[t] = 0; });
  }
  const counts = new Uint32Array(256);
  for (let t = 0; t < N; t++) counts[owner[t]]++;
  for (const n of nations) {
    if (!n || counts[n.i]) continue;
    owner[Math.round(n.home.label[1]) * W + Math.round(n.home.label[0])] = n.i;
  }
  land = new Uint8Array(N);
  for (let t = 0; t < N; t++) land[t] = owner[t] ? 1 : 0;

  // 3) udaljenost od obale (kopno → more, more → kopno)
  const water = new Uint8Array(N);
  for (let t = 0; t < N; t++) water[t] = land[t] ? 0 : 1;
  const coastD = chamfer(water);
  const dL = chamfer(land);
  for (let t = 0; t < N; t++) if (!land[t]) coastD[t] = dL[t];

  // 4) planine
  const mtn = new Uint8Array(N);
  for (const r of RANGES) {
    const h = r[0], wpx = r[1] * W / 360;
    for (let i = 2; i + 3 < r.length; i += 2) {
      const ax = lonX(r[i]), ay = latY(r[i + 1]), bx = lonX(r[i + 2]), by = latY(r[i + 3]);
      const pad = wpx * 1.4;
      const x0 = Math.max(0, Math.floor(Math.min(ax, bx) - pad)), x1 = Math.min(W - 1, Math.ceil(Math.max(ax, bx) + pad));
      const y0 = Math.max(0, Math.floor(Math.min(ay, by) - pad)), y1 = Math.min(H - 1, Math.ceil(Math.max(ay, by) + pad));
      const dx = bx - ax, dy = by - ay, ll = dx * dx + dy * dy || 1;
      for (let y = y0; y <= y1; y++) {
        for (let x = x0; x <= x1; x++) {
          const t = y * W + x;
          if (!land[t]) continue;
          const k = clamp(((x - ax) * dx + (y - ay) * dy) / ll, 0, 1);
          const ex = ax + dx * k - x, ey = ay + dy * k - y;
          const wn = wpx * (0.7 + 0.6 * vnoise(x * 0.045, y * 0.045, 21));
          const f = 1 - Math.sqrt(ex * ex + ey * ey) / wn;
          if (f <= 0) continue;
          const v = Math.round(h * f * f * (3 - 2 * f) * 255);
          if (v > mtn[t]) mtn[t] = v;
        }
      }
    }
  }

  // 5) visina
  const elev = new Float32Array(N);
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const t = y * W + x;
      if (!land[t]) continue;
      const cd = coastD[t] / 3;
      let e = 0.05 + 0.13 * fbm(x / 150, y / 150, 31, 3) + 0.05 * vnoise(x / 28, y / 28, 35) + Math.min(1, cd / 90) * 0.05;
      const m = mtn[t] / 255;
      if (m > 0) {
        const rd = 1 - Math.abs(2 * fbm(x / 19, y / 19, 41, 3) - 1);
        e += m * (0.35 + 0.65 * rd * rd);
      }
      elev[t] = e;
    }
  }

  // 6) boje terena + tip terena za igru
  terr = new Uint8Array(N);
  tcan = document.createElement('canvas');
  tcan.width = W; tcan.height = H;
  const tctx = tcan.getContext('2d');
  const timg = tctx.createImageData(W, H);
  const td = timg.data;
  const greenl = byCountry.get(304);
  const greenI = greenl ? greenl.i : -1;
  const MOIST = [
    [0, 226, 205, 152], [0.14, 218, 192, 136], [0.28, 196, 182, 124], [0.4, 170, 176, 108],
    [0.55, 142, 170, 92], [0.7, 110, 152, 76], [0.85, 78, 132, 64], [1, 60, 116, 54],
  ];
  const col = [0, 0, 0];
  const mcol = (m) => {
    m = clamp(m, 0, 1);
    let i = 1;
    while (i < MOIST.length - 1 && MOIST[i][0] < m) i++;
    const a = MOIST[i - 1], b = MOIST[i];
    const k = (m - a[0]) / (b[0] - a[0] || 1);
    col[0] = lerp(a[1], b[1], k); col[1] = lerp(a[2], b[2], k); col[2] = lerp(a[3], b[3], k);
  };
  const mix = (r, g, b, k) => { col[0] += (r - col[0]) * k; col[1] += (g - col[1]) * k; col[2] += (b - col[2]) * k; };
  for (let y = 0; y < H; y++) {
    const lat = 90 - (y + 0.5) * 180 / H;
    const al = Math.abs(lat);
    let base;
    if (al < 8) base = 0.95;
    else if (al < 16) base = lerp(0.95, 0.45, (al - 8) / 8);
    else if (al < 30) base = lerp(0.45, 0.25, (al - 16) / 14);
    else if (al < 42) base = lerp(0.25, 0.62, (al - 30) / 12);
    else if (al < 62) base = 0.7;
    else base = 0.55;
    const snowline = 0.82 - Math.max(0, al - 28) * 0.0085;
    for (let x = 0; x < W; x++) {
      const t = y * W + x, p = t * 4;
      if (!land[t]) {
        const d = coastD[t] / 3;
        let r, g, b;
        if (d < 1.5) { r = 112; g = 182; b = 210; }
        else if (d < 5) { const k = (d - 1.5) / 3.5; r = lerp(112, 64, k); g = lerp(182, 140, k); b = lerp(210, 196, k); }
        else if (d < 22) { const k = (d - 5) / 17; r = lerp(64, 40, k); g = lerp(140, 104, k); b = lerp(196, 170, k); }
        else if (d < 80) { const k = (d - 22) / 58; r = lerp(40, 28, k); g = lerp(104, 76, k); b = lerp(170, 142, k); }
        else { r = 26; g = 70; b = 134; }
        const nz = (vnoise(x / 9, y / 9, 61) - 0.5) * 8;
        td[p] = r + nz; td[p + 1] = g + nz; td[p + 2] = b + nz; td[p + 3] = 255;
        continue;
      }
      const lon = (x + 0.5) * 360 / W - 180;
      const cd = coastD[t] / 3;
      let m = base;
      if (al > 12) m -= clamp((cd - 50) / 420, 0, 0.35);
      for (const z of DRY) {
        const dx = (lon - z[0]) / z[2], dy = (lat - z[1]) / z[3];
        const r2 = dx * dx + dy * dy;
        if (r2 >= 1) continue;
        const f = 1 - r2;
        m -= z[4] * f * f * (3 - 2 * f);
      }
      m += (fbm(x / 70, y / 70, 51, 2) - 0.5) * 0.28;
      const e = elev[t];
      mcol(m);
      if (al > 48 && m > 0.38) mix(84, 118, 82, clamp((al - 48) / 12, 0, 1) * 0.8);
      if (al > 62) mix(160, 160, 132, clamp((al - 62) / 8, 0, 1));
      if (al > 71) mix(214, 220, 214, clamp((al - 71) / 6, 0, 1));
      if (owner[t] === greenI && cd > 5) mix(238, 243, 247, clamp((cd - 5) / 8, 0, 1));
      if (e > 0.36) mix(164, 146, 112, clamp((e - 0.36) / 0.22, 0, 1) * 0.65);
      if (e > 0.58) mix(142, 132, 122, clamp((e - 0.58) / 0.16, 0, 1) * 0.8);
      if (e > snowline) mix(246, 247, 250, clamp((e - snowline) / 0.1, 0, 1));
      const ul = (y > 0 && x > 0) ? elev[t - W - 1] : e;
      const dr = (y < H - 1 && x < W - 1) ? elev[t + W + 1] : e;
      const sh = clamp(1 + (ul - dr) * 7, 0.7, 1.32);
      const gr = 0.965 + vnoise(x / 4, y / 4, 71) * 0.07;
      td[p] = col[0] * sh * gr;
      td[p + 1] = col[1] * sh * gr;
      td[p + 2] = col[2] * sh * gr;
      td[p + 3] = 255;
      terr[t] = e > 0.6 ? 4 : e > 0.38 ? 3 : m > 0.72 ? 2 : m < 0.2 ? 5 : 1;
    }
  }
  tctx.putImageData(timg, 0, 0);

  // 7) reke
  tctx.lineJoin = 'round';
  tctx.lineCap = 'round';
  for (const rv of RIVERS) {
    const pts = [];
    for (let i = 0; i + 3 < rv.length; i += 2) {
      const ax = lonX(rv[i]), ay = latY(rv[i + 1]), bx = lonX(rv[i + 2]), by = latY(rv[i + 3]);
      const len = Math.hypot(bx - ax, by - ay) || 1;
      const steps = Math.max(1, Math.round(len / 2.5));
      const nx = -(by - ay) / len, ny = (bx - ax) / len;
      for (let s = 0; s < steps; s++) {
        const k = s / steps;
        const px = ax + (bx - ax) * k, py = ay + (by - ay) * k;
        const off = (fbm(px / 14, py / 14, 81, 2) - 0.5) * 7;
        pts.push(px + nx * off, py + ny * off);
      }
    }
    pts.push(lonX(rv[rv.length - 2]), latY(rv[rv.length - 1]));
    for (let pass = 0; pass < 2; pass++) {
      tctx.beginPath();
      tctx.moveTo(pts[0], pts[1]);
      for (let i = 2; i < pts.length; i += 2) tctx.lineTo(pts[i], pts[i + 1]);
      tctx.strokeStyle = pass ? 'rgba(84, 150, 206, 0.95)' : 'rgba(40, 80, 120, 0.25)';
      tctx.lineWidth = pass ? 1.1 : 2.2;
      tctx.stroke();
    }
  }

  // 8) obale, plovidba
  coastal = new Uint8Array(N);
  const cl = [];
  for (let t = 0; t < N; t++) {
    if (!land[t]) continue;
    const x = t % W;
    const l = x ? t - 1 : t + W - 1, r = x < W - 1 ? t + 1 : t - W + 1;
    if (!land[l] || !land[r] || (t >= W && !land[t - W]) || (t < N - W && !land[t + W])) { coastal[t] = 1; cl.push(t); }
  }
  coastList = Int32Array.from(cl);
  for (const t of coastList) nations[owner[t]].coast.push(t);
  for (const n of nations) {
    if (!n || n.coast.length <= 80) continue;
    const stepK = n.coast.length / 80;
    n.coast = Array.from({ length: 80 }, (_, k) => n.coast[Math.floor(k * stepK)]);
  }
  CWc = Math.ceil(W / CF); CHc = Math.ceil(H / CF);
  cwater = new Uint8Array(CWc * CHc);
  for (let t = 0; t < N; t++) {
    if (land[t]) continue;
    const x = t % W, y = (t / W) | 0;
    cwater[((y / CF) | 0) * CWc + ((x / CF) | 0)] = 1;
  }
  bfsPrev = new Int32Array(CWc * CHc);
  bfsSeen = new Uint32Array(CWc * CHc);
  bfsDist = new Uint16Array(CWc * CHc);
  bfsQ = new Int32Array(CWc * CHc);

  // 9) sloj teritorija
  ownerStart = owner.slice();
  regOwner = new Uint8Array(N);
  ocan = document.createElement('canvas');
  ocan.width = W; ocan.height = H;
  octx = ocan.getContext('2d');
  ovImg = octx.createImageData(W, H);
  ov32 = new Uint32Array(ovImg.data.buffer);
  CWN = Math.ceil(W / CH); CHN = Math.ceil(H / CH);
  chunkDirty = new Uint8Array(CWN * CHN);
  landTotal = 0;
  for (let t = 0; t < N; t++) if (land[t]) landTotal++;
  resetWorld();
}

function resetWorld() {
  owner.set(ownerStart);
  for (const n of nations) {
    if (!n) continue;
    n.tiles = 0; n.sx = 0; n.sy = 0; n.border.clear(); n.nextAI = 2 + Math.random() * 5;
    n.lx = n.ax = n.home.label[0]; n.ly = n.ay = n.home.label[1];
  }
  regOwner.fill(0);
  for (let t = 0; t < N; t++) {
    const o = owner[t];
    if (!o) continue;
    const n = nations[o];
    n.tiles++; n.sx += t % W; n.sy += (t / W) | 0;
  }
  for (const n of nations) {
    if (!n) continue;
    n.max = maxTroops(n);
    n.troops = n.max * (0.35 + ((n.id * 13) % 9) / 100);
  }
  attacks = []; boats = [];
  worldT = 0; over = null; target = null;
  atkAcc = aiAcc = endAcc = botAcc = 0;
  peakPct = 0; playerAttacks = 0;
  recolor();
  for (let t = 0; t < N; t++) {
    const o = owner[t];
    if (!o) { ov32[t] = 0; continue; }
    const b = edgeOf(t);
    if (b) { regOwner[t] = o; nations[o].border.add(t); }
    ov32[t] = b ? edgeCol[o] : fillCol[o];
  }
  allDirty = true;
  ovVersion++;
}

function maxTroops(n) { return 2500 + 55 * Math.pow(Math.max(1, n.tiles), 0.78); }
function growth(n) { return n.max * 0.026 * (1 - Math.min(1, n.troops / n.max)) + 0.6; }

function recolor() {
  for (const n of nations) {
    if (!n) continue;
    let rgb, edge, fa = 78;
    if (n.i === player) {
      rgb = [60, 125, 255]; edge = [26, 76, 222]; fa = 130;
    } else {
      let h = (n.i * 137.508) % 360;
      const d = Math.min(Math.abs(h - 220), 360 - Math.abs(h - 220));
      if (d < 24) h = (h + 48) % 360;
      rgb = hsl(h, 52 + (n.i % 3) * 8, 56 + (n.i % 4) * 3);
      edge = hsl(h, 55, 34);
    }
    n.css = `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
    n.edgeCss = `rgb(${edge[0]},${edge[1]},${edge[2]})`;
    if (n.i === hl) {
      fillCol[n.i] = pack(Math.min(255, rgb[0] + 30), Math.min(255, rgb[1] + 30), Math.min(255, rgb[2] + 30), 150);
      edgeCol[n.i] = pack(255, 214, 92, 255);
    } else {
      fillCol[n.i] = pack(rgb[0], rgb[1], rgb[2], fa);
      edgeCol[n.i] = pack(edge[0], edge[1], edge[2], 235);
    }
  }
}

function repaintAll() {
  recolor();
  for (let t = 0; t < N; t++) {
    const o = owner[t];
    ov32[t] = !o ? 0 : regOwner[t] ? edgeCol[o] : fillCol[o];
  }
  allDirty = true;
  ovVersion++;
}

function setHighlight(i) {
  if (i === hl) return;
  const old = hl;
  hl = i;
  recolor();
  for (let t = 0; t < N; t++) {
    const o = owner[t];
    if (o && (o === old || o === i)) ov32[t] = regOwner[t] ? edgeCol[o] : fillCol[o];
  }
  allDirty = true;
  ovVersion++;
}

// ---------- mreža ----------
function edgeOf(u) {
  const o = owner[u];
  if (!o) return false;
  const x = u % W;
  const l = x ? u - 1 : u + W - 1;
  if (land[l] && owner[l] !== o) return true;
  const r = x < W - 1 ? u + 1 : u - W + 1;
  if (land[r] && owner[r] !== o) return true;
  if (u >= W && land[u - W] && owner[u - W] !== o) return true;
  if (u < N - W && land[u + W] && owner[u + W] !== o) return true;
  return false;
}
// 4 suseda (x se obmotava), -1 ako ne postoji; deljeni niz — ne pozivati ugnježdeno
const NB = new Int32Array(4);
function nbrs(u) {
  const x = u % W;
  NB[0] = x ? u - 1 : u + W - 1;
  NB[1] = x < W - 1 ? u + 1 : u - W + 1;
  NB[2] = u >= W ? u - W : -1;
  NB[3] = u < N - W ? u + W : -1;
  return NB;
}
function refresh(u) {
  const o = owner[u];
  const b = edgeOf(u);
  const reg = regOwner[u];
  if (reg && (reg !== o || !b)) { nations[reg].border.delete(u); regOwner[u] = 0; }
  if (b && o && !regOwner[u]) { nations[o].border.add(u); regOwner[u] = o; }
  ov32[u] = !o ? 0 : b ? edgeCol[o] : fillCol[o];
  ovVersion++;
  const x = u % W, y = (u / W) | 0;
  chunkDirty[((y / CH) | 0) * CWN + ((x / CH) | 0)] = 1;
}
function conquer(u, a) {
  const d = owner[u];
  const x = u % W, y = (u / W) | 0;
  if (d) { const nd = nations[d]; nd.tiles--; nd.sx -= x; nd.sy -= y; }
  owner[u] = a;
  const na = nations[a];
  na.tiles++; na.sx += x; na.sy += y;
  const nb = nbrs(u);
  const n0 = nb[0], n1 = nb[1], n2 = nb[2], n3 = nb[3];
  refresh(u);
  if (land[n0]) refresh(n0);
  if (land[n1]) refresh(n1);
  if (n2 >= 0 && land[n2]) refresh(n2);
  if (n3 >= 0 && land[n3]) refresh(n3);
  if (d && !nations[d].tiles) onEliminated(d, a);
}
function adjCount(u, a) {
  const nb = nbrs(u);
  let c = 0;
  for (let k = 0; k < 4; k++) if (nb[k] >= 0 && owner[nb[k]] === a && land[nb[k]]) c++;
  return c;
}
function tileAt(mx, my) {
  const x = Math.floor(mx), y = Math.floor(my);
  if (x < 0 || y < 0 || x >= W || y >= H) return -1;
  return y * W + x;
}

// ---------- napadi ----------
function shareBorder(a, d) {
  for (const u of nations[a].border) {
    const nb = nbrs(u);
    for (let k = 0; k < 4; k++) {
      const v = nb[k];
      if (v >= 0 && land[v] && owner[v] === d) return true;
    }
  }
  return false;
}
function seedAround(A, u) {
  const nb = nbrs(u);
  for (let k = 0; k < 4; k++) {
    const v = nb[k];
    if (v >= 0 && land[v] && owner[v] === A.d && !A.inFr.has(v)) { A.inFr.add(v); A.fr.push(v); }
  }
}
function seed(A) {
  for (const u of nations[A.a].border) seedAround(A, u);
}
// napad troši vojsku polje po polje dok ne ostane bez nje ili bez fronta
function startAttack(a, d, troops, around) {
  if (a === d || troops < 1) return false;
  const opp = attacks.find((x) => !x.dead && x.a === d && x.d === a);
  if (opp) {
    const c = Math.min(opp.troops, troops);
    opp.troops -= c;
    troops -= c;
    if (opp.troops < 1) opp.dead = true;
    if (troops < 1) return true;
  }
  let A = attacks.find((x) => !x.dead && x.a === a && x.d === d);
  if (A) {
    A.troops += troops;
    if (around !== undefined) seedAround(A, around);
    return true;
  }
  A = { a, d, troops, fr: [], inFr: new Set(), budget: 0, dead: false, reseed: 2 };
  if (around !== undefined) seedAround(A, around);
  else seed(A);
  if (!A.fr.length) {
    nations[a].troops += troops;
    return false;
  }
  attacks.push(A);
  if (d === player && !SIM) toast(tr('underAttack', { name: nations[a].name }), 'bad');
  return true;
}
function endAttack(A, refund) {
  if (A.dead) return;
  A.dead = true;
  if (refund && nations[A.a].tiles) nations[A.a].troops += A.troops * refund;
}
const CAND = [];
function attackTick(A, dt) {
  const att = nations[A.a];
  if (!att.tiles) { A.dead = true; return; }
  const def = A.d ? nations[A.d] : null;
  if (def && !def.tiles) { endAttack(A, 1); return; }
  A.budget += (2.5 + Math.sqrt(A.fr.length) * 1.5 + A.fr.length * 0.04) * dt;
  let k = Math.floor(A.budget);
  if (!k) return;
  A.budget -= k;
  A.reseed -= dt;
  if (!A.fr.length || A.reseed <= 0) {
    A.reseed = 2;
    seed(A);
    if (!A.fr.length) { endAttack(A, 1); return; }
  }
  // uzmi nasumičan uzorak fronta i prvo osvajaj polja koja su najviše okružena (glatka linija)
  CAND.length = 0;
  const want = Math.min(A.fr.length, k * 3 + 6);
  const seen = new Set();
  let tries = 0;
  while (CAND.length < want && A.fr.length && tries < want * 4) {
    tries++;
    const i = (Math.random() * A.fr.length) | 0;
    const u = A.fr[i];
    const c = owner[u] === A.d ? adjCount(u, A.a) : 0;
    if (!c) {
      A.fr[i] = A.fr[A.fr.length - 1];
      A.fr.pop();
      A.inFr.delete(u);
      continue;
    }
    if (seen.has(u)) continue;
    seen.add(u);
    CAND.push([u, c + Math.random() * 1.6 - TMULT[terr[u]] * 0.45]);
  }
  CAND.sort((p, q) => q[1] - p[1]);
  for (let j = 0; j < CAND.length && k > 0; j++, k--) {
    const u = CAND[j][0];
    const tm = TMULT[terr[u]];
    if (Math.random() > 1 / tm) continue;
    const dens = def ? def.troops / Math.max(1, def.tiles) : 0;
    const cost = tileCost(u, def);
    if (A.troops < cost) { endAttack(A, 1); return; }
    A.troops -= cost;
    if (def) def.troops = Math.max(0, def.troops - dens * 0.5);
    conquer(u, A.a);
    seedAround(A, u);
    if (A.dead) return;
  }
}

// branilac je jači što je gušće posednut i na svojoj matičnoj zemlji
function tileCost(u, def) {
  const tm = TMULT[terr[u]];
  if (!def) return tm * 1.5;
  const core = ownerStart[u] === def.i ? 1.4 : 1;
  return tm * core * (2 + 1.2 * def.troops / Math.max(1, def.tiles) + Math.sqrt(def.troops) / 6);
}

function onEliminated(d, by) {
  for (const A of attacks) if (A.a === d) A.dead = true;
  for (const B of boats) if (B.a === d) B.dead = true;
  if (SIM || d === player) return;
  if (by === player) {
    toast(tr('youConquered', { name: nations[d].name }), 'good');
    chord([587, 740, 880, 1175], 0.07, 0.045);
    if (!SIM) { const n = nations[d]; ripple(n.ax, n.ay, '#3ddc97'); flashScreen(); }
    sdk.track('nation_conquered', { name: nations[d].code || nations[d].name });
  }
  else if (nations[d].home.area > 60) toast(tr('theyConquered', { by: nations[by].name, name: nations[d].name }));
}

// ---------- brodovi ----------
function cellOfTile(t) {
  const x = t % W, y = (t / W) | 0;
  const c = ((y / CF) | 0) * CWc + ((x / CF) | 0);
  if (cwater[c]) return c;
  const nb = nbrs(t);
  for (let k = 0; k < 4; k++) {
    const v = nb[k];
    if (v < 0 || land[v]) continue;
    return (((v / W) | 0) / CF | 0) * CWc + (((v % W) / CF) | 0);
  }
  return -1;
}
function waterPath(s, g, maxSteps) {
  if (s < 0 || g < 0) return null;
  bfsStamp++;
  let head = 0, tail = 0;
  bfsQ[tail++] = s; bfsSeen[s] = bfsStamp; bfsPrev[s] = -1; bfsDist[s] = 0;
  let found = s === g;
  const last = CWc * (CHc - 1);
  while (head < tail && !found) {
    const c = bfsQ[head++];
    const dd = bfsDist[c];
    if (dd >= maxSteps) continue;
    const cx = c % CWc;
    for (let k = 0; k < 4 && !found; k++) {
      const v = k === 0 ? (cx ? c - 1 : c + CWc - 1)
        : k === 1 ? (cx < CWc - 1 ? c + 1 : c - CWc + 1)
        : k === 2 ? (c >= CWc ? c - CWc : -1)
        : (c < last ? c + CWc : -1);
      if (v < 0 || !cwater[v] || bfsSeen[v] === bfsStamp) continue;
      bfsSeen[v] = bfsStamp; bfsPrev[v] = c; bfsDist[v] = dd + 1;
      if (v === g) found = true;
      else bfsQ[tail++] = v;
    }
  }
  if (!found) return null;
  const cells = [];
  for (let c = g; c !== -1; c = bfsPrev[c]) cells.push(c);
  cells.reverse();
  const pts = [];
  for (let i = 0; i < cells.length; i += 3) {
    const c = cells[i];
    pts.push((c % CWc) * CF + CF / 2, ((c / CWc) | 0) * CF + CF / 2);
  }
  const c = cells[cells.length - 1];
  pts.push((c % CWc) * CF + CF / 2, ((c / CWc) | 0) * CF + CF / 2);
  return pts;
}
function wrapDist2(a, b) {
  let dx = Math.abs(a % W - b % W);
  if (dx > W / 2) dx = W - dx;
  const dy = ((a / W) | 0) - ((b / W) | 0);
  return dx * dx + dy * dy;
}
function planBoat(a, landing) {
  const best = [];
  for (let i = 0; i < coastList.length; i++) {
    const t = coastList[i];
    if (owner[t] !== a) continue;
    const d2 = wrapDist2(t, landing);
    if (best.length < 4 || d2 < best[best.length - 1][1]) {
      best.push([t, d2]);
      best.sort((p, q) => p[1] - q[1]);
      if (best.length > 4) best.pop();
    }
  }
  const g = cellOfTile(landing);
  for (const [src] of best) {
    const path = waterPath(cellOfTile(src), g, 700);
    if (path) {
      path.unshift(src % W + 0.5, ((src / W) | 0) + 0.5);
      path.push(landing % W + 0.5, ((landing / W) | 0) + 0.5);
      return path;
    }
  }
  return null;
}
function pathLen(path) {
  let len = 0;
  for (let k = 2; k + 1 < path.length; k += 2) {
    let dx = Math.abs(path[k] - path[k - 2]);
    if (dx > W / 2) dx = W - dx;
    len += Math.hypot(dx, path[k + 1] - path[k - 1]);
  }
  return len;
}
const BOAT_SPEED = 34;
function launchBoat(a, landing, troops) {
  const n = nations[a];
  if (troops < 5 || troops > n.troops + 0.5) return false;
  const path = planBoat(a, landing);
  if (!path) return false;
  n.troops -= troops;
  boats.push({ a, troops, path, seg: 0, k: 0, x: path[0], y: path[1], landing, dead: false });
  return true;
}
function moveBoat(B, dt) {
  let step = BOAT_SPEED * dt;
  while (step > 0 && B.seg + 3 < B.path.length) {
    const ax = B.path[B.seg], ay = B.path[B.seg + 1], by = B.path[B.seg + 3];
    let dx = B.path[B.seg + 2] - ax;
    if (Math.abs(dx) > W / 2) dx -= Math.sign(dx) * W;
    const len = Math.hypot(dx, by - ay) || 0.001;
    const left = len * (1 - B.k);
    if (step >= left) { step -= left; B.seg += 2; B.k = 0; }
    else { B.k += step / len; step = 0; }
  }
  if (B.seg + 3 >= B.path.length) {
    B.x = B.path[B.path.length - 2]; B.y = B.path[B.path.length - 1];
    arrive(B);
    return;
  }
  const sx = B.path[B.seg], sy = B.path[B.seg + 1];
  let ex = B.path[B.seg + 2] - sx;
  if (Math.abs(ex) > W / 2) ex -= Math.sign(ex) * W;

}
function arrive(B) {

  const att = nations[B.a];
