  const u = B.landing;
  const d = owner[u];
  if (d === B.a) { att.troops += B.troops; return; }
  const def = d ? nations[d] : null;
  const dens = def ? def.troops / Math.max(1, def.tiles) : 0;
  const cost = tileCost(u, def) * 3;
  if (B.troops < cost) {
    if (B.a === player && !SIM) toast(tr('landingRepelled'), 'bad');
    return;
  }
  B.troops -= cost;
  if (def) def.troops = Math.max(0, def.troops - dens);
  conquer(u, B.a);
  if (B.a === player && !SIM) toast(tr('landing', { name: def ? def.name : tr('shore') }), 'good');
  startAttack(B.a, d, B.troops, u);
}

// ---------- AI ----------
function neighborsOf(n, cap) {
  const counts = new Map();
  let it = 0;
  for (const u of n.border) {
    if (++it > cap) break;
    const nb = nbrs(u);
    for (let k = 0; k < 4; k++) {
      const v = nb[k];
      if (v < 0 || !land[v]) continue;
      const o = owner[v];
      if (o !== n.i) counts.set(o, (counts.get(o) || 0) + 1);
    }
  }
  return counts;
}
function busy(i) {
  let c = 0;
  for (const A of attacks) if (!A.dead && A.a === i) c++;
  for (const B of boats) if (!B.dead && B.a === i) c++;
  return c;
}
function aiDecide(n, aggressive) {
  if (!n.tiles) return;
  if (n.troops < n.max * (aggressive ? 0.5 : 0.6)) return;
  if (busy(n.i) >= (aggressive ? 3 : 1)) return;
  const counts = neighborsOf(n, 2500);
  let best = null;
  for (const [o, len] of counts) {
    if (o === player && !aggressive && worldT < 60) continue;
    const T = o ? nations[o].troops : 0;
    const ratio = n.troops / (T + 1);
    if (o && ratio < (aggressive ? 1 : o === player ? 1.8 : 1.15)) continue;
    const s = (o === player ? 0.6 : 1) * ratio * (0.5 + Math.min(1, len / 40) * 0.5) * (o ? 1 : 3) * (0.75 + Math.random() * 0.5);
    if (!best || s > best.s) best = { o, s };
  }
  if (best) {
    const send = n.troops * (aggressive ? 0.35 : 0.15 + Math.random() * 0.15);
    n.troops -= send;
    if (startAttack(n.i, best.o, send) && n.i === player) playerAttacks++;
    return;
  }
  if ((counts.size === 0 || Math.random() < 0.1) && n.troops > n.max * 0.55 && n.naval.length) {
    const tn = nations[n.naval[(Math.random() * n.naval.length) | 0]];
    const opts = tn.coast.filter((u) => owner[u] !== n.i && (!owner[u] || nations[owner[u]].troops < n.troops * 1.4));
    if (!opts.length) return;
    if (launchBoat(n.i, opts[(Math.random() * opts.length) | 0], n.troops * 0.3) && n.i === player) playerAttacks++;
  }
}

// ---------- tok igre ----------
function update(dt) {
  if (!playing || paused || over) return;
  let left = Math.min(0.05, dt) * speed;
  while (left > 1e-6 && !over) {
    const h = Math.min(0.05, left);
    left -= h;
    step(h);
  }
}
function step(dt) {
  worldT += dt;
  for (let i = 1; i < nations.length; i++) {
    const n = nations[i];
    if (!n.tiles) continue;
    n.max = maxTroops(n);
    if (n.troops < n.max) n.troops = Math.min(n.max, n.troops + growth(n) * dt);
    else n.troops -= (n.troops - n.max) * 0.2 * dt;
  }
  atkAcc += dt;
  while (atkAcc >= 0.1) {
    atkAcc -= 0.1;
    for (let i = 0; i < attacks.length; i++) if (!attacks[i].dead) attackTick(attacks[i], 0.1);
    attacks = attacks.filter((A) => !A.dead);
  }
  for (const B of boats) if (!B.dead) moveBoat(B, dt);
  boats = boats.filter((B) => !B.dead);
  aiAcc += dt;
  if (aiAcc >= 0.25) {
    aiAcc = 0;
    for (let i = 1; i < nations.length; i++) {
      const n = nations[i];
      if (i === player || !n.tiles || n.nextAI > worldT) continue;
      n.nextAI = worldT + 6 + Math.random() * 7;
      aiDecide(n, false);
    }
  }
  if (BOT && player) {
    botAcc += dt;
    if (botAcc >= 2.5) { botAcc = 0; aiDecide(nations[player], true); }
  }
  endAcc += dt;
  if (endAcc >= 0.5) { endAcc = 0; checkEnd(); }
}

function snapshot() {
  const me = nations[player];
  const pct = me ? (me.tiles / landTotal) * 100 : 0;
  let fac = 0;
  for (let i = 1; i < nations.length; i++) if (nations[i].tiles) fac++;
  return { pct, tiles: me ? me.tiles : 0, troops: me ? me.troops : 0, fac, over: over || 'running', worldT, peakPct, playerAttacks };
}
function checkEnd() {
  const info = snapshot();
  if (info.pct > peakPct) peakPct = info.pct;
  if (info.pct > bestPct) {
    bestPct = info.pct;
    try { localStorage.setItem('osvoji-svet:best', bestPct.toFixed(2)); } catch (e) {}
  }
  if (!playing || over) return info;
  if (info.tiles === 0) finish('lose', info);
  else if (info.pct >= 80) finish('win', info);
  return info;
}
function finish(kind, info) {
  over = kind;
  paused = false;
  pauseEl.classList.add('hidden');
  endEl.classList.remove('hidden');
  $('end-title').textContent = tr(kind === 'win' ? 'winTitle' : 'loseTitle');
  $('end-text').textContent = kind === 'win'
    ? tr('winText', { p: info.pct.toFixed(0), time: clock(worldT), troops: fmt(info.troops) })
    : tr('loseText', { p: peakPct.toFixed(1) });
  if (!SIM) {
    if (kind === 'win') chord([523, 659, 784, 1046, 1318], 0.1, 0.06);
    else beep(110, 0.4, 0.05);
  }
  sdk.gameplayStop();
  sdk.track('game_end', { result: kind, pct: +info.pct.toFixed(1), peak: +peakPct.toFixed(1), seconds: Math.round(worldT), attacks: playerAttacks });
}
function clock(t) {
  const m = Math.floor(t / 60), s = Math.floor(t % 60);
  return `${m}:${String(s).padStart(2, '0')}`;
}

// ---------- kamera ----------
function screenToMap(sx, sy) { return [(sx - cam.x) / cam.z, (sy - cam.y) / cam.z]; }
function clampCam() {
  const m = 60;
  if (cam.x > viewW - m) cam.x = viewW - m;
  if (cam.y > viewH - m) cam.y = viewH - m;
  if (cam.x + W * cam.z < m) cam.x = m - W * cam.z;
  if (cam.y + H * cam.z < m) cam.y = m - H * cam.z;
}
// na telefonu pre igre donju polovinu pokriva kartica, pa mapa ide u gornji deo
function phoneStart() { return !playing && viewW < 720; }
function frameBox(minx, miny, maxx, maxy, pad) {
  const vh = phoneStart() ? viewH * 0.5 : viewH;
  const bw = Math.max(60, (maxx - minx) * pad), bh = Math.max(60, (maxy - miny) * pad);
  const cx = (minx + maxx) / 2, cy = (miny + maxy) / 2;
  cam.z = clamp(Math.min(viewW / bw, vh / bh), minZoom(), 10);
  cam.x = viewW / 2 - cx * cam.z;
  cam.y = vh / 2 - cy * cam.z;
  clampCam();
}
function fitWorld() {
  if (viewH > viewW * 1.2) {
    // uspravan ekran: svet je širi od ekrana, kreni od Evrope i pusti prevlačenje
    const z = Math.max(minZoom(), viewW * 2.2 / W);
    cam.z = z;
    cam.x = viewW / 2 - lonX(15) * z;
    cam.y = (phoneStart() ? viewH * 0.25 : viewH / 2) - latY(30) * z;
    clampCam();
    return;
  }
  frameBox(0, 0, W, H, 1.04);
}
function frameNation(i) {
  const n = nations[i];
  if (!n || !n.tiles) return fitWorld();
  const portrait = viewH > viewW;
  const r = Math.max(portrait ? 70 : 150, Math.sqrt(n.tiles) * 1.8);
  const ax = portrait ? 1 : 1.5;
  frameBox(n.ax - r * ax, n.ay - r, n.ax + r * ax, n.ay + r, 1.2);
}
function zoomAt(sx, sy, factor) {
  const [wx, wy] = screenToMap(sx, sy);
  cam.z = clamp(cam.z * factor, minZoom(), 10);
  cam.x = sx - wx * cam.z;
  cam.y = sy - wy * cam.z;
  clampCam();
}
function resize() {
  viewW = canvas.clientWidth || innerWidth;
  viewH = canvas.clientHeight || innerHeight;
  const dpr = Math.min(2, devicePixelRatio || 1);
  canvas.width = Math.max(1, Math.round(viewW * dpr));
  canvas.height = Math.max(1, Math.round(viewH * dpr));
  if (!camUser) fitWorld();
  else clampCam();
}

// ---------- natpisi ----------
function updateAnchors() {
  for (let i = 1; i < nations.length; i++) {
    const n = nations[i];
    if (!n.tiles) continue;
    const cx = Math.round(n.sx / n.tiles), cy = Math.round(n.sy / n.tiles);
    let t = cy * W + cx;
    const home = Math.round(n.home.label[1]) * W + Math.round(n.home.label[0]);
    if (owner[t] !== i) {
      if (owner[home] === i && wrapDist2(home, t) < n.tiles * 0.6) t = home;
      else {
        let found = -1;
        for (let r = 2; r <= 90 && found < 0; r += 3) {
          for (let a = 0; a < 16; a++) {
            const x = (cx + Math.round(Math.cos(a / 16 * Math.PI * 2) * r) + W) % W;
            const y = clamp(cy + Math.round(Math.sin(a / 16 * Math.PI * 2) * r), 0, H - 1);
            if (owner[y * W + x] === i) { found = y * W + x; break; }
          }
        }
        if (found < 0) found = owner[home] === i ? home : n.border.values().next().value;
        if (found === undefined) continue;
        t = found;
      }
    }
    n.ax = t % W + 0.5;
    n.ay = ((t / W) | 0) + 0.5;
  }
}

function drawLabels() {
  const items = [];
  for (let i = 1; i < nations.length; i++) {
    const n = nations[i];
    if (!n.tiles) continue;
    const sx = n.lx * cam.z + cam.x, sy = n.ly * cam.z + cam.y;
    if (sx < -60 || sy < -30 || sx > viewW + 60 || sy > viewH + 30) continue;
    const important = i === player || i === hl || i === hover;
    let size = Math.sqrt(n.tiles) * cam.z * 0.1;
    if (size < 7.5 && !important) continue;
    size = clamp(size, 10, viewW < 720 ? 18 : 24);
    items.push({ n, sx, sy, size, important });
  }
  items.sort((a, b) => (b.important - a.important) || (b.n.tiles - a.n.tiles));
  const placed = [];
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  for (const it of items) {
    const { n, sx, sy, size } = it;
    ctx.font = `800 ${size}px Manrope, sans-serif`;
    let name = n.name;
    const maxW = Math.max(70, Math.min(170, Math.sqrt(n.tiles) * cam.z * 0.9));
    if (ctx.measureText(name).width > maxW) {
      while (name.length > 3 && ctx.measureText(name + '…').width > maxW) name = name.slice(0, -1);
      name += '…';
    }
    const fw = size * 1.25, fh = size * 0.94;
    const tw = ctx.measureText(name).width;
    const total = fw + 5 + tw;
    const rect = { x: sx - total / 2 - 3, y: sy - size * 1.1, w: total + 6, h: size * 2.3 };
    if (!it.important && placed.some((r) => r.x < rect.x + rect.w && r.x + r.w > rect.x && r.y < rect.y + rect.h && r.y + r.h > rect.y)) continue;
    placed.push(rect);
    const x0 = sx - total / 2;
    const y0 = sy - size * 0.42;
    const img = flagImg(n.code);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(x0 - 1, y0 - fh / 2 - 1, fw + 2, fh + 2);
    if (img) ctx.drawImage(img, x0, y0 - fh / 2, fw, fh);
    else { ctx.fillStyle = n.css; ctx.fillRect(x0, y0 - fh / 2, fw, fh); }
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(8, 14, 26, 0.7)';
    ctx.textAlign = 'left';
    ctx.fillStyle = n.i === player ? '#ffffff' : '#f4f1e8';
    ctx.strokeText(name, x0 + fw + 5, y0);
    ctx.fillText(name, x0 + fw + 5, y0);
    ctx.textAlign = 'center';
    ctx.font = `800 ${Math.max(10, size * 0.82)}px Manrope, sans-serif`;
    const trp = fmt(n.troops);
    ctx.strokeText(trp, sx, sy + size * 0.62);
    ctx.fillStyle = n.i === player ? '#bcd6ff' : '#e6e0cf';
    ctx.fillText(trp, sx, sy + size * 0.62);
  }
}

function flushOverlay() {
  if (allDirty) {
    octx.putImageData(ovImg, 0, 0);
    allDirty = false;
    chunkDirty.fill(0);
    return;
  }
  for (let cy = 0; cy < CHN; cy++) {
    let cx = 0;
    while (cx < CWN) {
      if (!chunkDirty[cy * CWN + cx]) { cx++; continue; }
      let ex = cx;
      while (ex < CWN && chunkDirty[cy * CWN + ex]) { chunkDirty[cy * CWN + ex] = 0; ex++; }
      const x = cx * CH, y = cy * CH;
      octx.putImageData(ovImg, 0, 0, x, y, Math.min(W - x, (ex - cx) * CH), Math.min(H - y, CH));
      cx = ex;
    }
  }
}

// pri zumu: teritorije u rezoluciji ekrana, granice kao glatke krive između centara polja
let scan = null, sctx, simg, s32, sStamp = '', sVersion = -1, sClock = 0;
let sxs = new Int32Array(0), sfx = new Float32Array(0);
const OW = new Int32Array(4), WT = new Float32Array(4);
// sitno zrno u rezoluciji ekrana da reljef ne deluje mutno pri velikom zumu
let grain = null;
function grainPattern() {
  if (grain) return grain;
  const g = document.createElement('canvas');
  g.width = g.height = 256;
  const gc = g.getContext('2d');
  const im = gc.createImageData(256, 256);
  for (let y = 0; y < 256; y++) {
    for (let x = 0; x < 256; x++) {
      const v = 128 + (fbm(x / 6, y / 6, 91, 3) - 0.5) * 150 + (hash2(x, y, 93) - 0.5) * 50;
      const p = (y * 256 + x) * 4;
      im.data[p] = im.data[p + 1] = im.data[p + 2] = clamp(v, 0, 255);
      im.data[p + 3] = 255;
    }
  }
  gc.putImageData(im, 0, 0);
  grain = ctx.createPattern(g, 'repeat');
  return grain;
}

function renderSmooth(now) {
  const w = Math.ceil(viewW), h = Math.ceil(viewH);
  if (!scan || scan.width !== w || scan.height !== h) {
    scan = document.createElement('canvas');
    scan.width = w; scan.height = h;
    sctx = scan.getContext('2d');
    simg = sctx.createImageData(w, h);
    s32 = new Uint32Array(simg.data.buffer);
    sxs = new Int32Array(w); sfx = new Float32Array(w);
    sStamp = '';
  }
  const stamp = `${cam.x},${cam.y},${cam.z},${w},${h}`;
  if (stamp === sStamp && (sVersion === ovVersion || now - sClock < 100)) return;
  sStamp = stamp; sVersion = ovVersion; sClock = now;
  const z = cam.z, thr = 2.1 / z;
  for (let sx = 0; sx < w; sx++) {
    const mx = (sx + 0.5 - cam.x) / z - 0.5;
    const x0 = Math.floor(mx);
    sfx[sx] = mx - x0;
    sxs[sx] = ((x0 % W) + W) % W;
  }
  let p = 0;
  for (let sy = 0; sy < h; sy++) {
    const my = (sy + 0.5 - cam.y) / z - 0.5;
    const y0 = Math.floor(my);
    if (y0 < -1 || y0 >= H) { s32.fill(0, p, p + w); p += w; continue; }
    const fy = my - y0;
    const ra = clamp(y0, 0, H - 1) * W, rb = clamp(y0 + 1, 0, H - 1) * W;
    for (let sx = 0; sx < w; sx++, p++) {
      const xa = sxs[sx], xb = xa + 1 === W ? 0 : xa + 1;
      const a = owner[ra + xa], b = owner[ra + xb], c = owner[rb + xa], d = owner[rb + xb];
      if (a === b && a === c && a === d) { s32[p] = a ? fillCol[a] : 0; continue; }
      const fx = sfx[sx];
      OW[0] = a; OW[1] = b; OW[2] = c; OW[3] = d;
      WT[0] = (1 - fx) * (1 - fy); WT[1] = fx * (1 - fy); WT[2] = (1 - fx) * fy; WT[3] = fx * fy;
      for (let i = 1; i < 4; i++) {
        for (let j = 0; j < i; j++) if (OW[j] === OW[i] && WT[j] >= 0) { WT[j] += WT[i]; WT[i] = -1; break; }
      }
      let bi = 0;
      for (let i = 1; i < 4; i++) if (WT[i] > WT[bi]) bi = i;
      const o = OW[bi];
      if (!o) { s32[p] = 0; continue; }
      let second = -1;
      for (let i = 0; i < 4; i++) if (i !== bi && OW[i] && WT[i] > second) second = WT[i];
      s32[p] = second >= 0 && WT[bi] - second < thr ? edgeCol[o] : fillCol[o];
    }
  }
  sctx.putImageData(simg, 0, 0);
}

function draw(now) {
  const dpr = Math.min(2, devicePixelRatio || 1);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#163a6e';
  ctx.fillRect(0, 0, viewW, viewH);
  if (!tcan) return;
  flushOverlay();
  ctx.save();
  ctx.translate(cam.x, cam.y);
  ctx.scale(cam.z, cam.z);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(tcan, 0, 0);
  if (cam.z > 2) {
    ctx.save();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const pat = grainPattern();
    pat.setTransform(new DOMMatrix().translate(cam.x % 256, cam.y % 256));
    ctx.fillStyle = pat;
    ctx.globalAlpha = clamp((cam.z - 2) / 6, 0, 0.38);
    ctx.globalCompositeOperation = 'soft-light';
    const x0 = Math.max(0, cam.x), y0 = Math.max(0, cam.y);
    ctx.fillRect(x0, y0, Math.min(viewW, cam.x + W * cam.z) - x0, Math.min(viewH, cam.y + H * cam.z) - y0);
    ctx.restore();
  }
  const smooth = cam.z >= 1.4;
  if (!smooth) {
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(ocan, 0, 0);
    ctx.imageSmoothingEnabled = true;
  } else {
    renderSmooth(now);
    ctx.restore();
    ctx.drawImage(scan, 0, 0, viewW, viewH);
    ctx.save();
    ctx.translate(cam.x, cam.y);
    ctx.scale(cam.z, cam.z);
  }

  for (const B of boats) {
    const n = nations[B.a];
    if (B.a === player) {
      ctx.beginPath();
      ctx.moveTo(B.x, B.y);
      for (let i = B.seg + 2; i + 1 < B.path.length; i += 2) ctx.lineTo(B.path[i], B.path[i + 1]);
      ctx.setLineDash([4 / cam.z, 4 / cam.z]);
      ctx.strokeStyle = 'rgba(255,255,255,0.7)';
      ctx.lineWidth = 1.2 / cam.z;
      ctx.stroke();
      ctx.setLineDash([]);
    }
    const r = Math.max(1.6, 5 / cam.z);
    ctx.beginPath();
    ctx.moveTo(B.x - r * 1.4, B.y - r * 0.2);
    ctx.lineTo(B.x + r * 1.4, B.y - r * 0.2);
    ctx.lineTo(B.x + r * 0.8, B.y + r * 0.8);
    ctx.lineTo(B.x - r * 0.8, B.y + r * 0.8);
    ctx.closePath();
    ctx.fillStyle = n.css;
    ctx.fill();
    ctx.lineWidth = 1.2 / cam.z;
    ctx.strokeStyle = '#fff';
    ctx.stroke();
  }
  if (target && playing) {
    const tx = target.tile % W + 0.5, ty = ((target.tile / W) | 0) + 0.5;
    const pulse = 1 + 0.2 * Math.sin(now / 160);
    ctx.beginPath();
    ctx.arc(tx, ty, (7 * pulse) / cam.z, 0, Math.PI * 2);
    ctx.strokeStyle = '#ffd166';
    ctx.lineWidth = 2 / cam.z;
    ctx.stroke();
  }
  for (let i = ripples.length - 1; i >= 0; i--) {
    const R = ripples[i];
    R.t += 1 / 60;
    if (R.t > 1) { ripples.splice(i, 1); continue; }
    const e = 1 - Math.pow(1 - R.t, 3);
    ctx.globalAlpha = 1 - R.t;
    ctx.beginPath();
    ctx.arc(R.x, R.y, (8 + e * 60) / cam.z, 0, Math.PI * 2);
    ctx.strokeStyle = R.color;
    ctx.lineWidth = (4 * (1 - R.t) + 1) / cam.z;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  for (let i = 1; i < nations.length; i++) {
    const n = nations[i];
    const k = Math.abs(n.ax - n.lx) > 200 ? 1 : 0.15;
    n.lx += (n.ax - n.lx) * k;
    n.ly += (n.ay - n.ly) * k;
  }
  drawLabels();
}

// ---------- UI ----------
function toast(text, kind) {
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || '');
  el.textContent = text;
  toastsEl.appendChild(el);
  while (toastsEl.children.length > 4) toastsEl.firstChild.remove();
  setTimeout(() => el.remove(), 3600);
}
// sound: the shared bus (compressor, no clipping when many fronts move at once); loaded as a module
let bus = null;
import('../../shared/gameroom-audio.js').then(m => { bus = m.createAudioBus({ storageKey: '' }); }).catch(() => {});
function unlock() {
  if (SIM || !bus) return;
  bus.ensure();
}

// ---------- ads + analytics: only through shared/gameroom-sdk.js. A game for kids: kids:true = no personalised ads ----------
const GAME_VERSION = '1.1.0';
const sdk = window.Gameroom;
sdk.init({ game: 'osvoji-svet', version: GAME_VERSION, kids: true });
let adHeld = false, reinforceUsed = false, reinforceOffered = false, firstMinute = false;
sdk.on('adStart', () => { if (playing && !over && !paused) { adHeld = true; paused = true; } if (bus) bus.setMuted(true); });
sdk.on('adEnd', () => { if (adHeld) { adHeld = false; paused = false; } if (bus) bus.setMuted(false); });
function syncReinforce() {
  const me = nations[player];
  const can = playing && !over && !reinforceUsed && worldT > 45 && me && me.tiles > 0 && sdk.rewardedAvailable('reinforce');
  $('reinforce').classList.toggle('hidden', !can);
  if (can && !reinforceOffered) { reinforceOffered = true; sdk.track('rewarded_offer', { placement: 'reinforce' }); }
  if (!firstMinute && playing && worldT >= 60) { firstMinute = true; sdk.track('first_minute', { pct: +(snapshot().pct).toFixed(1) }); }
}
async function reinforce() {
  if (reinforceUsed) return;
  $('reinforce').classList.add('hidden');
  unlock();
  const ok = await sdk.showRewarded('reinforce');
  sdk.track('rewarded_watched', { placement: 'reinforce', ok });
  const me = nations[player];
  if (!ok || !me || over) return;
  reinforceUsed = true;
  me.troops += Math.max(50, me.max * 0.5);
  toast(tr('reinforced'), 'good');
  chord([523, 659, 784]);
  flashScreen();
}
function flashScreen() {
  const f = $('flashFx');
  f.classList.add('on');
  requestAnimationFrame(() => requestAnimationFrame(() => f.classList.remove('on')));
}
// conquest ripples drawn over the map (world coordinates)
const ripples = [];
function ripple(x, y, color) { ripples.push({ x, y, t: 0, color }); }
function beep(freq, dur, vol) {
  if (muted || SIM || !bus) return;
  bus.tone({ f: freq, d: dur, type: 'triangle', v: vol * 1.4 });
}
function chord(notes, gap = 0.08, v = 0.05) {
  if (muted || SIM || !bus) return;
  notes.forEach((f, i) => bus.tone({ f, d: 0.22, type: 'triangle', v, delay: i * gap }));
}

function choose(i) {
  picked = i;
  const n = nations[i];
  $('picked-name').textContent = n ? n.name : tr('pickCountry');
  const pf = $('picked-flag');
  if (n && n.code) { pf.src = flagUrl(n.code, 80); pf.classList.remove('hidden'); } else pf.classList.add('hidden');
  playBtn.disabled = !n;
  setHighlight(i);
  buildList();
  if (n) { camUser = true; frameNation(i); }
}
function buildList() {
  const q = norm(searchEl.value.trim());
  const rows = nations.slice(1).filter((n) => !q || norm(n.name).includes(q));
  listEl.innerHTML = rows.map((n) =>
    `<button type="button" data-id="${n.i}" class="${n.i === picked ? 'on' : ''}">${flagTag(n)}<span>${esc(n.name)}</span></button>`
  ).join('');
}

function attackMode(i, tile) {
  if (!player || i === player) return null;
  if (shareBorder(player, i)) return { mode: 'land' };
  let landing = -1;
  if (coastal[tile] && owner[tile] === i) landing = tile;
  else {
    const x0 = tile % W, y0 = (tile / W) | 0;
    let bd = Infinity;
    for (let dy = -30; dy <= 30; dy++) {
      const y = y0 + dy;
      if (y < 0 || y >= H) continue;
      for (let dx = -30; dx <= 30; dx++) {
        const t = y * W + ((x0 + dx + W) % W);
        if (coastal[t] && owner[t] === i) {
          const d = dx * dx + dy * dy;
          if (d < bd) { bd = d; landing = t; }
        }
      }
    }
  }
  if (landing < 0) return null;
  const path = planBoat(player, landing);
  if (!path) return null;
  return { mode: 'sea', landing, eta: pathLen(path) / BOAT_SPEED };
}

function onMapClick(mx, my) {
  const t = tileAt(mx, my);
  if (t < 0 || !land[t]) return;
  const o = owner[t];
  if (!playing) { if (o) choose(o); return; }
  if (over || !o) return;
  if (o === player) { target = null; setHighlight(0); refreshDock(); return; }
  if (target && target.i === o) { doAttack(); return; }
  const m = attackMode(o, t);
  if (!m) {
    toast(tr('noRoute', { name: nations[o].name }));
    target = null;
    setHighlight(0);
  } else {
    target = { i: o, tile: m.mode === 'sea' ? m.landing : t, mode: m.mode, eta: m.eta || 0 };
    setHighlight(o);
  }
  refreshDock();
}

function doAttack() {
  if (!target || over) return;
  const me = nations[player];
  const send = me.troops * Number(pctInput.value) / 100;
  if (send < 5) return;
  if (target.mode === 'land' && !shareBorder(player, target.i)) {
    const m = attackMode(target.i, target.tile);
    if (!m) { toast(tr('routeLost')); return; }
    target.mode = m.mode;
    if (m.mode === 'sea') { target.tile = m.landing; target.eta = m.eta; }
  }
  let ok;
  if (target.mode === 'land') {
    me.troops -= send;
    ok = startAttack(player, target.i, send);
  } else {
    if (owner[target.tile] === player) { toast(tr('coastYours')); return; }
    ok = launchBoat(player, target.tile, send);
  }
  if (ok) {
    playerAttacks++;
    beep(target.mode === 'sea' ? 300 : 520, 0.07, 0.04);
    if (bus && !muted && !SIM) bus.noise({ d: 0.35, v: 0.08, f: 400, f2: 2400 });
    const tx = target.tile % W + 0.5, ty = ((target.tile / W) | 0) + 0.5;
    if (!SIM) ripple(tx, ty, '#ffd166');
  }
  else toast(tr('cantAttack'));
}

function refreshDock() {
  if (!playing || !player) return;
  const me = nations[player];
  $('rate').textContent = '+' + fmt(growth(me)) + '/s';
  $('tfill').style.width = clamp(me.troops / me.max, 0, 1) * 100 + '%';
  $('ttext').textContent = `${fmt(me.troops)} / ${fmt(me.max)}`;
  const pct = (me.tiles / landTotal) * 100;
  $('landPct').textContent = '🌍 ' + (pct >= 10 ? pct.toFixed(0) : pct >= 1 ? pct.toFixed(1) : pct.toFixed(2)) + '%';
  const frac = Number(pctInput.value) / 100;
  const send = me.troops * frac;
  $('sendLbl').textContent = `⚔ ${pctInput.value}% (${fmt(send)})`;
  const go = $('go');
  const tf = $('tgt-flag');
  if (!target || !nations[target.i].tiles || target.i === player) {
    if (target) { target = null; setHighlight(0); }
    $('tgt-name').textContent = tr('pickTarget');
    $('tgt-info').textContent = tr('pickTargetHint');
    tf.style.visibility = 'hidden';
    go.disabled = true;
    go.textContent = tr('attack');
    hintEl.className = '';
    hintEl.textContent = tr('frontHint');
    return;
  }
  const d = nations[target.i];
  if (d.code && tf.dataset.code !== d.code) { tf.src = flagUrl(d.code, 80); tf.dataset.code = d.code; }
  tf.style.visibility = d.code ? 'visible' : 'hidden';
  $('tgt-name').textContent = d.name;
  const tName = TNAME[terr[target.tile]] || '';
  $('tgt-info').textContent = tr('targetInfo', { troops: fmt(d.troops), mode: target.mode === 'sea' ? tr('bySea', { s: Math.round(target.eta) }) : tr('byLand'), terrain: tName });
  go.disabled = send < 5;
  go.textContent = tr(target.mode === 'sea' ? 'land' : 'attack');
  const dens = d.troops / Math.max(1, d.tiles);
  const est = send / (1.3 * (2 + dens * 1.2 + Math.sqrt(d.troops) / 6));
  const share = est / Math.max(1, d.tiles);
  if (share >= 1) {
    hintEl.className = '';
    hintEl.textContent = tr('enough');
  } else if (share < 0.05) {
    hintEl.className = 'warn';
    hintEl.textContent = tr('tooFew', { p: Math.max(0.1, share * 100).toFixed(1) });
  } else {
    hintEl.className = frac >= 0.6 ? 'warn' : '';
    hintEl.textContent = tr(frac >= 0.6 ? 'takeWeak' : 'take', { p: Math.round(share * 100) });
  }
}

function refreshAtks() {
  const rows = [];
  if (playing) {
    for (const A of attacks) {
      if (A.dead) continue;
      if (A.a === player) {
        const d = nations[A.d];
        rows.push(`<div class="atk">⚔ ${flagTag(d)}${esc(d.name)} ${fmt(A.troops)}<button type="button" data-cancel="${A.d}" aria-label="${tr('retreat')}">✕</button></div>`);
      } else if (A.d === player) {
        const a = nations[A.a];
        rows.push(`<div class="atk in">🛡 ${flagTag(a)}${esc(a.name)} ${fmt(A.troops)}</div>`);
      }
    }
    for (const B of boats) {
      if (B.dead) continue;
      const o = nations[owner[B.landing]];
      if (B.a === player) rows.push(`<div class="atk">⛵ ${o ? esc(o.name) : tr('shore')} ${fmt(B.troops)}</div>`);
      else if (owner[B.landing] === player) rows.push(`<div class="atk in">⛵ ${flagTag(nations[B.a])}${esc(nations[B.a].name)} ${fmt(B.troops)}</div>`);
    }
  }
  const html = rows.slice(0, 8).join('');
  if (atksEl.dataset.html !== html) { atksEl.innerHTML = html; atksEl.dataset.html = html; }
}

function renderBoard() {
  const alive = nations.slice(1).filter((n) => n.tiles).sort((a, b) => b.tiles - a.tiles);
  const rows = alive.slice(0, 7);
  if (player && nations[player].tiles && !rows.includes(nations[player])) rows.push(nations[player]);
  if (player && nations[player].tiles) $('board-me').textContent = tr('rankOf', { r: alive.indexOf(nations[player]) + 1, n: alive.length });
  boardRows.innerHTML = rows.map((n) => {
    const pct = (n.tiles / landTotal) * 100;
    return `<button type="button" class="lb ${n.i === player ? 'me' : ''}" data-id="${n.i}">
      <span class="rk">${alive.indexOf(n) + 1}</span>
      <span class="who">${flagTag(n)}<b>${esc(n.name)}</b></span>
      <span class="num">${pct >= 10 ? pct.toFixed(0) : pct.toFixed(1)}%</span>
      <span class="num tr">${fmt(n.troops)}</span>
    </button>`;
  }).join('');
}

function begin(i) {
  unlock();
  player = i;
  picked = i;
  hl = 0;
  playing = true; paused = false; over = null; speed = 1;
  $('speed').textContent = '1×';
  repaintAll();
  for (const n of nations) if (n) n.nextAI = 2 + Math.random() * 5;
  startEl.classList.add('hidden');
  endEl.classList.add('hidden');
  pauseEl.classList.add('hidden');
  hud.classList.remove('hidden');
  board.classList.remove('hidden');
  dock.classList.remove('hidden');
  const me = nations[i];
  $('hud-name').textContent = me.name;
  const hf = $('hud-flag');
  if (me.code) { hf.src = flagUrl(me.code, 80); hf.style.visibility = 'visible'; } else hf.style.visibility = 'hidden';
  camUser = true;
  resize();
  frameNation(i);
  toast(tr('startHint'));
  reinforceUsed = false; reinforceOffered = false;
  if (!SIM) { sdk.gameplayStart(); sdk.track('game_start', { country: me.code || me.name }); }
  renderBoard();
  refreshDock();
  if (SIM > 0) runSim();
}

function runSim() {
  const t0 = performance.now();
  const steps = Math.round(SIM / 0.05);
  for (let i = 0; i < steps && !over; i++) step(0.05);
  const info = snapshot();
  info.ms = Math.round(performance.now() - t0);
  info.top = nations.slice(1).filter((n) => n.tiles).sort((a, b) => b.tiles - a.tiles).slice(0, 6)
    .map((n) => `${n.name}:${((n.tiles / landTotal) * 100).toFixed(1)}`);
  window.simLog = info;
  updateAnchors();
  for (const n of nations) if (n) { n.lx = n.ax; n.ly = n.ay; }
  document.title = `pct=${info.pct.toFixed(2)} peak=${info.peakPct.toFixed(2)} atk=${info.playerAttacks} fac=${info.fac} troops=${Math.round(info.troops)} ${info.over} t=${Math.round(info.worldT)} ms=${info.ms}`;
}

function togglePause(force) {
  if (!playing || over) return;
  const was = paused;
  paused = force === undefined ? !paused : force;
  pauseEl.classList.toggle('hidden', !paused);
  if (paused && !was) sdk.gameplayStop();
  if (!paused && was) sdk.gameplayStart();
}
function openSettings() {
  settingsEl.classList.remove('hidden');
  if (playing && !over) togglePause(true);
}
function closeSettings() { settingsEl.classList.add('hidden'); }

$('gear').onclick = openSettings;
$('settings-close').onclick = closeSettings;
$('mute').onchange = (e) => {
  muted = e.target.checked;
  if (bus) bus.setMuted(muted);
  try { localStorage.setItem('osvoji-svet:mute', muted ? '1' : '0'); } catch (err) {}
};
playBtn.onclick = () => { if (picked) begin(picked); };
$('random').onclick = () => choose(1 + ((Math.random() * (nations.length - 1)) | 0));
$('resume').onclick = () => { togglePause(false); sdk.showMidgame('resume'); };
$('reinforce').onclick = reinforce;
$('pauseBtn').onclick = () => togglePause();
$('speed').onclick = () => {
  speed = speed === 1 ? 2 : speed === 2 ? 3 : 1;
  $('speed').textContent = speed + '×';
};
$('again').onclick = async () => {
  await sdk.showMidgame('game_end');   // between two games: a natural break, capped by the SDK
  playing = false;
  player = 0;
  hl = 0;
  resetWorld();
  endEl.classList.add('hidden');
  hud.classList.add('hidden');
  board.classList.add('hidden');
  dock.classList.add('hidden');
  refreshAtks();
  startEl.classList.remove('hidden');
  camUser = false;
  fitWorld();
  if (picked) { const p = picked; picked = 0; choose(p); }
};
$('go').onclick = doAttack;
pctInput.addEventListener('input', refreshDock);
searchEl.addEventListener('input', buildList);
listEl.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-id]');
  if (btn) choose(Number(btn.dataset.id));
});
$('board-toggle').onclick = () => board.classList.toggle('open');
boardRows.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-id]');
  if (btn) { camUser = true; frameNation(Number(btn.dataset.id)); }
});
atksEl.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-cancel]');
  if (!btn) return;
  const d = Number(btn.dataset.cancel);
  const A = attacks.find((x) => !x.dead && x.a === player && x.d === d);
  if (A) { endAttack(A, 0.75); toast(tr('retreating')); }
});
$('zin').onclick = () => { camUser = true; zoomAt(viewW / 2, viewH / 2, 1.3); };
$('zout').onclick = () => { camUser = true; zoomAt(viewW / 2, viewH / 2, 1 / 1.3); };
$('fit').onclick = () => {
  camUser = true;
  if (playing && player) frameNation(player);
  else if (picked) frameNation(picked);
  else fitWorld();
};

addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' && e.target.type === 'search') return;
  if (e.key === 'Escape') {
    if (!settingsEl.classList.contains('hidden')) { closeSettings(); return; }
    if (playing && !over) togglePause();
  } else if ((e.key === 'p' || e.key === 'P') && playing && !over) {
    togglePause();
  } else if (e.key === 'Enter' && playing && target) {
    doAttack();
  } else if (e.key === '+' || e.key === '=') { camUser = true; zoomAt(viewW / 2, viewH / 2, 1.2); }
  else if (e.key === '-' || e.key === '_') { camUser = true; zoomAt(viewW / 2, viewH / 2, 1 / 1.2); }
  else if (playing && /^[1-9]$/.test(e.key)) { pctInput.value = String(Number(e.key) * 10); refreshDock(); }
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden && playing && !over && !AUTO) togglePause(true);
});

canvas.addEventListener('contextmenu', (e) => e.preventDefault());
canvas.addEventListener('pointerdown', (e) => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  tipEl.classList.add('hidden');
  if (pointers.size === 1) {
    drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y, moved: false };
    pinch = null;
  } else if (pointers.size >= 2) {
    drag = null;
    pinch = pinchInfo();
  }
});
function pinchInfo() {
  const p = [...pointers.values()];
  return { dist: Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) || 1, midX: (p[0].x + p[1].x) / 2, midY: (p[0].y + p[1].y) / 2 };
}
function showTip(e) {
  if (!owner || e.pointerType === 'touch') return;
  const rect = canvas.getBoundingClientRect();
  const [mx, my] = screenToMap(e.clientX - rect.left, e.clientY - rect.top);
  const t = tileAt(mx, my);
  const o = t >= 0 && land[t] ? owner[t] : 0;
  hover = o;
  if (!o) { tipEl.classList.add('hidden'); return; }
  const n = nations[o];
  const html = `${flagTag(n)}${esc(n.name)} <span>${fmt(n.troops)} · ${TNAME[terr[t]]}</span>`;
  if (tipEl.dataset.html !== html) { tipEl.innerHTML = html; tipEl.dataset.html = html; }
  tipEl.classList.remove('hidden');
  tipEl.style.left = Math.min(viewW - tipEl.offsetWidth - 8, e.clientX + 14) + 'px';
  tipEl.style.top = Math.min(viewH - 40, e.clientY + 14) + 'px';
}
canvas.addEventListener('pointermove', (e) => {
  if (!pointers.has(e.pointerId)) { showTip(e); return; }
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size >= 2 && pinch) {
    const next = pinchInfo();
    const rect = canvas.getBoundingClientRect();
    const [wx, wy] = screenToMap(pinch.midX - rect.left, pinch.midY - rect.top);
    cam.z = clamp(cam.z * (next.dist / pinch.dist), minZoom(), 10);
    cam.x = (next.midX - rect.left) - wx * cam.z;
    cam.y = (next.midY - rect.top) - wy * cam.z;
    pinch = next;
    camUser = true;
    clampCam();
    return;
  }
  if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (dx * dx + dy * dy > 25) drag.moved = true;
    cam.x = drag.cx + dx;
    cam.y = drag.cy + dy;
    camUser = true;
    clampCam();
  }
});
canvas.addEventListener('pointerleave', () => { tipEl.classList.add('hidden'); hover = 0; });
canvas.addEventListener('pointerup', (e) => {
  const moved = drag && drag.moved;
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (pointers.size === 0) {
    if (drag && !moved && owner) {
      const rect = canvas.getBoundingClientRect();
      const [mx, my] = screenToMap(e.clientX - rect.left, e.clientY - rect.top);
      onMapClick(mx, my);
    }
    drag = null;
  } else if (pointers.size === 1) {
    const p = [...pointers.values()][0];
    drag = { x: p.x, y: p.y, cx: cam.x, cy: cam.y, moved: true };
  }
});
canvas.addEventListener('pointercancel', (e) => { pointers.delete(e.pointerId); drag = null; pinch = null; });
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  camUser = true;
  zoomAt(e.clientX - rect.left, e.clientY - rect.top, e.deltaY > 0 ? 0.88 : 1.14);
}, { passive: false });
addEventListener('resize', resize);

let last = 0;
function loop(now) {
  const dt = Math.min(0.05, last ? (now - last) / 1000 : 0);
  last = now;
  if (playing) update(dt);
  if (owner) {
    anchorClock -= dt;
    if (anchorClock <= 0) { anchorClock = 0.5; updateAnchors(); }
  }
  draw(now);
  if (playing) {
    uiClock -= dt;
    if (uiClock <= 0) {
      uiClock = 0.1;
      refreshDock();
      refreshAtks();
      $('hud-time').textContent = clock(worldT);
      syncReinforce();
    }
    boardClock -= dt;
    if (boardClock <= 0) { boardClock = 0.6; renderBoard(); }
  }
  requestAnimationFrame(loop);
}

// debug hooks for tests
window.__os = {
  ready: () => !!owner,
  state: () => ({ playing, paused, over, player, worldT, ...(owner && player ? snapshot() : {}) }),
  begin: (i = 1) => begin(i),
  finish: (kind) => finish(kind, snapshot()),
  advance: (sec) => { worldT += sec; syncReinforce(); return worldT; },
  troops: () => nations[player] ? nations[player].troops : 0,
};

resize();
requestAnimationFrame(loop);
if (!window.OSVOJI_MAP) {
  $('loading').textContent = tr('mapFailed');
} else {
  setTimeout(() => {
    const t0 = performance.now();
    buildWorld(window.OSVOJI_MAP);
    window.buildMs = Math.round(performance.now() - t0);
    $('loading').classList.add('hidden');
    startEl.classList.remove('hidden');
    buildList();
    updateAnchors();
    for (const n of nations) if (n) { n.lx = n.ax; n.ly = n.ay; }
    resize();
    if (AUTO) {
      const want = params.get('as') || 'Srbija';
      const srb = nations.find((n) => n && (n.name === want || n.home.name === want)) || nations[1];
      begin(srb.i);
    }
  }, 30);
}
</script>
