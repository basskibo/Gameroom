<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  canvas { display: block; }
  #ui { position: fixed; inset: 0; pointer-events: none; color: #fff; }

  }

  #basebar { width: 150px; height: 14px; background: #0005; border-radius: 8px; overflow: hidden; margin-top: 6px; }
  #basefill { height: 100%; width: 100%; background: linear-gradient(#6ee36e, #2fae3a); transition: width .15s; }

  }
  #settingsMenu.hidden { display: none; }
  #settingsMenu button, #settingsMenu a {

  #bossHp { position: absolute; inset: 0; font-size: 14px; line-height: 14px; }
  #weapon { position: absolute; bottom: 14px; left: 14px; width: min(450px, calc(100vw - 28px)); }
  .plank {
    position: relative; padding: 24px 14px 12px; border-radius: 14px;
    background:
      repeating-linear-gradient(0deg, transparent 0 25px, rgba(0,0,0,.28) 25px 27px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 3px, rgba(0,0,0,.06) 3px 8px),
      linear-gradient(180deg, #a0673a, #6b3f1d);

  }
  .plank::before { left: 9px; } .plank::after { right: 9px; }
  .ribbon { position: absolute; top: -20px; left: 14px; filter: drop-shadow(0 3px 0 #6a040f); }

    display: flex; align-items: center; gap: 8px; padding: 5px 26px 7px 18px; font-size: 24px;
    background: linear-gradient(#ff5a5a, #c1121f);

  }

  .chip {
    display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px 5px; border-radius: 10px;

  }
  .chip i { font-style: normal; font-size: 13px; }
  .c-dmg { background: linear-gradient(#ff6b6b, #c1121f); }
  .c-shot { background: linear-gradient(#5cbcff, #1565c0); }
  .c-rate { background: linear-gradient(#6ee388, #1f8a3a); }
  .c-dps { background: linear-gradient(#ffd54a, #e08e00); }
  .c-pierce { background: linear-gradient(#5ff3f3, #0a8f9f); }
  .c-boom { background: linear-gradient(#ffa24c, #d9480f); }

  .lv { font-size: 12px; }

  .lv-shot b { background: linear-gradient(#8fd3ff, #1d8fe1); }
  .lv-dmg b { background: linear-gradient(#ff9b9b, #e63946); }
  .lv-rate b { background: linear-gradient(#9af0ad, #2fb344); }
  /* ---------- phones: compact HUD, keep the bottom of the screen (the hero) clear ---------- */
  @media (max-width: 600px), (max-height: 500px) {
    #top { padding: max(8px, env(safe-area-inset-top)) 8px 0; gap: 6px; align-items: center; }
    .pill { font-size: 14px; padding: 6px 10px; border-radius: 12px; }
    .pill small { font-size: 11px; }
    #baseBox { display: flex; align-items: center; gap: 6px; }
    #basebar { width: 64px; height: 9px; margin-top: 4px; }

    .btns button { min-width: 36px; height: 36px; font-size: 15px; }
    #weapon { width: auto; }
    .plank { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; padding: 5px 7px; border-width: 2px; border-radius: 12px; box-shadow: 0 3px 0 #3b2210, inset 0 0 0 2px #3b2210; }
    .plank::before, .plank::after, .tier, .levels { display: none; }
    .ribbon { position: static; filter: none; }
    .ribbon-in { font-size: 15px; gap: 5px; padding: 3px 14px 4px 9px; }
    .skull { font-size: 13px; }
    #wStats { gap: 4px; }

    #bossName { font-size: 13px; margin-bottom: 2px; }
    #bossBar { height: 16px; border-width: 2px; }
    #bossHp { font-size: 11px; line-height: 12px; }

    .float { font-size: 20px; }

    #bossWrap { width: calc(100vw - 16px); }   /* top is set from JS: right under the weapon strip */
  }
  /* landscape phone: small strip bottom-left */
  @media (min-width: 601px) and (max-height: 500px) {
    #weapon { bottom: 8px; left: 8px; width: auto; max-width: 52vw; }
    #bossWrap { top: 8px; width: min(340px, 40vw); }
  }
  #banner {
    position: absolute; top: 9%; left: 0; right: 0; text-align: center;
    font-size: clamp(34px, 8vw, 64px); opacity: 0; transform: scale(.6); transition: all .25s;
  }
  #banner.show { opacity: 1; transform: scale(1); }
  #bannerSub { font-size: .42em; display: block; margin-top: 6px; color: #ffe066; }
  #hurt { position: absolute; inset: 0; background: #e02020; opacity: 0; }
  .float {

  }
  .float.big { font-size: 38px; color: #ffe066; }

    0%   { opacity: 0; transform: translate(-50%, -30%) scale(.6); }

  }
  .overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #1b1b2f99; pointer-events: auto; padding: 16px;
  }
  .overlay.hidden { display: none; }
  .card {
    background: #fff8ec; color: #1b1b2f; border-radius: 24px; padding: 26px 24px;

  .legend {

  .sw { width: 24px; height: 24px; border-radius: 6px; }
  .stats { font-size: 20px; margin: 14px 0; line-height: 1.6; }
  button.play {
    font-family: inherit; font-size: 24px; color: #fff; background: #e63946; border: none;

  }
  button.play:active { transform: translateY(3px); box-shadow: 0 2px 0 #9d0208; }
  .keys { font-family: system-ui, sans-serif; font-size: 12px; color: #777; margin-top: 12px; }
  .best { font-size: 16px; color: #8a5a2b; margin: -4px 0 10px; }
  .legend.hidden { display: none; }
  .howBtn { background: none; border: 0; font-family: system-ui, sans-serif; font-size: 13px; color: #8a7f96; text-decoration: underline; cursor: pointer; margin-bottom: 4px; }
  .howBtn.hidden { display: none; }
  .stats { font-size: 18px; line-height: 1.45; }
  .best:empty { display: none; }
  /* rewarded-ad offers: the player picks them, they never pop up by themselves */
  button.ad {
    display: flex; align-items: center; justify-content: center; gap: 8px; margin: 12px auto 0;
    font-family: inherit; font-size: 17px; color: #1b1b2f; background: linear-gradient(#ffe066, #f5b800);
    border: none; border-radius: 14px; padding: 10px 18px; box-shadow: 0 4px 0 #b07d00; cursor: pointer;
  }
  button.ad:active { transform: translateY(3px); box-shadow: 0 1px 0 #b07d00; }
  button.ad small { font-family: system-ui, sans-serif; font-size: 11px; background: #1b1b2f; color: #ffe066; border-radius: 6px; padding: 2px 6px; }
  button.ad.hidden, button.ad.taken { display: none; }
  .gunOn { margin-top: 10px; font-size: 15px; color: #2f9e44; }

  .armory { margin: 12px 0 4px; padding: 10px; border-radius: 16px; background: #f3e6cf; border: 2px solid #e2cba3; }
  .armory h3 { font-size: 16px; color: #8a5a2b; display: flex; justify-content: space-between; align-items: center; }
  .armory h3 b { color: #b07d00; }
  .arm-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
  .arm-row button {
    font-family: inherit; border: 0; border-radius: 12px; padding: 6px 4px; cursor: pointer; color: #1b1b2f;
    background: #fff8ec; box-shadow: 0 3px 0 #c9b18a; display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 13px;
  }
  .arm-row button i { font-style: normal; font-size: 20px; }
  .arm-row button small { font-family: system-ui, sans-serif; font-size: 10px; color: #6b5a44; }
  .arm-row button.can { background: linear-gradient(#ffe066, #f5b800); box-shadow: 0 3px 0 #b07d00; }
  .arm-row button:disabled { opacity: .55; cursor: default; }
  .arm-row button.bought { animation: armPop .4s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes armPop { 50% { transform: scale(1.15); } }
  .coinsGot { font-size: 20px; color: #b07d00; margin-top: 4px; }
  #combo {
    position: absolute; right: 16px; top: 42%; text-align: right; font-size: 30px; color: #ffe066; opacity: 0;
    transition: opacity .2s; pointer-events: none;
  }
  #combo small { display: block; font-size: 14px; color: #fff; }
  #combo.on { opacity: 1; }
  #combo.pulse { animation: comboPulse .18s; }
  @keyframes comboPulse { 50% { transform: scale(1.18); } }
  @media (max-width: 600px) { #combo { top: 34%; right: 8px; font-size: 22px; } }
  .gunOn.hidden { display: none; }
  /* first-game hints: a bubble that points at the gate / chest in the world */
  #coach {
    position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); pointer-events: none;

  }
  #coach small { display: block; font-family: system-ui, sans-serif; font-size: 12px; color: #555; margin-top: 2px; }
  #coach::after {
    content: ''; position: absolute; left: 50%; bottom: -12px; transform: translateX(-50%);

  }
  #coach.hidden { opacity: 0; }
  @keyframes coachBob { from { margin-top: 0; } to { margin-top: -8px; } }
  .overlay .card { animation: cardIn .28s cubic-bezier(.2, 1.4, .4, 1); }
  @keyframes cardIn { from { transform: scale(.85) translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }
</style>

<div id="ui">
  <div id="top">
    <div class="pill stroke"><span id="wave"></span><small><span data-i18n="score"></span>: <span id="score">0</span></small></div>

  <div id="combo" class="stroke"><span id="comboN"></span><small data-i18n="combo"></small></div>

  <div id="startScreen" class="overlay">
    <div class="card">
      <h1>MONSTER<br>LANE</h1>
      <p data-i18n="intro"></p>
      <button class="howBtn" id="howBtn" type="button" data-i18n="how"></button>
      <div class="legend hidden" id="legend">
        <div class="sw" style="background:#4aa3ff"></div><div data-i18n-html="legendL"></div>
        <div class="sw" style="background:#f4c95d"></div><div data-i18n-html="legendR"></div>
        <div class="sw" style="background:#e63946"></div><div data-i18n-html="legendM"></div>
      </div>
      <div class="best" id="bestLine"></div>
      <div class="armory" id="armory1"></div>
      <button class="play" id="startBtn" data-i18n="play"></button>
      <button class="ad hidden" id="gunBtn" type="button"><span data-i18n="gunOffer"></span><small data-i18n="adTag"></small></button>
      <div class="gunOn hidden" id="gunOn" data-i18n="gunReady"></div>
      <div class="keys" data-i18n="keys"></div>
    </div>
  </div>

  <div id="overScreen" class="overlay hidden">
    <div class="card">
      <h2 data-i18n="baseFell"></h2>

      <div class="armory" id="armory2"></div>
      <button class="ad hidden" id="gunBtn2" type="button"><span data-i18n="gunOffer"></span><small data-i18n="adTag"></small></button>
      <div class="gunOn hidden" id="gunOn2" data-i18n="gunReady"></div>

  </div>

    <div class="card">
      <h2 data-i18n="paused"></h2>
      <p data-i18n="pausedHint"></p>
      <button class="play" id="resumeBtn" data-i18n="resume"></button>
    </div>
  </div>
</div>

// =====================================================================

const tr = (k, v) => i18n.t(k, v);
i18n.add({

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const easeOutBack = t => 1 + 2.7 * Math.pow(t - 1, 3) + 1.7 * Math.pow(t - 1, 2);

function groundY(z) {
  if (z >= PIER_END) return 0;
  if (z >= RAMP_TOP_Z) return (PIER_END - z) / (PIER_END - RAMP_TOP_Z) * RAMP_Y;
  return Math.max(DECK_Y, RAMP_Y - (RAMP_TOP_Z - z) * 1.5);

function canvasTex(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  return { c, ctx, tex, w, h };
}

// tileable value noise: returns f(x, y) for pixel coords in [0, size)
function valueNoise(size, cells) {
  const g = new Float32Array(cells * cells);
  for (let i = 0; i < g.length; i++) g[i] = Math.random();
  return (x, y) => {
    const fx = x / size * cells, fy = y / size * cells;
    const x0 = Math.floor(fx), y0 = Math.floor(fy);
    const tx = fx - x0, ty = fy - y0;
    const sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty);
    const X0 = x0 % cells, Y0 = y0 % cells, X1 = (X0 + 1) % cells, Y1 = (Y0 + 1) % cells;
    const a = g[Y0 * cells + X0], b = g[Y0 * cells + X1], c = g[Y1 * cells + X0], d = g[Y1 * cells + X1];
    return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
  };
}
function fbm(size, octaves) {
  const ns = octaves.map(([cells, amp]) => [valueNoise(size, cells), amp]);
  return (x, y) => { let v = 0; for (const [n, a] of ns) v += n(x, y) * a; return v; };
}

function dataTex(size, fill, srgb) {
  const { ctx, tex } = canvasTex(size, size);
  const img = ctx.createImageData(size, size);
  fill(img.data);
  ctx.putImageData(img, 0, 0);
  tex.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = 8;
  tex.needsUpdate = true;
  return tex;
}

function normalFromHeight(h, size, strength) {
  const H = (x, y) => h[((y + size) % size) * size + ((x + size) % size)];
  return dataTex(size, d => {
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
      const dx = (H(x + 1, y) - H(x - 1, y)) * strength;
      const dy = (H(x, y - 1) - H(x, y + 1)) * strength;
      const inv = 1 / Math.hypot(dx, dy, 1);
      const i = (y * size + x) * 4;
      d[i] = (-dx * inv * 0.5 + 0.5) * 255;
      d[i + 1] = (-dy * inv * 0.5 + 0.5) * 255;
      d[i + 2] = (inv * 0.5 + 0.5) * 255;
      d[i + 3] = 255;
    }
  }, false);
}

// wooden pier boards running across the lane, staggered joints, nails; light so lanes can tint it
function makePlanks(size = 512) {
  const boards = 8, bh = size / boards;
  const grain = fbm(size, [[8, 0.4], [32, 0.35], [128, 0.25]]);
  const shade = Array.from({ length: boards }, () => rand(-0.1, 0.1));
  const joint = Array.from({ length: boards }, () => rand(0, size));
  const h = new Float32Array(size * size), col = new Float32Array(size * size);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const b = Math.floor(y / bh), yb = y - b * bh;
    const dj = ((x - joint[b]) % size + size) % size;
    const g = grain((x * 0.2 + joint[b]) % size, y);
    const seam = yb < 3 || yb > bh - 3 || dj < 2 || dj > size - 2;
    const nail = Math.abs(yb - bh / 2) < 3 && (Math.abs(dj - 14) < 3 || Math.abs(dj - (size - 14)) < 3);
    const i = y * size + x;
    h[i] = seam ? 0 : 0.7 + g * 0.3 - (nail ? 0.3 : 0);
    col[i] = seam ? -0.55 : nail ? -0.45 : shade[b] + (g - 0.5) * 0.4 + Math.sin(g * 40) * 0.03;
  }
  const map = dataTex(size, d => {
    for (let i = 0; i < size * size; i++) {
      const v = col[i];
      d[i * 4] = clamp(236 * (1 + v), 0, 255);
      d[i * 4 + 1] = clamp(224 * (1 + v), 0, 255);
      d[i * 4 + 2] = clamp(206 * (1 + v), 0, 255);
      d[i * 4 + 3] = 255;
    }
  }, true);
  return { map, normalMap: normalFromHeight(h, size, 3.0) };
}

// sand: wind ripples warped by noise
function makeSand(size = 512) {
  const n = fbm(size, [[4, 0.5], [8, 0.3], [32, 0.2]]);
  const h = new Float32Array(size * size);
  const col = new Float32Array(size * size);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const w = n(x, y);
    const ripple = Math.sin(y / size * Math.PI * 2 * 14 + w * 9);
    const i = y * size + x;
    h[i] = ripple * 0.35 + w * 0.8 + Math.random() * 0.12;
    col[i] = w * 0.6 + ripple * 0.15 + (Math.random() - 0.5) * 0.12;
  }
  const map = dataTex(size, d => {
    for (let i = 0; i < size * size; i++) {
      const v = col[i];
      d[i * 4] = clamp(247 + v * 30, 0, 255);
      d[i * 4 + 1] = clamp(226 + v * 30, 0, 255);
      d[i * 4 + 2] = clamp(178 + v * 26, 0, 255);
      d[i * 4 + 3] = 255;
    }
  }, true);
  return { map, normalMap: normalFromHeight(h, size, 3.0) };
}

const toonRamp = (() => {
  const t = new THREE.DataTexture(new Uint8Array([95, 165, 230, 255]), 4, 1, THREE.RedFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter;
  t.generateMipmaps = false;
  t.needsUpdate = true;
  return t;
})();
const toon = params => new THREE.MeshToonMaterial({ gradientMap: toonRamp, ...params });

const matCache = new Map();
function toonMat(color, emissive = 0) {
  const key = `${color}_${emissive}`;
  if (!matCache.has(key)) {
    matCache.set(key, toon({ color, emissive: emissive ? color : 0x000000, emissiveIntensity: emissive * 2.5 }));
  }
  return matCache.get(key);
}

// ink outline: back faces pushed out along the normal (works for instanced meshes too)
const outlineMats = new Map();
function outlineMaterial(width) {
  if (!outlineMats.has(width)) {
    const m = new THREE.MeshBasicMaterial({ color: 0x1a1022, side: THREE.BackSide });
    m.onBeforeCompile = sh => {
      sh.vertexShader = sh.vertexShader.replace('#include <begin_vertex>',
        `vec3 transformed = position + normal * ${width.toFixed(3)};`);
    };
    m.customProgramCacheKey = () => 'outline_' + width;
    outlineMats.set(width, m);
  }
  return outlineMats.get(width);
}
function addOutline(root, width) {
  const meshes = [];
  root.traverse(o => { if (o.isMesh && !o.isInstancedMesh && !o.userData.outline && !o.material.transparent) meshes.push(o); });
  for (const m of meshes) {
    const ol = new THREE.Mesh(m.geometry, outlineMaterial(width));
    ol.userData.outline = true;
    m.add(ol);
  }
  return root;
}
function outlinedInstances(geo, material, count, width) {
  const mesh = new THREE.InstancedMesh(geo, material, count);
  const ol = new THREE.InstancedMesh(geo, outlineMaterial(width), count);
  ol.instanceMatrix = mesh.instanceMatrix;     // share transforms: one update drives both
  mesh.frustumCulled = ol.frustumCulled = false;
  mesh.count = ol.count = 0;
  scene.add(mesh, ol);
  return { mesh, ol };
}

function colored(geo, color) {
  const c = new THREE.Color(color);
  const n = geo.attributes.position.count;
  const arr = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { arr[i * 3] = c.r; arr[i * 3 + 1] = c.g; arr[i * 3 + 2] = c.b; }
  geo.setAttribute('color', new THREE.BufferAttribute(arr, 3));
  return geo;
}

function resize() {
  const w = innerWidth, h = innerHeight, aspect = w / h;
  renderer.setSize(w, h);
  camera.aspect = aspect;
  camera.fov = 66;
  // camera sits on a fixed direction behind/above the gun, tilted up enough to show the sea and
  // ships on the horizon. Wide screens fit the whole road; narrow (portrait) screens show a
  // ~17 m wide slice and pan sideways with the player instead of backing off (keeps things big)
  const portrait = aspect < 0.9;
  const off = portrait ? new THREE.Vector3(0, 16, 11) : new THREE.Vector3(0, 15, 12);
  const halfH = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const needHalf = portrait ? 8 : FENCE_OUT + 0.4;
  const k = Math.max(1, needHalf / (off.length() * halfH * aspect));
  camPanLimit = Math.max(0, FENCE_OUT + 1 - off.length() * k * halfH * aspect);
  camBase.set(0, 0, PLAYER_Z).addScaledVector(off, k);
  camLook.set(0, 0, camBase.z - (portrait ? 30 : 34) * k);

// every part carries a `limb` attribute: (swing multiplier, pivot height) read by the walk shader
function geoBuilder() {
  const parts = [];

  return {
    limb(swing = 0, pivotY = 0) { limb = [swing, pivotY]; },
    add(geo, color, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0) {
      if (rx) geo.rotateX(rx);
      if (ry) geo.rotateY(ry);
      if (rz) geo.rotateZ(rz);

      colored(geo, color);

      for (let i = 0; i < n; i++) { arr[i * 2] = limb[0]; arr[i * 2 + 1] = limb[1]; }

// walk cycle in the vertex shader: legs/arms rotate around their pivot (x axis) by sin(phase).
// Instanced meshes read the phase per instance (aWalk), single meshes from a uniform (uWalk).
const WALK_GLSL = /* glsl */`
  attribute vec2 limb;
  #ifdef USE_INSTANCING
    attribute float aWalk;
    #define WALK_PHASE aWalk
  #else
    uniform float uWalk;
    #define WALK_PHASE uWalk
  #endif
  vec3 walkRot(vec3 p, float a, float py) {
    p.y -= py;
    float c = cos(a), s = sin(a);
    return vec3(p.x, p.y * c - p.z * s + py, p.y * s + p.z * c);
  }`;
const WALK_ANGLE = 'float walkA = sin(WALK_PHASE) * 0.75 * limb.x;';
function addWalk(mat, walkU) {
  const prev = mat.onBeforeCompile, prevKey = mat.customProgramCacheKey;
  mat.onBeforeCompile = (sh, r) => {
    prev.call(mat, sh, r);
    if (walkU) sh.uniforms.uWalk = walkU;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\n' + WALK_GLSL)
      .replace('#include <beginnormal_vertex>', `#include <beginnormal_vertex>
        ${WALK_ANGLE}
        objectNormal = walkRot(objectNormal, walkA, 0.0);`)
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        transformed = walkRot(transformed, walkA, limb.y);`);
  };
  mat.customProgramCacheKey = () => prevKey.call(mat) + '_walk' + (walkU ? 'U' : 'I');
  return mat;
}
// ink outline that follows the walk cycle
function walkOutlineMaterial(width, walkU) {
  const m = new THREE.MeshBasicMaterial({ color: 0x1a1022, side: THREE.BackSide });
  m.onBeforeCompile = sh => {
    if (walkU) sh.uniforms.uWalk = walkU;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\n' + WALK_GLSL)
      .replace('#include <begin_vertex>', `${WALK_ANGLE}
        vec3 transformed = walkRot(position, walkA, limb.y) + walkRot(normal, walkA, 0.0) * ${width.toFixed(3)};`);
  };
  m.customProgramCacheKey = () => 'walkOutline_' + width + (walkU ? 'U' : 'I');
  return m;
}

function jollyRoger(bg, ink, strawHat) {
  const { ctx, tex } = canvasTex(256, 256);
  ctx.fillStyle = bg; ctx.fillRect(0, 0, 256, 256);
  ctx.strokeStyle = ink; ctx.fillStyle = ink; ctx.lineCap = 'round'; ctx.lineWidth = 22;
  ctx.beginPath(); ctx.moveTo(62, 92); ctx.lineTo(194, 212); ctx.moveTo(194, 92); ctx.lineTo(62, 212); ctx.stroke();
  for (const [x, y] of [[62, 92], [194, 92], [62, 212], [194, 212]]) {
    ctx.beginPath(); ctx.arc(x - 9, y, 13, 0, Math.PI * 2); ctx.arc(x + 9, y, 13, 0, Math.PI * 2); ctx.fill();
  }
  ctx.beginPath(); ctx.arc(128, 130, 56, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.roundRect(100, 158, 56, 36, 10); ctx.fill();
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.ellipse(106, 130, 15, 18, 0, 0, Math.PI * 2); ctx.ellipse(150, 130, 15, 18, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(128, 148); ctx.lineTo(120, 162); ctx.lineTo(136, 162); ctx.fill();
  for (const x of [114, 128, 142]) ctx.fillRect(x - 2, 174, 4, 20);
  if (strawHat) {
    ctx.lineWidth = 4; ctx.strokeStyle = '#3b2210';
    ctx.fillStyle = '#f2cf6b';
    ctx.beginPath(); ctx.ellipse(128, 84, 96, 18, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

}

function updateEnv(dt) {

  scrollDist += SCROLL * dt;

// Kenney pirate kit: same pier and lanes, dressed with the pack's palms, ships and walls.
const kitRng = (() => {
  let a = 11;
  return () => {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
})();
const kitRand = (a, b) => a + kitRng() * (b - a);

// models: Kenney Pirate Kit (CC0), meshopt + WebP GLBs in assets/models (tools/optimize-glb.mjs, art/monster-lane)
function mountPirateKit() {
  const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
  const cache = new Map();
  const load = (name) => {
    if (!cache.has(name)) cache.set(name, loader.loadAsync(`assets/models/${name}.glb`).then(gltf => {
      gltf.scene.traverse(o => {
        if (!o.isMesh) return;
        o.castShadow = true;
        o.receiveShadow = true;
        const src = Array.isArray(o.material) ? o.material : [o.material];
        const next = src.map(m => toon({ map: m.map || null, color: 0xffffff }));
        o.material = Array.isArray(o.material) ? next : next[0];
      });
      return gltf.scene;
    }));
    return cache.get(name);
  };
  const firstMesh = (obj) => {
    let mesh = null;
    obj.traverse(o => { if (!mesh && o.isMesh) mesh = o; });
    return mesh;
  };
  // meshopt stores positions quantized and puts the scale on the node: bake it into plain float geometry
  const bakedGeo = (obj) => {
    obj.updateMatrixWorld(true);
    const mesh = firstMesh(obj);
    if (!mesh.userData.flat) mesh.userData.flat = floatGeo(mesh.geometry).applyMatrix4(mesh.matrixWorld);
    return mesh.userData.flat;
  };
  const scatter = (src, places, shadow) => {
    const mesh = firstMesh(src);
    const im = new THREE.InstancedMesh(bakedGeo(src), mesh.material, places.length);
    im.castShadow = shadow;
    im.receiveShadow = true;
    const d = new THREE.Object3D();
    for (let i = 0; i < places.length; i++) {
      const p = places[i];
      d.position.set(p.x, p.y || 0, p.z);
      d.rotation.set(p.rx || 0, p.ry || 0, p.rz || 0);
      d.scale.set(p.sx || p.s || 1, p.sy || p.s || 1, p.sz || p.s || 1);
      d.updateMatrix();
      im.setMatrixAt(i, d.matrix);
    }
    im.computeBoundingSphere();
    scene.add(im);
    return im;
  };
  const beach = (n, gap) => {
    const out = [];
    let guard = 0;
    while (out.length < n && guard++ < 5000) {
      const x = kitRand(-40, 40), z = kitRand(PIER_END + 2, ROAD_NEAR + 4);
      if (Math.abs(x) < FENCE_OUT + 2.2) continue;
      if (islandSdf(x, z) > -1.4) continue;
      if (out.some(p => Math.hypot(p.x - x, p.z - z) < gap)) continue;
      out.push({ x, z, ry: kitRand(0, Math.PI * 2), s: 1 });
    }
    return out;
  };
  const afloat = (g, baseY, amp, speed, phase, roll) => {
    g.position.y = baseY;
    scene.add(g);
    kitFloats.push({ g, baseY, amp, speed, phase, roll });
  };
  const deckYOf = (obj) => {
    const pos = bakedGeo(obj).attributes.position;
    const ys = [];
    for (let i = 0; i < pos.count; i++) {
      const y = pos.getY(i);
      if (Math.abs(pos.getX(i)) < 1.7 && Math.abs(pos.getZ(i)) < 3.2 && y > 0.5 && y < 4.2) ys.push(y);
    }
    ys.sort((a, b) => a - b);
    return ys.length ? ys[Math.floor(ys.length * 0.62)] : 2.2;
  };

  load('castle-wall').then(async wall => {
    const [palmA, palmB, palmC, palmD, rockA, rockB, grass, barrel, crate, flag, gate, dock, plank, cannon, towerS, towerL] = await Promise.all([
      'palm-straight', 'palm-bend', 'palm-detailed-straight', 'palm-detailed-bend',
      'rocks-sand-a', 'rocks-a', 'grass-patch', 'barrel', 'crate', 'flag-pirate',
      'castle-gate', 'structure-platform-dock', 'platform-planks', 'cannon',
      'tower-complete-small', 'tower-complete-large',
    ].map(load));
    const ships = await Promise.all([
      'ship-pirate-large', null, 'ship-wreck', 'ship-pirate-small', 'ship-ghost',
      'boat-row-small', 'boat-row-large',
    ].map(n => n && load(n)));

    const wallRun = [];
    for (const side of [-1, 1]) {
      const x = side * (FENCE_OUT + 1.15);
      for (let z = PIER_END + 2; z <= ROAD_NEAR - 1; z += 2) {
        wallRun.push({ x, y: 0, z, ry: side > 0 ? -Math.PI / 2 : Math.PI / 2, s: 1 });
      }
    }
    for (let x = -FENCE_OUT; x <= FENCE_OUT; x += 2) {
      if (Math.abs(x) < 3.2) continue;
      wallRun.push({ x, y: 0, z: ROAD_NEAR + 1.2, ry: Math.PI, s: 1 });
    }
    scatter(wall, wallRun, true);

    const spots = beach(22, 4.2);
    const palmKinds = [palmA, palmB, palmC, palmD];
    for (let t = 0; t < palmKinds.length; t++) {
      const mine = spots.filter((_, i) => i % palmKinds.length === t).map(p => ({ ...p, s: kitRand(1.15, 1.75) }));
      if (mine.length) scatter(palmKinds[t], mine, true);
    }
    const rockSpots = beach(10, 5).map(p => ({ ...p, s: kitRand(0.38, 0.72) }));
    if (rockSpots.length > 1) {
      scatter(rockA, rockSpots.filter((_, i) => i % 2 === 0), true);
      scatter(rockB, rockSpots.filter((_, i) => i % 2 === 1), true);
    }
    const tufts = beach(14, 3.2).map(p => ({ ...p, y: 0.02, s: kitRand(1.1, 1.8) }));
    if (tufts.length) scatter(grass, tufts, false);

    const flags = [];
    for (let i = 0; i < wallRun.length; i += 5) {
      const w = wallRun[i];
      flags.push({ x: w.x, y: 4.35, z: w.z, ry: w.ry, s: 0.9 });
    }
    scatter(flag, flags, false);

    for (const [x, z, ry] of [[-16.8, 12.5, 0.4], [16.8, 12.5, -0.4], [-16.8, -34, 0.2], [16.8, -34, -0.2]]) {
      const t = towerS.clone(true);
      t.position.set(x, 0, z);
      t.rotation.y = ry;
      scene.add(t);
    }
    const keep = towerL.clone(true);
    keep.position.set(-24, 0, -6);
    keep.rotation.y = 0.6;
    scene.add(keep);
    for (const side of [-1, 1]) {
      const g = gate.clone(true);
      g.position.set(side * (FENCE_OUT + 1.15), 0, 2);
      g.rotation.y = side > 0 ? -Math.PI / 2 : Math.PI / 2;
      scene.add(g);
    }

    const props = [];
    for (const [x, z] of [[-16.2, 8], [16.4, 9], [-15.5, -30], [18, -28], [-22, -4]]) {
      props.push({ src: barrel, x, z, n: 3 });
      props.push({ src: crate, x: x + 1.3, z: z + 0.8, n: 2 });
    }
    for (const p of props) {
      const places = [];
      for (let i = 0; i < p.n; i++) places.push({ x: p.x + (i % 2) * 0.7, z: p.z + Math.floor(i / 2) * 0.7, ry: i, s: 1 });
      scatter(p.src, places, true);
    }
    for (const side of [-1, 1]) {
      const c = cannon.clone(true);
      c.position.set(side * (FENCE_OUT + 3.4), 0, -8);
      c.rotation.y = side > 0 ? 0 : Math.PI;
      scene.add(c);
    }

    const docks = [];
    for (const x of [-10, -5, 0, 5, 10]) docks.push({ x, y: WATER_Y + 0.15, z: PIER_END - 1.6, ry: 0, s: 1.15 });
    for (const side of [-1, 1]) for (const z of [-34, -28, -22]) {
      docks.push({ x: side * (FENCE_OUT + 2.4), y: WATER_Y + 0.05, z, ry: Math.PI / 2, s: 1 });
    }
    scatter(dock, docks, true);
    scatter(plank, [
      { x: -9.2, y: 0.02, z: PIER_END + 1.2, ry: 0.2, s: 1 },
      { x: 8.4, y: 0.02, z: PIER_END + 2.4, ry: 1.1, s: 1 },
      { x: -17.5, y: 0.02, z: 6, ry: 0.4, s: 1.1 },
      { x: 18.2, y: 0.02, z: -12, ry: -0.3, s: 1.1 },
    ], false);

    const warm = (root, hex) => {
      root.traverse(o => {
        if (!o.isMesh || !o.material) return;
        const list = Array.isArray(o.material) ? o.material : [o.material];
        for (const m of list) if (m.color) m.color.set(hex);
      });
    };
    warm(wall, 0xffe3b8);
    warm(towerS, 0xfff4e4);
    warm(towerL, 0xfff4e4);
    warm(gate, 0xffe3b8);
    warm(dock, 0xfff8ee);
    warm(plank, 0xfff8ee);

    const [pirate, , wreck, skiff, ghost, rowA, rowB] = ships;
    const moor = pirate.clone(true);
    const deck = deckYOf(pirate);
    const moorScale = clamp((DECK_Y - WATER_Y) / deck, 1.5, 2.9);
    moor.scale.setScalar(moorScale);
    moor.rotation.y = Math.PI / 2;

    const boatA = rowA.clone(true);

    palms.mesh.visible = palms.ol.visible = false;

    if (pierPiles) pierPiles.visible = false;
    for (const rail of laneRails) if (Math.abs(rail.position.x) > FENCE_IN + 1) rail.visible = false;
    window.__pirateKit = window.__models = true;
  }).catch(err => { console.warn('Pirate kit', err); window.__pirateKit = window.__models = String(err && err.message || err); });
}

    b.add(new THREE.SphereGeometry(0.05, 6, 4), 0xd62828, 0, 1.44, -0.2);
    for (const s of [-1, 1]) b.add(new THREE.BoxGeometry(0.04, 0.16, 0.02), 0xd62828, s * 0.04, 1.34, -0.22, 0, 0, s * 0.3);
  } else {
    b.add(new THREE.BoxGeometry(0.09, 0.08, 0.02), 0x111111, 0.07, 1.42, 0.195);                     // eyepatch
    b.add(new THREE.TorusGeometry(0.2, 0.012, 4, 20), 0x111111, 0, 1.44, 0, 0.35, 0, 0);

  return b.build();

// all weapon models point toward -z (forward, away from camera)
function buildWeaponModel(id) {
  const g = new THREE.Group();
  // wood stays matte, everything else is painted/bare metal
  const M = (c, e) => c === 0x8b5a2b ? toonMat(c, e, 0.8, 0) : toonMat(c, e, 0.3, 0.75);
  const box = (w, h, d, c, x, y, z, e = 0) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), M(c, e));
    m.position.set(x, y, z); m.castShadow = true; g.add(m); return m;
  };
  const tube = (r, l, c, x, y, z, e = 0) => {
    const geo = new THREE.CylinderGeometry(r, r, l, 14); geo.rotateX(Math.PI / 2);
    const m = new THREE.Mesh(geo, M(c, e));
    m.position.set(x, y, z); m.castShadow = true; g.add(m); return m;
  };
  switch (id) {
    case 'pistol':
      box(0.32, 0.36, 1.0, 0x3d4451, 0, 0, 0);
      box(0.26, 0.55, 0.3, 0x23272f, 0, -0.38, 0.25);
      tube(0.09, 0.5, 0x23272f, 0, 0.04, -0.7);
      box(0.34, 0.08, 0.8, 0xffd23f, 0, 0.2, 0, 0.3);
      break;
    case 'smg':
      box(0.6, 0.55, 1.1, 0x2b2d42, 0, 0, 0.3);
      box(0.3, 0.5, 0.3, 0x23272f, 0, -0.45, 0.5);
      for (let i = 0; i < 6; i++) {
        const a = i / 6 * Math.PI * 2;
        tube(0.07, 1.6, 0x8d99ae, Math.cos(a) * 0.17, Math.sin(a) * 0.17, -0.9);
      }
      tube(0.28, 0.12, 0xff9f1c, 0, 0, -0.4, 0.4);
      tube(0.28, 0.12, 0xff9f1c, 0, 0, -1.55, 0.4);
      break;
    case 'shotgun':
      box(0.28, 0.34, 0.9, 0x8b5a2b, 0, -0.08, 0.75);
      box(0.38, 0.42, 0.7, 0x2b2d42, 0, 0, 0.05);
      tube(0.1, 1.7, 0x495057, -0.1, 0.05, -1.1);
      tube(0.1, 1.7, 0x495057, 0.1, 0.05, -1.1);
      box(0.3, 0.16, 0.5, 0x8b5a2b, 0, -0.12, -0.7);
      break;
    case 'laser':
      box(0.5, 0.5, 1.3, 0xf1f3f5, 0, 0, 0.2);
      box(0.12, 0.5, 0.8, 0x3ff3ff, 0.3, 0, 0.2, 0.8);
      box(0.12, 0.5, 0.8, 0x3ff3ff, -0.3, 0, 0.2, 0.8);
      tube(0.16, 0.9, 0x3ff3ff, 0, 0, -0.85, 1.0);
      tube(0.22, 0.1, 0x495057, 0, 0, -0.45);
      break;
    case 'rocket': {
      tube(0.36, 2.1, 0x606c38, 0, 0, 0);
      tube(0.4, 0.18, 0x283618, 0, 0, -1.0);
      tube(0.4, 0.18, 0x283618, 0, 0, 1.0);
      const cone = new THREE.ConeGeometry(0.28, 0.6, 14); cone.rotateX(-Math.PI / 2);
      const tip = new THREE.Mesh(cone, toonMat(0xff4d2e, 0.3)); tip.position.set(0, 0, -1.3); g.add(tip);
      box(0.2, 0.5, 0.25, 0x283618, 0, -0.5, 0.2);
      break;
    }
    case 'plasma': {
      box(0.6, 0.55, 1.2, 0x3c096c, 0, 0, 0.3);
      const core = new THREE.Mesh(new THREE.SphereGeometry(0.38, 16, 12), toonMat(0xc77dff, 1.0));
      core.position.set(0, 0, -0.5); g.add(core);
      for (let i = 0; i < 3; i++) {
        const t = new THREE.Mesh(new THREE.TorusGeometry(0.34, 0.06, 8, 20), toonMat(0x7b2cbf));
        t.position.set(0, 0, -0.9 - i * 0.3); g.add(t);
      }
      break;
    }
  }
  return g;
}

const ARM_DOWN = new THREE.Vector3(0, -1, 0), armTmp = new THREE.Vector3();
function aimArms() {
  for (const a of hero.arms) {
    a.hand.position.copy(gunMount.position).add(a.grip);
    armTmp.copy(a.hand.position).sub(a.pivot.position);
    const len = armTmp.length();
    a.pivot.quaternion.setFromUnitVectors(ARM_DOWN, armTmp.divideScalar(len));
    a.pivot.scale.set(1, len, 1);
  }
}

function shockwave(x, z, radius, color, life = 0.35) {
  const r = rings.find(r => r.life <= 0) || rings.reduce((a, b) => (a.life < b.life ? a : b));
  r.life = r.max = life; r.radius = radius;
  r.mesh.position.set(x, 0.12, z);
  r.mesh.material.color.setHex(color);
  r.mesh.visible = true;
}
function updateRings(dt) {
  for (const r of rings) {
    if (r.life <= 0) continue;
    r.life -= dt;
    const t = 1 - Math.max(0, r.life) / r.max;
    r.mesh.scale.setScalar(r.radius * (0.25 + 0.9 * t));
    r.mesh.material.opacity = 1 - t;
    if (r.life <= 0) r.mesh.visible = false;
  }
}

const curWeapon = () => WEAPONS[state.weaponTier];
const curDmg = () => curWeapon().dmg * (1 + 0.1 * state.dmgLvl) * (1 + 0.06 * armLv('powder'));
const curRate = () => curWeapon().rate * (1 + 0.08 * state.rateLvl) * (1 + 0.05 * armLv('hands'));
const curShots = () => curWeapon().pellets + state.barrels;
const curDps = () => curDmg() * curShots() * curRate();

// =====================================================================
// AUDIO (tiny WebAudio synth)
// =====================================================================
// master bus with a compressor (shared/gameroom-audio.js): hundreds of hits a second never clip
const audio = createAudioBus({ storageKey: 'monster-lane:audio' });
audio.ambience({ wind: 0.8, birds: 0.25 });   // surf + a few gulls
const sfx = (() => {
  const last = {};
  const ok = (key, ms) => { const n = performance.now(); if (n - (last[key] || 0) < ms) return false; last[key] = n; return true; };
  const tone = (f, d, type = 'square', v = 0.05, f2 = null, delay = 0, pan = 0) => audio.tone({ f, d, type, v, f2, delay, pan });
  const px = x => clamp(x / FENCE_OUT, -1, 1) * 0.7;
  return {
    ensure() { audio.ensure(); },
    toggle() { return audio.toggleMute(); },
    get muted() { return audio.muted; },
    shoot() { if (ok('shoot', 75)) tone(880, 0.05, 'square', 0.012, 300, 0, px(state.playerX)); },
    pop(x = 0) { if (ok('pop', 45)) tone(rand(260, 380), 0.08, 'triangle', 0.05, 80, 0, px(x)); },
    hit() { if (ok('hit', 60)) tone(1400, 0.03, 'square', 0.008); },
    boom(x = 0) { if (ok('boom', 90)) { audio.noise({ d: 0.5, v: 0.22, f: 1600, f2: 60, pan: px(x) }); tone(70, 0.45, 'sine', 0.12, 30); } },
    upgrade() { [523, 659, 784].forEach((f, i) => tone(f, 0.12, 'triangle', 0.08, null, i * 0.07)); },
    weapon() { [392, 523, 659, 1046].forEach((f, i) => tone(f, 0.18, 'square', 0.05, null, i * 0.09)); },
    boss() { tone(110, 0.9, 'sawtooth', 0.09, 50); tone(55, 1.1, 'sine', 0.14, 40); },
    hurt() { if (ok('hurt', 120)) tone(160, 0.2, 'sawtooth', 0.06, 60); },
    revive() { [262, 330, 392, 523, 659].forEach((f, i) => tone(f, 0.22, 'triangle', 0.08, null, i * 0.08)); },
  };
})();

const uiRoot = $('ui');
let bannerTimer = null;
function banner(main, sub = '', ms = 2000) {
  $('bannerMain').textContent = main;
  $('bannerSub').textContent = sub;
  $('banner').classList.add('show');
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(() => $('banner').classList.remove('show'), ms);
}

const projV = new THREE.Vector3();
let floatCount = 0;
function floatText(text, x, y, z, cls = '') {
  if (floatCount > 12 && cls !== 'big') return;
  floatCount++;
  setTimeout(() => floatCount--, 1250);
  projV.set(x, y, z).project(camera);
  const el = document.createElement('div');
  el.className = 'float stroke ' + cls;
  el.textContent = text;
  el.style.left = ((projV.x + 1) / 2 * innerWidth) + 'px';
  el.style.top = ((1 - projV.y) / 2 * innerHeight) + 'px';
  uiRoot.appendChild(el);
  setTimeout(() => el.remove(), 1250);
}

const hudCache = {};
function setT(id, v) { if (hudCache[id] !== v) { hudCache[id] = v; $(id).textContent = v; } }
function setW(id, frac) {
  const v = (clamp(frac, 0, 1) * 100).toFixed(1) + '%';
  if (hudCache[id] !== v) { hudCache[id] = v; $(id).style.width = v; }
}

function updateWeaponHud() {
  const w = curWeapon();
  $('wName').textContent = w.name;
  const dmg = curDmg(), rate = curRate(), n = curShots();
  const chips = [
    ['c-dmg', '⚔', tr('c_dmg', { n: Math.round(dmg) })],
    ['c-shot', '✦', tr('c_shots', { n })],
    ['c-rate', '⚡', `${rate.toFixed(1)}/s`],
    ['c-dps', '☠', `DPS ~${Math.round(dmg * n * rate)}`],
  ];
  if (w.pierce) chips.push(['c-pierce', '➶', tr('c_pierce', { n: w.pierce })]);
  if (w.splash) chips.push(['c-boom', '✹', tr('c_boom')]);
  $('wStats').innerHTML = chips.map(([cls, icon, text]) => `<span class="chip ${cls}"><i>${icon}</i>${text}</span>`).join('');
  $('wTier').innerHTML = WEAPONS.map((_, i) => `<span class="${i <= state.weaponTier ? 'on' : ''}">☠</span>`).join('');
  const lv = (cls, name, v, max) =>
    `<div class="lv ${cls}">${name} ${v}/${max}<div class="bar"><b style="width:${v / max * 100}%"></b></div></div>`;
  $('wLevels').innerHTML =
    lv('lv-shot', tr('lv_shot'), state.barrels, MAX_BARRELS) +
    lv('lv-dmg', tr('lv_dmg'), state.dmgLvl, MAX_DMG_LVL) +
    lv('lv-rate', tr('lv_rate'), state.rateLvl, MAX_RATE_LVL);
  placeBossBar();
}
// portrait phones: the weapon strip can wrap to 1–3 rows, so the boss bar follows its height
function placeBossBar() {
  $('bossWrap').style.top = innerWidth <= 600 ? ($('weapon').getBoundingClientRect().bottom + 6) + 'px' : '';
}
addEventListener('resize', placeBossBar);

let shownScore = 0;
function updateHud() {
  setT('wave', tr('wave', { n: state.wave }));
  // score counts up instead of jumping
  shownScore = state.score < shownScore ? state.score : shownScore + Math.ceil((state.score - shownScore) * 0.2);
  setT('score', String(shownScore));
  const c = state.combo >= 10 ? '×' + state.combo : '';
  if (hudCache.combo !== c) {
    hudCache.combo = c;
    $('combo').classList.toggle('on', !!c);
    if (c) { $('comboN').textContent = c; const el = $('combo'); el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse'); }
  }
  setT('baseTxt', String(Math.max(0, Math.ceil(state.baseHp))));
  setW('basefill', state.baseHp / baseMax());
}

// =====================================================================
// LABEL DRAWING (canvas textures on gates / pedestals / bosses)
// =====================================================================
function drawGate(g) {
  const { ctx, tex, w: W, h: H } = g.lbl;
  const d = g.def;
  ctx.clearRect(0, 0, W, H);
  const gr = ctx.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, d.c1); gr.addColorStop(1, d.c2);
  ctx.fillStyle = gr;
  ctx.beginPath(); ctx.roundRect(4, 4, W - 8, H - 8, 18); ctx.fill();
  ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.stroke();

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.font = `84px ${FONT}`;
  ctx.lineWidth = 10; ctx.strokeStyle = d.ink;
  ctx.strokeText(d.label, W / 2, 70);
  ctx.fillStyle = '#fff'; ctx.fillText(d.label, W / 2, 70);
  ctx.font = `22px ${FONT}`;
  ctx.lineWidth = 5; ctx.strokeText(d.sub, W / 2, 120);
  ctx.fillText(d.sub, W / 2, 120);

  const bw = 190, bx = (W - bw) / 2, by = 142, bh = 30;
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 12); ctx.fill();
  const fw = bw * clamp(g.hp / g.maxHp, 0, 1);
  if (fw > 1) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.roundRect(bx, by, fw, bh, 12); ctx.fill(); }
  ctx.font = `24px ${FONT}`;
  ctx.fillStyle = d.ink;
  ctx.fillText(String(Math.max(0, Math.ceil(g.hp))), W / 2, by + bh / 2 + 1);
  tex.needsUpdate = true;
}

function drawPed(p) {
  const { ctx, tex, w: W, h: H } = p.lbl;
  ctx.clearRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
  ctx.font = `26px ${FONT}`;
  ctx.lineWidth = 6; ctx.strokeStyle = '#1b1b2f';
  ctx.strokeText(p.w.name.toUpperCase(), W / 2, 30);
  ctx.fillStyle = '#ffe066'; ctx.fillText(p.w.name.toUpperCase(), W / 2, 30);
  ctx.font = `92px ${FONT}`;
  ctx.lineWidth = 12;
  const t = String(Math.max(0, Math.ceil(p.hp)));
  ctx.strokeText(t, W / 2, 116);
  ctx.fillStyle = '#fff'; ctx.fillText(t, W / 2, 116);
  tex.needsUpdate = true;
}

function drawBoss(b) {
  const { ctx, tex, w: W, h: H } = b.lbl;
  ctx.clearRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.font = `28px ${FONT}`;
  ctx.lineWidth = 6; ctx.strokeStyle = '#1b1b2f';
  ctx.strokeText(b.name, W / 2, 28);
  ctx.fillStyle = '#ffe066'; ctx.fillText(b.name, W / 2, 28);
  ctx.font = `40px ${FONT}`;
  ctx.lineWidth = 8;
  const t = `${Math.max(0, Math.ceil(b.hp))} / ${b.maxHp}`;
  ctx.strokeText(t, W / 2, 72);
  ctx.fillStyle = '#fff'; ctx.fillText(t, W / 2, 72);
  const bw = 280, bx = (W - bw) / 2, by = 96, bh = 16;
  ctx.fillStyle = '#1b1b2f'; ctx.beginPath(); ctx.roundRect(bx - 3, by - 3, bw + 6, bh + 6, 8); ctx.fill();
  ctx.fillStyle = '#e63946';
  const fw = bw * clamp(b.hp / b.maxHp, 0, 1);
  if (fw > 1) { ctx.beginPath(); ctx.roundRect(bx, by, fw, bh, 6); ctx.fill(); }
  tex.needsUpdate = true;
}

// crowd creeps; a pistol that chews the front rank can hold, extra barrels push it back
function marchSpeed() {
  return 1.8 + Math.min(1.35, (state.wave - 1) * 0.12);
}

function spawnMonster(x, z, brute, col) {
  if (monsters.length >= MAX_MOBS) return;
  const w = state.wave;
  const baseHp = Math.round(10 * Math.pow(1.65, w - 1)) + (w - 1) * 4;
  const s = brute ? rand(2.05, 2.35) : rand(0.96, 1.08);
  const hp = brute ? baseHp * 12 : Math.max(10, Math.round(baseHp * 0.85));
  if (col == null) col = clamp(Math.round((x - COL_X0) / PACK_X), 0, COL_N - 1);
  monsters.push({
    kind: 'mob', x, z, hp, maxHp: hp, s, col,
    hw: (brute ? 0.5 : 0.48) * s, hd: (brute ? 0.46 : 0.42) * s,
    speed: marchSpeed(),
    phase: rand(0, 6.28), walk: rand(0, 6.28), flash: 0, dead: false, brute,
    dmg: brute ? 8 : 1, score: brute ? 60 : 6,
    variant: brute ? 2 : 0,
  });
}

// one rank across the lane, shaken a little so the files don't turn into stripes
function spawnRow(z, brute) {
  const bruteCol = brute ? 4 + Math.floor(Math.random() * Math.max(1, COL_N - 8)) : -1;
  for (let c = 0; c < COL_N; c++) {
    const x = COL_X0 + c * PACK_X + rand(-0.1, 0.1);
    if (Math.abs(x) > MOB_HALF) continue;
    spawnMonster(x, z + rand(-0.1, 0.1), c === bruteCol, c);
  }
}

// the opening mass stands on the ramp and the far pier, then walks down
function fillCrowd() {
  const front = -27;
  const rows = Math.min(42, Math.floor((MAX_MOBS - 80) / COL_N));
  for (let r = 0; r < rows; r++) spawnRow(front - r * PACK_Z, r % 8 === 7);
}

function spawnGate() {
  const capped = { barrel: state.barrels >= MAX_BARRELS, dmg: state.dmgLvl >= MAX_DMG_LVL, rate: state.rateLvl >= MAX_RATE_LVL };
  const types = ['barrel', 'barrel', 'dmg', 'rate'].filter(t => !capped[t]);
  if (!types.length) return;   // fully upgraded
  const type = types[Math.floor(Math.random() * types.length)];
  const def = GATE_DEFS[type];
  // HP = a few seconds of the player's own firepower (never out of reach, never instant);
  // every upgrade taken makes the next one take a bit longer
  const secs = 0.8 * Math.pow(1.04, state.upgradesTaken) * rand(0.9, 1.15);
  const hp = Math.round(Math.max(25, curDps() * secs) / 5) * 5;

  const group = new THREE.Group();
  const postMat = toonMat(0xeef6ff, 0, 0.2, 0.6);
  for (const sx of [-2.3, 2.3]) {
    const p = new THREE.Mesh(gatePostGeo, postMat);
    p.position.x = sx; p.castShadow = true; group.add(p);
  }
  const top = new THREE.Mesh(gateTopGeo, toonMat(def.color, 0.4));
  top.position.y = 3.6; top.castShadow = true; group.add(top);
  addOutline(group, 0.04);
  const lbl = canvasTex(256, 192);
  const panel = new THREE.Mesh(gatePanelGeo, gateMaterial(lbl.tex));
  panel.position.y = 1.95;
  group.add(panel);
  group.position.set(UP_X, 0, ITEM_Z);
  group.scale.setScalar(0.01);
  scene.add(group);

  const g = { kind: 'gate', type, def, x: UP_X, z: ITEM_Z, hw: 2.35, hd: 0.6, hp, maxHp: hp, age: 0,
              group, panel, lbl, dirty: false, flash: 0, dead: false, gone: false };
  drawGate(g);
  gates.push(g);
}

// the next chest the player has not already let roll past
function nextOfferTier() {
  for (let t = state.weaponTier + 1; t < WEAPONS.length; t++) {
    if (!state.skippedWeapons.has(t)) return t;
  }
  return null;
}

function spawnPedestal() {
  const tier = nextOfferTier();
  if (tier == null) return;
  const w = WEAPONS[tier];
  const group = new THREE.Group();
  const base = new THREE.Mesh(pedBaseGeo, toonMat(0x8b5a2b)); base.castShadow = base.receiveShadow = true;
  const top = new THREE.Group();                                   // treasure chest: lid + gold straps + lock
  const gold = toonMat(0xffc933, 0.1);
  top.add(new THREE.Mesh(pedLidGeo, toonMat(0x6b3f1d)));
  for (const x of [-1.25, 1.25]) {
    const band = new THREE.Mesh(pedBandGeo, gold); band.position.x = x; top.add(band);
    const strap = new THREE.Mesh(pedStrapGeo, gold); strap.position.x = x; top.add(strap);
  }
  const lock = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.5, 0.12), gold); lock.position.set(0, 1.85, 1.1); top.add(lock);
  top.traverse(o => { o.castShadow = true; });
  addOutline(base, 0.04); addOutline(top, 0.04);
  const lbl = canvasTex(256, 128);
  const label = new THREE.Mesh(pedLabelGeo, new THREE.MeshBasicMaterial({ map: lbl.tex, transparent: true, color: new THREE.Color().setScalar(1.5) }));
  label.position.set(0, 0.85, 1.215);
  const model = buildWeaponModel(w.id);
  model.scale.setScalar(1.5);
  model.position.y = 3.6;
  addOutline(model, 0.03);
  group.add(base, top, label, model);
  group.position.set(WPN_X, 0, ITEM_Z);
  group.scale.setScalar(0.01);
  scene.add(group);

  // never tougher than the wave-based price, but cheaper when the player is underpowered
  const byWave = w.capture * (1 + 0.5 * (state.wave - 1));
  const hp = Math.round(Math.min(byWave, Math.max(w.capture * 0.4, curDps() * rand(2.2, 2.8))) / 10) * 10;
  const p = { kind: 'ped', tier, w, x: WPN_X, z: ITEM_Z, hw: 2.1, hd: 1.5, hp, maxHp: hp, age: 0,
              group, lbl, model, dirty: false, flash: 0, dead: false, gone: false };
  drawPed(p);
  pedestals.push(p);
}

function spawnBoss() {
  state.bossSpawned = true;
  const w = state.wave;
  const hp = bossHpFor(w);
  const s = Math.min(4 + w * 0.4, 7);
  const pal = (w - 1) % BOSS_TYPES.length;
  const walkU = { value: 0 };
  const mat = addWalk(toon({ vertexColors: true }), walkU);
  const body = new THREE.Mesh(bossGeos[pal], mat);
  body.castShadow = true;
  body.add(new THREE.Mesh(bossGeos[pal], walkOutlineMaterial(0.02, walkU)));
  const inner = new THREE.Group();
  inner.add(body);
  inner.scale.setScalar(s);

  const lbl = canvasTex(512, 128);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: lbl.tex, transparent: true, color: new THREE.Color().setScalar(1.5) }));
  sprite.scale.set(8, 2, 1);
  sprite.position.y = s * 1.72 + 1.2;

  const group = new THREE.Group();
  group.add(inner, sprite);
  group.position.set(0, groundY(SPAWN_Z), SPAWN_Z);
  scene.add(group);

  const b = { kind: 'boss', name: BOSS_TYPES[pal].name, x: 0, z: SPAWN_Z, hp, maxHp: hp, s,
              speed: Math.min(3.2, 1.6 + w * 0.14), hw: 0.55 * s, hd: 0.5 * s,
              group, inner, mat, lbl, sprite, walkU, flash: 0, dirty: false, lastDraw: 0,
              dead: false, gone: false, phase: 0, summon: 2, enraged: false };
  drawBoss(b);
  bosses.push(b);
  banner(tr('captain'), `${b.name} · ${hp} HP`, 2400);
  sfx.boss();
  state.shake = 0.6;
}

function removeObj(o) {
  scene.remove(o.group);
  if (o.lbl) o.lbl.tex.dispose();
  const shared = new Set([...matCache.values(), ...outlineMats.values()]);
  o.group.traverse(c => { if (c.material && !shared.has(c.material)) c.material.dispose(); });
}

// =====================================================================
// PARTICLES
// =====================================================================
function burst(x, y, z, color, count, speed = 6, size = 1) {
  const c = new THREE.Color(color);
  for (let i = 0; i < count; i++) {
    if (parts.length >= MAX_PARTS) parts.shift();
    const a = Math.random() * Math.PI * 2, u = Math.random();
    const sp = speed * rand(0.4, 1);
    const life = rand(0.4, 0.9);
    parts.push({
      x, y, z, vx: Math.cos(a) * sp * (1 - u * 0.5), vy: rand(2, 1.4 * speed), vz: Math.sin(a) * sp * (1 - u * 0.5),
      life, max: life, s: size * rand(0.6, 1.4), c, rot: rand(0, 6),
    });
  }
}

function updateParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt;
    if (p.life <= 0) { parts[i] = parts[parts.length - 1]; parts.pop(); continue; }
    p.vy -= 22 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    if (p.y < 0.1) { p.y = 0.1; p.vy *= -0.35; p.vx *= 0.7; p.vz *= 0.7; }
    p.rot += dt * 8;
  }
  let n = 0;
  for (const p of parts) {
    dummy.position.set(p.x, p.y, p.z);
    dummy.rotation.set(p.rot, p.rot * 0.7, 0);
    dummy.scale.setScalar(p.s * Math.max(0.05, Math.min(1, p.life / p.max * 1.5)));
    dummy.updateMatrix();
    partMesh.setMatrixAt(n, dummy.matrix);
    partMesh.setColorAt(n, p.c);
    n++;
  }
  partMesh.count = n;
  partMesh.instanceMatrix.needsUpdate = true;
  if (partMesh.instanceColor) partMesh.instanceColor.needsUpdate = true;
}

// =====================================================================
// COMBAT
// =====================================================================
function fire() {
  const w = curWeapon();
  const dmg = curDmg();
  const n = curShots();
  const col = new THREE.Color(w.color).multiplyScalar(3.2);   // HDR: tracers bloom but keep their hue
  const spanW = Math.min(0.42 * (n - 1), 3.4);
  for (let i = 0; i < n; i++) {
    if (bullets.length >= MAX_BULLETS) break;
    const k = n > 1 ? i / (n - 1) - 0.5 : 0;   // -0.5 .. 0.5
    let ang, ox;
    if (w.pellets > 1) { ang = k * 2 * w.spread + rand(-0.03, 0.03); ox = k * 0.5; }
    else { ang = rand(-w.spread, w.spread) + k * 0.05; ox = k * spanW; }
    const sp = w.speed * rand(0.95, 1.05);
    bullets.push({
      x: state.playerX + ox, z: PLAYER_Z - 2.2,
      vx: Math.sin(ang) * sp, vz: -Math.cos(ang) * sp,
      dmg, pierce: w.pierce, splash: w.splash, size: w.size, len: w.len, color: col, hits: null,
      cleave: w.splash ? 0 : (w.pellets > 1 ? 3 : (w.pierce ? 2 : CLEAVE_N)),
    });
  }
  state.muzzle = 0.05;
  muzzle.material.color.set(w.color).multiplyScalar(2.6);
  if (Math.random() < 0.5) sparks(state.playerX, 2.2, PLAYER_Z - 2.4, w.color, 1, 3, 3.5, 0.18);
  sfx.shoot();
}

function damage(t, amount) {
  if (t.dead) return;
  t.hp -= amount;
  t.flash = 0.07;
  t.dirty = true;
  if (t.hp <= 0) { t.dead = true; onKill(t); }
}

function explode(x, z, radius, dmg, exclude) {
  burst(x, 1, z, 0xff8c2e, 8, 9, 1.3);
  sparks(x, 1.2, z, 0xffa040, 16, 9, 4);
  smoke(x, 1, z, 3, radius / 3);
  shockwave(x, z, radius, 0xff8c2e);
  sfx.boom(x);
  const lists = [monsters, bosses, gates, pedestals];
  for (const list of lists) for (const t of list) {
    if (t === exclude || t.dead || shielded(t)) continue;
    const dx = Math.max(0, Math.abs(t.x - x) - t.hw);
    const dz = Math.max(0, Math.abs(t.z - z) - t.hd);
    if (dx * dx + dz * dz <= radius * radius) damage(t, dmg);
  }
}

function onKill(t) {
  switch (t.kind) {
    case 'mob':
      state.kills++;
      state.score += t.score;
      addCombo();
      // some of the crew get blown off the pier and tumble away (always the brutes)
      if (t.brute || Math.random() < 0.22) launchFlier(t);
      burst(t.x, 0.8 * t.s, t.z, t.brute ? 0x7a4a21 : t.variant ? 0xc1121f : 0x1f4e9c, t.brute ? 16 : 4, 5, t.brute ? 1.3 : 0.9);
      if (t.brute) { sparks(t.x, 1.2, t.z, 0xffd23f, 10, 6, 3); smoke(t.x, 1, t.z, 2); }
      sfx.pop(t.x);
      break;
    case 'boss':
      state.score += Math.round(t.maxHp / 2);
      burst(t.x, t.s, t.z, BOSS_TYPES[(state.wave - 1) % BOSS_TYPES.length].coat, 60, 14, 2);
      burst(t.x, t.s, t.z, 0xffd23f, 30, 10, 1.4);
      floatText(tr('bossDown'), t.x, t.s * 1.5, t.z, 'big');
      shockwave(t.x, t.z, t.s * 2.5, 0xffd23f, 0.7);
      sparks(t.x, t.s, t.z, 0xffd23f, 60, 14, 4, 0.35);
      sparks(t.x, t.s, t.z, 0xff5a36, 30, 10, 4, 0.3);
      smoke(t.x, t.s * 0.6, t.z, 8, 2);
      hitStop(0.5);
      punch(0.12);
      haptic(40);
      state.shake = 0.8;
      sfx.boom(); sfx.weapon();
      break;
    case 'gate':
      applyUpgrade(t);
      burst(t.x, 2, t.z, t.def.color, 14, 8, 1.1);
      sparks(t.x, 2, t.z, t.def.color, 24, 8, 3.5, 0.28);
      shockwave(t.x, t.z, 3.5, t.def.color, 0.45);
      punch(0.04);
      haptic(15);
      break;
    case 'ped':
      captureWeapon(t);
      burst(t.x, 2.5, t.z, t.w.color, 36, 10, 1.3);
      burst(t.x, 1, t.z, 0x9c7a54, 14, 7, 1.2);
      sparks(t.x, 3, t.z, t.w.color, 40, 11, 4, 0.32);
      sparks(t.x, 2, t.z, 0xffd23f, 24, 8, 3.5, 0.24);
      shockwave(t.x, t.z, 5, t.w.color, 0.6);
      hitStop(0.25);
      punch(0.08);
      haptic(30);
      break;
  }
}

function applyUpgrade(g) {
  let text;
  if (g.type === 'barrel') { state.barrels = Math.min(MAX_BARRELS, state.barrels + 1); text = tr('plusBarrel'); }
  else if (g.type === 'dmg') { state.dmgLvl = Math.min(MAX_DMG_LVL, state.dmgLvl + 1); text = tr('g_dmg'); }
  else { state.rateLvl = Math.min(MAX_RATE_LVL, state.rateLvl + 1); text = tr('g_rate'); }
  state.upgradesTaken++;
  state.score += 25;
  floatText(text, g.x, 3, g.z);
  rebuildGun();
  updateWeaponHud();
  sfx.upgrade();
}

function captureWeapon(p) {
  if (p.tier > state.weaponTier) {
    state.weaponTier = p.tier;
    rebuildGun();
    updateWeaponHud();
    banner(p.w.name.toUpperCase() + '!', tr('newWeapon'));
  } else {
    state.dmgLvl = Math.min(MAX_DMG_LVL, state.dmgLvl + 2);
    updateWeaponHud();
    banner(tr('bonus20'), tr('weaponBonus'));
  }
  state.score += 150;
  floatText(p.w.name.toUpperCase(), p.x, 4, p.z, 'big');
  sfx.weapon();
}

// bullet moved from z0 (farther from spawn) to z1 this frame; t is an axis-aligned box
// pirates still on the deck (behind the bow rail) can't be hit; items can't be hit while popping in
const SHIELD_Z = RAMP_TOP_Z - 0.3;
const shielded = t => (t.kind === 'mob' || t.kind === 'boss') ? t.z < SHIELD_Z : t.age < 0.4;
function segHit(t, x, z0, z1) {
  return z1 <= t.z + t.hd && z0 >= t.z - t.hd && Math.abs(x - t.x) <= t.hw;
}

// monsters are bucketed by z (1 m bins) once per frame; a bullet only tests the bins it crossed
const BIN_Z0 = SPAWN_Z - 12, BIN_N = Math.ceil(DEFENSE_Z + 2 - BIN_Z0), MAX_HD = 1.3;
const bins = Array.from({ length: BIN_N }, () => []);
const FEW_LISTS = [bosses, gates, pedestals];
function binMonsters() {
  for (const b of bins) b.length = 0;
  for (const m of monsters) {
    if (m.dead || m.z < SHIELD_Z) continue;
    const i = Math.floor(m.z - BIN_Z0);
    if (i >= 0 && i < BIN_N) bins[i].push(m);
  }
}
function cleaveAt(x, z, dmg, primary, nMax) {
  let n = 0;
  const r2 = CLEAVE_R * CLEAVE_R;
  const i0 = Math.max(0, Math.floor(z - CLEAVE_R - BIN_Z0));
  const i1 = Math.min(BIN_N - 1, Math.floor(z + CLEAVE_R - BIN_Z0));
  for (let k = i0; k <= i1; k++) for (const m of bins[k]) {
    if (m.dead || m.brute || m === primary) continue;
    const dx = m.x - x, dz = m.z - z;
    if (dx * dx + dz * dz <= r2) {
      damage(m, dmg);
      if (++n >= nMax) return;
    }
  }
}

function updateBullets(dt) {
  binMonsters();
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    const z0 = b.z;
    b.x += b.vx * dt; b.z += b.vz * dt;
    const z1 = b.z;
    let dead = false;
    const i0 = Math.max(0, Math.floor(z1 - MAX_HD - BIN_Z0)), i1 = Math.min(BIN_N - 1, Math.floor(z0 + MAX_HD - BIN_Z0));
    for (;;) {
      // nearest thing along the bullet path (largest z = first encountered)
      let best = null, bestZ = -Infinity;
      for (let k = i1; k >= i0; k--) {
        for (const t of bins[k]) {
          if (t.dead || t.z <= bestZ) continue;
          if (b.hits && b.hits.has(t)) continue;
          if (segHit(t, b.x, z0, z1)) { best = t; bestZ = t.z; }
        }
      }
      for (const list of FEW_LISTS) {
        for (const t of list) {
          if (t.dead || t.z <= bestZ || shielded(t)) continue;
          if (b.hits && b.hits.has(t)) continue;
          if (segHit(t, b.x, z0, z1)) { best = t; bestZ = t.z; }
        }
      }
      if (!best) break;
      damage(best, b.dmg);
      if (b.cleave && best.kind === 'mob' && !best.brute) cleaveAt(best.x, best.z, b.dmg, best, b.cleave);
      if (best.kind === 'mob') { if (Math.random() < 0.3) sparks(b.x, 1, best.z + best.hd, 0xffc06a, 1, 3, 2.5, 0.16); }
      else { sparks(b.x, 1.6, best.z + best.hd, 0xffffff, 2, 4, 3, 0.18); sfx.hit(); }
      if (b.splash) explode(b.x, best.z, b.splash, b.dmg * 0.5, best);
      if (b.pierce > 0) {
        b.pierce--;
        (b.hits ||= new Set()).add(best);
      } else { dead = true; break; }
    }
    if (!dead && b.z < SHIELD_Z && Math.abs(b.x) < FENCE_IN) {       // thunk into the bow
      dead = true;
      if (Math.random() < 0.15) burst(b.x, RAMP_Y + 0.5, SHIELD_Z, 0x6b4a2e, 1, 3, 0.5);
    }
    if (dead || b.z < ITEM_Z - 12 || Math.abs(b.x) > FENCE_OUT + 1.5) {
      bullets[i] = bullets[bullets.length - 1];
      bullets.pop();
    }
  }
  let n = 0;
  for (const b of bullets) {
    dummy.position.set(b.x, groundY(b.z) + 1.2 + 1.0 * Math.exp((b.z - PLAYER_Z + 2.2) / 4), b.z);
    dummy.rotation.set(0, Math.atan2(b.vx, b.vz), 0);
    dummy.scale.set(b.size, b.size, b.size * b.len);
    dummy.updateMatrix();
    bulletMesh.setMatrixAt(n, dummy.matrix);
    bulletMesh.setColorAt(n, b.color);
    n++;
  }
  bulletMesh.count = n;
  bulletMesh.instanceMatrix.needsUpdate = true;
  if (bulletMesh.instanceColor) bulletMesh.instanceColor.needsUpdate = true;
}

// =====================================================================
// UPDATE
// =====================================================================
const flashColor = new THREE.Color(3, 3, 3), plainColor = new THREE.Color(1, 1, 1);
const kindCounts = [0, 0, 0];
// knocked-out pirates: drawn with the same instanced meshes (after the living ones), arcing away and tumbling
const fliers = [], MAX_FLIERS = 140;
function launchFlier(m) {
  if (fliers.length >= MAX_FLIERS) fliers.shift();
  const side = m.x === 0 ? (Math.random() < 0.5 ? -1 : 1) : Math.sign(m.x);
  const k = m.brute ? 0.7 : 1;
  fliers.push({ v: m.variant, x: m.x, y: groundY(m.z) + 0.3, z: m.z, s: m.s,
    vx: side * rand(2, 7) * k, vy: rand(6, 10) * k, vz: rand(-5, -1), rx: rand(-9, 9), rz: rand(-9, 9), a: 0, life: 1.3 });
}
function updateFliers(dt) {
  for (let i = fliers.length - 1; i >= 0; i--) {
    const f = fliers[i];
    f.life -= dt;
    f.vy -= 22 * dt;
    f.x += f.vx * dt; f.y += f.vy * dt; f.z += f.vz * dt;
    f.a += dt;
    if (f.life <= 0 || f.y < WATER_Y - 1) {
      if (f.y < 0.3 && Math.abs(f.x) > FENCE_OUT) sparks(f.x, WATER_Y + 0.2, f.z, 0xdff6ff, 4, 3, 1.4, 0.25);   // splash
      fliers.splice(i, 1);
    }
  }
}
// combo: kills less than a second apart chain up; every 50 pays a bonus
function addCombo() {
  state.combo++;
  state.comboT = 0.7;
  state.bestCombo = Math.max(state.bestCombo, state.combo);
  if (state.combo % 50 === 0) {
    const bonus = 50;
    state.score += bonus;
    floatText(tr('comboBig', { n: state.combo }) + ` +${bonus}`, state.playerX, 4, PLAYER_Z - 6, 'big');
    sfx.upgrade();
  }
}

function hurtBase(amount, x, z) {
  state.baseHp -= amount;
  state.hurt = Math.min(1, state.hurt + 0.35 + amount * 0.01);
  state.shake = Math.max(state.shake, 0.25 + amount * 0.008);
  floatText(`-${amount}`, x, 1.5, z, 'bad');
  sparks(x, 0.8, z, 0xff3355, 6, 5, 3, 0.2);
  if (amount >= 5) haptic(25);
  sfx.hurt();
}

function updateMonsters(dt) {
  updateFliers(dt);
  for (const m of monsters) {
    if (m.dead) continue;
    m._pz = m.z;
    m.z += m.speed * dt;
    m.flash -= dt;
    if (m.z > DEFENSE_Z) {
      m.dead = true;
      hurtBase(m.dmg || 1, m.x, DEFENSE_Z);
      continue;
    }
  }

  let n = 0;
  kindCounts.fill(0);
  for (const m of monsters) {
    if (m.dead) continue;
    const moved = Math.max(0, m.z - (m._pz ?? m.z));
    m.walk += (moved > 0.0008 ? moved : m.speed * dt * 0.45) * (m.brute ? 2.0 : 2.6) / (m.s / 1.5);
    const gy = groundY(m.z);
    dummy.position.set(m.x, gy + 0.04, m.z);
    dummy.rotation.set(0, 0, 0);
    dummy.scale.setScalar(m.s);
    dummy.updateMatrix();
    blobMesh.setMatrixAt(n++, dummy.matrix);
    const sw = Math.sin(m.walk);
    dummy.position.set(m.x, gy + Math.abs(Math.cos(m.walk)) * 0.06 * m.s, m.z);
    dummy.rotation.set(m.brute ? 0.05 : 0.12, Math.sin(m.phase + state.time) * 0.08, sw * (m.brute ? 0.09 : 0.05));
    dummy.updateMatrix();
    const kind = MOB_KINDS[m.variant], i = kindCounts[m.variant]++;
    kind.mesh.setMatrixAt(i, dummy.matrix);
    kind.mesh.setColorAt(i, m.flash > 0 ? flashColor : plainColor);
    kind.walk.array[i] = m.walk;
  }
  for (const f of fliers) {
    const kind = MOB_KINDS[f.v], i = kindCounts[f.v];
    if (i >= MAX_MOBS) continue;
    kindCounts[f.v]++;
    dummy.position.set(f.x, f.y, f.z);
    dummy.rotation.set(f.rx * f.a, 0, f.rz * f.a);
    dummy.scale.setScalar(f.s * Math.min(1, f.life * 3));
    dummy.updateMatrix();
    kind.mesh.setMatrixAt(i, dummy.matrix);
    kind.mesh.setColorAt(i, plainColor);
    kind.walk.array[i] = 1.2;
  }
  blobMesh.count = n;
  blobMesh.instanceMatrix.needsUpdate = true;
  MOB_KINDS.forEach((k, v) => {
    k.mesh.count = k.ol.count = kindCounts[v];
    k.mesh.instanceMatrix.needsUpdate = true;
    k.mesh.instanceColor.needsUpdate = true;
    k.walk.needsUpdate = true;
  });
}

function updateBosses(dt) {
  for (const b of bosses) {
    if (b.dead) continue;
    b.z += b.speed * dt;
    const strikeZ = DEFENSE_Z - 0.7;
    if (b.z >= strikeZ) b.z = strikeZ;
    b.flash -= dt;
    b.phase += dt * b.speed * 2.2 / (b.s / 4);
    b.walkU.value = b.phase;
    b.group.position.set(b.x, groundY(b.z), b.z);
    b.inner.position.y = Math.abs(Math.cos(b.phase)) * 0.25;
    b.inner.rotation.z = Math.sin(b.phase) * 0.05;
    b.inner.rotation.x = 0.06;
    // the captain keeps calling his crew off the ship
    b.summon -= dt;
    if (b.summon <= 0) {
      spawnRow(SPAWN_Z, state.wave >= 2);
      b.summon = Math.max(1.8, (b.enraged ? 2.4 : 3.4) - state.wave * 0.15);
    }
    if (!b.enraged && b.hp < b.maxHp * 0.5) {
      b.enraged = true;
      b.speed *= 1.5;
      banner(tr('enraged'), tr('enragedSub'), 1800);
      state.shake = Math.max(state.shake, 0.5);
      sfx.boss();
    }
    if (b.dirty && state.time - b.lastDraw > 0.05) { drawBoss(b); b.dirty = false; b.lastDraw = state.time; }
    if (b.z >= strikeZ) {
      b.z = strikeZ;
      b.swing = (b.swing || 0) - dt;
      if (b.swing <= 0) {
        const hit = b.enraged ? 10 : 6;
        hurtBase(hit, b.x, DEFENSE_Z);
        b.swing = b.enraged ? 0.7 : 1.05;
        burst(b.x, 1.4, DEFENSE_Z, 0xff3355, 10, 7, 0.9);
        state.shake = Math.max(state.shake, 0.35);
        if (!b.struck) {
          b.struck = true;
          banner(tr('strikes'), tr('perHit', { n: hit }));
        }
      }
    }
  }
}

function updateGates(dt) {
  for (const g of gates) {
    if (g.dead) continue;
    g.z += SCROLL * dt;
    g.flash -= dt;
    g.age += dt;
    g.group.position.z = g.z;
    if (g.age < 0.5) g.group.scale.setScalar(Math.max(0.01, easeOutBack(Math.min(1, g.age / 0.45))));
    const pulse = g.flash > 0 ? 1.06 : 1;
    g.panel.scale.set(pulse, pulse, 1);
    if (g.dirty && state.time - (g.lastDraw || 0) > 0.08) { drawGate(g); g.dirty = false; g.lastDraw = state.time; }
    if (g.z > PLAYER_Z + 6) g.gone = true;
  }
}

function updatePedestals(dt) {
  for (const p of pedestals) {
    if (p.dead) continue;
    p.z += SCROLL * PED_SPEED * dt;
    p.flash -= dt;
    p.age += dt;
    p.group.position.z = p.z;
    if (p.age < 0.5) p.group.scale.setScalar(Math.max(0.01, easeOutBack(Math.min(1, p.age / 0.45))));
    p.model.rotation.y += dt * 1.6;
    p.model.position.y = 3.6 + Math.sin(state.time * 3) * 0.2;
    p.model.scale.setScalar(p.flash > 0 ? 1.65 : 1.5);
    if (p.dirty && state.time - (p.lastDraw || 0) > 0.08) { drawPed(p); p.dirty = false; p.lastDraw = state.time; }
    if (p.z > PLAYER_Z + 6) {
      // left the lane uncaptured: don't offer this same gun again
      if (!p.dead) state.skippedWeapons.add(p.tier);
      p.gone = true;
    }
  }
}

function sweepList(arr, withObj) {
  let j = 0;
  for (let i = 0; i < arr.length; i++) {
    const t = arr[i];
    if (t.dead || t.gone) { if (withObj) removeObj(t); }
    else arr[j++] = t;
  }
  arr.length = j;
}

function startWave() {
  state.waveTime = 0;
  state.bossSpawned = false;
  state.rowTimer = 0.35;
  if (monsters.length < 160) fillCrowd();
  banner(tr('wave', { n: state.wave }), tr('waveBoss', { hp: bossHpFor(state.wave) }));
}

const waveDuration = w => 22 + w * 4;

function updateWave(dt) {
  if (state.betweenWaves > 0) {
    state.betweenWaves -= dt;
    if (state.betweenWaves <= 0) { state.wave++; startWave(); }
    return;
  }
  state.waveTime += dt;
  state.rowTimer -= dt;
  if (state.rowTimer <= 0) {
    spawnRow(SPAWN_Z, !state.bossSpawned && Math.random() < 0.12 + state.wave * 0.03);
    state.rowTimer = PACK_Z / marchSpeed() * (state.bossSpawned ? 1.8 : 0.92);
  }
  if (!state.bossSpawned) {
    if (state.waveTime >= waveDuration(state.wave)) spawnBoss();
  } else {
    if (bosses.length === 0) {
      state.bossSpawned = false;
      state.betweenWaves = 4;
      state.score += 100 * state.wave;
      sdk.track('wave_cleared', { wave: state.wave, weapon: curWeapon().id });
      banner(tr('waveDone', { n: state.wave }), tr('wavePts', { n: 100 * state.wave }));
    }
  }
}

function updateSpawners(dt) {
  state.gateTimer -= dt;
  if (state.gateTimer <= 0) { spawnGate(); state.gateTimer = rand(2.8, 3.6); }
  state.pedTimer -= dt;
  if (state.pedTimer <= 0 && pedestals.length === 0) {
    if (nextOfferTier() != null) spawnPedestal();
    state.pedTimer = 26;
  }
}

let heroStep = 0;
function updatePlayer(dt) {
  let dir = 0;
  if (keys.has('ArrowLeft') || keys.has('KeyA')) dir -= 1;
  if (keys.has('ArrowRight') || keys.has('KeyD')) dir += 1;
  if (dir) state.targetX = clamp(state.targetX + dir * 16 * dt, -PLAYER_LIMIT, PLAYER_LIMIT);
  state.playerX += (state.targetX - state.playerX) * Math.min(1, dt * 14);
  player.position.x = state.playerX;
  const vx = state.targetX - state.playerX;
  player.rotation.z = clamp(vx * -0.05, -0.25, 0.25);
  // standing guard: breathing idle, quick side-steps while strafing
  const move = clamp(Math.abs(vx) * 0.5, 0, 1);
  heroStep += dt * (3 + 11 * move);
  const step = Math.sin(heroStep) * 0.55 * move;
  hero.hips[0].rotation.x = step;
  hero.hips[1].rotation.x = -step;
  hero.hips[0].rotation.z = -Math.abs(step) * 0.4;
  hero.hips[1].rotation.z = Math.abs(step) * 0.4;
  hero.torso.position.y = 1.05 + Math.abs(Math.cos(heroStep)) * 0.05 * move + Math.sin(state.time * 2.2) * 0.012;
  hero.torso.rotation.y = Math.sin(heroStep) * 0.05 * move;
  hero.head.rotation.z = Math.sin(heroStep) * -0.04 * move;

  state.fireTimer -= dt;
  const interval = 1 / curRate();
  while (state.fireTimer <= 0) { state.fireTimer += interval; fire(); }

  state.muzzle -= dt;
  muzzle.visible = state.muzzle > 0;   // flash on every shot (was always hidden)
  if (muzzle.visible) { muzzle.material.rotation = Math.random() * 6.28; muzzle.scale.setScalar(0.8 + Math.random() * 0.6); }
  gunMount.position.z = GUN_POS.z + Math.max(0, state.muzzle) * 1.6;   // small recoil
  aimArms();
}

function updateFx(dt) {
  uTime.value += dt;
  updateRings(dt);
  fx.update(dt);
}

function update(dt) {
  state.time += dt;
  updateFx(dt);
  updateEnv(dt);
  updatePlayer(dt);
  updateWave(dt);
  updateSpawners(dt);
  updateMonsters(dt);
  updateBosses(dt);
  updateGates(dt);
  updatePedestals(dt);
  updateBullets(dt);
  updateParts(dt);

  sweepList(monsters, false);
  sweepList(bosses, true);
  sweepList(gates, true);
  sweepList(pedestals, true);

  state.hurt = Math.max(0, state.hurt - dt * 1.5);
  if (state.comboT > 0) { state.comboT -= dt; if (state.comboT <= 0) state.combo = 0; }
  if (!firstMinute && state.time >= 60) { firstMinute = true; sdk.track('first_minute', { wave: state.wave }); }
  updateGuide();
  updateHud();
  if (state.baseHp <= 0) gameOver();
}
