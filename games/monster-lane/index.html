function resetGame() {
  for (const list of [bosses, gates, pedestals]) { for (const o of list) removeObj(o); list.length = 0; }
  monsters.length = 0; bullets.length = 0; parts.length = 0; fliers.length = 0;
  shownScore = 0;
  blobMesh.count = bulletMesh.count = partMesh.count = 0;
  for (const k of MOB_KINDS) k.mesh.count = k.ol.count = 0;
  state = freshState();
  rebuildGun();
  updateWeaponHud();
  updateHud();
}

// ---------------------------------------------------------------------
// STATS (versioned save: best score / wave, games played)
// ---------------------------------------------------------------------
const STATS_KEY = 'monster-lane:stats';
function readStats() {
  let st = null;
  try { st = JSON.parse(localStorage.getItem(STATS_KEY) || 'null'); } catch (e) {}
  if (!st || typeof st !== 'object' || st.v !== 1) {
    let old = 0;
    try { old = Number(localStorage.getItem('monsterLaneBest') || 0) || 0; } catch (e) {}
    st = { v: 1, best: old, bestWave: 0, games: 0, kills: 0 };
  }
  st.coins = st.coins | 0;
  st.armory = Object.assign({ walls: 0, powder: 0, hands: 0 }, st.armory || {});
  return st;
}
stats = readStats();
function writeStats() { try { localStorage.setItem(STATS_KEY, JSON.stringify(stats)); } catch (e) {} }
function drawBest() {
  $('bestLine').textContent = stats.best > 0 ? tr('bestLine', { best: stats.best, wave: stats.bestWave || '–' }) : '';
}
drawBest();

function drawArmory() {
  for (const id of ['armory1', 'armory2']) {
    const box = $(id);
    box.innerHTML = '';
    const h = document.createElement('h3');
    h.innerHTML = `<span></span><b></b>`;
    h.firstChild.textContent = tr('armory');
    h.lastChild.textContent = `🪙 ${stats.coins}`;
    box.appendChild(h);
    const row = document.createElement('div');
    row.className = 'arm-row';
    for (const a of ARMORY) {
      const lv = armLv(a.id), cost = a.costs[lv], b = document.createElement('button');
      b.type = 'button';
      b.dataset.id = a.id;
      const maxed = cost == null;
      b.disabled = maxed || stats.coins < cost;
      b.classList.toggle('can', !b.disabled);
      b.innerHTML = '<i></i><span></span><small></small>';
      b.children[0].textContent = a.icon;
      b.children[1].textContent = `${tr('a_' + a.id)} ${lv}/${a.costs.length}`;
      b.children[2].textContent = maxed ? tr('a_max') : `${tr('a_' + a.id + 'Desc')} · 🪙${cost}`;
      b.addEventListener('click', () => buyArmory(a.id));
      row.appendChild(b);
    }
    box.appendChild(row);
  }
}
function buyArmory(id) {
  const a = ARMORY.find(x => x.id === id), lv = armLv(id), cost = a.costs[lv];
  if (cost == null || stats.coins < cost) return;
  sfx.ensure();
  stats.coins -= cost;
  stats.armory[id] = lv + 1;
  writeStats();
  drawArmory();
  for (const b of document.querySelectorAll(`.arm-row button[data-id="${id}"]`)) b.classList.add('bought');
  sfx.upgrade();
  sdk.track('armory_buy', { id, lv: lv + 1 });
  if (!state.running) { state.baseHp = baseMax(); updateHud(); updateWeaponHud(); }
}

// ---------------------------------------------------------------------
// ADS + ANALYTICS — only through shared/gameroom-sdk.js (MONETIZATION.md). Without an ad network the
// offers stay hidden and the game is the same.
// ---------------------------------------------------------------------
const GAME_VERSION = '1.1.0';
const sdk = window.Gameroom;
const offerStartGun = () => { if (!state.running && !state.over && !startGun) offer('gunBtn', 'start_weapon'); };
sdk.init({ game: 'monster-lane', version: GAME_VERSION }).then(offerStartGun);
setTimeout(offerStartGun, 5000);   // the app's ad network may need a few seconds to load the first ad
drawArmory();
// music: a quiet procedural shanty on the music bus (off switch in ⚙, remembered)
const music = createMusic(audio, SONGS.shanty, { storageKey: 'monster-lane:music' });
const drawMusic = () => { $('menuMusic').textContent = tr(music.on ? 'musicOn' : 'musicOff'); };
$('menuMusic').addEventListener('click', e => { e.stopPropagation(); sfx.ensure(); if (music.toggle() && state.running && !state.paused) music.play(); drawMusic(); });
drawMusic();
let coinsRun = 0, coinsDoubled = false;
$('coinsBtn').addEventListener('click', async () => {
  if (coinsDoubled || !state.over) return;
  $('coinsBtn').classList.add('hidden');
  if (await watch('double_coins')) {
    coinsDoubled = true;
    stats.coins += coinsRun;
    writeStats();
    $('coinsGot').textContent = tr('coinsDoubled', { n: coinsRun });
    drawArmory();
    sfx.weapon();
  }
});
let adHeld = false, startGun = false, firstMinute = false;
sdk.on('adStart', () => {
  if (state.running && !state.paused) { adHeld = true; state.paused = true; }
  audio.setMuted(true);
  if (typeof music !== 'undefined') music.stop();
});
let soundWasMuted = audio.muted;
sdk.on('adEnd', () => {
  if (adHeld) { adHeld = false; state.paused = false; clock.getDelta(); music.play(); }
  audio.setMuted(soundWasMuted);
});
function offer(btnId, placement) {
  const btn = $(btnId), can = sdk.rewardedAvailable(placement);
  btn.classList.toggle('hidden', !can);
  if (can) sdk.track('rewarded_offer', { placement });
}
function syncGunOffer() {
  for (const [b, o] of [['gunBtn', 'gunOn'], ['gunBtn2', 'gunOn2']]) {
    $(o).classList.toggle('hidden', !startGun);
    if (startGun) $(b).classList.add('hidden');
  }
}
async function watch(placement) {
  sfx.ensure();
  soundWasMuted = audio.muted;
  const ok = await sdk.showRewarded(placement);
  sdk.track('rewarded_watched', { placement, ok });
  return ok;
}
for (const id of ['gunBtn', 'gunBtn2']) $(id).addEventListener('click', async () => {
  if (startGun) return;
  if (await watch('start_weapon')) { startGun = true; sfx.weapon(); }
  syncGunOffer();
});
$('reviveBtn').addEventListener('click', async () => {
  if (!state.over || state.revived) return;
  $('reviveBtn').classList.add('hidden');
  if (await watch('revive')) revive();
});
function revive() {
  state.revived = true;
  state.over = false;
  state.running = true;
  state.baseHp = Math.round(baseMax() * 0.6);
  // blow the front ranks away and push the captain back, so the player gets a real second chance
  for (const m of monsters) if (!m.dead && m.z > DEFENSE_Z - 16) { m.dead = true; if (Math.random() < 0.15) burst(m.x, 0.8, m.z, 0xc1121f, 2, 6, 0.9); }
  for (const b of bosses) { b.z = Math.min(b.z, DEFENSE_Z - 18); b.struck = false; }
  shockwave(0, DEFENSE_Z - 6, 14, 0xffe066, 0.8);
  sparks(0, 1.5, DEFENSE_Z - 4, 0xffe066, 60, 14, 4, 0.3);
  $('overScreen').classList.add('hidden');
  banner(tr('revived'), tr('revivedSub'), 2200);
  sfx.revive();
  music.play();
  state.shake = 0.5;
  clock.getDelta();
  sdk.gameplayStart();
  sdk.track('revive', { wave: state.wave });
}

function startGame() {
  sfx.ensure();
  resetGame();
  if (startGun) {
    startGun = false;
    state.weaponTier = 1;
    state.barrels = 1;
    rebuildGun();
    updateWeaponHud();
  }
  syncGunOffer();
  state.running = true;
  $('startScreen').classList.add('hidden');
  $('overScreen').classList.add('hidden');
  startWave();
  music.play();
  sdk.gameplayStart();
  sdk.track('game_start', { games: stats.games, weapon: curWeapon().id, armory: ARMORY.map(a => armLv(a.id)).join('') });
  startGuide();
}

function gameOver() {
  state.running = false;
  state.over = true;
  const newBest = state.score > stats.best;
  stats.best = Math.max(stats.best, state.score);
  stats.bestWave = Math.max(stats.bestWave || 0, state.wave);
  stats.games++;
  stats.kills += state.kills;
  coinsRun = Math.round(state.score / 25) + state.wave * 10;
  coinsDoubled = false;
  stats.coins += coinsRun;
  writeStats();
  $('coinsGot').textContent = tr('coinsGot', { n: coinsRun });
  drawArmory();
  music.stop();
  drawBest();
  $('overStats').innerHTML =
    tr('overStats', { wave: state.wave, score: state.score, kills: state.kills, weapon: curWeapon().name, best: stats.best }) +
    (newBest ? `<div style="color:#e63946">${tr('newBest')}</div>` : '');
  $('overScreen').classList.remove('hidden');
  $('bossWrap').style.display = 'none';
  hudCache.bossShow = 'none';
  endGuide();
  sdk.gameplayStop();
  sdk.track('game_over', { wave: state.wave, score: state.score, kills: state.kills, weapon: curWeapon().id, revived: !!state.revived });
  if (!state.revived) offer('reviveBtn', 'revive'); else $('reviveBtn').classList.add('hidden');
  if (!startGun) offer('gunBtn2', 'start_weapon');
  offer('coinsBtn', 'double_coins');
  syncGunOffer();
}

// ---------------------------------------------------------------------
// FIRST-GAME GUIDE: a bubble over the hero, then over the first gate and the first chest (wall clock,
// so a slow device still sees each hint long enough)
// ---------------------------------------------------------------------
const GUIDE_KEY = 'monster-lane:guide';
let guide = null;
function startGuide() {
  let seen = false;
  try { seen = localStorage.getItem(GUIDE_KEY) === 'done'; } catch (e) {}
  if (seen && !qs0.has('guide')) return;
  guide = { step: 0, t0: performance.now(), gate: false, chest: false };
}
function endGuide() {
  if (!guide) return;
  guide = null;
  $('coach').classList.add('hidden');
  try { localStorage.setItem(GUIDE_KEY, 'done'); } catch (e) {}
  sdk.track('guide_done');
}
const coachV = new THREE.Vector3();
function coachAt(x, y, z, main, sub) {
  coachV.set(x, y, z).project(camera);
  const el = $('coach');
  el.style.left = clamp((coachV.x + 1) / 2 * innerWidth, 130, innerWidth - 130) + 'px';
  el.style.top = clamp((1 - coachV.y) / 2 * innerHeight, 90, innerHeight - 20) + 'px';
  if ($('coachMain').textContent !== main) { $('coachMain').textContent = main; $('coachSub').textContent = sub; }
  el.classList.remove('hidden');
}
function updateGuide() {
  if (!guide || !state.running) return;
  const t = (performance.now() - guide.t0) / 1000;
  if (state.paused) { $('coach').classList.add('hidden'); return; }
  if (guide.step === 0) {
    const mouse = matchMedia('(pointer: fine)').matches;
    coachAt(state.playerX, 3.4, PLAYER_Z, tr(mouse ? 'coachMoveMouse' : 'coachMove'), tr('coachMoveSub'));
    if (t > 4.5) { guide.step = 1; guide.t0 = performance.now(); }
    return;
  }
  if (guide.step === 1) {
    const g = gates.find(g => !g.dead && g.z > -24);
    if (g) coachAt(g.x, 4.6, g.z, tr('coachGate'), tr('coachGateSub'));
    else $('coach').classList.add('hidden');
    if (state.upgradesTaken > 0 || t > 14) { guide.step = 2; guide.t0 = performance.now(); }
    return;
  }
  const p = pedestals.find(p => !p.dead && p.z > -26);
  if (p) coachAt(p.x, 5.4, p.z, tr('coachChest'), tr('coachChestSub'));
  else $('coach').classList.add('hidden');
  if (state.weaponTier > 0 || state.skippedWeapons.size || t > 30) endGuide();
}
window.__guide = () => guide && { step: guide.step };
window.__revive = () => { if (state.over) revive(); return state.baseHp; };
window.__state = () => ({ running: state.running, over: state.over, paused: state.paused, wave: state.wave, baseHp: state.baseHp,
  score: state.score, tier: state.weaponTier, barrels: state.barrels, mobs: monsters.length, revived: !!state.revived });
window.__kill = () => { state.baseHp = 0; };
window.__start = () => startGame();
window.__targetX = () => state.targetX;
window.__give = (tier = 4, barrels = 4) => { state.weaponTier = tier; state.barrels = barrels; rebuildGun(); updateWeaponHud(); return window.__state(); };
// advance the real simulation n fixed steps (tests); returns the state afterwards
window.__run = (n = 60, dt = 1 / 60) => { for (let i = 0; i < n && state.running; i++) update(dt); return window.__state(); };

function closeSettings() { $('settingsMenu').classList.add('hidden'); }
function setPaused(p) {
  if (!state.running) return;
  if (p) { sdk.gameplayStop(); music.stop(); } else { sdk.gameplayStart(); music.play(); }
  state.paused = p;
  $('pauseScreen').classList.toggle('hidden', !p);
  $('menuPause').textContent = tr(p ? 'resumeBtn' : 'pauseBtn');
  if (p) closeSettings();
  clock.getDelta();
}

$('startBtn').addEventListener('click', startGame);
$('howBtn').addEventListener('click', () => { $('legend').classList.remove('hidden'); $('howBtn').classList.add('hidden'); });
$('restartBtn').addEventListener('click', async () => {
  // between two runs is a natural break; the SDK caps how often a full-screen ad may show
  soundWasMuted = audio.muted;
  await sdk.showMidgame('game_over');
  startGame();
});
$('resumeBtn').addEventListener('click', () => { setPaused(false); soundWasMuted = audio.muted; sdk.showMidgame('resume'); });
$('settingsBtn').addEventListener('click', e => {
  e.stopPropagation();
  $('settingsMenu').classList.toggle('hidden');
});
$('menuPause').addEventListener('click', e => { e.stopPropagation(); setPaused(!state.paused); });
$('menuSound').addEventListener('click', e => {
  e.stopPropagation();
  sfx.ensure();
  $('menuSound').textContent = tr(sfx.toggle() ? 'soundOff' : 'soundOn');
});
document.addEventListener('visibilitychange', () => { if (document.hidden) setPaused(true); });

// =====================================================================
// INPUT
// =====================================================================
const keys = new Set();
addEventListener('keydown', e => {
  keys.add(e.code);
  if (e.code === 'Escape' && !$('settingsMenu').classList.contains('hidden')) { closeSettings(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') setPaused(!state.paused);
  if ((e.code === 'Enter' || e.code === 'Space') && !state.running && !document.getElementById('gameroomFakeAd')) $(state.over ? 'restartBtn' : 'startBtn').click();
});
addEventListener('keyup', e => keys.delete(e.code));

const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const aimPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), -PLAYER_Z);
const hitPoint = new THREE.Vector3();
function aimAt(cx, cy) {
  if (!state.running || state.paused) return;
  ndc.set(cx / innerWidth * 2 - 1, -(cy / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  if (raycaster.ray.intersectPlane(aimPlane, hitPoint)) {
    state.targetX = clamp(hitPoint.x, -PLAYER_LIMIT, PLAYER_LIMIT);
  }
}
// mouse: the hero follows the cursor. touch: drag anywhere, the hero moves by the drag distance
const drag = { id: null, x: 0, target: 0 };
function worldPerPx() {
  const a = new THREE.Vector3(), b = new THREE.Vector3();
  ndc.set(-1, -0.6); raycaster.setFromCamera(ndc, camera); raycaster.ray.intersectPlane(aimPlane, a);
  ndc.set(1, -0.6); raycaster.setFromCamera(ndc, camera); raycaster.ray.intersectPlane(aimPlane, b);
  return (b.x - a.x) / innerWidth;
}
renderer.domElement.addEventListener('pointerdown', e => {
  sfx.ensure();
  if (e.pointerType === 'mouse') { aimAt(e.clientX, e.clientY); return; }
  drag.id = e.pointerId; drag.x = e.clientX; drag.target = state.targetX;
});
renderer.domElement.addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse') { aimAt(e.clientX, e.clientY); return; }
  if (e.pointerId !== drag.id || !state.running || state.paused) return;
  state.targetX = clamp(drag.target + (e.clientX - drag.x) * worldPerPx() * 1.6, -PLAYER_LIMIT, PLAYER_LIMIT);
});
for (const ev of ['pointerup', 'pointercancel']) renderer.domElement.addEventListener(ev, e => { if (e.pointerId === drag.id) drag.id = null; });

// =====================================================================
// LOOP
// =====================================================================
// quality presets; the game steps down automatically if the frame rate drops.
// bloom and the shine shaders are gone — they were the frame-time cost.
const QUALITY = [
  { label: 'LQ', pr: 1,    shadow: 1024, mobOutline: false, post: false },
  { label: 'MQ', pr: 1.25, shadow: 1024, mobOutline: false, post: true },
  { label: 'HQ', pr: 1.5,  shadow: 2048, mobOutline: true,  post: true },
];
let qLevel = 2, autoQuality = true;
function applyQuality(level) {
  qLevel = level;
  const q = QUALITY[level];
  renderer.setPixelRatio(Math.min(devicePixelRatio, q.pr));
  for (const k of MOB_KINDS) k.ol.visible = q.mobOutline;
  post.enabled = q.post;
  if (sun.shadow.mapSize.x !== q.shadow) {
    sun.shadow.mapSize.set(q.shadow, q.shadow);
    if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; }
  }
  resize();
  $('menuQuality').textContent = tr('quality', { q: q.label });
}
$('menuQuality').addEventListener('click', e => {
  e.stopPropagation();
  autoQuality = false;
  applyQuality((qLevel + QUALITY.length - 1) % QUALITY.length);
});
applyQuality(matchMedia('(pointer: coarse)').matches ? 1 : 2);

const perf = { time: 0, frames: 0 };
function watchFps(raw) {
  if (!autoQuality || !state.running || state.paused || qLevel === 0) return;
  perf.time += raw; perf.frames++;
  if (perf.time < 2) return;
  const fps = perf.frames / perf.time;
  perf.time = perf.frames = 0;
  if (fps < 48) applyQuality(qLevel - 1);
}

const clock = new THREE.Clock();
rebuildGun();
updateWeaponHud();

function loop() {
  requestAnimationFrame(loop);
  const raw = clock.getDelta();
  let dt = Math.min(raw, 0.05);
  watchFps(raw);
  if (slowmo > 0) { slowmo -= dt; dt *= 0.25; }
  if (state.running && !state.paused) {
    update(dt);
  } else if (!state.paused) {
    updateEnv(dt * 0.5);       // keep the world moving behind menus
    updateParts(dt);
    updateFx(dt);
  }
  $('hurt').style.opacity = String(clamp(state.hurt, 0, 0.45) * 0.55);
  const sh = state.shake;
  // sideways pan (portrait): keep the player and the lane he is in on screen
  camPan += (clamp(state.playerX * 0.75, -camPanLimit, camPanLimit) - camPan) * Math.min(1, dt * 6);
  camera.position.set(camBase.x + camPan + rand(-sh, sh), camBase.y + rand(-sh, sh) * 0.5, camBase.z);
  state.shake = Math.max(0, sh - 1.6 * dt);
  fovKick = Math.max(0, fovKick - raw * 0.6);
  const fov = 66 * (1 - fovKick);
  if (Math.abs(camera.fov - fov) > 0.01) { camera.fov = fov; camera.updateProjectionMatrix(); }
  post.render(scene, camera);
}
loop();
// debug: ?auto starts immediately, &sim=N fast-forwards N seconds (used for testing)
const qs = qs0;
if (qs.has('auto')) {
  autoQuality = false;
  if (qs.has('q')) applyQuality(Number(qs.get('q')));
  if (qs.has('closeup')) { debugCloseup = true; resize(); }
  startGame();
  // bot: alternates between the upgrade gates, the weapon chest and sweeping the crowd
  const sim = Number(qs.get('sim') || 0), log = [];
  let lastWave = 0, bossAt = 0;
  const skipUpgrades = Number(qs.get('nogates') || 0);
  for (let t = 0; t < sim && state.running; t += 1 / 60) {
    const c = t % 10;
    const greedy = t >= skipUpgrades;     // &nogates=N: ignore gates/chests for the first N seconds
    state.targetX = greedy && c < 3 && gates.length ? UP_X : greedy && c < 5 && pedestals.length ? WPN_X : Math.sin(t * 0.9) * 6;
    if (t < skipUpgrades + 1 / 60 && t + 1 / 60 >= skipUpgrades) log.push(`start upgrading@${t.toFixed(0)}s ups=${state.upgradesTaken}`);
    update(1 / 60);
    if (state.wave !== lastWave) { lastWave = state.wave; log.push(`w${state.wave}@${t.toFixed(0)}s dps=${Math.round(curDmg() * curShots() * curRate())} hp=${Math.ceil(state.baseHp)}`); }
    if (bosses.length && !bossAt) bossAt = t;
    if (!bosses.length && bossAt) { log.push(`  boss${state.wave} ${(t - bossAt).toFixed(1)}s`); bossAt = 0; }
  }
  log.push(`end ups=${state.upgradesTaken}`);
  window.simLog = log;
  if (debugCloseup) resize();
  document.title = `wave=${state.wave} hp=${Math.ceil(state.baseHp)} score=${state.score} tier=${state.weaponTier} barrels=${state.barrels} dmgLvl=${state.dmgLvl} rateLvl=${state.rateLvl} dps=${Math.round(curDmg()*curShots()*curRate())} kills=${state.kills} mobs=${monsters.length} running=${state.running}`;
}
</script>
