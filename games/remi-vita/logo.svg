<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Remi Vita">
  <!-- round café badge: lettering around the ring, a cup with steam in the middle, suit pips at the sides -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7e0a3"/><stop offset=".55" stop-color="#e2b65c"/><stop offset="1" stop-color="#c99a45"/>
    </linearGradient>
    <radialGradient id="felt" cx=".5" cy=".42" r=".62">
      <stop offset="0" stop-color="#174a35"/><stop offset="1" stop-color="#0a2419"/>
    </radialGradient>
    <path id="top" d="M 44 128 A 84 84 0 0 1 212 128"/>
    <path id="bottom" d="M 37 128 A 91 91 0 0 0 219 128"/>
  </defs>
  <circle cx="128" cy="128" r="124" fill="url(#felt)"/>
  <circle cx="128" cy="128" r="116" fill="none" stroke="url(#gold)" stroke-width="7"/>
  <circle cx="128" cy="128" r="70" fill="none" stroke="url(#gold)" stroke-width="5"/>
  <g fill="url(#gold)" font-family="'Fredoka', 'Nunito', 'Quicksand', 'Varela Round', 'Arial Rounded MT Bold', 'Manrope', sans-serif" font-weight="700" text-anchor="middle">
    <text font-size="34" letter-spacing="1.5"><textPath href="#top" startOffset="50%">remi vita</textPath></text>
    <text font-size="21" letter-spacing="1.2"><textPath href="#bottom" startOffset="50%">cards &amp; coffee</textPath></text>
  </g>
  <!-- pips where the ring text breaks -->
  <path fill="url(#gold)" d="M30 120c-5 6-9 9-9 13a4.5 4.5 0 0 0 7.5 3.2L27 141h6l-1.5-4.8A4.5 4.5 0 0 0 39 133c0-4-4-7-9-13z"/>
  <path fill="#d1453a" d="M226 141c-6-5-11-8.5-11-13a5 5 0 0 1 11-1.5 5 5 0 0 1 11 1.5c0 4.5-5 8-11 13z"/>
  <!-- cup, saucer, steam -->
  <g fill="url(#gold)">
    <path d="M90 118h64v18c0 17-13 28-32 28s-32-11-32-28z"/>
    <path d="M154 122h5a12 12 0 0 1 0 24h-7l2-6h5a6 6 0 0 0 0-12h-5z"/>
    <rect x="84" y="167" width="76" height="6" rx="3"/>
  </g>
  <g fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round">
    <path d="M108 110c-6-7 6-11 0-19s6-11 0-18"/>
    <path d="M122 110c-6-7 6-11 0-19s6-11 0-18"/>
    <path d="M136 110c-6-7 6-11 0-19s6-11 0-18"/>
  </g>
</svg>
