<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gameroom</title>
<meta name="description" content="Gameroom — kolekcija browser igrica. Izaberi i igraj odmah, bez instalacije.">
<meta name="theme-color" content="#08080d">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800;900&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #08080d;
    --surface: #12121b;
    --line: rgba(255,255,255,0.08);
    --text: #f5f5fa;
    --text-dim: rgba(245,245,250,0.68);
    --text-faint: rgba(245,245,250,0.42);
    --accent: #c6ff3d;
    --radius-lg: 32px;
    --radius: 24px;
    --ease: cubic-bezier(.2,.8,.2,1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Manrope', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; }

  /* ambient glow koji prati boju istaknute igre */
  .ambient {
    position: fixed; inset: -20vh -10vw auto; height: 90vh; z-index: -1; pointer-events: none;
    background:
      radial-gradient(40% 50% at 20% 30%, var(--glow-1, #6a3dff) 0%, transparent 70%),
      radial-gradient(35% 45% at 80% 20%, var(--glow-2, #00c2ff) 0%, transparent 70%);
    opacity: .22; filter: blur(60px);
  }
  .grain {
    position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: .06; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  .wrap { width: min(1320px, 100%); margin: 0 auto; padding: 0 24px; }

  /* ---------- nav ---------- */
  nav { display: flex; align-items: center; justify-content: space-between; padding: 24px 0; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark {
    width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
    background: var(--accent); color: #0b0b10; font: 900 18px 'Unbounded', sans-serif;
  }
  .brand-name { font: 800 18px 'Unbounded', sans-serif; letter-spacing: .5px; }
  .count {
    font-size: 13px; font-weight: 700; color: var(--text-dim);
    padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px;
    background: rgba(255,255,255,0.03); backdrop-filter: blur(10px);
  }
  .count b { color: var(--text); }

  /* ---------- hero ---------- */
  .hero {
    position: relative; display: block; overflow: hidden;
    border-radius: var(--radius-lg); margin-top: 8px;
    aspect-ratio: 21 / 9; min-height: 440px; max-height: 620px; width: 100%;
    background: var(--surface);
    isolation: isolate;
  }
  .hero {
    background:
      radial-gradient(70% 90% at 0% 100%, color-mix(in srgb, var(--h1, #6a3dff) 35%, transparent), transparent 70%),
      radial-gradient(50% 70% at 30% 0%, color-mix(in srgb, var(--h2, #00c2ff) 22%, transparent), transparent 70%),
      var(--surface);
    box-shadow: 0 0 0 1px var(--line);
  }
  .hero .media {
    position: absolute; inset: 0 0 0 32%; z-index: -1; overflow: hidden;
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 38%);
            mask-image: linear-gradient(90deg, transparent 0%, #000 38%);
  }
  .hero .media picture { display: contents; }
  .hero .media img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.04); transition: transform 1.2s var(--ease); }
  .hero:hover .media img { transform: scale(1.08); }
  .hero::before {
    content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none;
    background: linear-gradient(0deg, rgba(8,8,13,.55) 0%, rgba(8,8,13,0) 35%);
  }
  .hero-content {
    position: absolute; left: 0; bottom: 0; padding: clamp(24px, 4vw, 56px);
    max-width: min(640px, 52%); display: flex; flex-direction: column; gap: 18px;
  }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px; align-self: flex-start;
    font-size: 12px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase;
    color: #0b0b10; background: var(--accent); padding: 7px 12px; border-radius: 999px;
  }
  .eyebrow::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  .hero h1 {
    font: 900 clamp(40px, 7vw, 96px)/.92 'Unbounded', sans-serif;
    letter-spacing: -2px; text-transform: uppercase;
    text-shadow: 0 6px 40px rgba(0,0,0,.45);
  }
  .hero p { font-size: clamp(15px, 1.4vw, 18px); line-height: 1.55; color: var(--text-dim); max-width: 520px; }
  .hero-actions { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; gap: 10px;
    font: 800 16px 'Manrope', sans-serif; letter-spacing: .3px;
    padding: 16px 26px; border-radius: 999px;
    background: var(--text); color: #0b0b10;
    transition: transform .2s var(--ease), box-shadow .2s var(--ease), background .2s;
  }
  .hero:hover .btn { background: var(--accent); box-shadow: 0 10px 40px -8px var(--accent); transform: translateY(-2px); }
  .btn svg { width: 18px; height: 18px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    font-size: 12px; font-weight: 700; letter-spacing: .4px; color: var(--text);
    padding: 6px 12px; border-radius: 999px;
    background: rgba(8,8,13,0.45); border: 1px solid rgba(255,255,255,0.16);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }

  /* ---------- sekcija ---------- */
  .section-head { display: flex; align-items: baseline; justify-content: space-between; margin: 72px 0 24px; gap: 16px; }
  .section-head h2 { font: 800 clamp(24px, 3vw, 34px) 'Unbounded', sans-serif; letter-spacing: -.5px; }
  .section-head span { color: var(--text-faint); font-size: 14px; font-weight: 700; }

  /* ---------- kartice ---------- */
  .grid { display: grid; gap: 24px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); }
  .card {
    --tx: 0deg; --ty: 0deg;
    position: relative; display: block; overflow: hidden; isolation: isolate;
    aspect-ratio: 4 / 3; border-radius: var(--radius);
    background: var(--surface);
    transform: perspective(1000px) rotateX(var(--tx)) rotateY(var(--ty));
    transition: transform .35s var(--ease), box-shadow .35s var(--ease);
    box-shadow: 0 0 0 1px var(--line);
  }
  .card:hover, .card:focus-visible {
    box-shadow: 0 0 0 1px rgba(255,255,255,.18), 0 30px 60px -20px var(--card-glow, #000);
    outline: none;
  }
  .card .media { position: absolute; inset: 0; z-index: -2; }
  .card .media img { width: 100%; height: 100%; object-fit: cover; transition: transform .8s var(--ease); }
  .card:hover .media img { transform: scale(1.07); }
  .card .fallback {
    width: 100%; height: 100%; display: grid; place-items: center; font-size: 110px;
    background: linear-gradient(135deg, var(--c1, #6a3dff), var(--c2, #00c2ff));
  }
  .card::after {
    content: ''; position: absolute; inset: 0; z-index: -1;
    background: linear-gradient(0deg, rgba(8,8,13,.95) 0%, rgba(8,8,13,.55) 32%, rgba(8,8,13,0) 62%);
  }
  .card .chips { position: absolute; top: 18px; left: 18px; right: 18px; }
  .card .new {
    position: absolute; top: 18px; right: 18px;
    font-size: 11px; font-weight: 800; letter-spacing: 1.5px; color: #0b0b10;
    background: var(--accent); padding: 6px 10px; border-radius: 999px;
  }
  .card-body {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 26px 28px;
    display: flex; align-items: flex-end; justify-content: space-between; gap: 20px;
  }
  .card h3 {
    font: 900 clamp(26px, 3.2vw, 40px)/1 'Unbounded', sans-serif;
    letter-spacing: -1px; text-transform: uppercase;
  }
  .card p {
    margin-top: 10px; font-size: 15px; line-height: 1.5; color: var(--text-dim); max-width: 440px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  footer {
    margin: 96px 0 40px; padding-top: 28px; border-top: 1px solid var(--line);
    display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    color: var(--text-faint); font-size: 14px; font-weight: 600;
  }

  /* ulazna animacija */
  .reveal { opacity: 0; transform: translateY(24px); animation: rise .8s var(--ease) forwards; }
  @keyframes rise { to { opacity: 1; transform: none; } }

  @media (max-width: 760px) {
    .wrap { padding: 0 16px; }
    nav { padding: 18px 0; }
    .hero { aspect-ratio: auto; min-height: 560px; max-height: none; border-radius: var(--radius); }
    .hero .media {
      inset: 0 0 42% 0;
      -webkit-mask-image: linear-gradient(0deg, transparent 0%, #000 45%);
              mask-image: linear-gradient(0deg, transparent 0%, #000 45%);
    }
    .hero-content { max-width: none; }
    .section-head span { display: none; }
    .hero h1 { letter-spacing: -1px; }
    .card { aspect-ratio: 4 / 5; }
    .card-body { padding: 20px; }
    .section-head { margin-top: 48px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .reveal { opacity: 1; transform: none; }
  }
</style>
</head>
<body>
<div class="ambient" id="ambient"></div>
<div class="grain"></div>

<div class="wrap">
  <nav>
    <a class="brand" href="./">
      <span class="brand-mark">G</span>
      <span class="brand-name">GAMEROOM</span>
    </a>
    <span class="count" id="count"></span>
  </nav>

  <a class="hero reveal" id="hero"></a>

  <div class="section-head reveal" style="animation-delay:.1s">
    <h2>Sve igre</h2>
    <span>Igraj odmah u browseru — bez instalacije</span>
  </div>
  <main class="grid" id="grid" aria-label="Lista igara"></main>

  <footer>
    <span>© <span id="year"></span> Gameroom</span>
    <span>Radi na telefonu i računaru</span>
  </footer>
</div>

<script>
  // ====================================================================
  //  REGISTAR IGARA — nova igra = novi objekat NA POČETKU niza + folder games/<slug>/
  //  Prva igra u nizu je istaknuta (hero) na vrhu stranice.
  //  slug:    ime foldera u games/ (kebab-case)
  //  cover:   slika kartice u games/<slug>/ (screenshot 1200x900, vidi skill browser-games)
  //  hero:    opciono, široka slika 1600x700 za hero kad je igra istaknuta (fallback: cover)
  //  accent:  [boja1, boja2] — glow iza hero-a/kartice i fallback gradijent
  //  emoji:   fallback kad nema cover slike
  //  isNew:   opciono, bedž "NOVO"
  // ====================================================================
  const GAMES = [
    {
      slug: 'surprizi',
      title: 'Male igracke',
      description: 'Otvaraj kesice iznenađenja, skupljaj retke figurice i složi svoju kolekciju na 3D policama.',
      cover: 'cover.jpg',
      hero: 'hero.jpg',
      accent: ['#ff5fc8', '#3dc8ff'],
      emoji: '🎁',
      tags: ['3D', 'Kolekcija', 'Opuštena'],
      isNew: true,
    },
    {
      slug: 'monster-lane',
      title: 'Monster Lane',
      description: 'Gusari nadiru preko pristaništa — pomeraj pirata, razbijaj kapije za jača oružja i čuvaj bazu.',
      cover: 'cover.jpg',
      hero: 'hero.jpg',
      accent: ['#ff8a00', '#00a2ff'],
      emoji: '🏴‍☠️',
      tags: ['3D', 'Akcija', 'Talasi'],
    },
  ];

  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const href = g => `games/${g.slug}/index.html`;
  const media = g => g.cover
    ? `<img src="games/${g.slug}/${esc(g.cover)}" alt="" loading="lazy" decoding="async">`
    : `<div class="fallback" style="--c1:${g.accent?.[0]};--c2:${g.accent?.[1]}">${g.emoji || '🎮'}</div>`;
  const chips = g => `<div class="chips">${(g.tags || []).map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div>`;
  const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>';

  // hero
  const featured = GAMES[0];
  const hero = document.getElementById('hero');
  hero.href = href(featured);
  hero.setAttribute('aria-label', `Igraj ${featured.title}`);
  hero.innerHTML = `
    <div class="media">${featured.hero && featured.cover
      ? `<picture><source media="(max-width: 760px)" srcset="games/${featured.slug}/${esc(featured.cover)}"><img src="games/${featured.slug}/${esc(featured.hero)}" alt="" fetchpriority="high"></picture>`
      : media({ ...featured, cover: featured.hero || featured.cover }).replace('loading="lazy"', 'fetchpriority="high"')}</div>
    <div class="hero-content">
      <span class="eyebrow">${featured.isNew ? 'Nova igra' : 'Istaknuto'}</span>
      <h1>${esc(featured.title)}</h1>
      <p>${esc(featured.description)}</p>
      <div class="hero-actions">
        <span class="btn">${ICON_PLAY} Igraj sad</span>
        ${chips(featured)}
      </div>
    </div>`;
  if (featured.accent) {
    const amb = document.getElementById('ambient').style;
    amb.setProperty('--glow-1', featured.accent[0]);
    amb.setProperty('--glow-2', featured.accent[1]);
    hero.style.setProperty('--h1', featured.accent[0]);
    hero.style.setProperty('--h2', featured.accent[1]);
  }

  // grid
  document.getElementById('grid').innerHTML = GAMES.map((g, i) => `
    <a class="card reveal" href="${href(g)}" style="--card-glow:${g.accent?.[0] || '#000'}; animation-delay:${0.15 + i * 0.08}s" aria-label="Igraj ${esc(g.title)}">
      <div class="media">${media(g)}</div>
      ${chips(g)}
      ${g.isNew ? '<span class="new">NOVO</span>' : ''}
      <div class="card-body">
        <div>
          <h3>${esc(g.title)}</h3>
          <p>${esc(g.description)}</p>
        </div>
      </div>
    </a>`).join('');

  document.getElementById('count').innerHTML = `<b>${GAMES.length}</b> ${GAMES.length === 1 ? 'igra' : GAMES.length < 5 ? 'igre' : 'igara'}`;
  document.getElementById('year').textContent = new Date().getFullYear();

  // blagi 3D tilt kartica na mišu
  if (matchMedia('(hover: hover) and (prefers-reduced-motion: no-preference)').matches) {
    document.querySelectorAll('.card').forEach(card => {
      card.addEventListener('pointermove', e => {
        const r = card.getBoundingClientRect();
        const x = (e.clientX - r.left) / r.width - 0.5;
        const y = (e.clientY - r.top) / r.height - 0.5;
        card.style.setProperty('--ty', `${x * 6}deg`);
        card.style.setProperty('--tx', `${-y * 6}deg`);
      });
      card.addEventListener('pointerleave', () => {
        card.style.setProperty('--tx', '0deg');
        card.style.setProperty('--ty', '0deg');
      });
    });
  }
</script>
</body>
</html>
